name: cirrus-adhoc-publish-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
- name: GitHubServiceConnection
  displayName: 'GitHub Service Connection'
  type: string
  default: 'github.com_naga-nandyala'
- name: signed_pipeline_name
  displayName: 'Signed pipeline name'
  type: string
  default: 'cirrus-adhoc-sign'
- name: signed_build_id
  displayName: 'Signed build id'
  type: string
  default: '321333'
- name: signed_artifact_name
  displayName: 'Signed artifact name'
  type: string
  default: 'Distribution_Signed'

variables:
- template: templates/variables.yml
- template: templates/dist/variables/common.yml
- template: templates/dist/variables/security-suppressions.yml
- name: SourceProject
  value: release
- name: GitHubTargetRepo
  value: naga-nandyala/cirrus
- name: GitHubReleasePrefix
  value: dist
- name: GitHubReleaseIsPrerelease
  value: true

stages:
- stage: Preflight
  displayName: Preflight Checks
  jobs:
  - job: EnsureReleaseProject
    displayName: Ensure Release Project Context
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: none
    - template: templates/dist/steps/validate-release-project.yml
      parameters:
        error_message: cirrus-adhoc-publish must run in the 'release' project to access signed artifacts.
        display_name: Validate Team Project Is release
    - bash: |
        set -euo pipefail
        signed_build_id='${{ parameters.signed_build_id }}'
        if [[ -z "$signed_build_id" ]]; then
          echo 'ERROR: signed_build_id is required for publish provenance.'
          exit 1
        fi
        if ! [[ "$signed_build_id" =~ ^[0-9]+$ ]]; then
          echo "ERROR: signed_build_id must be numeric. Got: $signed_build_id"
          exit 1
        fi
        if [[ "$signed_build_id" == "0" ]]; then
          echo 'ERROR: signed_build_id must be greater than zero.'
          exit 1
        fi
        echo "signed_build_id validated: $signed_build_id"
      displayName: Validate Signed Build Provenance Input

- template: templates/dist/stages/publish-to-github-release.yml
  parameters:
    ubuntu_pool: $(ubuntu_pool)
    dependency_stage: Preflight
    SourceProject: $(SourceProject)
    GitHubTargetRepo: $(GitHubTargetRepo)
    GitHubReleasePrefix: $(GitHubReleasePrefix)
    GitHubReleaseIsPrerelease: $(GitHubReleaseIsPrerelease)
    GitHubServiceConnection: ${{ parameters.GitHubServiceConnection }}
    signed_pipeline_name: ${{ parameters.signed_pipeline_name }}
    signed_build_id: ${{ parameters.signed_build_id }}
    signed_artifact_name: ${{ parameters.signed_artifact_name }}
