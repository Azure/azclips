name: 3_naga_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - naga/test-pr

pr: none

variables:
  Solution_Name: cirrus.slnx
  Publish_Root: ./publish
  Bin_Root: ./bin
  Codeql.Enabled: false
  Codeql.SkipTaskAutoInjection: true
  runCodesignValidationInjection: false
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NugetSecurityAnalysisWarningLevel: none
  skipNugetSecurityAnalysis: true

stages:
  - stage: BuildAndPublish
    displayName: Build Learn Step By Step
    jobs:
      - job: Start
        displayName: Start workflow
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: echo "Starting 3_naga workflow"
            displayName: Start workflow

      - job: BuildArtifacts
        displayName: Build artifacts
        dependsOn: Start
        strategy:
          matrix:
            Debug_win_x64:
              configuration: Debug
              rid: win-x64
            Release_win_x64:
              configuration: Release
              rid: win-x64
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Install .NET Core from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true

          - pwsh: dotnet restore $(Solution_Name)
            displayName: Restore solution

          - pwsh: dotnet build $(Solution_Name) --configuration $(configuration) --no-restore
            displayName: Build solution

          - pwsh: dotnet test $(Solution_Name) --no-build --configuration $(configuration) --verbosity normal
            displayName: Execute unit tests

          - task: PublishPipelineArtifact@1
            displayName: Upload build artifacts
            inputs:
              targetPath: artifacts/$(configuration)
              artifact: Build_Artifacts_$(configuration)_$(rid)
              publishLocation: pipeline

      - job: PublishCli
        displayName: Publish CLI
        dependsOn: Start
        strategy:
          matrix:
            Debug_win_x64:
              configuration: Debug
              rid: win-x64
            Release_win_x64:
              configuration: Release
              rid: win-x64
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Install .NET Core from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true

          - pwsh: dotnet restore src/CLI/Core.Cli.csproj -r $(rid)
            displayName: Restore CLI project

          - pwsh: dotnet publish src/CLI/Core.Cli.csproj -c $(configuration) -r $(rid) --self-contained --no-restore -o "$(Publish_Root)/$(configuration)/$(rid)"
            displayName: Publish the CLI application

          - pwsh: Copy-Item src/CLI/Core.Cli.appxmanifest "$(Publish_Root)/$(configuration)/$(rid)/AppxManifest.xml"
            displayName: Copy appx manifest

          - pwsh: |
              $manifestPath = "$(Publish_Root)/$(configuration)/$(rid)/AppxManifest.xml"
              (Get-Content $manifestPath) |
                ForEach-Object {
                  $_ -replace 'Publisher="CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US"', 'Publisher="CN=Cirrus Dev Signer"'
                } |
                ForEach-Object {
                  $_ -replace '<PublisherDisplayName>Microsoft Corporation</PublisherDisplayName>', '<PublisherDisplayName>Cirrus Dev Signer</PublisherDisplayName>'
                } |
                Set-Content $manifestPath
            displayName: Update appx manifest publisher for dev signing

          - pwsh: |
              $assetsSource = "assets"
              $assetsDestination = "$(Publish_Root)/$(configuration)/$(rid)/Assets"
              if (Test-Path $assetsSource) {
                New-Item -ItemType Directory -Path $assetsDestination -Force | Out-Null
                Copy-Item "$assetsSource\*" $assetsDestination -Recurse -Force
              }
            displayName: Copy appx assets

          - pwsh: |
              $windowsKitBinRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
              $latestBinDir = Get-ChildItem -Path $windowsKitBinRoot -Directory |
                Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
                Sort-Object -Property Name -Descending |
                Select-Object -First 1
              if (-not $latestBinDir) {
                throw "No Windows SDK bin directory found under $windowsKitBinRoot"
              }
              $sdkArch = if ("$(rid)" -eq "win-x86") { "x86" } else { "x64" }
              $makeAppxPath = Join-Path -Path $latestBinDir.FullName -ChildPath "$sdkArch\MakeAppx.exe"
              New-Item -ItemType Directory -Path "$(Bin_Root)/$(configuration)" -Force | Out-Null
              & $makeAppxPath pack /d "$(Publish_Root)/$(configuration)/$(rid)" /p "$(Bin_Root)/$(configuration)/azv2-$(rid).msix" /nv
            displayName: Create the appx package

          - task: PublishPipelineArtifact@1
            displayName: Upload published CLI
            inputs:
              targetPath: $(Publish_Root)/$(configuration)/$(rid)
              artifact: Published_CLI_$(configuration)_$(rid)
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: Upload MSIX package
            inputs:
              targetPath: $(Bin_Root)/$(configuration)/azv2-$(rid).msix
              artifact: MSIX_Package_$(configuration)_$(rid)
              publishLocation: pipeline

      - job: PublishCliLinux
        displayName: Publish CLI (Linux)
        dependsOn: Start
        strategy:
          matrix:
            Release_linux_x64:
              configuration: Release
              rid: linux-x64
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Install .NET Core from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true

          - script: dotnet restore src/CLI/Core.Cli.csproj -r $(rid)
            displayName: Restore CLI project

          - script: dotnet publish src/CLI/Core.Cli.csproj -c $(configuration) -r $(rid) --self-contained --no-restore -o "$(Publish_Root)/$(configuration)/$(rid)"
            displayName: Publish the CLI application (Linux)

          - script: |
              mkdir -p "$(Bin_Root)/$(configuration)"
              tar -czf "$(Bin_Root)/$(configuration)/azv2-$(rid).tar.gz" -C "$(Publish_Root)/$(configuration)/$(rid)" .
            displayName: Create Linux tarball

          - task: PublishPipelineArtifact@1
            displayName: Upload Linux tarball
            inputs:
              targetPath: $(Bin_Root)/$(configuration)/azv2-$(rid).tar.gz
              artifact: Linux_Tarball_$(configuration)_$(rid)
              publishLocation: pipeline

      - job: PublishExtension
        displayName: Publish Extension (az extension)
        dependsOn: Start
        strategy:
          matrix:
            Debug_win_x64:
              configuration: Debug
              rid: win-x64
            Release_win_x64:
              configuration: Release
              rid: win-x64
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Install .NET Core from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true

          - pwsh: dotnet restore src/Extensions/Extension/Extensions.Extension.csproj -r $(rid)
            displayName: Restore extension project

          - pwsh: dotnet publish src/Extensions/Extension/Extensions.Extension.csproj -c $(configuration) -r $(rid) --no-restore -o "$(Publish_Root)/$(configuration)/$(rid)/Extensions/Extension"
            displayName: Publish the Extension (az extension)

          - task: PublishPipelineArtifact@1
            displayName: Upload published Extension
            inputs:
              targetPath: $(Publish_Root)/$(configuration)/$(rid)/Extensions/Extension
              artifact: Published_Extension_$(configuration)_$(rid)
              publishLocation: pipeline

      - job: DiscoverExtensions
        displayName: Discover extension matrix inputs
        dependsOn: Start
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - pwsh: |
              $extensions = Get-ChildItem -Path src/Extensions -Recurse -Filter *.csproj | Sort-Object FullName

              $buildMatrix = @{}
              $packMatrix = @{}

              foreach ($extension in $extensions) {
                [xml]$csproj = Get-Content $extension.FullName

                $extName = $csproj.Project.PropertyGroup.ExtName | Where-Object { $_ } | Select-Object -First 1
                $packageIdentity = $csproj.Project.PropertyGroup.PackageId | Where-Object { $_ } | Select-Object -First 1

                if (-not $extName) {
                  throw "ExtName not found in $($extension.FullName)"
                }

                if (-not $packageIdentity) {
                  throw "PackageId not found in $($extension.FullName)"
                }

                $baseLegName = ($extName -replace '[^A-Za-z0-9_]', '_')
                $path = $extension.FullName -replace '\\', '/'

                $buildMatrix["${baseLegName}_Debug"] = @{
                  extensionPath = $path
                  extName = $extName
                  configuration = 'Debug'
                }

                $buildMatrix["${baseLegName}_Release"] = @{
                  extensionPath = $path
                  extName = $extName
                  configuration = 'Release'
                }

                $packMatrix["${baseLegName}_Release"] = @{
                  extensionPath = $path
                  packageIdentity = $packageIdentity
                  configuration = 'Release'
                }
              }

              if ($buildMatrix.Keys.Count -eq 0) {
                $buildMatrixJson = '{}'
                $packMatrixJson = '{}'
              } else {
                $buildMatrixJson = $buildMatrix | ConvertTo-Json -Compress -Depth 10
                $packMatrixJson = $packMatrix | ConvertTo-Json -Compress -Depth 10
              }

              Write-Host "##vso[task.setvariable variable=buildMatrix;isOutput=true]$buildMatrixJson"
              Write-Host "##vso[task.setvariable variable=packMatrix;isOutput=true]$packMatrixJson"
              Write-Host "Discovered extensions matrix: $buildMatrixJson"
              Write-Host "Discovered pack matrix: $packMatrixJson"
            displayName: Discover and export extension matrices
            name: setExtensionMatrices

      - job: BuildExtension
        displayName: Build discovered extensions
        dependsOn: DiscoverExtensions
        condition: and(succeeded(), ne(dependencies.DiscoverExtensions.outputs['setExtensionMatrices.buildMatrix'], '{}'))
        strategy:
          matrix: $[ dependencies.DiscoverExtensions.outputs['setExtensionMatrices.buildMatrix'] ]
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Install .NET Core from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true

          - pwsh: dotnet restore "$(extensionPath)"
            displayName: Restore Extension

          - pwsh: dotnet build "$(extensionPath)" --configuration $(configuration) --no-restore
            displayName: Build Extension

          - task: PublishPipelineArtifact@1
            displayName: Upload Extension Build Artifacts
            inputs:
              targetPath: artifacts/$(configuration)/$(extName)
              artifact: Extension_$(extName)_$(configuration)
              publishLocation: pipeline

      - job: PackExtensionPackages
        displayName: Pack discovered extension packages
        dependsOn: DiscoverExtensions
        condition: and(succeeded(), ne(dependencies.DiscoverExtensions.outputs['setExtensionMatrices.packMatrix'], '{}'))
        strategy:
          matrix: $[ dependencies.DiscoverExtensions.outputs['setExtensionMatrices.packMatrix'] ]
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Install .NET Core from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true

          - pwsh: dotnet restore "$(extensionPath)"
            displayName: Restore Extension

          - pwsh: dotnet build "$(extensionPath)" --configuration $(configuration) --no-restore
            displayName: Build Extension (Generates NuGet Package)

          - task: PublishPipelineArtifact@1
            displayName: Upload Extension NuGet Package
            inputs:
              targetPath: artifacts/$(configuration)/$(packageIdentity)
              artifact: Extension_NuGet_$(packageIdentity)_$(configuration)
              publishLocation: pipeline

      - job: DiscoverPowerShellModules
        displayName: Discover PowerShell module matrix inputs
        dependsOn: Start
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - pwsh: |
              $modules = Get-ChildItem -Path src/PS -Recurse -Filter *.psd1 | Sort-Object FullName
              $moduleMatrix = @{}

              foreach ($moduleManifest in $modules) {
                $moduleName = [System.IO.Path]::GetFileNameWithoutExtension($moduleManifest.FullName)
                if (-not $moduleName) {
                  throw "Module name could not be determined from $($moduleManifest.FullName)"
                }

                $legName = ($moduleName -replace '[^A-Za-z0-9_]', '_')
                $manifestPath = $moduleManifest.FullName -replace '\\', '/'

                $moduleMatrix[$legName] = @{
                  moduleName = $moduleName
                  moduleManifestPath = $manifestPath
                  moduleDir = [System.IO.Path]::GetDirectoryName($manifestPath)
                  cmdletsProjectPath = "src/PS/$moduleName/Cmdlets.$moduleName.csproj"
                  extensionProjectPath = "src/Extensions/$moduleName/Extensions.$moduleName.csproj"
                }
              }

              if ($moduleMatrix.Keys.Count -eq 0) {
                $moduleMatrixJson = '{}'
              } else {
                $moduleMatrixJson = $moduleMatrix | ConvertTo-Json -Compress -Depth 10
              }

              Write-Host "##vso[task.setvariable variable=moduleMatrix;isOutput=true]$moduleMatrixJson"
              Write-Host "Discovered modules matrix: $moduleMatrixJson"
            displayName: Discover and export module matrix
            name: setModuleMatrix

      - job: BuildPowerShellModule
        displayName: Build PowerShell modules
        dependsOn: DiscoverPowerShellModules
        condition: and(succeeded(), ne(dependencies.DiscoverPowerShellModules.outputs['setModuleMatrix.moduleMatrix'], '{}'))
        strategy:
          matrix: $[ dependencies.DiscoverPowerShellModules.outputs['setModuleMatrix.moduleMatrix'] ]
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - pwsh: |
              Write-Host "Using preinstalled PowerShell on windows-latest"
              $PSVersionTable | Format-List
            displayName: Verify PowerShell runtime

          - task: UseDotNet@2
            displayName: Install .NET Core from global.json
            inputs:
              packageType: sdk
              useGlobalJson: true

          - pwsh: dotnet restore $(extensionProjectPath)
            displayName: Restore Extension

          - pwsh: dotnet restore $(cmdletsProjectPath)
            displayName: Restore Cmdlets Project

          - pwsh: dotnet build $(extensionProjectPath) --configuration Debug --no-restore
            displayName: Build Corresponding Extension

          - pwsh: dotnet build $(cmdletsProjectPath) --configuration Debug --no-restore
            displayName: Build Corresponding Cmdlets Project

          - pwsh: |
              dotnet restore src/Extensions/Login/Extensions.Login.csproj
              dotnet restore src/PS/Login/Cmdlets.Login.csproj
            displayName: Restore Login dependency projects (for Resources module)
            condition: eq(variables['moduleName'], 'Resources')

          - pwsh: |
              dotnet build src/Extensions/Login/Extensions.Login.csproj --configuration Debug --no-restore
              dotnet build src/PS/Login/Cmdlets.Login.csproj --configuration Debug --no-restore
            displayName: Build Login dependency projects (for Resources module)
            condition: eq(variables['moduleName'], 'Resources')

          - pwsh: dotnet restore cirrus.slnx
            displayName: Restore solution for module import validation

          - pwsh: dotnet build cirrus.slnx --configuration Debug --no-restore
            displayName: Build solution for module import validation

          - pwsh: |
              function Test-ManifestDependencies {
                param(
                  [Parameter(Mandatory = $true)]
                  [string]$ManifestPath
                )

                $manifestAbs = (Resolve-Path $ManifestPath).Path
                $manifestDir = Split-Path -Parent $manifestAbs
                Write-Host "Validating manifest: $manifestAbs"

                $manifest = Import-PowerShellDataFile -Path $manifestAbs

                if ($manifest.RequiredAssemblies) {
                  foreach ($asm in $manifest.RequiredAssemblies) {
                    $asmPath = [System.IO.Path]::GetFullPath((Join-Path $manifestDir $asm))
                    if (-not (Test-Path $asmPath)) {
                      throw "Missing RequiredAssemblies entry: $asmPath (declared: $asm)"
                    }
                    Write-Host "  OK RequiredAssembly: $asmPath"
                  }
                }

                if ($manifest.RequiredModules) {
                  foreach ($requiredModule in $manifest.RequiredModules) {
                    if ($requiredModule -is [hashtable] -and $requiredModule.ContainsKey('ModuleName')) {
                      $requiredPath = [System.IO.Path]::GetFullPath((Join-Path $manifestDir $requiredModule.ModuleName))
                      if (-not (Test-Path $requiredPath)) {
                        throw "Missing RequiredModules manifest: $requiredPath (declared: $($requiredModule.ModuleName))"
                      }
                      Write-Host "  OK RequiredModule manifest: $requiredPath"
                      Test-ManifestDependencies -ManifestPath $requiredPath
                    }
                  }
                }

                Write-Host "Manifest validation passed: $manifestAbs"
              }

              try {
                Test-ManifestDependencies -ManifestPath "$(moduleManifestPath)"
                Write-Host "Dependency validation succeeded for module: $(moduleName)"
              } catch {
                Write-Host "Debug listing of artifacts/Debug/Core:"
                Get-ChildItem ./artifacts/Debug/Core -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
                throw "Failed to validate module dependencies for $(moduleName). $_"
              }
            displayName: Validate Module Manifest Dependencies

      - job: End
        displayName: End workflow
        dependsOn:
          - BuildArtifacts
          - PublishCli
          - PublishCliLinux
          - PublishExtension
          - BuildExtension
          - PackExtensionPackages
          - DiscoverPowerShellModules
          - BuildPowerShellModule
        condition: always()
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: echo "3_naga workflow finished"
            displayName: End workflow
