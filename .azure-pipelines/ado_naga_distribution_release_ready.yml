name: dist_release_ready_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
  PackagingScriptsRoot: $(Build.SourcesDirectory)/devops/scripts/packaging
  PackagingOutRoot: $(Build.SourcesDirectory)/devops/out
  PackagingCommonOutRoot: $(PackagingOutRoot)/common
  PackagingLinuxOutRoot: $(PackagingOutRoot)/linux
  PackagingWindowsOutRoot: $(PackagingOutRoot)/windows
  PackagingMacOSOutRoot: $(PackagingOutRoot)/macos
  PackageProfile: lean
  PackagingLinuxRid: linux-x64
  PackagingWindowsRid: win-x64
  PackagingMacOSRid: osx-arm64
  ubuntu_pool: 'ubuntu-latest'
  windows_pool: 'windows-latest'
  macos_arm64_pool: 'macOS-15-arm64'
  macos_intel_pool: 'macOS-15'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  Codeql.Enabled: false
  Codeql.SkipTaskAutoInjection: true
  AdvancedSecurity.CodeQL.Enabled: false
  ComponentGovernance.Enabled: false
  skipComponentGovernanceDetection: true
  runCodesignValidationInjection: false
  CredScan.Enabled: false
  BinSkim.Enabled: false
  PoliCheck.Enabled: false
  RoslynAnalyzers.Enabled: false
  SdtReport.Enabled: false
  TSAUpload.Enabled: false
  NugetSecurityAnalysisWarningLevel: none
  skipNugetSecurityAnalysis: true

stages:
- stage: Init
  displayName: Init
  jobs:
  - job: Start
    displayName: Kickoff
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0
    - script: |
        echo "Starting release-ready distribution pipeline"
        echo "Build number: $(Build.BuildNumber)"
        echo "Branch: $(Build.SourceBranch)"
      displayName: Context

- stage: BuildCommon
  displayName: Build Common
  dependsOn: Init
  condition: succeeded()
  jobs:
  - job: BuildCommonOutputs
    displayName: Common Output
    timeoutInMinutes: 90
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true

    - script: |
        set -euo pipefail
        chmod +x "$(PackagingScriptsRoot)/common/build_common.sh"
        OUT_ROOT="$(PackagingCommonOutRoot)" PACKAGE_PROFILE="$(PackageProfile)" "$(PackagingScriptsRoot)/common/build_common.sh"
      displayName: Build Common

    - task: PublishPipelineArtifact@1
      displayName: Publish Common
      inputs:
        targetPath: $(PackagingCommonOutRoot)
        artifact: Distribution_Common
        publishLocation: pipeline

- stage: BuildLinux
  displayName: Build Linux
  dependsOn: BuildCommon
  condition: succeeded()
  jobs:
  - job: BuildLinuxOutput
    displayName: Linux Tarball
    timeoutInMinutes: 60
    strategy:
      matrix:
        linux_x64:
          Rid: linux-x64
          DistributionArtifact: Distribution_Linux
        linux_arm64:
          Rid: linux-arm64
          DistributionArtifact: Distribution_Linux_Arm64
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: Distribution_Common
        path: $(PackagingCommonOutRoot)

    - script: |
        set -euo pipefail
        package_profile="$(echo "$(PackageProfile)" | tr '[:upper:]' '[:lower:]')"
        if [[ "$package_profile" == "full" ]]; then
          artifact_prefix="azv2"
        elif [[ "$package_profile" == "lean" ]]; then
          artifact_prefix="azv2-lean"
        else
          echo "ERROR: Unsupported PackageProfile '$package_profile'. Expected 'lean' or 'full'."
          exit 1
        fi
        cli_tar_path="$(PackagingLinuxOutRoot)/Release/tarball/${artifact_prefix}-$(Rid).tar.gz"
        chmod +x "$(PackagingScriptsRoot)/linux/tarball/build_linux_tarball.sh"
        OUT_ROOT="$(PackagingLinuxOutRoot)" COMMON_OUT_ROOT="$(PackagingCommonOutRoot)" PACKAGE_PROFILE="$package_profile" RID="$(Rid)" CLI_TAR_PATH="$cli_tar_path" "$(PackagingScriptsRoot)/linux/tarball/build_linux_tarball.sh"
      displayName: Build Linux Tarball

    - task: PublishPipelineArtifact@1
      displayName: Publish Linux
      inputs:
        targetPath: $(PackagingLinuxOutRoot)
        artifact: $(DistributionArtifact)
        publishLocation: pipeline

- stage: BuildWindows
  displayName: Build Windows
  dependsOn: BuildCommon
  condition: succeeded()
  jobs:
  - job: BuildWindowsOutput
    displayName: Windows Zip
    timeoutInMinutes: 60
    strategy:
      matrix:
        win_x64:
          Rid: win-x64
          DistributionArtifact: Distribution_Windows
        win_arm64:
          Rid: win-arm64
          DistributionArtifact: Distribution_Windows_Arm64
    pool:
      vmImage: $(windows_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: Distribution_Common
        path: $(PackagingCommonOutRoot)

    - task: PowerShell@2
      displayName: Build Windows Zip
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'
          $packageProfile = "$(PackageProfile)".ToLowerInvariant()
          if ($packageProfile -eq 'full') {
            $artifactPrefix = 'azv2'
          }
          elseif ($packageProfile -eq 'lean') {
            $artifactPrefix = 'azv2-lean'
          }
          else {
            throw "Unsupported PackageProfile '$packageProfile'. Expected 'lean' or 'full'."
          }

          $cliZipPath = "$(PackagingWindowsOutRoot)/Release/zip/$artifactPrefix-$(Rid).zip"
          $env:PACKAGE_PROFILE = $packageProfile
          & "$(PackagingScriptsRoot)/windows/zip/build_win_zip.ps1" -OutRoot "$(PackagingWindowsOutRoot)" -CommonOutRoot "$(PackagingCommonOutRoot)" -Rid "$(Rid)" -CliWinZipPath $cliZipPath
        pwsh: true

    - task: PublishPipelineArtifact@1
      displayName: Publish Windows
      inputs:
        targetPath: $(PackagingWindowsOutRoot)
        artifact: $(DistributionArtifact)
        publishLocation: pipeline

- stage: BuildMacOS
  displayName: Build macOS
  dependsOn: BuildCommon
  condition: succeeded()
  jobs:
  - job: BuildMacOSOutput
    displayName: macOS Tarball
    timeoutInMinutes: 60
    strategy:
      matrix:
        osx_arm64:
          Rid: osx-arm64
          DistributionArtifact: Distribution_MacOS
          VmImage: macOS-15-arm64
        osx_x64:
          Rid: osx-x64
          DistributionArtifact: Distribution_MacOS_Intel
          VmImage: macOS-15
    pool:
      vmImage: $(VmImage)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: Distribution_Common
        path: $(PackagingCommonOutRoot)

    - script: |
        set -euo pipefail
        package_profile="$(echo "$(PackageProfile)" | tr '[:upper:]' '[:lower:]')"
        if [[ "$package_profile" == "full" ]]; then
          artifact_prefix="azv2"
        elif [[ "$package_profile" == "lean" ]]; then
          artifact_prefix="azv2-lean"
        else
          echo "ERROR: Unsupported PackageProfile '$package_profile'. Expected 'lean' or 'full'."
          exit 1
        fi
        cli_tar_path="$(PackagingMacOSOutRoot)/Release/tarball/${artifact_prefix}-$(Rid).tar.gz"
        chmod +x "$(PackagingScriptsRoot)/macos/tarball/build_macos_tarball.sh"
        OUT_ROOT="$(PackagingMacOSOutRoot)" COMMON_OUT_ROOT="$(PackagingCommonOutRoot)" PACKAGE_PROFILE="$package_profile" RID="$(Rid)" CLI_TAR_PATH="$cli_tar_path" "$(PackagingScriptsRoot)/macos/tarball/build_macos_tarball.sh"
      displayName: Build macOS Tarball

    - task: PublishPipelineArtifact@1
      displayName: Publish macOS
      inputs:
        targetPath: $(PackagingMacOSOutRoot)
        artifact: $(DistributionArtifact)
        publishLocation: pipeline

- stage: ValidateLinux
  displayName: Validate Linux
  dependsOn: BuildLinux
  condition: succeeded()
  jobs:
  - job: LinuxValidation
    displayName: Linux Validation
    timeoutInMinutes: 45
    strategy:
      matrix:
        linux_x64:
          Rid: linux-x64
          DistributionArtifact: Distribution_Linux
          SkipRuntime: false
        linux_arm64:
          Rid: linux-arm64
          DistributionArtifact: Distribution_Linux_Arm64
          SkipRuntime: true
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      displayName: Get Linux Dist
      inputs:
        artifact: $(DistributionArtifact)
        path: $(PackagingLinuxOutRoot)

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: Distribution_Common
        path: $(PackagingCommonOutRoot)

    - script: |
        set -euo pipefail
        package_profile="$(echo "$(PackageProfile)" | tr '[:upper:]' '[:lower:]')"
        if [[ "$package_profile" == "full" ]]; then
          artifact_prefix="azv2"
        elif [[ "$package_profile" == "lean" ]]; then
          artifact_prefix="azv2-lean"
        else
          echo "ERROR: Unsupported PackageProfile '$package_profile'. Expected 'lean' or 'full'."
          exit 1
        fi
        cli_tar_path="$(PackagingLinuxOutRoot)/Release/tarball/${artifact_prefix}-$(Rid).tar.gz"
        chmod +x "$(PackagingScriptsRoot)/linux/tarball/test_linux_tarball_bundled_plus_ext.sh"
        OUT_ROOT="$(PackagingLinuxOutRoot)" COMMON_OUT_ROOT="$(PackagingCommonOutRoot)" PACKAGE_PROFILE="$package_profile" CLI_TAR_PATH="$cli_tar_path" SKIP_RUNTIME="$(SkipRuntime)" "$(PackagingScriptsRoot)/linux/tarball/test_linux_tarball_bundled_plus_ext.sh"
      displayName: Validate Linux Tarball

    - task: PublishPipelineArtifact@1
      displayName: Publish Linux Sim
      condition: always()
      inputs:
        targetPath: $(Build.SourcesDirectory)/devops/sim/linux-tarball-bundled-plus-ext
        artifact: Validate_Linux_Sim_$(Rid)
        publishLocation: pipeline

- stage: ValidateWindows
  displayName: Validate Windows
  dependsOn: BuildWindows
  condition: succeeded()
  jobs:
  - job: WindowsValidation
    displayName: Windows Validation
    timeoutInMinutes: 45
    strategy:
      matrix:
        win_x64:
          Rid: win-x64
          DistributionArtifact: Distribution_Windows
          SkipRuntime: false
        win_arm64:
          Rid: win-arm64
          DistributionArtifact: Distribution_Windows_Arm64
          SkipRuntime: true
    pool:
      vmImage: $(windows_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      displayName: Get Windows Dist
      inputs:
        artifact: $(DistributionArtifact)
        path: $(PackagingWindowsOutRoot)

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: Distribution_Common
        path: $(PackagingCommonOutRoot)

    - task: PowerShell@2
      displayName: Validate Windows Zip
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $packageProfile = "$(PackageProfile)".ToLowerInvariant()
          if ($packageProfile -eq 'full') {
            $artifactPrefix = 'azv2'
          }
          elseif ($packageProfile -eq 'lean') {
            $artifactPrefix = 'azv2-lean'
          }
          else {
            throw "Unsupported PackageProfile '$packageProfile'. Expected 'lean' or 'full'."
          }

          $cliZipPath = "$(PackagingWindowsOutRoot)/Release/zip/$artifactPrefix-$(Rid).zip"
          $env:PACKAGE_PROFILE = $packageProfile
          $skipRuntime = "$(SkipRuntime)"
          if ($skipRuntime -eq 'true') {
            & "$(PackagingScriptsRoot)/windows/zip/test_windows_zip_bundled_plus_ext.ps1" -OutRoot "$(PackagingWindowsOutRoot)" -CommonOutRoot "$(PackagingCommonOutRoot)" -CliZipPath $cliZipPath -SkipRuntime
          }
          else {
            & "$(PackagingScriptsRoot)/windows/zip/test_windows_zip_bundled_plus_ext.ps1" -OutRoot "$(PackagingWindowsOutRoot)" -CommonOutRoot "$(PackagingCommonOutRoot)" -CliZipPath $cliZipPath
          }

    - task: PublishPipelineArtifact@1
      displayName: Publish Windows Sim
      condition: always()
      inputs:
        targetPath: $(Build.SourcesDirectory)/devops/sim/win-zip-bundled-plus-ext
        artifact: Validate_Windows_Sim_$(Rid)
        publishLocation: pipeline

- stage: ValidateMacOS
  displayName: Validate macOS
  dependsOn: BuildMacOS
  condition: succeeded()
  jobs:
  - job: MacOSValidation
    displayName: macOS Validation
    timeoutInMinutes: 45
    strategy:
      matrix:
        osx_arm64:
          Rid: osx-arm64
          DistributionArtifact: Distribution_MacOS
          VmImage: macOS-15-arm64
        osx_x64:
          Rid: osx-x64
          DistributionArtifact: Distribution_MacOS_Intel
          VmImage: macOS-15
    pool:
      vmImage: $(VmImage)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      displayName: Get macOS Dist
      inputs:
        artifact: $(DistributionArtifact)
        path: $(PackagingMacOSOutRoot)

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: Distribution_Common
        path: $(PackagingCommonOutRoot)

    - script: |
        set -euo pipefail
        package_profile="$(echo "$(PackageProfile)" | tr '[:upper:]' '[:lower:]')"
        if [[ "$package_profile" == "full" ]]; then
          artifact_prefix="azv2"
        elif [[ "$package_profile" == "lean" ]]; then
          artifact_prefix="azv2-lean"
        else
          echo "ERROR: Unsupported PackageProfile '$package_profile'. Expected 'lean' or 'full'."
          exit 1
        fi
        cli_tar_path="$(PackagingMacOSOutRoot)/Release/tarball/${artifact_prefix}-$(Rid).tar.gz"
        chmod +x "$(PackagingScriptsRoot)/macos/tarball/test_macos_tarball_bundled_plus_ext.sh"
        OUT_ROOT="$(PackagingMacOSOutRoot)" COMMON_OUT_ROOT="$(PackagingCommonOutRoot)" PACKAGE_PROFILE="$package_profile" RID="$(Rid)" CLI_TAR_PATH="$cli_tar_path" "$(PackagingScriptsRoot)/macos/tarball/test_macos_tarball_bundled_plus_ext.sh"
      displayName: Validate macOS Tarball

    - task: PublishPipelineArtifact@1
      displayName: Publish macOS Sim
      condition: always()
      inputs:
        targetPath: $(Build.SourcesDirectory)/devops/sim/macos-tarball-bundled-plus-ext
        artifact: Validate_MacOS_Sim_$(Rid)
        publishLocation: pipeline

- stage: Finalize
  displayName: Finalize
  dependsOn:
  - BuildCommon
  - BuildLinux
  - BuildWindows
  - BuildMacOS
  - ValidateLinux
  - ValidateWindows
  - ValidateMacOS
  condition: always()
  variables:
    BuildCommonResult: $[ stageDependencies.BuildCommon.BuildCommonOutputs.result ]
    BuildLinuxResult: $[ stageDependencies.BuildLinux.BuildLinuxOutput.result ]
    BuildWindowsResult: $[ stageDependencies.BuildWindows.BuildWindowsOutput.result ]
    BuildMacOSResult: $[ stageDependencies.BuildMacOS.BuildMacOSOutput.result ]
    ValidateLinuxResult: $[ stageDependencies.ValidateLinux.LinuxValidation.result ]
    ValidateWindowsResult: $[ stageDependencies.ValidateWindows.WindowsValidation.result ]
    ValidateMacOSResult: $[ stageDependencies.ValidateMacOS.MacOSValidation.result ]
  jobs:
  - job: Summary
    displayName: Summary
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - script: |
        echo "BuildCommon: $(BuildCommonResult)"
        echo "BuildLinux: $(BuildLinuxResult)"
        echo "BuildWindows: $(BuildWindowsResult)"
        echo "BuildMacOS: $(BuildMacOSResult)"
        echo "ValidateLinux: $(ValidateLinuxResult)"
        echo "ValidateWindows: $(ValidateWindowsResult)"
        echo "ValidateMacOS: $(ValidateMacOSResult)"
      displayName: Stage Summary
