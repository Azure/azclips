name: dist_release_ready_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
  PackagingScriptsRoot: $(Build.SourcesDirectory)/devops/scripts/packaging
  PackagingOutRoot: $(Build.SourcesDirectory)/devops/out
  PackagingCommonOutRoot: $(PackagingOutRoot)/common
  PackagingLinuxOutRoot: $(PackagingOutRoot)/linux
  PackagingWindowsOutRoot: $(PackagingOutRoot)/windows
  PackagingMacOSOutRoot: $(PackagingOutRoot)/macos
  PackagingLinuxRid: linux-x64
  PackagingWindowsRid: win-x64
  PackagingMacOSRid: osx-arm64
  ubuntu_pool: 'ubuntu-latest'
  windows_pool: 'windows-latest'
  macos_arm64_pool: 'macOS-15-arm64'
  macos_intel_pool: 'macOS-15'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  Codeql.Enabled: false
  Codeql.SkipTaskAutoInjection: true
  AdvancedSecurity.CodeQL.Enabled: false
  ComponentGovernance.Enabled: false
  skipComponentGovernanceDetection: true
  runCodesignValidationInjection: false
  CredScan.Enabled: false
  BinSkim.Enabled: false
  PoliCheck.Enabled: false
  RoslynAnalyzers.Enabled: false
  SdtReport.Enabled: false
  TSAUpload.Enabled: false
  NugetSecurityAnalysisWarningLevel: none
  skipNugetSecurityAnalysis: true

stages:
- stage: Init
  displayName: Init
  jobs:
  - job: Start
    displayName: Kickoff
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0
    - script: |
        echo "Starting release-ready distribution pipeline"
        echo "Build number: $(Build.BuildNumber)"
        echo "Branch: $(Build.SourceBranch)"
      displayName: Context

- stage: BuildCommon
  displayName: Build Common
  dependsOn: Init
  condition: succeeded()
  jobs:
  - job: BuildCommonOutputs
    displayName: Common Output
    timeoutInMinutes: 90
    strategy:
      matrix:
        lean:
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
        full:
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true

    - script: |
        set -euo pipefail
        chmod +x "$(PackagingScriptsRoot)/common/build_common.sh"
        OUT_ROOT="$(PackagingCommonOutRoot)" PACKAGE_PROFILE="$(BuildProfile)" "$(PackagingScriptsRoot)/common/build_common.sh"
      displayName: Build Common

    - task: PublishPipelineArtifact@1
      displayName: Publish Common
      inputs:
        targetPath: $(PackagingCommonOutRoot)
        artifact: $(DistributionCommonArtifact)
        publishLocation: pipeline

- stage: BuildLinux
  displayName: Build Linux
  dependsOn: BuildCommon
  condition: succeeded()
  jobs:
  - job: BuildLinuxOutput
    displayName: Linux Tarball
    timeoutInMinutes: 60
    strategy:
      matrix:
        linux_x64_lean:
          Rid: linux-x64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_Linux_Lean
          CliTarPath: $(PackagingLinuxOutRoot)/Release/tarball/azv2-lean-linux-x64.tar.gz
        linux_arm64_lean:
          Rid: linux-arm64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_Linux_Arm64_Lean
          CliTarPath: $(PackagingLinuxOutRoot)/Release/tarball/azv2-lean-linux-arm64.tar.gz
        linux_x64_full:
          Rid: linux-x64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_Linux_Full
          CliTarPath: $(PackagingLinuxOutRoot)/Release/tarball/azv2-linux-x64.tar.gz
        linux_arm64_full:
          Rid: linux-arm64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_Linux_Arm64_Full
          CliTarPath: $(PackagingLinuxOutRoot)/Release/tarball/azv2-linux-arm64.tar.gz
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: $(DistributionCommonArtifact)
        path: $(PackagingCommonOutRoot)

    - script: |
        set -euo pipefail
        chmod +x "$(PackagingScriptsRoot)/linux/tarball/build_linux_tarball.sh"
        OUT_ROOT="$(PackagingLinuxOutRoot)" COMMON_OUT_ROOT="$(PackagingCommonOutRoot)" PACKAGE_PROFILE="$(BuildProfile)" RID="$(Rid)" CLI_TAR_PATH="$(CliTarPath)" "$(PackagingScriptsRoot)/linux/tarball/build_linux_tarball.sh"
      displayName: Build Linux Tarball

    - task: PublishPipelineArtifact@1
      displayName: Publish Linux
      inputs:
        targetPath: $(PackagingLinuxOutRoot)
        artifact: $(DistributionArtifact)
        publishLocation: pipeline

- stage: BuildWindows
  displayName: Build Windows
  dependsOn: BuildCommon
  condition: succeeded()
  jobs:
  - job: BuildWindowsOutput
    displayName: Windows Zip
    timeoutInMinutes: 60
    strategy:
      matrix:
        win_x64_lean:
          Rid: win-x64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_Windows_Lean
          CliZipPath: $(PackagingWindowsOutRoot)/Release/zip/azv2-lean-win-x64.zip
        win_arm64_lean:
          Rid: win-arm64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_Windows_Arm64_Lean
          CliZipPath: $(PackagingWindowsOutRoot)/Release/zip/azv2-lean-win-arm64.zip
        win_x64_full:
          Rid: win-x64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_Windows_Full
          CliZipPath: $(PackagingWindowsOutRoot)/Release/zip/azv2-win-x64.zip
        win_arm64_full:
          Rid: win-arm64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_Windows_Arm64_Full
          CliZipPath: $(PackagingWindowsOutRoot)/Release/zip/azv2-win-arm64.zip
    pool:
      vmImage: $(windows_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: $(DistributionCommonArtifact)
        path: $(PackagingCommonOutRoot)

    - task: PowerShell@2
      displayName: Build Windows Zip
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'
          $env:PACKAGE_PROFILE = "$(BuildProfile)"
          & "$(PackagingScriptsRoot)/windows/zip/build_win_zip.ps1" -OutRoot "$(PackagingWindowsOutRoot)" -CommonOutRoot "$(PackagingCommonOutRoot)" -Rid "$(Rid)" -CliWinZipPath "$(CliZipPath)"
        pwsh: true

    - task: PublishPipelineArtifact@1
      displayName: Publish Windows
      inputs:
        targetPath: $(PackagingWindowsOutRoot)
        artifact: $(DistributionArtifact)
        publishLocation: pipeline

- stage: BuildMacOS
  displayName: Build macOS
  dependsOn: BuildCommon
  condition: succeeded()
  jobs:
  - job: BuildMacOSOutput
    displayName: macOS Tarball
    timeoutInMinutes: 60
    strategy:
      matrix:
        osx_arm64_lean:
          Rid: osx-arm64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_MacOS_Lean
          VmImage: macOS-15-arm64
          CliTarPath: $(PackagingMacOSOutRoot)/Release/tarball/azv2-lean-osx-arm64.tar.gz
        osx_x64_lean:
          Rid: osx-x64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_MacOS_Intel_Lean
          VmImage: macOS-15
          CliTarPath: $(PackagingMacOSOutRoot)/Release/tarball/azv2-lean-osx-x64.tar.gz
        osx_arm64_full:
          Rid: osx-arm64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_MacOS_Full
          VmImage: macOS-15-arm64
          CliTarPath: $(PackagingMacOSOutRoot)/Release/tarball/azv2-osx-arm64.tar.gz
        osx_x64_full:
          Rid: osx-x64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_MacOS_Intel_Full
          VmImage: macOS-15
          CliTarPath: $(PackagingMacOSOutRoot)/Release/tarball/azv2-osx-x64.tar.gz
    pool:
      vmImage: $(VmImage)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: $(DistributionCommonArtifact)
        path: $(PackagingCommonOutRoot)

    - script: |
        set -euo pipefail
        chmod +x "$(PackagingScriptsRoot)/macos/tarball/build_macos_tarball.sh"
        OUT_ROOT="$(PackagingMacOSOutRoot)" COMMON_OUT_ROOT="$(PackagingCommonOutRoot)" PACKAGE_PROFILE="$(BuildProfile)" RID="$(Rid)" CLI_TAR_PATH="$(CliTarPath)" "$(PackagingScriptsRoot)/macos/tarball/build_macos_tarball.sh"
      displayName: Build macOS Tarball

    - task: PublishPipelineArtifact@1
      displayName: Publish macOS
      inputs:
        targetPath: $(PackagingMacOSOutRoot)
        artifact: $(DistributionArtifact)
        publishLocation: pipeline

- stage: ValidateLinux
  displayName: Validate Linux
  dependsOn: BuildLinux
  condition: succeeded()
  jobs:
  - job: LinuxValidation
    displayName: Linux Validation
    timeoutInMinutes: 45
    strategy:
      matrix:
        linux_x64_lean:
          Rid: linux-x64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_Linux_Lean
          CliTarPath: $(PackagingLinuxOutRoot)/Release/tarball/azv2-lean-linux-x64.tar.gz
          SkipRuntime: false
        linux_arm64_lean:
          Rid: linux-arm64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_Linux_Arm64_Lean
          CliTarPath: $(PackagingLinuxOutRoot)/Release/tarball/azv2-lean-linux-arm64.tar.gz
          SkipRuntime: true
        linux_x64_full:
          Rid: linux-x64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_Linux_Full
          CliTarPath: $(PackagingLinuxOutRoot)/Release/tarball/azv2-linux-x64.tar.gz
          SkipRuntime: false
        linux_arm64_full:
          Rid: linux-arm64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_Linux_Arm64_Full
          CliTarPath: $(PackagingLinuxOutRoot)/Release/tarball/azv2-linux-arm64.tar.gz
          SkipRuntime: true
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      displayName: Get Linux Dist
      inputs:
        artifact: $(DistributionArtifact)
        path: $(PackagingLinuxOutRoot)

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: $(DistributionCommonArtifact)
        path: $(PackagingCommonOutRoot)

    - script: |
        set -euo pipefail
        chmod +x "$(PackagingScriptsRoot)/linux/tarball/test_linux_tarball_bundled_plus_ext.sh"
        OUT_ROOT="$(PackagingLinuxOutRoot)" COMMON_OUT_ROOT="$(PackagingCommonOutRoot)" PACKAGE_PROFILE="$(BuildProfile)" CLI_TAR_PATH="$(CliTarPath)" SKIP_RUNTIME="$(SkipRuntime)" "$(PackagingScriptsRoot)/linux/tarball/test_linux_tarball_bundled_plus_ext.sh"
      displayName: Validate Linux Tarball

    - task: PublishPipelineArtifact@1
      displayName: Publish Linux Sim
      condition: always()
      inputs:
        targetPath: $(Build.SourcesDirectory)/devops/sim/linux-tarball-bundled-plus-ext
        artifact: Validate_Linux_Sim_$(Rid)_$(BuildProfile)
        publishLocation: pipeline

- stage: ValidateWindows
  displayName: Validate Windows
  dependsOn: BuildWindows
  condition: succeeded()
  jobs:
  - job: WindowsValidation
    displayName: Windows Validation
    timeoutInMinutes: 45
    strategy:
      matrix:
        win_x64_lean:
          Rid: win-x64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_Windows_Lean
          CliZipPath: $(PackagingWindowsOutRoot)/Release/zip/azv2-lean-win-x64.zip
          SkipRuntime: false
        win_arm64_lean:
          Rid: win-arm64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_Windows_Arm64_Lean
          CliZipPath: $(PackagingWindowsOutRoot)/Release/zip/azv2-lean-win-arm64.zip
          SkipRuntime: true
        win_x64_full:
          Rid: win-x64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_Windows_Full
          CliZipPath: $(PackagingWindowsOutRoot)/Release/zip/azv2-win-x64.zip
          SkipRuntime: false
        win_arm64_full:
          Rid: win-arm64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_Windows_Arm64_Full
          CliZipPath: $(PackagingWindowsOutRoot)/Release/zip/azv2-win-arm64.zip
          SkipRuntime: true
    pool:
      vmImage: $(windows_pool)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      displayName: Get Windows Dist
      inputs:
        artifact: $(DistributionArtifact)
        path: $(PackagingWindowsOutRoot)

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: $(DistributionCommonArtifact)
        path: $(PackagingCommonOutRoot)

    - task: PowerShell@2
      displayName: Validate Windows Zip
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $env:PACKAGE_PROFILE = "$(BuildProfile)"
          $skipRuntime = "$(SkipRuntime)"
          if ($skipRuntime -eq 'true') {
            & "$(PackagingScriptsRoot)/windows/zip/test_windows_zip_bundled_plus_ext.ps1" -OutRoot "$(PackagingWindowsOutRoot)" -CommonOutRoot "$(PackagingCommonOutRoot)" -CliZipPath "$(CliZipPath)" -SkipRuntime
          }
          else {
            & "$(PackagingScriptsRoot)/windows/zip/test_windows_zip_bundled_plus_ext.ps1" -OutRoot "$(PackagingWindowsOutRoot)" -CommonOutRoot "$(PackagingCommonOutRoot)" -CliZipPath "$(CliZipPath)"
          }

    - task: PublishPipelineArtifact@1
      displayName: Publish Windows Sim
      condition: always()
      inputs:
        targetPath: $(Build.SourcesDirectory)/devops/sim/win-zip-bundled-plus-ext
        artifact: Validate_Windows_Sim_$(Rid)_$(BuildProfile)
        publishLocation: pipeline

- stage: ValidateMacOS
  displayName: Validate macOS
  dependsOn: BuildMacOS
  condition: succeeded()
  jobs:
  - job: MacOSValidation
    displayName: macOS Validation
    timeoutInMinutes: 45
    strategy:
      matrix:
        osx_arm64_lean:
          Rid: osx-arm64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_MacOS_Lean
          VmImage: macOS-15-arm64
          CliTarPath: $(PackagingMacOSOutRoot)/Release/tarball/azv2-lean-osx-arm64.tar.gz
        osx_x64_lean:
          Rid: osx-x64
          BuildProfile: lean
          DistributionCommonArtifact: Distribution_Common_Lean
          DistributionArtifact: Distribution_MacOS_Intel_Lean
          VmImage: macOS-15
          CliTarPath: $(PackagingMacOSOutRoot)/Release/tarball/azv2-lean-osx-x64.tar.gz
        osx_arm64_full:
          Rid: osx-arm64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_MacOS_Full
          VmImage: macOS-15-arm64
          CliTarPath: $(PackagingMacOSOutRoot)/Release/tarball/azv2-osx-arm64.tar.gz
        osx_x64_full:
          Rid: osx-x64
          BuildProfile: full
          DistributionCommonArtifact: Distribution_Common_Full
          DistributionArtifact: Distribution_MacOS_Intel_Full
          VmImage: macOS-15
          CliTarPath: $(PackagingMacOSOutRoot)/Release/tarball/azv2-osx-x64.tar.gz
    pool:
      vmImage: $(VmImage)
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      displayName: Get macOS Dist
      inputs:
        artifact: $(DistributionArtifact)
        path: $(PackagingMacOSOutRoot)

    - task: DownloadPipelineArtifact@2
      displayName: Get Common
      inputs:
        artifact: $(DistributionCommonArtifact)
        path: $(PackagingCommonOutRoot)

    - script: |
        set -euo pipefail
        chmod +x "$(PackagingScriptsRoot)/macos/tarball/test_macos_tarball_bundled_plus_ext.sh"
        OUT_ROOT="$(PackagingMacOSOutRoot)" COMMON_OUT_ROOT="$(PackagingCommonOutRoot)" PACKAGE_PROFILE="$(BuildProfile)" RID="$(Rid)" CLI_TAR_PATH="$(CliTarPath)" "$(PackagingScriptsRoot)/macos/tarball/test_macos_tarball_bundled_plus_ext.sh"
      displayName: Validate macOS Tarball

    - task: PublishPipelineArtifact@1
      displayName: Publish macOS Sim
      condition: always()
      inputs:
        targetPath: $(Build.SourcesDirectory)/devops/sim/macos-tarball-bundled-plus-ext
        artifact: Validate_MacOS_Sim_$(Rid)_$(BuildProfile)
        publishLocation: pipeline

- stage: Finalize
  displayName: Finalize
  dependsOn:
  - BuildCommon
  - BuildLinux
  - BuildWindows
  - BuildMacOS
  - ValidateLinux
  - ValidateWindows
  - ValidateMacOS
  condition: always()
  variables:
    BuildCommonResult: $[ stageDependencies.BuildCommon.BuildCommonOutputs.result ]
    BuildLinuxResult: $[ stageDependencies.BuildLinux.BuildLinuxOutput.result ]
    BuildWindowsResult: $[ stageDependencies.BuildWindows.BuildWindowsOutput.result ]
    BuildMacOSResult: $[ stageDependencies.BuildMacOS.BuildMacOSOutput.result ]
    ValidateLinuxResult: $[ stageDependencies.ValidateLinux.LinuxValidation.result ]
    ValidateWindowsResult: $[ stageDependencies.ValidateWindows.WindowsValidation.result ]
    ValidateMacOSResult: $[ stageDependencies.ValidateMacOS.MacOSValidation.result ]
  jobs:
  - job: Summary
    displayName: Summary
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - script: |
        echo "BuildCommon: $(BuildCommonResult)"
        echo "BuildLinux: $(BuildLinuxResult)"
        echo "BuildWindows: $(BuildWindowsResult)"
        echo "BuildMacOS: $(BuildMacOSResult)"
        echo "ValidateLinux: $(ValidateLinuxResult)"
        echo "ValidateWindows: $(ValidateWindowsResult)"
        echo "ValidateMacOS: $(ValidateMacOSResult)"
      displayName: Stage Summary
