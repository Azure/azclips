name: dist_release_ready_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
  DistScriptsRoot: $(Build.SourcesDirectory)/devops/scripts/distribution
  DistOutRoot: $(Build.SourcesDirectory)/devops/scripts/distribution/out
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

stages:
- stage: Init
  displayName: Initialize
  jobs:
  - job: Start
    displayName: Start
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0
    - script: |
        echo "Starting release-ready distribution pipeline"
        echo "Build number: $(Build.BuildNumber)"
        echo "Branch: $(Build.SourceBranch)"
      displayName: Print run context

- stage: BuildCommon
  displayName: Build Common Distribution Assets
  dependsOn: Init
  condition: succeeded()
  jobs:
  - job: BuildCommonOutputs
    displayName: Build common outputs
    timeoutInMinutes: 90
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: Use .NET SDK from global.json
      inputs:
        packageType: sdk
        useGlobalJson: true

    - script: |
        set -euo pipefail
        chmod +x "$(DistScriptsRoot)/build_common.sh"
        OUT_ROOT="$(DistOutRoot)" "$(DistScriptsRoot)/build_common.sh"
      displayName: Run build_common.sh

    - task: PublishPipelineArtifact@1
      displayName: Publish common output
      inputs:
        targetPath: $(DistOutRoot)
        artifact: Distribution_Common
        publishLocation: pipeline

- stage: BuildLinux
  displayName: Build Linux Distribution Artifact
  dependsOn: BuildCommon
  condition: succeeded()
  jobs:
  - job: BuildLinuxOutput
    displayName: Build Linux tarball output
    timeoutInMinutes: 60
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: Use .NET SDK from global.json
      inputs:
        packageType: sdk
        useGlobalJson: true

    - task: DownloadPipelineArtifact@2
      displayName: Download common output
      inputs:
        artifact: Distribution_Common
        path: $(DistOutRoot)

    - script: |
        set -euo pipefail
        chmod +x "$(DistScriptsRoot)/build_linux_tarball.sh"
        OUT_ROOT="$(DistOutRoot)" "$(DistScriptsRoot)/build_linux_tarball.sh"
      displayName: Run build_linux_tarball.sh

    - task: PublishPipelineArtifact@1
      displayName: Publish Linux distribution output
      inputs:
        targetPath: $(DistOutRoot)
        artifact: Distribution_Linux
        publishLocation: pipeline

- stage: BuildWindows
  displayName: Build Windows Distribution Artifact
  dependsOn: BuildCommon
  condition: succeeded()
  jobs:
  - job: BuildWindowsOutput
    displayName: Build Windows zip output
    timeoutInMinutes: 60
    pool:
      vmImage: windows-latest
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: Use .NET SDK from global.json
      inputs:
        packageType: sdk
        useGlobalJson: true

    - task: DownloadPipelineArtifact@2
      displayName: Download common output
      inputs:
        artifact: Distribution_Common
        path: $(DistOutRoot)

    - task: PowerShell@2
      displayName: Run build_win_zip.ps1
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          & "$(DistScriptsRoot)/build_win_zip.ps1" -OutRoot "$(DistOutRoot)"

    - task: PublishPipelineArtifact@1
      displayName: Publish Windows distribution output
      inputs:
        targetPath: $(DistOutRoot)
        artifact: Distribution_Windows
        publishLocation: pipeline

- stage: ValidateLinux
  displayName: Validate Linux Distribution Flow
  dependsOn: BuildLinux
  condition: succeeded()
  jobs:
  - job: LinuxValidation
    displayName: Linux bundled plus optional extension validation
    timeoutInMinutes: 45
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      displayName: Download Linux distribution output
      inputs:
        artifact: Distribution_Linux
        path: $(DistOutRoot)

    - script: |
        set -euo pipefail
        chmod +x "$(DistScriptsRoot)/test_bundled_plus_ext_linux.sh"
        OUT_ROOT="$(DistOutRoot)" "$(DistScriptsRoot)/test_bundled_plus_ext_linux.sh"
      displayName: Run Linux validation script

    - task: PublishPipelineArtifact@1
      displayName: Publish Linux simulation artifacts
      condition: always()
      inputs:
        targetPath: $(Build.SourcesDirectory)/devops/scripts/distribution/sim-bundled-plus-linux
        artifact: Validate_Linux_Sim
        publishLocation: pipeline

- stage: ValidateWindows
  displayName: Validate Windows Distribution Flow
  dependsOn: BuildWindows
  condition: succeeded()
  jobs:
  - job: WindowsValidation
    displayName: Windows bundled plus optional extension validation
    timeoutInMinutes: 45
    pool:
      vmImage: windows-latest
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      displayName: Download Windows distribution output
      inputs:
        artifact: Distribution_Windows
        path: $(DistOutRoot)

    - task: PowerShell@2
      displayName: Run Windows validation script
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          & "$(DistScriptsRoot)/test_bundled_plus_ext_win.ps1" -OutRoot "$(DistOutRoot)"

    - task: PublishPipelineArtifact@1
      displayName: Publish Windows simulation artifacts
      condition: always()
      inputs:
        targetPath: $(Build.SourcesDirectory)/devops/scripts/distribution/sim-bundled-plus-win-ps
        artifact: Validate_Windows_Sim
        publishLocation: pipeline

- stage: Finalize
  displayName: Finalize
  dependsOn:
  - BuildCommon
  - BuildLinux
  - BuildWindows
  - ValidateLinux
  - ValidateWindows
  condition: always()
  variables:
    BuildCommonResult: $[ stageDependencies.BuildCommon.BuildCommonOutputs.result ]
    BuildLinuxResult: $[ stageDependencies.BuildLinux.BuildLinuxOutput.result ]
    BuildWindowsResult: $[ stageDependencies.BuildWindows.BuildWindowsOutput.result ]
    ValidateLinuxResult: $[ stageDependencies.ValidateLinux.LinuxValidation.result ]
    ValidateWindowsResult: $[ stageDependencies.ValidateWindows.WindowsValidation.result ]
  jobs:
  - job: Summary
    displayName: Summary
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        echo "BuildCommon: $(BuildCommonResult)"
        echo "BuildLinux: $(BuildLinuxResult)"
        echo "BuildWindows: $(BuildWindowsResult)"
        echo "ValidateLinux: $(ValidateLinuxResult)"
        echo "ValidateWindows: $(ValidateWindowsResult)"
      displayName: Print stage outcomes
