name: azclips-stable-sign-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: stableBuild
    project: release
    source: azclips-stable-build
    trigger: true

parameters:
- name: signed_artifact_name
  displayName: 'Signed artifact name'
  type: string
  default: 'Final_Signed_Distribution'

variables:
- template: templates/variables.yml
- template: templates/dist/variables/common.yml
- ${{ if eq(variables['System.TeamProject'], 'release') }}:
  - group: 'AME ESRP Variable Group'
- name: SourceProject
  value: release
- name: ESRPServiceConnection
  value: ame_esrp_connection
- name: MacOSBundleId
  value: com.microsoft.cirrus.cli

stages:
- stage: Preflight
  displayName: Preflight Checks
  jobs:
  - job: EnsureReleaseProject
    displayName: Ensure Release Project Context
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: none
    - template: templates/dist/steps/validate-release-project.yml
      parameters:
        error_message: azclips-stable-sign must run in the 'release' project for ESRP access.
    - bash: |
        set -euo pipefail
        source_build_id='$(resources.pipeline.stableBuild.runID)'
        if [[ -z "$source_build_id" ]]; then
          echo 'ERROR: stableBuild resource run id was not resolved. Select a azclips-stable-build resource version when queueing this pipeline.'
          exit 1
        fi
        if ! [[ "$source_build_id" =~ ^[0-9]+$ ]]; then
          echo "ERROR: stableBuild resource run id must be numeric. Got: $source_build_id"
          exit 1
        fi

        echo "Stable source project: release"
        echo "Stable source pipeline: azclips-stable-build"
        echo "Stable source build id: $source_build_id"
        echo "Stable source run name: $(resources.pipeline.stableBuild.runName)"
        echo "Stable source branch: $(resources.pipeline.stableBuild.sourceBranch)"
        echo "Stable source commit: $(resources.pipeline.stableBuild.sourceCommit)"
        echo "Stable source artifact: Final_Build_Distribution"
      displayName: Validate Stable Build Resource

- template: templates/dist/stages/sign-with-esrp.yml
  parameters:
    windows_pool: ${{ variables.windows_pool }}
    ubuntu_pool: ${{ variables.ubuntu_pool }}
    macos_arm64_pool: ${{ variables.macos_arm64_pool }}
    macos_intel_pool: ${{ variables.macos_intel_pool }}
    dependency_stage: Preflight
    SourceProject: release
    source_pipeline_name: azclips-stable-build
    source_build_id: $(resources.pipeline.stableBuild.runID)
    source_artifact_name: Final_Build_Distribution
    signed_artifact_name: ${{ parameters.signed_artifact_name }}
    esrp_service_connection: ${{ variables.ESRPServiceConnection }}
    macos_bundle_id: ${{ variables.MacOSBundleId }}
