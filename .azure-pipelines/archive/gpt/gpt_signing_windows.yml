name: gpt-signing-windows-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: stableBuild
    project: release
    source: azclips-stable-build

parameters:
- name: signed_artifact_name
  displayName: Signed artifact name
  type: string
  default: Final_Signed_Windows_Distribution
- name: source_project
  displayName: Source Azure DevOps project
  type: string
  default: release
- name: source_pipeline_name
  displayName: Source build pipeline definition
  type: string
  default: azclips-stable-build
- name: source_build_id
  displayName: Source build id override, blank uses stableBuild resource
  type: string
  default: ''
- name: source_artifact_source
  displayName: Source artifact source
  type: string
  default: specific
  values:
  - specific
  - current
- name: source_artifact_name
  displayName: Source unsigned artifact name
  type: string
  default: Final_Build_Distribution
- name: windows_sign_architectures
  displayName: Windows architectures to sign
  type: object
  default:
  - x64
- name: esrp_enable_nuget_verify
  displayName: Run ESRP NuGetVerify
  type: boolean
  default: true
- name: esrp_enable_windows_verify
  displayName: Run ESRP SigntoolVerify
  type: boolean
  default: true
- name: esrp_enable_windows_timestamp
  displayName: Timestamp Authenticode signatures
  type: boolean
  default: true
- name: esrp_enable_strong_name_signing
  displayName: ESRP strong-name sign Cirrus managed DLLs
  type: boolean
  default: true
- name: esrp_strong_name_file_patterns
  displayName: Strong-name candidate file patterns, relative to signing work root
  type: object
  default: []
- name: esrp_strong_name_public_key_token
  displayName: Expected strong-name public key token for delay-signed Cirrus assemblies
  type: string
  default: 31bf3856ad364e35
- name: esrp_enable_non_cirrus_dll_signing
  displayName: Optional co-sign unsigned non-Cirrus DLLs in bundled artifacts
  type: boolean
  default: true
- name: require_payload_verification
  displayName: Fail if signed artifacts contain unsigned Cirrus or PowerShell payloads
  type: boolean
  default: true

variables:
- name: ubuntu_pool
  value: ubuntu-latest
- name: windows_pool
  value: windows-2022
- name: SourceProject
  value: ${{ parameters.source_project }}
- name: SourcePipelineName
  value: ${{ parameters.source_pipeline_name }}
- name: SourceArtifactName
  value: ${{ parameters.source_artifact_name }}
- name: ESRPServiceConnection
  value: ame_esrp_connection
- name: ESRPNuGetKeyCode
  value: CP-401405
- name: ESRPAuthenticodeKeyCode
  value: CP-230012
- name: ESRPThirdPartyKeyCode
  value: CP-231522
- name: ESRPStrongNameKeyCode
  value: CP-233863-SN
- ${{ if eq(parameters.esrp_enable_windows_timestamp, true) }}:
  - name: ESRPAuthenticodeSignParameters
    value: '{ "OpusName": "Microsoft", "OpusInfo": "http://www.microsoft.com", "FileDigest": "/fd \"SHA256\"", "PageHash": "/NPH", "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256" }'
- ${{ if ne(parameters.esrp_enable_windows_timestamp, true) }}:
  - name: ESRPAuthenticodeSignParameters
    value: '{ "OpusName": "Microsoft", "OpusInfo": "http://www.microsoft.com", "FileDigest": "/fd \"SHA256\"", "PageHash": "/NPH" }'
- ${{ if eq(variables['System.TeamProject'], 'release') }}:
  - group: AME ESRP Variable Group

stages:
- stage: Preflight
  displayName: Preflight Checks
  jobs:
  - job: EnsureReleaseProject
    displayName: Ensure Release Project Context
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: none
    - bash: |
        set -euo pipefail
        if [[ "$(System.TeamProject)" != "release" ]]; then
          echo "ERROR: gpt_signing_windows must run in the 'release' project for ESRP access. Current project: $(System.TeamProject)"
          exit 1
        fi

        if [[ "${{ parameters.source_artifact_source }}" == "specific" ]]; then
          if [[ -n "${{ parameters.source_build_id }}" ]]; then
            source_build_id='${{ parameters.source_build_id }}'
          else
            source_build_id='$(resources.pipeline.stableBuild.runID)'
          fi

          if [[ -z "$source_build_id" ]]; then
            echo 'ERROR: source build id was not resolved. Provide source_build_id or select a stableBuild resource version.'
            exit 1
          fi
          if ! [[ "$source_build_id" =~ ^[0-9]+$ ]]; then
            echo "ERROR: source build id must be numeric. Got: $source_build_id"
            exit 1
          fi
          echo "Source build id: $source_build_id"
        else
          echo 'Source artifact source: current pipeline run'
        fi

        echo "Source project: ${{ parameters.source_project }}"
        echo "Source pipeline: ${{ parameters.source_pipeline_name }}"
        echo "Source artifact: ${{ parameters.source_artifact_name }}"
      displayName: Validate Signing Inputs

- stage: SignWindowsAndPackages
  displayName: Sign Windows And Package Artifacts
  dependsOn: Preflight
  jobs:
  - job: SignWindowsAndPackages
    displayName: Sign Windows, Extension Nupkg, and Az Module Artifacts
    pool:
      vmImage: $(windows_pool)
    timeoutInMinutes: 120
    steps:
    - checkout: self
      fetchDepth: 1

    - task: UseDotNet@2
      displayName: '0. Setup .NET SDK'
      inputs:
        packageType: sdk
        version: 10.0.203

    - ${{ if eq(parameters.source_artifact_source, 'current') }}:
      - task: DownloadPipelineArtifact@2
        displayName: '1. Download unsigned distribution artifacts from current run'
        inputs:
          buildType: current
          artifactName: ${{ parameters.source_artifact_name }}
          targetPath: $(Pipeline.Workspace)/unsigned-all
    - ${{ if and(eq(parameters.source_artifact_source, 'specific'), ne(parameters.source_build_id, '')) }}:
      - task: DownloadPipelineArtifact@2
        displayName: '1. Download unsigned distribution artifacts by build id'
        inputs:
          buildType: specific
          project: ${{ parameters.source_project }}
          definition: ${{ parameters.source_pipeline_name }}
          buildVersionToDownload: specific
          pipelineId: ${{ parameters.source_build_id }}
          artifactName: ${{ parameters.source_artifact_name }}
          targetPath: $(Pipeline.Workspace)/unsigned-all
    - ${{ if and(eq(parameters.source_artifact_source, 'specific'), eq(parameters.source_build_id, '')) }}:
      - task: DownloadPipelineArtifact@2
        displayName: '1. Download unsigned distribution artifacts from selected stable build'
        inputs:
          buildType: specific
          project: ${{ parameters.source_project }}
          definition: ${{ parameters.source_pipeline_name }}
          buildVersionToDownload: specific
          pipelineId: $(resources.pipeline.stableBuild.runID)
          artifactName: ${{ parameters.source_artifact_name }}
          targetPath: $(Pipeline.Workspace)/unsigned-all

    - task: PowerShell@2
      displayName: 'A. Prepare signing workspace'
      inputs:
        targetType: filePath
        filePath: $(Build.SourcesDirectory)/.azure-pipelines/gpt/scripts/signing-prepare-workspace.ps1
        pwsh: true
        arguments: >
          -SourceRoot "$(Pipeline.Workspace)/unsigned-all"
          -WorkingRoot "$(Pipeline.Workspace)/gpt-signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
          -ArchitectureCsv '${{ join(',', parameters.windows_sign_architectures) }}'
          -EnableStrongNameSigning '${{ parameters.esrp_enable_strong_name_signing }}'
          -StrongNamePatternCsv '${{ join('|', parameters.esrp_strong_name_file_patterns) }}'
          -ExpectedStrongNameToken '${{ parameters.esrp_strong_name_public_key_token }}'
          -EnableNonCirrusDllSigning '${{ parameters.esrp_enable_non_cirrus_dll_signing }}'

    - task: PowerShell@2
      displayName: 'A2. List signing candidates'
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $workingRoot = "$(Pipeline.Workspace)/gpt-signing-work"
          $roots = @(
            (Join-Path $workingRoot 'windows-extracted'),
            (Join-Path $workingRoot 'nupkg-extracted')
          ) | Where-Object { Test-Path $_ }

          $files = Get-ChildItem -Path $roots -Recurse -File | Where-Object {
            $_.Name -ieq 'az.exe' -or
            $_.Name -like 'Microsoft.Azure.Cirrus*.dll' -or
            $_.Name -like 'Core.*.dll' -or
            $_.Name -ieq 'az.dll' -or
            $_.Name -ieq 'cirrus-agent.dll' -or
            $_.Name -like 'Microsoft.Azure.Cirrus*.exe' -or
            $_.Extension -in '.ps1', '.psm1', '.psd1', '.ps1xml'
          } | Sort-Object FullName

          Write-Host "Signing candidates ($($files.Count))"
          foreach ($file in $files) {
            $relative = $file.FullName.Substring($workingRoot.Length).TrimStart('\', '/')
            Write-Host ("  {0} ({1} bytes)" -f $relative, $file.Length)
          }

          $nupkgs = Get-ChildItem -Path (Join-Path $workingRoot 'nupkg') -File -Filter '*.nupkg' | Sort-Object Name
          Write-Host "Package wrappers to NuGetSign ($($nupkgs.Count))"
          foreach ($pkg in $nupkgs) {
            Write-Host ("  {0} ({1} bytes)" -f $pkg.Name, $pkg.Length)
          }

          $thirdPartyRoot = Join-Path $workingRoot 'thirdparty'
          if (Test-Path $thirdPartyRoot) {
            $thirdPartyFiles = Get-ChildItem -Path $thirdPartyRoot -File -Filter '*.dll' | Sort-Object Name
            Write-Host "Unsigned non-Cirrus DLLs staged for optional co-signing ($($thirdPartyFiles.Count))"
            foreach ($file in $thirdPartyFiles) {
              Write-Host ("  {0} ({1} bytes)" -f $file.Name, $file.Length)
            }
          }

          $strongNameRoot = Join-Path $workingRoot 'strongname'
          if (Test-Path $strongNameRoot) {
            $strongNameFiles = Get-ChildItem -Path $strongNameRoot -File -Filter '*.dll' | Sort-Object Name
            Write-Host "Explicit strong-name DLLs staged for ESRP ($($strongNameFiles.Count))"
            foreach ($file in $strongNameFiles) {
              Write-Host ("  {0} ({1} bytes)" -f $file.Name, $file.Length)
            }
          }

    - ${{ if eq(parameters.esrp_enable_strong_name_signing, true) }}:
      - task: EsrpCodeSigning@6
        displayName: 'B. Strong-name sign staged Cirrus managed DLLs'
        condition: eq(variables['HasStrongNamePayload'], 'true')
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/gpt-signing-work/strongname'
          UseMinimatch: true
          Pattern: '*.dll'
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "$(ESRPStrongNameKeyCode)",
                "OperationCode": "StrongNameSign",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              },
              {
                "KeyCode": "$(ESRPStrongNameKeyCode)",
                "OperationCode": "StrongNameVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]

      - task: PowerShell@2
        displayName: 'B2. Restore strong-name signed Cirrus DLLs'
        condition: eq(variables['HasStrongNamePayload'], 'true')
        inputs:
          targetType: inline
          pwsh: true
          script: |
            $ErrorActionPreference = 'Stop'
            $workingRoot = "$(Pipeline.Workspace)/gpt-signing-work"
            $strongNameRoot = Join-Path $workingRoot 'strongname'
            $mapPath = Join-Path $workingRoot 'strongname-map.json'

            if (-not (Test-Path $mapPath)) {
              throw "Strong-name restore map was not found: $mapPath"
            }

            $strongNameMap = @(Get-Content $mapPath -Raw | ConvertFrom-Json)
            foreach ($entry in $strongNameMap) {
              $signedFile = Join-Path $strongNameRoot ([string]$entry.FlatName)
              $originalPath = [string]$entry.OriginalPath
              if (-not (Test-Path $signedFile)) {
                throw "Expected strong-name signed DLL was not found: $signedFile"
              }
              Copy-Item $signedFile -Destination $originalPath -Force
            }

            Write-Host "Restored strong-name signed DLLs into extracted artifacts: $($strongNameMap.Count)"

    - task: EsrpCodeSigning@6
      displayName: 'C. Authenticode sign Cirrus binaries'
      condition: eq(variables['HasCirrusPayload'], 'true')
      inputs:
        ConnectedServiceName: '$(ESRPServiceConnection)'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        batchSignPolicyFile: ''
        ciPolicyFile: ''
        FolderPath: '$(Pipeline.Workspace)/gpt-signing-work'
        UseMinimatch: true
        Pattern: |
          windows-extracted/**/az.exe
          windows-extracted/**/az.dll
          windows-extracted/**/cirrus-agent.dll
          windows-extracted/**/Core.*.dll
          windows-extracted/**/Microsoft.Azure.Cirrus*.dll
          windows-extracted/**/Microsoft.Azure.Cirrus*.exe
          nupkg-extracted/**/az.dll
          nupkg-extracted/**/cirrus-agent.dll
          nupkg-extracted/**/Core.*.dll
          nupkg-extracted/**/Microsoft.Azure.Cirrus*.dll
          nupkg-extracted/**/Microsoft.Azure.Cirrus*.exe
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "$(ESRPAuthenticodeKeyCode)",
              "OperationCode": "SigntoolSign",
              "Parameters": $(ESRPAuthenticodeSignParameters),
              "ToolName": "sign",
              "ToolVersion": "1.0"
            },
            {
              "KeyCode": "$(ESRPAuthenticodeKeyCode)",
              "OperationCode": "SigntoolVerify",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    - task: EsrpCodeSigning@6
      displayName: 'D. Authenticode sign PowerShell module payloads'
      condition: eq(variables['HasPowerShellPayload'], 'true')
      inputs:
        ConnectedServiceName: '$(ESRPServiceConnection)'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        batchSignPolicyFile: ''
        ciPolicyFile: ''
        FolderPath: '$(Pipeline.Workspace)/gpt-signing-work/nupkg-extracted'
        UseMinimatch: true
        Pattern: |
          **/*.ps1
          **/*.psm1
          **/*.psd1
          **/*.ps1xml
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "$(ESRPAuthenticodeKeyCode)",
              "OperationCode": "SigntoolSign",
              "Parameters": $(ESRPAuthenticodeSignParameters),
              "ToolName": "sign",
              "ToolVersion": "1.0"
            },
            {
              "KeyCode": "$(ESRPAuthenticodeKeyCode)",
              "OperationCode": "SigntoolVerify",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    - ${{ if eq(parameters.esrp_enable_non_cirrus_dll_signing, true) }}:
      - task: EsrpCodeSigning@6
        displayName: 'E. Optional co-sign staged unsigned non-Cirrus DLLs'
        condition: eq(variables['HasNonCirrusDllPayload'], 'true')
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/gpt-signing-work/thirdparty'
          UseMinimatch: true
          Pattern: '*.dll'
          signConfigType: inlineSignParams
          SessionTimeout: '60'
          MaxConcurrency: '25'
          MaxRetryAttempts: '5'
          inlineOperation: |
            [
              {
                "KeyCode": "$(ESRPThirdPartyKeyCode)",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "http://www.microsoft.com",
                  "FileDigest": "/fd \"SHA256\"",
                  "PageHash": "/NPH",
                  "Append": "/as",
                  "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
              },
              {
                "KeyCode": "$(ESRPThirdPartyKeyCode)",
                "OperationCode": "SigntoolVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]

      - task: PowerShell@2
        displayName: 'E2. Restore co-signed non-Cirrus DLLs'
        condition: eq(variables['HasNonCirrusDllPayload'], 'true')
        inputs:
          targetType: inline
          pwsh: true
          script: |
            $ErrorActionPreference = 'Stop'
            $workingRoot = "$(Pipeline.Workspace)/gpt-signing-work"
            $thirdPartyRoot = Join-Path $workingRoot 'thirdparty'
            $mapPath = Join-Path $workingRoot 'thirdparty-map.json'

            if (-not (Test-Path $mapPath)) {
              throw "Third-party restore map was not found: $mapPath"
            }

            $thirdPartyMap = @(Get-Content $mapPath -Raw | ConvertFrom-Json)
            foreach ($entry in $thirdPartyMap) {
              $signedFile = Join-Path $thirdPartyRoot ([string]$entry.FlatName)
              $originalPath = [string]$entry.OriginalPath
              if (-not (Test-Path $signedFile)) {
                throw "Expected co-signed third-party DLL was not found: $signedFile"
              }
              Copy-Item $signedFile -Destination $originalPath -Force
            }

            Write-Host "Restored co-signed non-Cirrus DLLs into extracted artifacts: $($thirdPartyMap.Count)"

    - ${{ if eq(parameters.esrp_enable_windows_verify, true) }}:
      - task: EsrpCodeSigning@6
        displayName: 'F. ESRP verify Cirrus binaries'
        condition: eq(variables['HasCirrusPayload'], 'true')
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/gpt-signing-work'
          UseMinimatch: true
          Pattern: |
            windows-extracted/**/az.exe
            windows-extracted/**/az.dll
            windows-extracted/**/cirrus-agent.dll
            windows-extracted/**/Core.*.dll
            windows-extracted/**/Microsoft.Azure.Cirrus*.dll
            windows-extracted/**/Microsoft.Azure.Cirrus*.exe
            nupkg-extracted/**/az.dll
            nupkg-extracted/**/cirrus-agent.dll
            nupkg-extracted/**/Core.*.dll
            nupkg-extracted/**/Microsoft.Azure.Cirrus*.dll
            nupkg-extracted/**/Microsoft.Azure.Cirrus*.exe
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "$(ESRPAuthenticodeKeyCode)",
                "OperationCode": "SigntoolVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]

      - task: EsrpCodeSigning@6
        displayName: 'F2. ESRP verify PowerShell module payloads'
        condition: eq(variables['HasPowerShellPayload'], 'true')
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/gpt-signing-work/nupkg-extracted'
          UseMinimatch: true
          Pattern: |
            **/*.ps1
            **/*.psm1
            **/*.psd1
            **/*.ps1xml
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "$(ESRPAuthenticodeKeyCode)",
                "OperationCode": "SigntoolVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]

    - task: PowerShell@2
      displayName: 'G. Repack payload-signed NuGet packages'
      condition: eq(variables['HasNupkg'], 'true')
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $workingRoot = "$(Pipeline.Workspace)/gpt-signing-work"
          $mapPath = Join-Path $workingRoot 'nupkg-map.json'
          if (-not (Test-Path $mapPath)) {
            throw "NuGet package map was not found: $mapPath"
          }

          $packageMap = @(Get-Content $mapPath -Raw | ConvertFrom-Json)
          foreach ($entry in $packageMap) {
            $packagePath = [string]$entry.PackagePath
            $extractDir = [string]$entry.ExtractedDir
            if (-not (Test-Path $extractDir)) {
              throw "Extracted package directory was not found: $extractDir"
            }
            if (Test-Path $packagePath) {
              Remove-Item $packagePath -Force
            }
            [System.IO.Compression.ZipFile]::CreateFromDirectory($extractDir, $packagePath)
            Write-Host "Repacked payload-signed package: $packagePath"
          }

    - task: EsrpCodeSigning@6
      displayName: 'H. NuGet sign package wrappers [Microsoft.Azure.Cirrus + Az]'
      condition: eq(variables['HasNupkg'], 'true')
      inputs:
        ConnectedServiceName: '$(ESRPServiceConnection)'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        batchSignPolicyFile: ''
        ciPolicyFile: ''
        FolderPath: '$(Pipeline.Workspace)/gpt-signing-work/nupkg'
        UseMinimatch: true
        Pattern: |
          Microsoft.Azure.Cirrus*.nupkg
          Az.*.nupkg
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "$(ESRPNuGetKeyCode)",
              "OperationCode": "NuGetSign",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    - ${{ if eq(parameters.esrp_enable_nuget_verify, true) }}:
      - task: EsrpCodeSigning@6
        displayName: 'H2. ESRP NuGet verify package wrappers [Microsoft.Azure.Cirrus + Az]'
        condition: eq(variables['HasNupkg'], 'true')
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/gpt-signing-work/nupkg'
          UseMinimatch: true
          Pattern: |
            Microsoft.Azure.Cirrus*.nupkg
            Az.*.nupkg
          signConfigType: inlineSignParams
          SessionTimeout: '60'
          MaxConcurrency: '25'
          MaxRetryAttempts: '5'
          inlineOperation: |
            [
              {
                "KeyCode": "$(ESRPNuGetKeyCode)",
                "OperationCode": "NuGetVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]

    - task: PowerShell@2
      displayName: 'I. Repack signed Windows archives and release assets'
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $workingRoot = "$(Pipeline.Workspace)/gpt-signing-work"
          $releaseRoot = "$(Build.ArtifactStagingDirectory)/signed-release"
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null

          $zipMapPath = Join-Path $workingRoot 'windows-zip-map.json'
          if (Test-Path $zipMapPath) {
            $zipMap = @(Get-Content $zipMapPath -Raw | ConvertFrom-Json)
            foreach ($entry in $zipMap) {
              $zipName = [string]$entry.ZipName
              $extractDir = [string]$entry.ExtractedDir
              $zipPath = Join-Path $releaseRoot $zipName
              if (-not (Test-Path $extractDir)) {
                throw "Expected extracted Windows archive folder was not found: $extractDir"
              }
              if (Test-Path $zipPath) {
                Remove-Item $zipPath -Force
              }
              Compress-Archive -Path (Join-Path $extractDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
              Write-Host "Repacked signed Windows archive: $zipPath"
            }
          }

          $nupkgRoot = Join-Path $workingRoot 'nupkg'
          if (Test-Path $nupkgRoot) {
            Get-ChildItem -Path $nupkgRoot -File -Filter '*.nupkg' | ForEach-Object {
              Copy-Item $_.FullName -Destination (Join-Path $releaseRoot $_.Name) -Force
              Write-Host "Copied signed package: $($_.Name)"
            }
          }

    - task: PowerShell@2
      displayName: 'J. Holistic signature verification + provenance'
      inputs:
        targetType: filePath
        filePath: $(Build.SourcesDirectory)/.azure-pipelines/gpt/scripts/signing-verify-signatures.ps1
        pwsh: true
        arguments: >
          -WorkingRoot "$(Pipeline.Workspace)/gpt-signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
          -RequirePayloadVerification '${{ parameters.require_payload_verification }}'
          -RequireStrongName '$(HasStrongNamePayload)'
          -ExpectedStrongNameToken '${{ parameters.esrp_strong_name_public_key_token }}'
          -SourceProject '${{ parameters.source_project }}'
          -SourcePipelineName '${{ parameters.source_pipeline_name }}'
          -SourceArtifactName '${{ parameters.source_artifact_name }}'
          -SourceArtifactSource '${{ parameters.source_artifact_source }}'
          -SigningProject '$(System.TeamProject)'
          -SigningPipeline '$(Build.DefinitionName)'
          -SigningBuildId '$(Build.BuildId)'
          -SigningBuildNumber '$(Build.BuildNumber)'
          -SigningBranch '$(Build.SourceBranch)'
          -SigningCommit '$(Build.SourceVersion)'
          -AuthenticodeKeyCode '$(ESRPAuthenticodeKeyCode)'
          -NuGetKeyCode '$(ESRPNuGetKeyCode)'
          -StrongNameKeyCode '$(ESRPStrongNameKeyCode)'
          -ThirdPartyKeyCode '$(ESRPThirdPartyKeyCode)'
          -TimestampEnabled '${{ parameters.esrp_enable_windows_timestamp }}'
          -StrongNameEnabled '${{ parameters.esrp_enable_strong_name_signing }}'
          -StrongNameCandidatePatterns '${{ join(';', parameters.esrp_strong_name_file_patterns) }}'
          -ThirdPartySigningEnabled '${{ parameters.esrp_enable_non_cirrus_dll_signing }}'
          -NuGetVerifyEnabled '${{ parameters.esrp_enable_nuget_verify }}'

    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      displayName: 'J2. Generate SBOM for signed Windows and package artifacts'
      inputs:
        BuildDropPath: $(Build.ArtifactStagingDirectory)/signed-release

    - task: PublishPipelineArtifact@1
      displayName: 'J3. Publish signed Windows and package artifacts'
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-release
        artifact: ${{ parameters.signed_artifact_name }}
        publishLocation: pipeline
