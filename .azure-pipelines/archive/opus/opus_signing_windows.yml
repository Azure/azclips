# =============================================================================
# opus_signing_windows.yml
# -----------------------------------------------------------------------------
# Self-contained Windows signing pipeline for Cirrus that addresses EVERY signing
# gap identified vs. the Azure PowerShell ESRP model. Intentionally written as a
# SINGLE pipeline file (no template splitting) so the whole flow is readable in
# one place.
#
# Gaps addressed (all inline, in correct order):
#   1. Windows Authenticode on loose archive binaries (az.exe + Cirrus DLLs/EXEs)
#   2. Authenticode of DLL payloads INSIDE extension .nupkg packages (extract -> sign -> repack -> NuGetSign)
#   3. PowerShell module Az.* packages: sign .psd1/.psm1/.ps1/.ps1xml + cmdlet DLLs, repack, NuGetSign
#      (also fixes the Microsoft.Azure.Cirrus* vs Az.* filter mismatch)
#   4. Strong-Name signing (real ESRP StrongNameSign/StrongNameVerify, gated by policy)
#   5. Third-party / dependency DLL co-signing for any bundled DLL that is NOT already
#      Authenticode-signed (skips pre-signed .NET runtime DLLs)
#   6. NuGet package-wrapper signing (NuGetSign + NuGetVerify) for BOTH extension and Az.* packages
#   7. Holistic post-sign verification sweep (every Cirrus binary + every nupkg payload
#      + every PS script is verified; pipeline fails if anything Microsoft-owned is unsigned)
#
# Signing order matters: StrongName (mutates assembly) MUST run before Authenticode
# (which must be the last signature applied). NuGet wrapper signing is always last.
#
# Hardening adopted from house conventions: architecture-filtered Windows zips,
# ESRP resilience knobs (SessionTimeout / MaxConcurrency / MaxRetryAttempts), and a
# pre-sign "list signing candidates" diagnostics step.
#
# NOTE: requires OneBranch / ESRP-capable Windows agents and the ESRP variable group.
# =============================================================================

name: opus-signing-windows-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

# Consume the build that produced the unsigned distribution. Select a specific
# run when queueing manually.
resources:
  pipelines:
  - pipeline: stableBuild
    project: release
    source: azclips-stable-build
    trigger: none

parameters:
# ---- source artifact selection -------------------------------------------------
- name: SourceProject
  type: string
  default: 'release'
- name: source_pipeline_name
  type: string
  default: 'azclips-stable-build'
- name: source_build_id
  type: string
  default: ''
- name: source_artifact_name
  type: string
  default: 'Final_Build_Distribution'
- name: source_artifact_source
  type: string
  default: 'specific'        # 'specific' | 'current'
- name: signed_artifact_name
  type: string
  default: 'Final_Signed_Windows_Distribution'
- name: windows_sign_architectures
  type: object             # which win-*.zip architectures to sign (adapted from cirrus convention)
  default:
  - x64

# ---- ESRP key codes ------------------------------------------------------------
- name: esrp_authenticode_keycode
  type: string
  default: 'CP-230012'        # first-party Authenticode
- name: esrp_nuget_keycode
  type: string
  default: 'CP-401405'        # NuGet package signature
- name: esrp_strongname_keycode
  type: string
  default: 'CP-233863-SN'     # strong-name authority
- name: esrp_thirdparty_keycode
  type: string
  default: 'CP-231522'        # third-party / co-signing Authenticode

# ---- policy toggles ------------------------------------------------------------
# Configured to mirror the Azure PowerShell signing model now that the build
# delay-signs first-party assemblies (Shared.props -> MSSharedLibKey.snk).
# Strong-name + third-party co-sign are ON; standalone ESRP verify stays OFF
# because Azure PowerShell verifies inline within each sign op, never standalone.
- name: esrp_enable_windows_timestamp
  type: boolean
  default: true               # ON  - Authenticode RFC 3161 timestamp (CP-230012)
- name: esrp_enable_strong_name
  type: boolean
  default: true               # ON  - StrongNameSign (CP-233863-SN); requires delay-signed build
- name: esrp_enable_nuget_verify
  type: boolean
  default: true               # ON  - NuGetVerify (CP-401405)
- name: esrp_enable_windows_verify
  type: boolean
  default: false              # OFF - standalone ESRP SigntoolVerify (not an AzPS pattern; inline verify covers it)
- name: sign_third_party
  type: boolean
  default: true               # ON  - third-party co-sign (CP-231522), AzPS-style /as append
- name: require_payload_verification
  type: boolean
  default: true               # fail if any Cirrus binary inside a nupkg/zip is unsigned

variables:
- name: windows_pool
  value: 'windows-latest'
- name: ubuntu_pool
  value: 'ubuntu-latest'
- name: ESRPServiceConnection
  value: 'ame_esrp_connection'
# Resolve the source build id: explicit parameter wins, otherwise fall back to the
# selected stableBuild pipeline-resource run (expanded at runtime).
- name: SourceBuildId
  value: ${{ coalesce(parameters.source_build_id, '$(resources.pipeline.stableBuild.runID)') }}
# ESRP secrets (AppClientId / TenantId / KV / cert names) come from this group.
- ${{ if eq(variables['System.TeamProject'], 'release') }}:
  - group: 'AME ESRP Variable Group'

stages:
# =============================================================================
# Stage 1 - Preflight: make sure we are in the ESRP-capable 'release' project and
# that a concrete source build was selected.
# =============================================================================
- stage: Preflight
  displayName: Preflight Checks
  jobs:
  - job: EnsureReleaseContext
    displayName: Ensure Release Project + Source Build
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: none
    - bash: |
        set -euo pipefail
        echo "System.TeamProject=$(System.TeamProject)"
        if [[ "$(System.TeamProject)" != "release" ]]; then
          echo "ERROR: opus_signing_windows must run in the 'release' project for ESRP access."
          exit 1
        fi

        if [[ "${{ parameters.source_artifact_source }}" == "specific" ]]; then
          source_build_id='${{ parameters.source_build_id }}'
          if [[ -z "$source_build_id" ]]; then
            source_build_id='$(resources.pipeline.stableBuild.runID)'
          fi
          if [[ -z "$source_build_id" || ! "$source_build_id" =~ ^[0-9]+$ ]]; then
            echo "ERROR: A numeric source build id is required. Select a azclips-stable-build run or pass source_build_id."
            exit 1
          fi
          echo "Resolved source build id: $source_build_id"
        fi
      displayName: Validate Release Context

# =============================================================================
# Stage 2 - Sign Windows distribution. One job, all aspects, in dependency order.
# Runs on a Windows agent (required by ESRP signtool / strong-name operations).
# =============================================================================
- stage: SignWindows
  displayName: Sign Windows Distribution
  dependsOn: Preflight
  jobs:
  - job: SignWindows
    displayName: Sign + Verify Windows Artifacts
    pool:
      vmImage: $(windows_pool)
    timeoutInMinutes: 120
    variables:
      WorkRoot: '$(Pipeline.Workspace)/signing-work'
      ReleaseRoot: '$(Build.ArtifactStagingDirectory)/signed-windows'
    steps:
    - checkout: none

    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        version: '8.0.x'

    # ---- download the unsigned distribution ----------------------------------
    - ${{ if eq(parameters.source_artifact_source, 'current') }}:
      - task: DownloadPipelineArtifact@2
        displayName: Download Unsigned Distribution (current)
        inputs:
          artifact: ${{ parameters.source_artifact_name }}
          path: $(Pipeline.Workspace)/unsigned-all
    - ${{ if ne(parameters.source_artifact_source, 'current') }}:
      - task: DownloadPipelineArtifact@2
        displayName: Download Unsigned Distribution (specific)
        inputs:
          buildType: specific
          project: ${{ parameters.SourceProject }}
          definition: ${{ parameters.source_pipeline_name }}
          buildVersionToDownload: specific
          pipelineId: $(SourceBuildId)
          artifactName: ${{ parameters.source_artifact_name }}
          targetPath: $(Pipeline.Workspace)/unsigned-all

    # =========================================================================
    # Step A - Build the signing work tree.
    #   windows-extracted/<zip>/      loose archive binaries (from *win-*.zip)
    #   ext-nupkg/<pkg>/              extracted extension nupkg payloads
    #   ps-nupkg/<pkg>/              extracted Az.* PowerShell module payloads
    # A JSON map records how to repack each artifact afterwards.
    # =========================================================================
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $src   = "$(Pipeline.Workspace)/unsigned-all"
        $work  = "$(WorkRoot)"
        $rel   = "$(ReleaseRoot)"

        Remove-Item $work, $rel -Recurse -Force -ErrorAction SilentlyContinue
        $winRoot = Join-Path $work 'windows-extracted'
        $extRoot = Join-Path $work 'ext-nupkg'
        $psRoot  = Join-Path $work 'ps-nupkg'
        New-Item -ItemType Directory -Force -Path $winRoot, $extRoot, $psRoot, $rel | Out-Null

        $repack = @()

        # --- loose Windows archives (architecture-filtered) ---
        $archCsv = '${{ join(',', parameters.windows_sign_architectures) }}'
        $arches  = $archCsv.Split(',') | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ }
        if (-not $arches) { throw 'windows_sign_architectures resolved to an empty list.' }
        Write-Host "Windows signing architectures: $($arches -join ', ')"
        $allWinZips = Get-ChildItem -Path $src -Recurse -File | Where-Object { $_.Name -like '*win-*.zip' }
        $winZips = $allWinZips | Where-Object {
          $n = $_.Name.ToLowerInvariant()
          ($arches | Where-Object { $n.Contains($_) }) | Select-Object -First 1
        }
        foreach ($zip in $winZips) {
          $dest = Join-Path $winRoot $zip.BaseName
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          $repack += [pscustomobject]@{ kind='zip'; name=$zip.Name; dir=$dest }
        }

        # --- extension nupkgs (Microsoft.Azure.Cirrus*, excluding Az.*) ---
        $extPkgs = Get-ChildItem -Path $src -Recurse -File |
          Where-Object { $_.Name -like 'Microsoft.Azure.Cirrus*.nupkg' -and $_.Name -notlike '*.snupkg' }
        foreach ($pkg in $extPkgs) {
          $dest = Join-Path $extRoot $pkg.BaseName
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # extract as zip (keep .nupkg metadata: [Content_Types].xml, _rels, .nuspec)
          $tmpZip = "$dest.zip"
          Copy-Item $pkg.FullName $tmpZip -Force
          Expand-Archive -Path $tmpZip -DestinationPath $dest -Force
          Remove-Item $tmpZip -Force
          $repack += [pscustomobject]@{ kind='nupkg'; name=$pkg.Name; dir=$dest; origin=$pkg.FullName }
        }

        # --- PowerShell module nupkgs (Az.*) ---
        $psPkgs = Get-ChildItem -Path $src -Recurse -File |
          Where-Object { $_.Name -like 'Az.*.nupkg' -and $_.Name -notlike '*.snupkg' }
        foreach ($pkg in $psPkgs) {
          $dest = Join-Path $psRoot $pkg.BaseName
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $tmpZip = "$dest.zip"
          Copy-Item $pkg.FullName $tmpZip -Force
          Expand-Archive -Path $tmpZip -DestinationPath $dest -Force
          Remove-Item $tmpZip -Force
          $repack += [pscustomobject]@{ kind='nupkg'; name=$pkg.Name; dir=$dest; origin=$pkg.FullName }
        }

        $repack | ConvertTo-Json -Depth 5 | Out-File (Join-Path $work 'repack-map.json') -Encoding utf8

        Write-Host "Prepared signing work tree:"
        Write-Host "  Windows zips     : $($winZips.Count)"
        Write-Host "  Extension nupkgs : $($extPkgs.Count)"
        Write-Host "  Az.* PS modules  : $($psPkgs.Count)"

        if ($winZips.Count -eq 0 -and $extPkgs.Count -eq 0 -and $psPkgs.Count -eq 0) {
          throw "No Windows-signable artifacts (win-*.zip / Microsoft.Azure.Cirrus*.nupkg / Az.*.nupkg) were found."
        }

        $hasWin   = if ($winZips.Count -gt 0) { 'true' } else { 'false' }
        $hasExt   = if ($extPkgs.Count -gt 0) { 'true' } else { 'false' }
        $hasPs    = if ($psPkgs.Count  -gt 0) { 'true' } else { 'false' }
        Write-Host "##vso[task.setvariable variable=HasWin]$hasWin"
        Write-Host "##vso[task.setvariable variable=HasExt]$hasExt"
        Write-Host "##vso[task.setvariable variable=HasPs]$hasPs"
      displayName: 'A. Build signing work tree'

    # ---- diagnostics: list every binary / script that will be signed ----------
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $work  = "$(WorkRoot)"
        $roots = @("$work/windows-extracted", "$work/ext-nupkg", "$work/ps-nupkg") | Where-Object { Test-Path $_ }
        $files = Get-ChildItem -Path $roots -Recurse -File | Where-Object {
          $_.Name -ieq 'az.exe' -or
          $_.Name -ieq 'az.dll' -or
          $_.Name -ieq 'cirrus-agent.dll' -or
          $_.Name -like 'Core.*.dll' -or
          $_.Name -like 'Microsoft.Azure.Cirrus*.dll' -or
          $_.Name -like 'Microsoft.Azure.Cirrus*.exe' -or
          $_.Extension -in '.ps1', '.psm1', '.psd1', '.ps1xml'
        } | Sort-Object FullName
        Write-Host "Signing candidates ($($files.Count)):"
        foreach ($f in $files) {
          $rel = $f.FullName.Substring($work.Length).TrimStart('\', '/')
          Write-Host ("  {0}  ({1} bytes)" -f $rel, $f.Length)
        }
      displayName: 'A2. List signing candidates'

    # =========================================================================
    # Step B - Stage third-party / dependency DLLs that are NOT already
    # Authenticode-signed (skips pre-signed .NET runtime + Microsoft DLLs).
    # Only the unsigned ones are submitted to ESRP, with the original path kept
    # in a map so we can copy them back after signing.
    # =========================================================================
    - ${{ if eq(parameters.sign_third_party, true) }}:
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $work   = "$(WorkRoot)"
          $tpDir  = Join-Path $work 'thirdparty'
          New-Item -ItemType Directory -Force -Path $tpDir | Out-Null

          # first-party Cirrus assemblies (Microsoft.Azure.Cirrus*, Core.*, az.dll,
          # cirrus-agent.dll) are handled by first-party signing (Steps C/D); exclude
          # them here so only genuinely third-party unsigned DLLs are staged.
          function Test-FirstParty([string]$n) {
            return ($n -like 'Microsoft.Azure.Cirrus*.dll') -or ($n -like 'Core.*.dll') -or
                   ($n -ieq 'az.dll') -or ($n -ieq 'cirrus-agent.dll')
          }
          $candidates = Get-ChildItem -Path $work -Recurse -File -Include *.dll |
            Where-Object { $_.FullName -notlike "*\thirdparty\*" -and -not (Test-FirstParty $_.Name) }

          $map = @()
          $i = 0
          foreach ($dll in $candidates) {
            $sig = Get-AuthenticodeSignature -FilePath $dll.FullName
            if ($sig.Status -eq 'Valid') { continue }   # already signed (e.g. .NET runtime) -> skip
            $i++
            $flat = "tp_{0:d5}_{1}" -f $i, $dll.Name
            Copy-Item $dll.FullName (Join-Path $tpDir $flat) -Force
            $map += [pscustomobject]@{ flat=$flat; origin=$dll.FullName }
          }
          $map | ConvertTo-Json -Depth 5 | Out-File (Join-Path $work 'thirdparty-map.json') -Encoding utf8
          Write-Host "Third-party DLLs needing a signature: $($map.Count)"
          Write-Host "##vso[task.setvariable variable=HasThirdParty]$([string]($map.Count -gt 0).ToString().ToLower())"
        displayName: 'B. Detect unsigned third-party DLLs'

    # =========================================================================
    # Step C - Strong-Name signing (GATED). Must run BEFORE Authenticode.
    # Covers loose binaries AND extracted nupkg payloads.
    # =========================================================================
    - ${{ if eq(parameters.esrp_enable_strong_name, true) }}:
      - task: EsrpCodeSigning@6
        displayName: 'C. Strong-Name sign [first-party managed DLLs]'
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          SessionTimeout: '60'
          MaxConcurrency: '25'
          MaxRetryAttempts: '5'
          FolderPath: '$(WorkRoot)'
          UseMinimatch: true
          Pattern: |
            **/Microsoft.Azure.Cirrus*.dll
            **/Core.*.dll
            **/az.dll
            **/cirrus-agent.dll
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              { "KeyCode": "${{ parameters.esrp_strongname_keycode }}", "OperationCode": "StrongNameSign",   "Parameters": {}, "ToolName": "sign", "ToolVersion": "1.0" },
              { "KeyCode": "${{ parameters.esrp_strongname_keycode }}", "OperationCode": "StrongNameVerify", "Parameters": {}, "ToolName": "sign", "ToolVersion": "1.0" }
            ]

    # =========================================================================
    # Step D - Authenticode for first-party Cirrus binaries (loose + nupkg payloads).
    # Two variants: with / without RFC 3161 timestamp.
    # =========================================================================
    - ${{ if eq(parameters.esrp_enable_windows_timestamp, true) }}:
      - task: EsrpCodeSigning@6
        displayName: 'D. Authenticode sign [Cirrus binaries +timestamp]'
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          SessionTimeout: '60'
          MaxConcurrency: '25'
          MaxRetryAttempts: '5'
          FolderPath: '$(WorkRoot)'
          UseMinimatch: true
          Pattern: |
            **/az.exe
            **/az.dll
            **/cirrus-agent.dll
            **/Core.*.dll
            **/Microsoft.Azure.Cirrus*.dll
            **/Microsoft.Azure.Cirrus*.exe
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "http://www.microsoft.com",
                  "FileDigest": "/fd \"SHA256\"",
                  "PageHash": "/NPH",
                  "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign", "ToolVersion": "1.0"
              },
              { "KeyCode": "${{ parameters.esrp_authenticode_keycode }}", "OperationCode": "SigntoolVerify", "Parameters": {}, "ToolName": "sign", "ToolVersion": "1.0" }
            ]
    - ${{ if ne(parameters.esrp_enable_windows_timestamp, true) }}:
      - task: EsrpCodeSigning@6
        displayName: 'D. Authenticode sign [Cirrus binaries no-timestamp]'
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          SessionTimeout: '60'
          MaxConcurrency: '25'
          MaxRetryAttempts: '5'
          FolderPath: '$(WorkRoot)'
          UseMinimatch: true
          Pattern: |
            **/az.exe
            **/az.dll
            **/cirrus-agent.dll
            **/Core.*.dll
            **/Microsoft.Azure.Cirrus*.dll
            **/Microsoft.Azure.Cirrus*.exe
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "http://www.microsoft.com",
                  "FileDigest": "/fd \"SHA256\"",
                  "PageHash": "/NPH"
                },
                "ToolName": "sign", "ToolVersion": "1.0"
              },
              { "KeyCode": "${{ parameters.esrp_authenticode_keycode }}", "OperationCode": "SigntoolVerify", "Parameters": {}, "ToolName": "sign", "ToolVersion": "1.0" }
            ]

    # =========================================================================
    # Step E - Authenticode for PowerShell scripts + manifests (Az.* payloads).
    # =========================================================================
    - task: EsrpCodeSigning@6
      displayName: 'E. Authenticode sign [PowerShell scripts + manifests]'
      condition: eq(variables['HasPs'], 'true')
      inputs:
        ConnectedServiceName: '$(ESRPServiceConnection)'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        batchSignPolicyFile: ''
        ciPolicyFile: ''
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        FolderPath: '$(WorkRoot)/ps-nupkg'
        UseMinimatch: true
        Pattern: |
          **/*.psd1
          **/*.psm1
          **/*.ps1
          **/*.ps1xml
        signConfigType: inlineSignParams
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolSign",
              "Parameters": {
                "OpusName": "Microsoft",
                "OpusInfo": "http://www.microsoft.com",
                "FileDigest": "/fd \"SHA256\"",
                "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
              },
              "ToolName": "sign", "ToolVersion": "1.0"
            },
            { "KeyCode": "${{ parameters.esrp_authenticode_keycode }}", "OperationCode": "SigntoolVerify", "Parameters": {}, "ToolName": "sign", "ToolVersion": "1.0" }
          ]

    # =========================================================================
    # Step F - Third-party co-signing (GATED). Append Microsoft Authenticode to
    # bundled dependency DLLs that were not already signed.
    # =========================================================================
    - ${{ if eq(parameters.sign_third_party, true) }}:
      - task: EsrpCodeSigning@6
        displayName: 'F. Authenticode sign [third-party deps]'
        condition: eq(variables['HasThirdParty'], 'true')
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          SessionTimeout: '60'
          MaxConcurrency: '25'
          MaxRetryAttempts: '5'
          FolderPath: '$(WorkRoot)/thirdparty'
          UseMinimatch: true
          Pattern: '*.dll'
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "${{ parameters.esrp_thirdparty_keycode }}",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "http://www.microsoft.com",
                  "FileDigest": "/fd \"SHA256\"",
                  "PageHash": "/NPH",
                  "Append": "/as",
                  "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign", "ToolVersion": "1.0"
              },
              { "KeyCode": "${{ parameters.esrp_thirdparty_keycode }}", "OperationCode": "SigntoolVerify", "Parameters": {}, "ToolName": "sign", "ToolVersion": "1.0" }
            ]
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $work = "$(WorkRoot)"
          $mapPath = Join-Path $work 'thirdparty-map.json'
          if (-not (Test-Path $mapPath)) { return }
          $map = Get-Content $mapPath -Raw | ConvertFrom-Json
          foreach ($e in $map) {
            $signed = Join-Path (Join-Path $work 'thirdparty') $e.flat
            if (-not (Test-Path $signed)) { throw "Signed third-party file missing: $signed" }
            Copy-Item $signed $e.origin -Force   # copy signed DLL back to its place in the tree
          }
          Write-Host "Restored $($map.Count) signed third-party DLLs into the work tree."
        displayName: 'F2. Copy signed third-party DLLs back'

    # =========================================================================
    # Step FV - Independent ESRP verification pass (GATED). A second, ESRP-side
    # SigntoolVerify of the signed payloads, separate from the inline verify in
    # each sign task. Runs on the work tree before repack.
    # =========================================================================
    - ${{ if eq(parameters.esrp_enable_windows_verify, true) }}:
      - task: EsrpCodeSigning@6
        displayName: 'FV. ESRP verify [Cirrus binaries]'
        condition: eq(variables['HasWin'], 'true')
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          SessionTimeout: '60'
          MaxConcurrency: '25'
          MaxRetryAttempts: '5'
          FolderPath: '$(WorkRoot)'
          UseMinimatch: true
          Pattern: |
            **/az.exe
            **/Microsoft.Azure.Cirrus*.dll
            **/Microsoft.Azure.Cirrus*.exe
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              { "KeyCode": "${{ parameters.esrp_authenticode_keycode }}", "OperationCode": "SigntoolVerify", "Parameters": {}, "ToolName": "sign", "ToolVersion": "1.0" }
            ]
      - task: EsrpCodeSigning@6
        displayName: 'FV. ESRP verify [PowerShell scripts + manifests]'
        condition: eq(variables['HasPs'], 'true')
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          SessionTimeout: '60'
          MaxConcurrency: '25'
          MaxRetryAttempts: '5'
          FolderPath: '$(WorkRoot)/ps-nupkg'
          UseMinimatch: true
          Pattern: |
            **/*.psd1
            **/*.psm1
            **/*.ps1
            **/*.ps1xml
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              { "KeyCode": "${{ parameters.esrp_authenticode_keycode }}", "OperationCode": "SigntoolVerify", "Parameters": {}, "ToolName": "sign", "ToolVersion": "1.0" }
            ]

    # =========================================================================
    # Step G - Repack: rebuild each win-*.zip and each .nupkg from its now-signed
    # extracted contents (in-place entry replacement to preserve nupkg metadata).
    # =========================================================================
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        Add-Type -AssemblyName System.IO.Compression.FileSystem | Out-Null
        $work = "$(WorkRoot)"
        $rel  = "$(ReleaseRoot)"
        $repack = Get-Content (Join-Path $work 'repack-map.json') -Raw | ConvertFrom-Json

        function Repack-Dir([string]$dir, [string]$outZip) {
          if (Test-Path $outZip) { Remove-Item $outZip -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $dir, $outZip,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false)   # includeBaseDirectory = false
        }

        foreach ($item in $repack) {
          $out = Join-Path $rel $item.name
          Repack-Dir -dir $item.dir -outZip $out
          Write-Host ("repacked {0} ({1})" -f $item.name, $item.kind)
        }
        Write-Host "Repacked $($repack.Count) artifacts into $rel"
      displayName: 'G. Repack signed zips + nupkgs'

    # =========================================================================
    # Step H - NuGet package-wrapper signing for ALL packages (extension + Az.*).
    # Runs from the release folder where the repacked nupkgs now live.
    # =========================================================================
    - task: EsrpCodeSigning@6
      displayName: 'H. NuGet sign [all packages]'
      condition: or(eq(variables['HasExt'], 'true'), eq(variables['HasPs'], 'true'))
      inputs:
        ConnectedServiceName: '$(ESRPServiceConnection)'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        batchSignPolicyFile: ''
        ciPolicyFile: ''
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        FolderPath: '$(ReleaseRoot)'
        UseMinimatch: true
        Pattern: '*.nupkg'
        signConfigType: inlineSignParams
        inlineOperation: |
          [
            { "KeyCode": "${{ parameters.esrp_nuget_keycode }}", "OperationCode": "NuGetSign",   "Parameters": {}, "ToolName": "sign", "ToolVersion": "1.0" }
          ]
    - ${{ if eq(parameters.esrp_enable_nuget_verify, true) }}:
      - task: EsrpCodeSigning@6
        displayName: 'H2. NuGet verify [all packages]'
        condition: or(eq(variables['HasExt'], 'true'), eq(variables['HasPs'], 'true'))
        inputs:
          ConnectedServiceName: '$(ESRPServiceConnection)'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          SessionTimeout: '60'
          MaxConcurrency: '25'
          MaxRetryAttempts: '5'
          FolderPath: '$(ReleaseRoot)'
          UseMinimatch: true
          Pattern: '*.nupkg'
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              { "KeyCode": "${{ parameters.esrp_nuget_keycode }}", "OperationCode": "NuGetVerify", "Parameters": {}, "ToolName": "sign", "ToolVersion": "1.0" }
            ]

    # =========================================================================
    # Step I - Holistic verification sweep. Fails the pipeline if ANY Cirrus
    # binary (loose, in a zip, or inside a nupkg) or PowerShell script is
    # unsigned, and verifies every nupkg package signature.
    # =========================================================================
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $rel = "$(ReleaseRoot)"
        $requirePayload = [System.Convert]::ToBoolean('${{ parameters.require_payload_verification }}')
        $requireStrongName = [System.Convert]::ToBoolean('${{ parameters.esrp_enable_strong_name }}')
        $tmp = Join-Path "$(Agent.TempDirectory)" 'verify-extract'
        Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $tmp | Out-Null

        $failures = New-Object System.Collections.Generic.List[string]
        $checked  = 0

        function Test-CirrusBinary([string]$path) {
          $script:checked++
          $sig = Get-AuthenticodeSignature -FilePath $path
          if ($sig.Status -ne 'Valid') {
            $script:failures.Add("UNSIGNED/INVALID: $path (Status=$($sig.Status))")
          }
        }

        function Test-StrongName([string]$path) {
          # (a) public key token must be present
          try { $an = [System.Reflection.AssemblyName]::GetAssemblyName($path) }
          catch { $script:failures.Add("STRONGNAME-UNREADABLE: $path"); return }
          $tok = $an.GetPublicKeyToken()
          if (-not $tok -or $tok.Length -eq 0) { $script:failures.Add("STRONGNAME-MISSING-KEY: $path"); return }
          # (b) strong name must actually be COMPLETED by ESRP, not just delay-signed.
          #     A delay-signed assembly still has a public key token but the
          #     COMIMAGE_FLAGS_STRONGNAMESIGNED (0x8) bit is clear. Read the CLI
          #     header flags from the PE to confirm the signature was applied.
          try {
            $b = [System.IO.File]::ReadAllBytes($path)
            $pe = [System.BitConverter]::ToInt32($b, 0x3C)
            $opt = $pe + 24
            $magic = [System.BitConverter]::ToUInt16($b, $opt)
            $ddOff = $opt + $(if ($magic -eq 0x20b) { 112 } else { 96 })
            $corRva = [System.BitConverter]::ToInt32($b, $ddOff + 14 * 8)
            if ($corRva -eq 0) { $script:failures.Add("STRONGNAME-NO-CLR-HEADER: $path"); return }
            $nsec = [System.BitConverter]::ToUInt16($b, $pe + 6)
            $optSize = [System.BitConverter]::ToUInt16($b, $pe + 20)
            $sec = $opt + $optSize
            $corOff = $null
            for ($i = 0; $i -lt $nsec; $i++) {
              $s = $sec + $i * 40
              $va = [System.BitConverter]::ToInt32($b, $s + 12)
              $vs = [System.BitConverter]::ToInt32($b, $s + 8)
              $raw = [System.BitConverter]::ToInt32($b, $s + 20)
              if ($corRva -ge $va -and $corRva -lt ($va + $vs)) { $corOff = $corRva - $va + $raw; break }
            }
            if ($null -eq $corOff) { Write-Host "##[warning]Strong-name PE RVA unmapped (skipped completion check): $path"; return }
            $corFlags = [System.BitConverter]::ToInt32($b, $corOff + 16)
            if (-not ($corFlags -band 0x8)) {
              $script:failures.Add("STRONGNAME-NOT-COMPLETED (delay-signed only, ESRP did not finish): $path")
            }
          }
          catch {
            # PE parsing quirk - warn but do not fail the pipeline on it
            Write-Host "##[warning]Strong-name completion check could not parse PE (skipped): $path ($($_.Exception.Message))"
          }
        }

        function Test-FirstPartyDll([string]$n) {
          return ($n -like 'Microsoft.Azure.Cirrus*.dll') -or ($n -like 'Core.*.dll') -or
                 ($n -ieq 'az.dll') -or ($n -ieq 'cirrus-agent.dll')
        }
        function Test-Tree([string]$root) {
          $bins = Get-ChildItem -Path $root -Recurse -File | Where-Object {
            $_.Name -ieq 'az.exe' -or
            $_.Name -ieq 'az.dll' -or
            $_.Name -ieq 'cirrus-agent.dll' -or
            $_.Name -like 'Core.*.dll' -or
            $_.Name -like 'Microsoft.Azure.Cirrus*.dll' -or
            $_.Name -like 'Microsoft.Azure.Cirrus*.exe'
          }
          foreach ($b in $bins) {
            Test-CirrusBinary $b.FullName
            if ($requireStrongName -and (Test-FirstPartyDll $b.Name)) { Test-StrongName $b.FullName }
          }
          # PowerShell scripts/manifests must also be signed
          $scripts = Get-ChildItem -Path $root -Recurse -File -Include *.psd1,*.psm1,*.ps1,*.ps1xml
          foreach ($s in $scripts) {
            $script:checked++
            $sig = Get-AuthenticodeSignature -FilePath $s.FullName
            if ($sig.Status -ne 'Valid') { $script:failures.Add("UNSIGNED PS: $($s.FullName) (Status=$($sig.Status))") }
          }
        }

        # 1) verify loose + extracted contents inside each shipped zip / nupkg
        if ($requirePayload) {
          $packages = Get-ChildItem -Path $rel -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.nupkg' }
          foreach ($pkg in $packages) {
            $dest = Join-Path $tmp $pkg.BaseName
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $asZip = Join-Path $tmp ($pkg.BaseName + '.zip')
            Copy-Item $pkg.FullName $asZip -Force
            Expand-Archive -Path $asZip -DestinationPath $dest -Force
            Test-Tree $dest
          }
        }

        # 2) verify every nupkg package signature
        $nupkgVerified = 0
        Get-ChildItem -Path $rel -File -Filter '*.nupkg' | ForEach-Object {
          dotnet nuget verify --all $_.FullName | Out-Host
          if ($LASTEXITCODE -ne 0) { $failures.Add("NUGET-SIGNATURE-INVALID: $($_.Name)") } else { $nupkgVerified++ }
        }

        Write-Host "Verification sweep: checked $checked binaries/scripts; nupkg signatures verified $nupkgVerified."
        if ($failures.Count -gt 0) {
          Write-Host "##vso[task.logissue type=error]Holistic signing verification failed ($($failures.Count) issue(s)):"
          $failures | Select-Object -First 50 | ForEach-Object { Write-Host "  $_" }
          throw "Signing verification sweep failed."
        }
        Write-Host "All Cirrus binaries, PowerShell scripts, and package signatures verified."
      displayName: 'I. Holistic post-sign verification sweep'

    # =========================================================================
    # Step J - Provenance, SBOM, and publish the signed Windows distribution.
    # =========================================================================
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $rel = "$(ReleaseRoot)"
        $entries = Get-ChildItem -Path $rel -File | ForEach-Object {
          [pscustomobject]@{
            file   = $_.Name
            size   = $_.Length
            sha256 = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
        }
        $entries | ConvertTo-Json -Depth 5 | Out-File (Join-Path $rel 'signing-manifest.json') -Encoding utf8

        $provenance = [pscustomobject]@{
          source = @{
            project  = '${{ parameters.SourceProject }}'
            pipeline = '${{ parameters.source_pipeline_name }}'
            artifact = '${{ parameters.source_artifact_name }}'
          }
          signingRun = @{
            project     = "$(System.TeamProject)"
            pipeline    = "$(Build.DefinitionName)"
            buildId     = "$(Build.BuildId)"
            buildNumber = "$(Build.BuildNumber)"
            branch      = "$(Build.SourceBranch)"
            commit      = "$(Build.SourceVersion)"
          }
          policy = @{
            authenticodeKeyCode = '${{ parameters.esrp_authenticode_keycode }}'
            nugetKeyCode        = '${{ parameters.esrp_nuget_keycode }}'
            strongNameKeyCode   = '${{ parameters.esrp_strongname_keycode }}'
            thirdPartyKeyCode   = '${{ parameters.esrp_thirdparty_keycode }}'
            timestampEnabled    = '${{ parameters.esrp_enable_windows_timestamp }}'
            strongNameEnabled   = '${{ parameters.esrp_enable_strong_name }}'
            thirdPartySigning   = '${{ parameters.sign_third_party }}'
            nugetVerifyEnabled  = '${{ parameters.esrp_enable_nuget_verify }}'
          }
        }
        $provenance | ConvertTo-Json -Depth 6 | Out-File (Join-Path $rel 'signing-provenance.json') -Encoding utf8
        Write-Host "Wrote signing-manifest.json and signing-provenance.json"
      displayName: 'J. Write manifest + provenance'

    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      displayName: 'J2. Generate SBOM for signed Windows distribution'
      inputs:
        BuildDropPath: '$(ReleaseRoot)'

    - task: PublishPipelineArtifact@1
      displayName: 'J3. Publish signed Windows distribution'
      inputs:
        targetPath: '$(ReleaseRoot)'
        artifact: ${{ parameters.signed_artifact_name }}
        publishLocation: pipeline
