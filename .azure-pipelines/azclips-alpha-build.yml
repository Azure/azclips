name: azclips-alpha-build-$(SourceBranchName)-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr:
  autoCancel: true
  branches:
    include:
    - '*'

variables:
- template: templates/variables.yml
- template: templates/dist/variables/packaging.yml
- template: templates/dist/variables/common.yml

stages:
- stage: ValidatePullRequest
  displayName: Validate Pull Request
  jobs:
  - job: CheckPullRequest
    displayName: Check Pull Request Title and History Notes
    pool:
      vmImage: ${{ variables.ubuntu_pool }}
    steps:
    - checkout: self
    - bash: |
        set -euo pipefail

        python3 - <<'PY'
        import json
        import os
        import subprocess
        import sys
        import urllib.request

        pr_number = os.environ.get('SYSTEM_PULLREQUEST_PULLREQUESTNUMBER')
        repository = os.environ.get('BUILD_REPOSITORY_NAME')

        if not pr_number:
            print('No pull request number found; skipping pull request metadata validation.')
            sys.exit(0)
        if not repository:
            print('BUILD_REPOSITORY_NAME is not set.', file=sys.stderr)
            sys.exit(1)

        request = urllib.request.Request(
            f'https://api.github.com/repos/{repository}/pulls/{pr_number}',
            headers={'User-Agent': 'azclips-pr-title-check'}
        )

        with urllib.request.urlopen(request) as response:
            pull_request = json.load(response)

        title = pull_request.get('title') or ''
        body = pull_request.get('body') or ''

        print(f'Check pull request title and history notes: #{pr_number}')
        print(title)

        subprocess.run(
            ['python3', 'devops/scripts/ci/check_pull_request.py', title, body],
            check=True
        )
        PY
      displayName: Check PR title and history notes

- template: templates/dist/stages/build-unsigned-distribution.yml
  parameters:
    artifact_version_override: auto
    bump_type: patch
    release_channel: pr-alpha
    release_date: auto
    pr_number: auto
    sequence: auto
    ubuntu_pool: ${{ variables.ubuntu_pool }}
    windows_pool: ${{ variables.windows_pool }}
    macos_arm64_pool: ${{ variables.macos_arm64_pool }}
    macos_intel_pool: ${{ variables.macos_intel_pool }}
    final_artifact_name: Final_Build_Distribution
