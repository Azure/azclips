name: azclips-beta-build-$(SourceBranchName)-$(Date:yyyyMMdd)$(Rev:.r)

parameters:
- name: sign_beta
  displayName: Sign this manual beta build after successful completion
  type: boolean
  default: false
- name: allowed_signing_source_branch
  displayName: Allowed source branch when sign_beta is true
  type: string
  default: refs/heads/main

trigger:
  batch: true
  branches:
    include:
    - main
pr: none

variables:
- template: templates/variables.yml
- template: templates/dist/variables/packaging.yml
- template: templates/dist/variables/common.yml

stages:
- template: templates/dist/stages/build-unsigned-distribution.yml
  parameters:
    artifact_version_override: auto
    bump_type: patch
    release_channel: beta
    limit_ps_testing: false
    skip_ps_version_check: false
    build_docker_images: true
    release_date: auto
    pr_number: auto
    sequence: auto
    ubuntu_pool: ${{ variables.ubuntu_pool }}
    ubuntu_arm64_pool: ${{ variables.ubuntu_arm64_pool }}
    windows_pool: ${{ variables.windows_pool }}
    windows_arm64_pool: ${{ variables.windows_arm64_pool }}
    macos_arm64_pool: ${{ variables.macos_arm64_pool }}
    macos_intel_pool: ${{ variables.macos_intel_pool }}
    final_artifact_name: Final_Build_Distribution

- ${{ if eq(parameters.sign_beta, true) }}:
  - stage: MarkBetaForSigning
    displayName: Mark Beta Build For Signing
    dependsOn:
    - Finalize
    - ComponentGovernance
    condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
    jobs:
    - job: AddSigningTag
      displayName: Add sign-beta Build Tag
      pool:
        name: ${{ variables.ubuntu_pool }}
      steps:
      - checkout: none
      - bash: |
          set -euo pipefail
          allowed_source_branch='${{ parameters.allowed_signing_source_branch }}'

          if [[ '$(System.TeamProject)' != 'public' ]]; then
            echo "ERROR: sign_beta must run from the public project. Got: $(System.TeamProject)"
            exit 1
          fi
          if [[ '$(Build.SourceBranch)' != 'refs/heads/main' && '$(Build.SourceBranch)' != "$allowed_source_branch" ]]; then
            echo "ERROR: sign_beta only supports refs/heads/main or the configured allowed_signing_source_branch. Got: $(Build.SourceBranch); allowed: $allowed_source_branch"
            exit 1
          fi

          echo 'Adding sign-beta tag so azclips-beta-sign can consume this completed build.'
          echo '##vso[build.addbuildtag]sign-beta'
        displayName: Add sign-beta tag for release-project signing trigger
