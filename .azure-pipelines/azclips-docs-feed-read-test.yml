name: docs-powershell-pat-read-test-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

jobs:
- job: CheckGitHubPat
  displayName: Test PowerShell release GitHub credential
  pool:
    name: pool-ubuntu-2404
  steps:
  - checkout: self
  - template: templates/dist/steps/get-github-pat-token.yml
    parameters:
      azureSubscription: azureps-infra-sp
      keyVaultName: azurepsdev
      secretName: azpsbot-github-pat
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      if ($env:SYSTEM_TEAMPROJECT -ne 'release') {
        throw 'This test must run in the release project.'
      }
      if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
        throw 'GitHub token was not supplied by Key Vault.'
      }
      $headers = @{
        Authorization = "Bearer $env:GH_TOKEN"
        'User-Agent' = 'azclips-docs-pat-test'
        Accept = 'application/vnd.github+json'
      }
      try {
        $identity = Invoke-WebRequest -Uri 'https://api.github.com/user' -Headers $headers -SkipHttpErrorCheck
        if ($identity.StatusCode -ne 200) {
          $reason = 'unclassified'
          $content = [string]$identity.Content
          if ($content -match 'rate limit') { $reason = 'rate limit' }
          elseif ($content -match 'bad credentials') { $reason = 'bad credentials' }
          elseif ($content -match 'resource not accessible') { $reason = 'resource not accessible' }
          elseif ($content -match 'SAML|single sign.on|SSO') { $reason = 'SSO authorization' }
          elseif ($content -match 'IP allow list|IP address|IP restriction') { $reason = 'IP restriction' }
          $anonymous = Invoke-WebRequest -Uri 'https://api.github.com' -Headers @{ 'User-Agent' = 'azclips-docs-pat-test' } -SkipHttpErrorCheck
          Write-Host "GitHub auth response: HTTP $($identity.StatusCode), reason=$reason, GitHub-request-id-present=$([bool]$identity.Headers['X-GitHub-Request-Id']), rate-limit-remaining=$($identity.Headers['X-RateLimit-Remaining'] -join ',')."
          Write-Host "Anonymous GitHub API response: HTTP $($anonymous.StatusCode)."
          if ($identity.StatusCode -ne 403 -or $reason -ne 'resource not accessible') {
            throw "GitHub authentication failed: HTTP $($identity.StatusCode)."
          }
          Write-Host 'The user endpoint is unavailable to this credential; checking installation access instead.'
        } else {
          Write-Host "Authenticated GitHub account: $(($identity.Content | ConvertFrom-Json).login)."
        }
        $installation = Invoke-WebRequest -Uri 'https://api.github.com/installation/repositories?per_page=100&page=1' -Headers $headers -SkipHttpErrorCheck
        $installationNames = @()
        if ($installation.StatusCode -eq 200) {
          $data = $installation.Content | ConvertFrom-Json
          $installationNames = @($data.repositories | ForEach-Object full_name)
          for ($page = 2; $installationNames.Count -lt $data.total_count; $page++) {
            $next = Invoke-WebRequest -Uri "https://api.github.com/installation/repositories?per_page=100&page=$page" -Headers $headers -SkipHttpErrorCheck
            if ($next.StatusCode -ne 200) { throw "GitHub installation listing failed on page $page : HTTP $($next.StatusCode)." }
            $names = @(($next.Content | ConvertFrom-Json).repositories | ForEach-Object full_name)
            if ($names.Count -eq 0) { throw 'GitHub installation listing ended before the reported total.' }
            $installationNames += $names
          }
          Write-Host 'GitHub installation repository listing succeeded.'
        } else {
          Write-Host "GitHub installation repository listing unavailable: HTTP $($installation.StatusCode)."
          if ($identity.StatusCode -ne 200) { throw 'Unable to verify an authenticated user or installation.' }
        }
        $failures = 0
        foreach ($repo in @('MicrosoftDocs/azure-docs-cli', 'MicrosoftDocs/azure-docs-powershell')) {
          if ($installation.StatusCode -eq 200) {
            Write-Host "$repo listed in installation: $($repo -in $installationNames)."
          }
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/$repo" -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -ne 200) {
            Write-Host "$repo metadata request failed: HTTP $($response.StatusCode)."
            $failures++
            continue
          }
          $metadata = $response.Content | ConvertFrom-Json
          if ($null -ne $metadata.permissions) {
            Write-Host "$repo metadata: push=$($metadata.permissions.push), admin=$($metadata.permissions.admin)."
          } else {
            Write-Host "$repo metadata read succeeded; permission details not returned."
          }
        }
        if ($failures -ne 0) { throw "$failures repository metadata check(s) failed." }
        Write-Host 'No repository changes were made. Public-repo reads and metadata do not prove token write or PR permissions.'
      } finally {
        $headers = $null
        $identity = $null
        $installation = $null
        $response = $null
        Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
      }
    displayName: Test GitHub Authentication And Repository Metadata
    env:
      GH_TOKEN: $(GH_TOKEN)
