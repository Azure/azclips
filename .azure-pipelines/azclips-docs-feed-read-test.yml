name: docs-github-app-identity-test-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

jobs:
- job: CheckGitHubApp
  displayName: Test Learn GitHub App access
  pool:
    name: pool-ubuntu-2404
  steps:
  - checkout: none
  - task: AzureCLI@2
    displayName: Test GitHub App token requests
    inputs:
      azureSubscription: DocsReference_WIF
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        if ($env:SYSTEM_TEAMPROJECT -ne 'release') {
          throw 'This test must run in the release project.'
        }
        $serviceToken = az account get-access-token --resource 6befca88-4c28-430a-957e-f870b267bcfc --query accessToken --output tsv
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($serviceToken)) {
          throw 'Could not obtain an access token for the Learn build service.'
        }
        $failures = 0
        try {
          foreach ($repo in @('MicrosoftDocs/azure-docs-cli', 'MicrosoftDocs/azure-docs-powershell')) {
            foreach ($mode in @('read', 'pr-write')) {
              $permissions = if ($mode -eq 'read') {
                @{ contents = 'Read' }
              } else {
                @{ contents = 'Write'; pull_requests = 'Write' }
              }
              $body = @{ repoUrl = "https://github.com/$repo"; permissions = $permissions } | ConvertTo-Json -Compress
              $response = Invoke-WebRequest -Method Post -Uri 'https://buildapi.docs.microsoft.com/v2/authentication/profile/token' `
                -Headers @{ Authorization = "Bearer $serviceToken" } -Body $body -ContentType 'application/json' -SkipHttpErrorCheck
              if ($response.StatusCode -ne 200) {
                Write-Host "$repo $mode token request failed: HTTP $($response.StatusCode)."
                $failures++
                continue
              }
              $githubToken = ($response.Content | ConvertFrom-Json).access_token
              $response = $null
              if ([string]::IsNullOrWhiteSpace($githubToken)) {
                Write-Host "$repo $mode token request returned no token."
                $failures++
                continue
              }
              try {
                $check = Invoke-WebRequest -Uri "https://api.github.com/repos/$repo" `
                  -Headers @{ Authorization = "Bearer $githubToken"; 'User-Agent' = 'azclips-docs-app-test'; Accept = 'application/vnd.github+json' } `
                  -SkipHttpErrorCheck
                if ($check.StatusCode -ne 200) {
                  Write-Host "$repo $mode GitHub check failed: HTTP $($check.StatusCode)."
                  $failures++
                } else {
                  Write-Host "$repo $mode token request and GitHub read succeeded."
                }
              } finally {
                $githubToken = $null
                $check = $null
              }
            }
          }
        } finally {
          $serviceToken = $null
          $response = $null
        }
        if ($failures -ne 0) { throw "$failures GitHub App access check(s) failed." }
        Write-Host 'No repository changes were made. Write permissions have not been exercised.'
