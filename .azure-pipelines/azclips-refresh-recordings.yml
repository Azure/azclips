name: azclips-refresh-recordings-$(Date:yyyyMMdd)$(Rev:.r)

# Records scenarios against a live test subscription, so it runs only in the internal
# release project. Who may queue or edit it, which branches may use the live test service
# connection, and which pipelines may use that connection are enforced by Azure DevOps
# resource settings; the guards below are defense in depth, not the boundary.
trigger: none
pr: none

schedules:
- cron: '0 6 * * 1'
  displayName: Weekly recording refresh
  branches:
    include:
    - main
  # Recordings go stale when Azure changes, not when the repository does.
  always: true

parameters:
- name: scenario_filter
  displayName: Only refresh scenario classes whose name contains this (blank for all)
  type: string
  default: ' '

variables:
- ${{ if eq(variables['System.TeamProject'], 'release') }}:
  - group: 'get-github-pat-token'
  # The live test service principal that Azure PowerShell's live tests use. The group holds
  # LiveTestServiceConnectionName, LiveTestServicePrincipalKeyVaultName,
  # LiveTestServicePrincipalSecretName, LiveTestServicePrincipalId, LiveTestTenantId and
  # LiveTestSubscriptionId; the secret itself stays in Key Vault and is read each run.
  # TEMP: test only. The test pipeline defines these as pipeline variables in Azure DevOps;
  # link the live test variable group here before PR.
  # - group: 'REPLACE-WITH-LIVE-TEST-VARIABLE-GROUP'
- template: templates/variables.yml
- template: templates/dist/variables/common.yml
- name: GitHubTargetRepo
  value: ${{ variables.github_target_repo }}
# Set by Validate Refresh Inputs; declared so the refresh step never sees an unexpanded macro.
- name: ScenarioFilter
  value: ''

jobs:
- job: RefreshRecordings
  displayName: Refresh Stale Recordings
  timeoutInMinutes: 360
  pool:
    name: $(ubuntu_pool)
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - template: templates/dist/steps/validate-release-project.yml
    parameters:
      error_message: azclips-refresh-recordings must run in the 'release' project because it records against the live test subscription and opens pull requests.

  - bash: |
      set -euo pipefail

      # Azure Pipelines treats this marker anywhere in output as a logging command.
      log_value() {
        local value="$1"
        local marker='##vso['
        local escaped_marker='##vso_['
        printf '%s' "${value//"$marker"/"$escaped_marker"}"
      }

      if [[ "$SOURCE_BRANCH" != "refs/heads/main" && "$SOURCE_BRANCH" != "refs/heads/refresh-recordings-ado" ]]; then  # TEMP: test only, revert before PR
        echo "ERROR: Recordings are refreshed only from refs/heads/main. Got: $(log_value "$SOURCE_BRANCH")"
        exit 1
      fi

      filter="$SCENARIO_FILTER"
      filter="${filter#"${filter%%[![:space:]]*}"}"
      filter="${filter%"${filter##*[![:space:]]}"}"
      if [[ ! "$filter" =~ ^[A-Za-z0-9_.]*$ ]]; then
        echo "ERROR: scenario_filter may contain only letters, digits, '_' and '.'. Got: $(log_value "$filter")"
        exit 1
      fi

      echo "Scenario filter: ${filter:-(all scenario classes)}"
      echo "##vso[task.setvariable variable=ScenarioFilter]$filter"
    displayName: Validate Refresh Inputs
    env:
      SCENARIO_FILTER: ${{ parameters.scenario_filter }}
      SOURCE_BRANCH: $(Build.SourceBranch)

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - bash: |
      set -euo pipefail
      dotnet build azclips.slnx -p:CopilotSkipCliDownload=true
    displayName: Build

  # Same sign-in as Azure PowerShell's live tests: read the service principal's secret from
  # Key Vault each run, then sign the built azclips CLI in with it.
  - task: AzurePowerShell@5
    displayName: Get Live Test Secret From Key Vault
    inputs:
      azureSubscription: $(LiveTestServiceConnectionName)
      azurePowerShellVersion: LatestVersion
      pwsh: true
      ScriptType: InlineScript
      Inline: |
        $secret = Get-AzKeyVaultSecret -VaultName $env:KEY_VAULT_NAME -Name $env:SECRET_NAME -AsPlainText
        if ([string]::IsNullOrWhiteSpace($secret)) {
          throw "Secret '$env:SECRET_NAME' in vault '$env:KEY_VAULT_NAME' was empty or not found."
        }
        Write-Host "##vso[task.setvariable variable=LiveTestServicePrincipalSecret;issecret=true;isreadonly=true]$secret"
    env:
      KEY_VAULT_NAME: $(LiveTestServicePrincipalKeyVaultName)
      SECRET_NAME: $(LiveTestServicePrincipalSecretName)

  # AZCLIPS_HOME keeps the profile, and the secret azclips stores with it, in the job's temp
  # directory rather than the agent user's home, so nothing outlives the job. Without a session
  # bus azclips cannot reach a keyring, so the secret is stored there and not in the agent
  # user's keyring, which the cleanup step could not remove.
  - bash: |
      set -euo pipefail
      unset DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR
      for name in LIVE_TEST_CLIENT_ID LIVE_TEST_CLIENT_SECRET LIVE_TEST_TENANT_ID LIVE_TEST_SUBSCRIPTION_ID; do
        # An undefined variable reaches the script as its literal macro, such as $(LiveTestTenantId).
        if [[ -z "${!name:-}" || "${!name}" =~ ^\$\([A-Za-z0-9_.]+\)$ ]]; then
          echo "ERROR: $name is not set. Link the live test variable group to this pipeline."
          exit 1
        fi
      done
      # azclips reads any argument that starts with '-' as an option name, so such a secret
      # would be misparsed and could be echoed back in the error.
      if [[ "$LIVE_TEST_CLIENT_SECRET" == -* ]]; then
        echo "ERROR: The live test secret starts with '-', which azclips cannot take as a value."
        exit 1
      fi
      ./artifacts/Debug/Core.Cli/az login --service-principal \
        --client-id "$LIVE_TEST_CLIENT_ID" \
        --client-secret "$LIVE_TEST_CLIENT_SECRET" \
        --tenant-id "$LIVE_TEST_TENANT_ID" \
        --subscription-id "$LIVE_TEST_SUBSCRIPTION_ID"
    displayName: Sign In To The Live Test Subscription
    retryCountOnTaskFailure: 3
    env:
      AZCLIPS_HOME: $(Agent.TempDirectory)/azclips-home
      LIVE_TEST_CLIENT_ID: $(LiveTestServicePrincipalId)
      LIVE_TEST_CLIENT_SECRET: $(LiveTestServicePrincipalSecret)
      LIVE_TEST_TENANT_ID: $(LiveTestTenantId)
      LIVE_TEST_SUBSCRIPTION_ID: $(LiveTestSubscriptionId)

  # The script's exit code separates refresh failures (3) from secret scan findings (4);
  # see refresh_recordings.py. Only 0 and 3 leave recordings that may be published.
  - bash: |
      set -uo pipefail
      # Same store as the sign-in step: the profile under AZCLIPS_HOME, not a keyring.
      unset DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR
      if [[ "$SCENARIO_FILTER" == \$\(* ]]; then
        echo "ERROR: The validated scenario filter was not set."
        exit 1
      fi
      status=0
      python3 devops/scripts/live/refresh_recordings.py --filter "$SCENARIO_FILTER" || status=$?
      if [[ -f refresh-summary.md ]]; then
        echo "##vso[task.uploadsummary]$BUILD_SOURCESDIRECTORY/refresh-summary.md"
      fi
      echo "##vso[task.setvariable variable=RefreshExitCode]$status"
      exit "$status"
    displayName: Refresh Stale Recordings
    env:
      AZCLIPS_HOME: $(Agent.TempDirectory)/azclips-home
      SCENARIO_FILTER: $(ScenarioFilter)
      # Ties run-scoped resource names (-t<8hex>) to this build, so a resource group left
      # behind by an interrupted run maps back to the run that created it.
      AZCLIPS_TEST_RUN_ID: $(Build.BuildId)

  - template: templates/dist/steps/get-github-pat-token.yml
    parameters:
      azureSubscription: $(AzureSubscription)
      keyVaultName: $(GitHubPatKeyVault)
      secretName: $(GitHubPatSecretName)
      execCondition: and(not(canceled()), in(variables['RefreshExitCode'], '0', '3'))

  - bash: |
      set -euo pipefail

      if [[ -z "${GH_TOKEN:-}" || "${GH_TOKEN:-}" == \$\(* ]]; then
        echo "ERROR: GH_TOKEN was not obtained from Azure Key Vault."
        exit 1
      fi

      if ! command -v gh >/dev/null 2>&1; then
        echo "ERROR: GitHub CLI 'gh' is required to open the refresh PR."
        exit 1
      fi

      records='tests/Scenario.Tests/*/Records/*'
      changes="$(git status --porcelain --untracked-files=all -- "$records")"
      if [[ -z "$changes" ]]; then
        echo "No recordings were rewritten; no pull request is opened."
        exit 0
      fi

      repo="$GITHUB_TARGET_REPO"
      branch="live/recording-refresh-$BUILD_BUILDID"

      git config user.name "Azclips Release Automation"
      git config user.email "azclips-release-automation@microsoft.com"
      git checkout -b "$branch"
      git add -- "$records"
      git commit -m "Refresh stale scenario recordings"
      echo "TEST RUN: recordings committed locally only; no push and no pull request."  # TEMP: test only, revert before PR
      git show --stat HEAD
      exit 0
      basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
      git -c "http.https://github.com/$repo.git.extraheader=AUTHORIZATION: Basic $basic_auth" push "https://github.com/$repo.git" "HEAD:refs/heads/$branch"

      gh pr create \
        --repo "$repo" \
        --base main \
        --head "$branch" \
        --title "{Tests} Refresh stale scenario recordings" \
        --body-file refresh-summary.md
    displayName: Push Refreshed Recordings And Open PR
    condition: and(not(canceled()), in(variables['RefreshExitCode'], '0', '3'))
    env:
      GH_TOKEN: $(GH_TOKEN)
      GITHUB_TARGET_REPO: $(GitHubTargetRepo)

  # Removes the azclips profile and the service principal secret stored with it, whatever
  # happened above; a logout alone keeps the stored secret.
  - bash: rm -rf "$AZCLIPS_HOME"
    displayName: Remove The Live Test Sign-In
    condition: always()
    env:
      AZCLIPS_HOME: $(Agent.TempDirectory)/azclips-home
