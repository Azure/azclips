name: azclips-scenario-6-cli-install-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
- name: include_windows_macos
  displayName: Include Windows and macOS installation checks
  type: boolean
  default: false

variables:
- ${{ if eq(variables['System.TeamProject'], 'release') }}:
  - group: 'get-github-pat-token'

jobs:
- job: InstallFullCli
  displayName: Install full CLI and check help
  timeoutInMinutes: 30
  strategy:
    matrix:
      Ubuntu:
        image: ubuntu-24.04
      ${{ if eq(parameters.include_windows_macos, true) }}:
        Windows:
          image: windows-2022
        MacOS:
          image: macOS-15
  pool:
    vmImage: $(image)
  steps:
  - checkout: self

  - template: templates/dist/steps/validate-release-project.yml
    parameters:
      error_message: This test pipeline must run in the release project to use the existing GitHub download credential.

  - template: templates/dist/steps/get-github-pat-token.yml
    parameters:
      azureSubscription: $(AzureSubscription)
      keyVaultName: $(GitHubPatKeyVault)
      secretName: $(GitHubPatSecretName)

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN) -or $env:GH_TOKEN.StartsWith('$(')) {
          throw 'GitHub download credential was not obtained from Key Vault.'
      }
      gh auth status --hostname github.com *> $null
      if ($LASTEXITCODE -ne 0) {
          throw 'GitHub authentication failed; cannot download the CLI release unattended.'
      }
    displayName: Verify unattended GitHub download access
    env:
      GH_TOKEN: $(GH_TOKEN)

  - bash: |
      set -euo pipefail
      bash install/azcli-install.sh --package full
    displayName: Install full CLI on Linux or macOS
    condition: and(succeeded(), ne(variables['Agent.OS'], 'Windows_NT'))
    env:
      GH_TOKEN: $(GH_TOKEN)

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      & ./install/azcli-install.ps1 -Package full
    displayName: Install full CLI on Windows
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))
    env:
      GH_TOKEN: $(GH_TOKEN)

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      $az = if ($IsWindows) {
          Join-Path $env:LOCALAPPDATA 'Programs/azcli/az.exe'
      } else {
          Join-Path $HOME '.local/share/azcli/az'
      }
      if (-not (Test-Path -LiteralPath $az -PathType Leaf)) {
          throw "Installed preview executable not found: $az"
      }
      Write-Host "Testing installed preview: $az"
      $version = & $az --version
      $version
      if (($version -join "`n") -notmatch '(?m)^AzCli\s+\S+') {
          throw 'Version output did not identify the AzCLIPS preview.'
      }
      & $az version
      & $az --help
      & $az login --help
      & $az group create --help
      & $az vm create --help
      & $az extension list
      $compute = & $az extension show --name compute | ConvertFrom-Json
      if ($compute.packageId -ne 'Microsoft.Azure.Azclips.Extensions.Compute' -or 'vm' -notin $compute.namespaces) {
          throw 'The full installation did not expose the expected compute extension.'
      }
      $compute
      Write-Host 'PASS: full CLI installation, version, help, and compute extension checks.'
    displayName: Verify installed CLI version, help, and full-package extension

  - task: AzureCLI@2
    displayName: Verify AzCLIPS OIDC sign-in and scoped resource access
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))
    inputs:
      azureSubscription: naga-azclips-scenario6
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      visibleAzLogin: false
      inlineScript: |
        set -euo pipefail
        : "${servicePrincipalId:?Service connection did not provide a client ID}"
        : "${tenantId:?Service connection did not provide a tenant ID}"
        : "${idToken:?Service connection did not provide an OIDC token}"
        if [[ "$tenantId" != "$TEST_TENANT" ]]; then
          echo "ERROR: Service connection targets a different tenant." >&2
          exit 1
        fi

        # AzureCLI@2 brokers the assertion; explicitly test the installed preview, not classic az.
        azclips="$HOME/.local/share/azcli/az"
        "$azclips" login --service-principal \
          --client-id "$servicePrincipalId" \
          --tenant-id "$tenantId" \
          --subscription-id "$TEST_SUBSCRIPTION" \
          --federated-token "$idToken" \
          --out-profile scenario6-oidc

        profile_json=$("$azclips" profile show --active)
        jq -e --arg tenant "$TEST_TENANT" --arg sub "$TEST_SUBSCRIPTION" \
          --arg client "$servicePrincipalId" \
          '.name == "scenario6-oidc" and .isActive == true and
           .tenantId == $tenant and .subscriptionId == $sub and .clientId == $client' \
          <<< "$profile_json" > /dev/null

        group_id=$("$azclips" group show --subscription-id "$TEST_SUBSCRIPTION" \
          --name rg-azclips-scenario6 --query id --output tsv)
        expected_id="/subscriptions/$TEST_SUBSCRIPTION/resourceGroups/rg-azclips-scenario6"
        if [[ "${group_id,,}" != "${expected_id,,}" ]]; then
          echo "ERROR: Resource-group lookup did not return the approved test scope." >&2
          exit 1
        fi
        echo "PASS: AzCLIPS federated sign-in, profile target, and test resource-group access."
    env:
      AZCLIPS_HOME: $(Agent.TempDirectory)/azclips-scenario6-$(System.JobId)
      TEST_TENANT: 72031ed9-9b48-4bb7-804a-0d1a2a44e7be
      TEST_SUBSCRIPTION: 2e4d10de-8014-45bd-b341-de3ba295cade

  - bash: |
      set -euo pipefail
      azclips="$HOME/.local/share/azcli/az"
      if [[ ! -x "$azclips" ]]; then
        echo "No installed preview executable; OIDC sign-in was not reached."
        exit 0
      fi
      profiles=$("$azclips" profile list)
      if jq -e 'any(.[]; .name == "scenario6-oidc")' <<< "$profiles" > /dev/null; then
        "$azclips" profile set --name scenario6-oidc
        "$azclips" logout
        "$azclips" profile remove --name scenario6-oidc
      fi
      remaining=$("$azclips" profile list)
      jq -e 'all(.[]; .name != "scenario6-oidc")' <<< "$remaining" > /dev/null
      echo "PASS: temporary OIDC profile cleanup; no Azure resources were changed."
    displayName: Clean up AzCLIPS OIDC profile even after failure
    condition: and(always(), eq(variables['Agent.OS'], 'Linux'))
    env:
      AZCLIPS_HOME: $(Agent.TempDirectory)/azclips-scenario6-$(System.JobId)
