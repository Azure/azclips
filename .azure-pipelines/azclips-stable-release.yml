name: azclips-stable-release-$(SourceBranchName)-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  tags:
    include:
    # Stable release tags must use vX.Y.Z.yyyyMMddTHHmmssZ.
    - v*.*.*.*T*Z
    exclude:
    # Exclude prerelease-like tags even if they include a timestamp suffix.
    - v*-*
pr: none

variables:
- template: templates/variables.yml
- template: templates/dist/variables/packaging.yml
- template: templates/dist/variables/common.yml
- ${{ if eq(variables['System.TeamProject'], 'release') }}:
  - group: 'AME ESRP Variable Group'
- name: ReleasePipelineName
  value: azclips-stable-release
- name: SourceProject
  value: release
- name: GitHubTargetRepo
  value: Azure/azclips
- name: GitHubServiceConnection
  value: Azure
- name: GitHubReleasePrefix
  value: dist
- name: GitHubReleaseIsPrerelease
  value: false
- name: SignedArtifactName
  value: Final_Signed_Distribution
- name: ESRPServiceConnection
  value: ame_esrp_connection
- name: MacOSBundleId
  value: com.microsoft.cirrus.cli

stages:
- stage: Preflight
  displayName: Preflight Checks
  jobs:
  - job: EnsureReleaseProject
    displayName: Ensure Release Project Context
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: none
    - template: templates/dist/steps/validate-release-project.yml
      parameters:
        error_message: azclips-stable-release must run in the 'release' project.
    - bash: |
        set -euo pipefail

        source_branch="$(Build.SourceBranch)"
        source_version="$(Build.SourceVersion)"
        echo "Build.SourceBranch=$source_branch"
        echo "Build.SourceVersion=$source_version"

        if [[ ! "$source_branch" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{8}T[0-9]{6}Z$ ]]; then
          echo "ERROR: azclips-stable-release must run from a UTC timestamp-suffixed stable tag like v1.2.3.20260624T091500Z."
          echo "When manually rerunning, select the release tag as the pipeline version instead of a branch."
          exit 1
        fi

        if [[ -z "$source_version" ]]; then
          echo 'ERROR: Build.SourceVersion was not resolved for the selected tag.'
          exit 1
        fi
      displayName: Validate Stable Tag Input

- template: templates/dist/stages/build-unsigned-distribution.yml
  parameters:
    artifact_version_override: auto
    bump_type: patch
    release_channel: stable
    release_date: auto
    pr_number: auto
    sequence: auto
    ubuntu_pool: ${{ variables.ubuntu_pool }}
    windows_pool: ${{ variables.windows_pool }}
    macos_arm64_pool: ${{ variables.macos_arm64_pool }}
    macos_intel_pool: ${{ variables.macos_intel_pool }}
    final_artifact_name: Final_Build_Distribution

- template: templates/dist/stages/sign-with-esrp.yml
  parameters:
    windows_pool: ${{ variables.windows_pool }}
    ubuntu_pool: ${{ variables.ubuntu_pool }}
    macos_arm64_pool: ${{ variables.macos_arm64_pool }}
    macos_intel_pool: ${{ variables.macos_intel_pool }}
    dependency_stage:
    - BuildCommon
    - BuildLinux
    - BuildWindows
    - BuildMacOS
    - BuildPSModules
    - Test
    - Benchmark
    - ValidateLinux
    - ValidateWindows
    - ValidateMacOS
    - Finalize
    SourceProject: ${{ variables.SourceProject }}
    source_pipeline_name: ${{ variables.ReleasePipelineName }}
    source_build_id: $(Build.BuildId)
    source_artifact_name: Final_Build_Distribution
    source_artifact_source: current
    signed_artifact_name: ${{ variables.SignedArtifactName }}
    esrp_service_connection: ${{ variables.ESRPServiceConnection }}
    macos_bundle_id: ${{ variables.MacOSBundleId }}

- template: templates/dist/stages/verify-signed-distribution.yml
  parameters:
    ubuntu_pool: ${{ variables.ubuntu_pool }}
    dependency_stage: AssembleSignedArtifacts
    SourceProject: ${{ variables.SourceProject }}
    signed_pipeline_name: ${{ variables.ReleasePipelineName }}
    signed_build_id: $(Build.BuildId)
    signed_artifact_source: current
    signed_artifact_name: ${{ variables.SignedArtifactName }}

- template: templates/dist/stages/publish-to-github-release.yml
  parameters:
    ubuntu_pool: ${{ variables.ubuntu_pool }}
    dependency_stage: VerifySignedDistribution
    SourceProject: ${{ variables.SourceProject }}
    GitHubTargetRepo: ${{ variables.GitHubTargetRepo }}
    GitHubReleasePrefix: ${{ variables.GitHubReleasePrefix }}
    GitHubReleaseTagMode: stableVersion
    GitHubReleaseAllowOverwrite: 'false'
    GitHubReleaseIsPrerelease: ${{ variables.GitHubReleaseIsPrerelease }}
    GitHubServiceConnection: ${{ variables.GitHubServiceConnection }}
    signed_pipeline_name: ${{ variables.ReleasePipelineName }}
    signed_build_id: $(Build.BuildId)
    signed_artifact_source: current
    signed_artifact_name: ${{ variables.SignedArtifactName }}