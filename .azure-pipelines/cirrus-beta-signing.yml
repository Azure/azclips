name: cirrus-beta-signing-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: betaBuild
    project: public
    source: cirrus-beta-build
    trigger: true

parameters:
- name: signed_artifact_name
  displayName: 'Signed artifact name'
  type: string
  default: 'Distribution_Signed_Beta'
- name: ESRPServiceConnection
  displayName: 'ESRP Service Connection'
  type: string
  default: 'ame_esrp_connection'
- name: macos_bundle_id
  displayName: 'macOS bundle id for notarization'
  type: string
  default: 'com.microsoft.cirrus.cli'

variables:
- template: templates/variables.yml
- ${{ if eq(variables['System.TeamProject'], 'release') }}:
  - group: 'AME ESRP Variable Group'
- name: Codeql.Enabled
  value: false
- name: Codeql.SkipTaskAutoInjection
  value: true
- name: AdvancedSecurity.CodeQL.Enabled
  value: false
- name: ComponentGovernance.Enabled
  value: false
- name: skipComponentGovernanceDetection
  value: true
- name: runCodesignValidationInjection
  value: false
- name: CredScan.Enabled
  value: false
- name: BinSkim.Enabled
  value: false
- name: PoliCheck.Enabled
  value: false
- name: RoslynAnalyzers.Enabled
  value: false
- name: SdtReport.Enabled
  value: false
- name: TSAUpload.Enabled
  value: false
- name: NugetSecurityAnalysisWarningLevel
  value: none
- name: skipNugetSecurityAnalysis
  value: true

stages:
- stage: Preflight
  displayName: Preflight Checks
  jobs:
  - job: EnsureReleaseProject
    displayName: Ensure Release Project Context
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: none
    - bash: |
        set -euo pipefail
        echo "System.TeamProject=$(System.TeamProject)"
        if [[ "$(System.TeamProject)" != "release" ]]; then
          echo "ERROR: cirrus-beta-signing must run in the 'release' project for ESRP access."
          exit 1
        fi

        source_build_id='$(resources.pipeline.betaBuild.runID)'
        if [[ -z "$source_build_id" ]]; then
          echo 'ERROR: betaBuild resource run id was not resolved.'
          exit 1
        fi
        if ! [[ "$source_build_id" =~ ^[0-9]+$ ]]; then
          echo "ERROR: betaBuild resource run id must be numeric. Got: $source_build_id"
          exit 1
        fi

        echo "Beta source project: public"
        echo "Beta source pipeline: cirrus-beta-build"
        echo "Beta source build id: $source_build_id"
        echo "Beta source run name: $(resources.pipeline.betaBuild.runName)"
        echo "Beta source branch: $(resources.pipeline.betaBuild.sourceBranch)"
        echo "Beta source commit: $(resources.pipeline.betaBuild.sourceCommit)"
        echo "Beta source artifact: Distribution_Final"
      displayName: Validate Beta Build Resource

- template: templates/dist/stages/sign-with-esrp.yml
  parameters:
    windows_pool: ${{ variables.windows_pool }}
    ubuntu_pool: ${{ variables.ubuntu_pool }}
    macos_arm64_pool: ${{ variables.macos_arm64_pool }}
    macos_intel_pool: ${{ variables.macos_intel_pool }}
    dependency_stage: Preflight
    SourceProject: public
    source_pipeline_name: cirrus-beta-build
    source_build_id: $(resources.pipeline.betaBuild.runID)
    source_artifact_name: Distribution_Final
    signed_artifact_name: ${{ parameters.signed_artifact_name }}
    esrp_service_connection: ${{ parameters.ESRPServiceConnection }}
    macos_bundle_id: ${{ parameters.macos_bundle_id }}
