name: cirrus-build-$(SourceBranchName)-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
- name: artifact_version_override
  displayName: 'Artifact version override (auto = infer_from_code)'
  type: string
  default: 'auto'
- name: bump_type
  displayName: Version bump type
  type: string
  default: patch
  values:
  - patch
  - minor
  - major
- name: release_channel
  displayName: Release channel
  type: string
  default: auto
  values:
  - auto
  - pr-alpha
  - main-rc
  - stable
- name: release_date
  displayName: 'Release date override (auto = utc, or yyyyMMdd)'
  type: string
  default: 'utc'
- name: pr_number
  displayName: PR number for pr-alpha, or auto
  type: string
  default: 'auto'
- name: sequence
  displayName: Build sequence, or auto
  type: string
  default: 'auto'

variables:
- template: templates/variables.yml
- name: PackagingScriptsRoot
  value: $(Build.SourcesDirectory)/devops/scripts/packaging
- name: PackagingOutRoot
  value: $(Build.SourcesDirectory)/devops/out
- name: PackagingCommonOutRoot
  value: $(PackagingOutRoot)/common
- name: PackagingLinuxOutRoot
  value: $(PackagingOutRoot)/linux
- name: PackagingWindowsOutRoot
  value: $(PackagingOutRoot)/windows
- name: PackagingMacOSOutRoot
  value: $(PackagingOutRoot)/macos
- name: PackagingLinuxRid
  value: linux-x64
- name: PackagingWindowsRid
  value: win-x64
- name: PackagingMacOSRid
  value: osx-arm64
- name: DOTNET_CLI_TELEMETRY_OPTOUT
  value: 1
- name: DOTNET_NOLOGO
  value: 1
- name: Codeql.Enabled
  value: false
- name: Codeql.SkipTaskAutoInjection
  value: true
- name: AdvancedSecurity.CodeQL.Enabled
  value: false
- name: ComponentGovernance.Enabled
  value: false
- name: skipComponentGovernanceDetection
  value: true
- name: runCodesignValidationInjection
  value: false
- name: CredScan.Enabled
  value: false
- name: BinSkim.Enabled
  value: false
- name: PoliCheck.Enabled
  value: false
- name: RoslynAnalyzers.Enabled
  value: false
- name: SdtReport.Enabled
  value: false
- name: TSAUpload.Enabled
  value: false
- name: NugetSecurityAnalysisWarningLevel
  value: none
- name: skipNugetSecurityAnalysis
  value: true

stages:
- template: templates/dist/stages/init-resolve-version.yml
  parameters:
    artifact_version_override: ${{ parameters.artifact_version_override }}
    bump_type: ${{ parameters.bump_type }}
    release_channel: ${{ parameters.release_channel }}
    release_date: ${{ parameters.release_date }}
    pr_number: ${{ parameters.pr_number }}
    sequence: ${{ parameters.sequence }}
    ubuntu_pool: $(ubuntu_pool)

- stage: BuildCommon
  displayName: Build Common
  dependsOn: Init
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: templates/dist/jobs/build-common.yml
    parameters:
      ubuntu_pool: $(ubuntu_pool)
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)

- stage: BuildLinux
  displayName: Build Linux
  dependsOn:
  - Init
  - BuildCommon
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: templates/dist/jobs/build-linux.yml
    parameters:
      ubuntu_pool: $(ubuntu_pool)
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingLinuxOutRoot: $(PackagingLinuxOutRoot)

- stage: BuildWindows
  displayName: Build Windows
  dependsOn:
  - Init
  - BuildCommon
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: templates/dist/jobs/build-windows.yml
    parameters:
      windows_pool: $(windows_pool)
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingWindowsOutRoot: $(PackagingWindowsOutRoot)

- stage: BuildMacOS
  displayName: Build macOS
  dependsOn:
  - Init
  - BuildCommon
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: templates/dist/jobs/build-macos.yml
    parameters:
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingMacOSOutRoot: $(PackagingMacOSOutRoot)

- stage: Test
  displayName: Test
  dependsOn:
  - Init
  - BuildCommon
  condition: succeeded()
  jobs:
  - template: templates/dist/jobs/test-suite.yml
    parameters:
      ubuntu_pool: $(ubuntu_pool)

- stage: Benchmark
  displayName: Benchmark
  dependsOn:
  - Init
  - BuildCommon
  condition: succeeded()
  jobs:
  - template: templates/dist/jobs/benchmark-suite.yml
    parameters:
      ubuntu_pool: $(ubuntu_pool)

- stage: ValidateLinux
  displayName: Validate Linux
  dependsOn:
  - Init
  - BuildLinux
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: templates/dist/jobs/validate-linux.yml
    parameters:
      ubuntu_pool: $(ubuntu_pool)
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingLinuxOutRoot: $(PackagingLinuxOutRoot)

- stage: ValidateWindows
  displayName: Validate Windows
  dependsOn:
  - Init
  - BuildWindows
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: templates/dist/jobs/validate-windows.yml
    parameters:
      windows_pool: $(windows_pool)
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingWindowsOutRoot: $(PackagingWindowsOutRoot)

- stage: ValidateMacOS
  displayName: Validate macOS
  dependsOn:
  - Init
  - BuildMacOS
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: templates/dist/jobs/validate-macos.yml
    parameters:
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingMacOSOutRoot: $(PackagingMacOSOutRoot)

- stage: Finalize
  displayName: Finalize
  dependsOn:
  - BuildCommon
  - BuildLinux
  - BuildWindows
  - BuildMacOS
  - Test
  - Benchmark
  - ValidateLinux
  - ValidateWindows
  - ValidateMacOS
  condition: always()
  variables:
    BuildCommonResult: $[ stageDependencies.BuildCommon.BuildCommonOutputs.result ]
    BuildLinuxResult: $[ stageDependencies.BuildLinux.BuildLinuxOutput.result ]
    BuildWindowsResult: $[ stageDependencies.BuildWindows.BuildWindowsOutput.result ]
    BuildMacOSResult: $[ stageDependencies.BuildMacOS.BuildMacOSOutput.result ]
    TestResult: $[ stageDependencies.Test.UnitTests.result ]
    BenchmarkResult: $[ stageDependencies.Benchmark.BenchmarkSuite.result ]
    ValidateLinuxResult: $[ stageDependencies.ValidateLinux.LinuxValidation.result ]
    ValidateWindowsResult: $[ stageDependencies.ValidateWindows.WindowsValidation.result ]
    ValidateMacOSResult: $[ stageDependencies.ValidateMacOS.MacOSValidation.result ]
  jobs:
  - template: templates/dist/jobs/finalize-summary.yml
    parameters:
      ubuntu_pool: $(ubuntu_pool)
