name: cirrus-signing-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
- name: source_pipeline_name
  displayName: 'Source pipeline name'
  type: string
  default: 'cirrus-build'
- name: source_build_id
  displayName: 'Source build id'
  type: string
  default: '320494'
- name: signed_artifact_name
  displayName: 'Signed artifact name'
  type: string
  default: 'Distribution_Signed'
- name: ESRPServiceConnection
  displayName: 'ESRP Service Connection'
  type: string
  default: 'ame_esrp_connection'
- name: macos_bundle_id
  displayName: 'macOS bundle id for notarization'
  type: string
  default: 'com.microsoft.cirrus.cli'
- name: enable_esrp_nuget_verify
  displayName: 'Enable ESRP NuGet verify pass'
  type: boolean
  default: true
- name: enable_esrp_windows_verify
  displayName: 'Enable ESRP Windows verify pass'
  type: boolean
  default: true
- name: enable_windows_timestamp
  displayName: 'Enable Windows RFC3161 timestamp parameter'
  type: boolean
  default: true
- name: require_windows_strong_name
  displayName: 'Require strong-name verification for Cirrus DLLs'
  type: boolean
  default: false
- name: windows_sign_architectures
  displayName: 'Windows architectures to sign'
  type: object
  default:
  - x64
- name: linux_collect_architectures
  displayName: 'Linux architectures to collect'
  type: object
  default:
  - x64
  - arm64
variables:
- template: templates/variables.yml
- ${{ if eq(variables['System.TeamProject'], 'release') }}:
  - group: 'AME ESRP Variable Group'
- name: SourceProject
  value: release
- name: Codeql.Enabled
  value: false
- name: Codeql.SkipTaskAutoInjection
  value: true
- name: AdvancedSecurity.CodeQL.Enabled
  value: false
- name: ComponentGovernance.Enabled
  value: false
- name: skipComponentGovernanceDetection
  value: true
- name: runCodesignValidationInjection
  value: false
- name: CredScan.Enabled
  value: false
- name: BinSkim.Enabled
  value: false
- name: PoliCheck.Enabled
  value: false
- name: RoslynAnalyzers.Enabled
  value: false
- name: SdtReport.Enabled
  value: false
- name: TSAUpload.Enabled
  value: false
- name: NugetSecurityAnalysisWarningLevel
  value: none
- name: skipNugetSecurityAnalysis
  value: true

stages:
- stage: Preflight
  displayName: Preflight Checks
  jobs:
  - job: EnsureReleaseProject
    displayName: Ensure Release Project Context
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: none
    - bash: |
        set -euo pipefail
        echo "System.TeamProject=$(System.TeamProject)"
        if [[ "$(System.TeamProject)" != "release" ]]; then
          echo "ERROR: cirrus-signing must run in the 'release' project for ESRP access."
          exit 1
        fi
      displayName: Validate Team Project Is release
    - bash: |
        set -euo pipefail
        source_build_id='${{ parameters.source_build_id }}'
        if [[ -z "$source_build_id" ]]; then
          echo 'ERROR: source_build_id is required for signing provenance.'
          exit 1
        fi
        if ! [[ "$source_build_id" =~ ^[0-9]+$ ]]; then
          echo "ERROR: source_build_id must be numeric. Got: $source_build_id"
          exit 1
        fi
        if [[ "$source_build_id" == "0" ]]; then
          echo 'ERROR: source_build_id must be greater than zero.'
          exit 1
        fi
        echo "source_build_id validated: $source_build_id"
      displayName: Validate Source Build Provenance Input
    - bash: |
        set -euo pipefail
        template_file='.azure-pipelines/templates/dist/stages/sign-with-esrp.yml'
        if grep -nE 'useGlobalJson:[[:space:]]*true' "$template_file"; then
          echo "ERROR: Found disallowed UseDotNet useGlobalJson=true in $template_file"
          exit 1
        fi
        echo 'SDK pinning regression check passed (no useGlobalJson=true in signing template).'
      displayName: Enforce SDK Regression Guardrails

- template: templates/dist/stages/sign-with-esrp.yml
  parameters:
    windows_pool: $(windows_pool)
    ubuntu_pool: $(ubuntu_pool)
    macos_arm64_pool: $(macos_arm64_pool)
    macos_intel_pool: $(macos_intel_pool)
    dependency_stage: Preflight
    SourceProject: $(SourceProject)
    source_pipeline_name: ${{ parameters.source_pipeline_name }}
    source_build_id: ${{ parameters.source_build_id }}
    signed_artifact_name: ${{ parameters.signed_artifact_name }}
    esrp_service_connection: ${{ parameters.ESRPServiceConnection }}
    macos_bundle_id: ${{ parameters.macos_bundle_id }}
    esrp_enable_nuget_verify: ${{ parameters.enable_esrp_nuget_verify }}
    esrp_enable_windows_verify: ${{ parameters.enable_esrp_windows_verify }}
    esrp_enable_windows_timestamp: ${{ parameters.enable_windows_timestamp }}
    esrp_require_windows_strong_name: ${{ parameters.require_windows_strong_name }}
    windows_sign_architectures: ${{ parameters.windows_sign_architectures }}
    linux_collect_architectures: ${{ parameters.linux_collect_architectures }}
