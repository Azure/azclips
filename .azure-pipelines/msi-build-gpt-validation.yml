name: msi-build-gpt-validation-$(Date:yyyyMMdd).$(Rev:r)

trigger: none
pr: none

parameters:
  - name: configuration
    displayName: Build configuration
    type: string
    default: Release
    values:
      - Release
      - Debug

  - name: runtime_identifier
    displayName: Windows runtime identifier
    type: string
    default: win-x64
    values:
      - win-x64

  - name: package_version
    displayName: MSI version, for example 1.0.25.0
    type: string
    default: 1.0.0.0

  - name: publisher
    displayName: Dev signing certificate subject
    type: string
    default: CN=Cirrus Development

  - name: run_install_test
    displayName: Install, smoke test, assert registry/PATH, and uninstall MSI
    type: boolean
    default: true

variables:
  DOTNET_NOLOGO: true
  Codeql.Enabled: false
  Codeql.SkipTaskAutoInjection: true
  AdvancedSecurity.CodeQL.Enabled: false
  ComponentGovernance.Enabled: false
  skipComponentGovernanceDetection: true
  runCodesignValidationInjection: false
  CredScan.Enabled: false
  BinSkim.Enabled: false
  PoliCheck.Enabled: false
  RoslynAnalyzers.Enabled: false
  SdtReport.Enabled: false
  TSAUpload.Enabled: false
  NugetSecurityAnalysisWarningLevel: none
  skipNugetSecurityAnalysis: true
  CONFIGURATION: ${{ parameters.configuration }}
  RUNTIME_IDENTIFIER: ${{ parameters.runtime_identifier }}
  PACKAGE_VERSION_INPUT: ${{ parameters.package_version }}
  PACKAGE_PUBLISHER: ${{ parameters.publisher }}
  PRODUCT_NAME: Cirrus CLI
  MANUFACTURER: Cirrus Development
  UPGRADE_CODE: D71E4F9B-A5D8-4F16-A0A3-E0D74BB989B8
  COMMON_OUT_ROOT: $(Build.SourcesDirectory)\devops\out\common
  WINDOWS_OUT_ROOT: $(Build.SourcesDirectory)\devops\out\windows
  UNSIGNED_ARTIFACT_ROOT: $(Build.ArtifactStagingDirectory)\msi\unsigned
  SIGNED_ARTIFACT_ROOT: $(Build.ArtifactStagingDirectory)\msi\signed
  TEST_OUTPUT_ROOT: $(Build.ArtifactStagingDirectory)\msi\test
  AUDIT_DOWNLOAD_ROOT: $(Pipeline.Workspace)\cirrus-msi-audit
  UNSIGNED_DOWNLOAD_ROOT: $(Pipeline.Workspace)\cirrus-msi-unsigned
  SIGNED_DOWNLOAD_ROOT: $(Pipeline.Workspace)\cirrus-msi-signed

stages:
  - stage: BuildUnsigned
    displayName: Build unsigned MSI
    jobs:
      - job: build_unsigned_msi
        displayName: Build unsigned ${{ parameters.runtime_identifier }} MSI
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            clean: true

          - task: UseDotNet@2
            displayName: Setup .NET SDK
            inputs:
              packageType: sdk
              useGlobalJson: true
              workingDirectory: $(Build.SourcesDirectory)

          - pwsh: |
              if ([string]::IsNullOrWhiteSpace($env:RUNTIME_IDENTIFIER)) {
                throw 'runtime_identifier resolved to an empty value.'
              }

              if ([string]::IsNullOrWhiteSpace($env:CONFIGURATION)) {
                throw 'configuration resolved to an empty value.'
              }

              if ($env:RUNTIME_IDENTIFIER -ne 'win-x64') {
                throw "This MSI pipeline currently supports win-x64 only. Received '$env:RUNTIME_IDENTIFIER'."
              }

              if ($env:PACKAGE_VERSION_INPUT -notmatch '^\d{1,5}\.\d{1,5}\.\d{1,5}\.\d{1,5}$') {
                throw "MSI package_version must use four numeric components. Received '$env:PACKAGE_VERSION_INPUT'."
              }

              Write-Host "Configuration: $env:CONFIGURATION"
              Write-Host "Runtime identifier: $env:RUNTIME_IDENTIFIER"
              Write-Host "Package version: $env:PACKAGE_VERSION_INPUT"
              Write-Host "Common output root: $env:COMMON_OUT_ROOT"
              Write-Host "Windows output root: $env:WINDOWS_OUT_ROOT"
            displayName: Validate inputs

          - bash: |
              set -euo pipefail

              if command -v cygpath >/dev/null 2>&1; then
                common_out_root="$(cygpath -u "$COMMON_OUT_ROOT")"
              else
                common_out_root="$COMMON_OUT_ROOT"
              fi

              chmod +x devops/scripts/packaging/common/build_common.sh
              OUT_ROOT="$common_out_root" devops/scripts/packaging/common/build_common.sh
            displayName: Build common packaging outputs
            env:
              COMMON_OUT_ROOT: $(COMMON_OUT_ROOT)

          - pwsh: |
              choco install wixtoolset -y --no-progress

              $wixDirectory = Get-ChildItem ${env:ProgramFiles(x86)} -Directory -Filter 'WiX Toolset v3*' |
                Sort-Object Name -Descending |
                Select-Object -First 1

              if ($null -eq $wixDirectory) {
                throw 'WiX Toolset v3 was not found after installation.'
              }

              $wixBin = Join-Path $wixDirectory.FullName 'bin'
              foreach ($toolName in @('heat.exe', 'candle.exe', 'light.exe')) {
                $toolPath = Join-Path $wixBin $toolName
                if (-not (Test-Path $toolPath)) {
                  throw "Required WiX tool was not found: $toolPath"
                }
              }

              Write-Host "##vso[task.setvariable variable=WIX_BIN]$wixBin"
            displayName: Install WiX Toolset

          - pwsh: |
              $script = Join-Path $env:BUILD_SOURCESDIRECTORY 'devops/scripts/packaging/windows/build_win_msi.ps1'
              & $script `
                -Configuration $env:CONFIGURATION `
                -Rid $env:RUNTIME_IDENTIFIER `
                -ProductVersion $env:PACKAGE_VERSION_INPUT `
                -RepoRoot $env:BUILD_SOURCESDIRECTORY `
                -OutRoot $env:WINDOWS_OUT_ROOT `
                -CommonOutRoot $env:COMMON_OUT_ROOT `
                -WixBin $env:WIX_BIN

              if ($LASTEXITCODE -ne 0) {
                throw "build_win_msi.ps1 failed with exit code $LASTEXITCODE."
              }

              $msiPath = Join-Path $env:WINDOWS_OUT_ROOT "bin/Release/azv2-$env:RUNTIME_IDENTIFIER.msi"
              if (-not (Test-Path $msiPath)) {
                throw "MSI was not found after build: $msiPath"
              }
            displayName: Build unsigned MSI package

          - pwsh: |
              New-Item -ItemType Directory -Path $env:UNSIGNED_ARTIFACT_ROOT -Force | Out-Null

              $windowsReleaseRoot = Join-Path $env:WINDOWS_OUT_ROOT 'bin/Release'
              $windowsOutArtifact = Join-Path $env:UNSIGNED_ARTIFACT_ROOT 'windows'
              $commonOutArtifact = Join-Path $env:UNSIGNED_ARTIFACT_ROOT 'common'
              New-Item -ItemType Directory -Path $windowsOutArtifact, $commonOutArtifact -Force | Out-Null

              Copy-Item (Join-Path $windowsReleaseRoot '*') $windowsOutArtifact -Recurse -Force
              Copy-Item (Join-Path $env:COMMON_OUT_ROOT '*') $commonOutArtifact -Recurse -Force
            displayName: Collect unsigned MSI build outputs

          - task: PublishPipelineArtifact@1
            displayName: Publish unsigned MSI artifact
            inputs:
              targetPath: $(UNSIGNED_ARTIFACT_ROOT)
              artifact: cirrus-msi-validation-unsigned-${{ parameters.runtime_identifier }}
              publishLocation: pipeline

  - stage: AuditUnsigned
    displayName: Audit unsigned MSI payload and metadata
    dependsOn: BuildUnsigned
    jobs:
      - job: audit_unsigned_msi
        displayName: Audit unsigned MSI before signing
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: Download unsigned MSI artifact
            inputs:
              buildType: current
              artifactName: cirrus-msi-validation-unsigned-${{ parameters.runtime_identifier }}
              targetPath: $(AUDIT_DOWNLOAD_ROOT)

          - pwsh: |
              function Get-MsiProperty([string]$MsiPath, [string]$Name) {
                $installer = New-Object -ComObject WindowsInstaller.Installer
                $database = $installer.OpenDatabase($MsiPath, 0)
                $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = '$Name'")
                $view.Execute()
                $record = $view.Fetch()
                if ($null -eq $record) { return $null }
                return $record.StringData(1).Trim()
              }

              $msiPath = Join-Path $env:AUDIT_DOWNLOAD_ROOT "windows/azv2-$env:RUNTIME_IDENTIFIER.msi"
              if (-not (Test-Path $msiPath)) {
                throw "MSI was not found for audit: $msiPath"
              }

              $productName = Get-MsiProperty $msiPath 'ProductName'
              $manufacturer = Get-MsiProperty $msiPath 'Manufacturer'
              $productVersion = Get-MsiProperty $msiPath 'ProductVersion'
              $productCode = Get-MsiProperty $msiPath 'ProductCode'
              $upgradeCode = Get-MsiProperty $msiPath 'UpgradeCode'

              Write-Host "MSI ProductName: $productName"
              Write-Host "MSI Manufacturer: $manufacturer"
              Write-Host "MSI ProductVersion: $productVersion"
              Write-Host "MSI ProductCode: $productCode"
              Write-Host "MSI UpgradeCode: $upgradeCode"

              if ($productName -ne $env:PRODUCT_NAME) {
                throw "Expected ProductName '$env:PRODUCT_NAME' but found '$productName'."
              }

              if ($manufacturer -ne $env:MANUFACTURER) {
                throw "Expected Manufacturer '$env:MANUFACTURER' but found '$manufacturer'."
              }

              if ($productVersion -ne $env:PACKAGE_VERSION_INPUT) {
                throw "Expected ProductVersion '$env:PACKAGE_VERSION_INPUT' but found '$productVersion'."
              }

              if ($productCode -notmatch '^\{[0-9A-Fa-f-]{36}\}$') {
                throw "ProductCode is not a GUID: $productCode"
              }

              $expectedUpgradeCode = $env:UPGRADE_CODE.Trim().Trim('{}')
              $actualUpgradeCode = $upgradeCode.Trim().Trim('{}')
              if ($actualUpgradeCode -ne $expectedUpgradeCode) {
                throw "Expected UpgradeCode '$expectedUpgradeCode' but found '$actualUpgradeCode'. Raw MSI value was '$upgradeCode'."
              }
            displayName: Audit MSI property table

          - pwsh: |
              $configPath = Join-Path $env:BUILD_SOURCESDIRECTORY 'devops/scripts/packaging/config/bundled_ext.config'
              $expected = foreach ($line in Get-Content $configPath) {
                $name = ($line -replace '#.*$', '').Trim()
                if ([string]::IsNullOrWhiteSpace($name)) { continue }
                "Microsoft.Azure.Cirrus.Extensions.$name"
              }

              $builtinRoot = Join-Path $env:AUDIT_DOWNLOAD_ROOT 'common/builtin-publish'
              if (-not (Test-Path $builtinRoot)) {
                throw "builtin-publish artifact directory was not found: $builtinRoot"
              }

              $actual = Get-ChildItem $builtinRoot -Directory | Select-Object -ExpandProperty Name
              foreach ($extension in $expected) {
                if ($actual -notcontains $extension) {
                  throw "Expected bundled extension output missing from artifact: $extension"
                }

                $dllPath = Join-Path $builtinRoot "$extension/$extension.dll"
                if (-not (Test-Path $dllPath)) {
                  throw "Expected bundled extension DLL missing from artifact: $dllPath"
                }

                Write-Host "PASS: $extension output exists before MSI signing."
              }

              if ($actual.Count -lt $expected.Count) {
                throw "Expected at least $($expected.Count) bundled extension directories but found $($actual.Count)."
              }
            displayName: Audit bundled extension build outputs

  - stage: DevSign
    displayName: Dev-sign MSI placeholder
    dependsOn: AuditUnsigned
    jobs:
      - job: dev_sign_msi
        displayName: Dev-sign ${{ parameters.runtime_identifier }} MSI
        pool:
          vmImage: windows-latest
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: Download unsigned MSI artifact
            inputs:
              buildType: current
              artifactName: cirrus-msi-validation-unsigned-${{ parameters.runtime_identifier }}
              targetPath: $(UNSIGNED_DOWNLOAD_ROOT)

          - pwsh: |
              $artifactRoot = $env:UNSIGNED_DOWNLOAD_ROOT
              $windowsRoot = Join-Path $artifactRoot 'windows'
              $signedRoot = Join-Path $env:SIGNED_ARTIFACT_ROOT 'windows'
              $commonRoot = Join-Path $env:SIGNED_ARTIFACT_ROOT 'common'
              New-Item -ItemType Directory -Path $signedRoot, $commonRoot -Force | Out-Null

              Copy-Item (Join-Path $windowsRoot '*') $signedRoot -Recurse -Force
              Copy-Item (Join-Path $artifactRoot 'common\*') $commonRoot -Recurse -Force

              $msiPath = Join-Path $signedRoot "azv2-$env:RUNTIME_IDENTIFIER.msi"
              if (-not (Test-Path $msiPath)) {
                throw "MSI was not found for signing: $msiPath"
              }

              Write-Host "##vso[task.setvariable variable=MSI_PATH]$msiPath"
            displayName: Prepare signing inputs

          - pwsh: |
              $certificateDirectory = Join-Path $env:SIGNED_ARTIFACT_ROOT 'windows/certificate'
              New-Item -ItemType Directory -Path $certificateDirectory -Force | Out-Null

              $certificate = $null
              try {
                $certificate = New-SelfSignedCertificate `
                  -Type CodeSigningCert `
                  -Subject $env:PACKAGE_PUBLISHER `
                  -CertStoreLocation 'Cert:\CurrentUser\My' `
                  -KeyExportPolicy Exportable `
                  -KeyLength 2048 `
                  -NotAfter (Get-Date).AddYears(1)

                $certificatePath = Join-Path $certificateDirectory 'CirrusDevelopment.cer'
                Export-Certificate -Cert $certificate -FilePath $certificatePath | Out-Null

                $windowsKitsBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
                $sdkDirectory = Get-ChildItem $windowsKitsBin -Directory |
                  Sort-Object Name -Descending |
                  Where-Object { Test-Path (Join-Path $_.FullName 'x64\signtool.exe') } |
                  Select-Object -First 1

                if ($null -eq $sdkDirectory) {
                  throw 'Could not find SignTool.exe in the Windows SDK.'
                }

                $signTool = Join-Path $sdkDirectory.FullName 'x64\signtool.exe'
                & $signTool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /s My /sha1 $certificate.Thumbprint $env:MSI_PATH

                if ($LASTEXITCODE -ne 0) {
                  throw "SignTool failed with exit code $LASTEXITCODE."
                }

                Write-Host "##vso[task.setvariable variable=SIGNING_CERT_THUMBPRINT]$($certificate.Thumbprint)"
              }
              finally {
                if ($null -ne $certificate) {
                  Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -Force -ErrorAction SilentlyContinue
                }
              }
            displayName: Dev-sign MSI package

          - pwsh: |
              $signature = Get-AuthenticodeSignature -FilePath $env:MSI_PATH
              Write-Host "MSI signature status: $($signature.Status)"
              if ($null -eq $signature.SignerCertificate) {
                throw 'MSI is not signed.'
              }

              if ($signature.SignerCertificate.Thumbprint -ne $env:SIGNING_CERT_THUMBPRINT) {
                throw "MSI signer thumbprint '$($signature.SignerCertificate.Thumbprint)' did not match expected thumbprint '$env:SIGNING_CERT_THUMBPRINT'."
              }

              if ($signature.Status -ne 'Valid') {
                Write-Host "##vso[task.logissue type=warning]MSI has a signature from the expected dev certificate, but trust-chain validation returned '$($signature.Status)'. This is expected for a self-signed dev certificate on hosted agents."
              }
            displayName: Validate dev MSI signature

          - task: PublishPipelineArtifact@1
            displayName: Publish signed MSI artifact
            inputs:
              targetPath: $(SIGNED_ARTIFACT_ROOT)
              artifact: cirrus-msi-validation-signed-${{ parameters.runtime_identifier }}
              publishLocation: pipeline

  - stage: TestSigned
    displayName: Test signed MSI with installed-state assertions
    dependsOn: DevSign
    condition: and(succeeded(), eq('${{ parameters.run_install_test }}', 'true'))
    jobs:
      - job: test_signed_msi
        displayName: Install, assert, and uninstall signed MSI
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: Download signed MSI artifact
            inputs:
              buildType: current
              artifactName: cirrus-msi-validation-signed-${{ parameters.runtime_identifier }}
              targetPath: $(SIGNED_DOWNLOAD_ROOT)

          - pwsh: |
              $artifactRoot = $env:SIGNED_DOWNLOAD_ROOT
              $windowsRoot = Join-Path $artifactRoot 'windows'
              $commonRoot = Join-Path $artifactRoot 'common'

              $script = Join-Path $env:BUILD_SOURCESDIRECTORY 'devops/scripts/packaging/windows/test_bundled_plus_ext_msi.ps1'
              & $script `
                -OutRoot $windowsRoot `
                -CommonOutRoot $commonRoot `
                -SimRoot $env:TEST_OUTPUT_ROOT `
                -ProductVersion $env:PACKAGE_VERSION_INPUT `
                -KeepInstalled
            displayName: Install and smoke test MSI, keep installed for assertions

          - pwsh: |
              function Get-MsiProductCode([string]$Path) {
                $installer = New-Object -ComObject WindowsInstaller.Installer
                $database = $installer.OpenDatabase($Path, 0)
                $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'ProductCode'")
                $view.Execute()
                $record = $view.Fetch()
                if ($null -eq $record) { throw "ProductCode not found in $Path" }
                return $record.StringData(1).Trim()
              }

              function Invoke-MsiExec([string[]]$Arguments, [string]$FailureMessage) {
                $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList $Arguments
                if ($process.ExitCode -ne 0) {
                  throw "$FailureMessage ExitCode=$($process.ExitCode)"
                }
              }

              $msiPath = Join-Path $env:SIGNED_DOWNLOAD_ROOT "windows/azv2-$env:RUNTIME_IDENTIFIER.msi"
              $productCode = Get-MsiProductCode $msiPath
              $installPath = Join-Path ${env:ProgramFiles} 'Cirrus CLI'
              $azv2Exe = Join-Path $installPath 'azv2.exe'
              $installedExtensions = Join-Path $installPath 'Extensions'
              $installLog = Join-Path $env:TEST_OUTPUT_ROOT 'msi-install.log'
              $uninstallLog = Join-Path $env:TEST_OUTPUT_ROOT 'msi-uninstall.log'

              try {
                $arpKey = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$productCode"
                if (-not (Test-Path $arpKey)) {
                  throw "ARP uninstall key was not found: $arpKey"
                }

                $arp = Get-ItemProperty $arpKey
                if ($arp.DisplayName -ne $env:PRODUCT_NAME) {
                  throw "Expected ARP DisplayName '$env:PRODUCT_NAME' but found '$($arp.DisplayName)'."
                }

                if ($arp.DisplayVersion -ne $env:PACKAGE_VERSION_INPUT) {
                  throw "Expected ARP DisplayVersion '$env:PACKAGE_VERSION_INPUT' but found '$($arp.DisplayVersion)'."
                }

                $cirrusRegistry = Get-ItemProperty 'HKLM:\Software\Cirrus CLI' -ErrorAction Stop
                $installDir = $cirrusRegistry.InstallDir
                if ([string]::IsNullOrWhiteSpace($installDir)) {
                  throw 'HKLM:\Software\Cirrus CLI InstallDir was empty.'
                }

                if ($cirrusRegistry.Version -ne $env:PACKAGE_VERSION_INPUT) {
                  throw "HKLM:\Software\Cirrus CLI Version '$($cirrusRegistry.Version)' did not match '$env:PACKAGE_VERSION_INPUT'."
                }

                if (-not (Test-Path $installDir)) {
                  throw "Recorded InstallDir does not exist: $installDir"
                }

                if (-not (Test-Path $azv2Exe)) {
                  throw "azv2.exe missing from install path: $azv2Exe"
                }

                $machinePath = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').Path
                $pathEntries = $machinePath -split ';' | ForEach-Object { $_.TrimEnd('\') }
                if ($pathEntries -notcontains $installPath.TrimEnd('\')) {
                  throw "Machine PATH does not contain install path: $installPath"
                }

                $configPath = Join-Path $env:BUILD_SOURCESDIRECTORY 'devops/scripts/packaging/config/bundled_ext.config'
                $expectedBuiltins = foreach ($line in Get-Content $configPath) {
                  $name = ($line -replace '#.*$', '').Trim()
                  if ([string]::IsNullOrWhiteSpace($name)) { continue }
                  "Microsoft.Azure.Cirrus.Extensions.$name"
                }

                $actualBuiltins = Get-ChildItem $installedExtensions -Directory | Select-Object -ExpandProperty Name
                foreach ($extension in $expectedBuiltins) {
                  if ($actualBuiltins -notcontains $extension) {
                    throw "Installed built-in extension directory missing: $extension"
                  }
                }

                if (-not (Test-Path $installLog)) {
                  throw "MSI install log was not found: $installLog"
                }

                Write-Host 'PASS: ARP DisplayName, DisplayVersion, InstallDir, registry Version, PATH, built-ins, and install log validated.'
              }
              finally {
                if (Test-Path $azv2Exe) {
                  Write-Host "Uninstalling validation MSI: $productCode"
                  Invoke-MsiExec -Arguments @('/x', $productCode, '/quiet', '/norestart', '/L*V', "`"$uninstallLog`"") -FailureMessage "FAIL: MSI uninstall failed. See $uninstallLog."
                }
              }

              if (Test-Path $azv2Exe) {
                throw "azv2.exe still exists after uninstall: $azv2Exe"
              }

              if (Test-Path $arpKey) {
                throw "ARP uninstall key still exists after uninstall: $arpKey"
              }

              $machinePathAfterUninstall = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').Path
              $pathEntriesAfterUninstall = $machinePathAfterUninstall -split ';' | ForEach-Object { $_.TrimEnd('\') }
              if ($pathEntriesAfterUninstall -contains $installPath.TrimEnd('\')) {
                throw "Machine PATH still contains install path after uninstall: $installPath"
              }

              if (-not (Test-Path $uninstallLog)) {
                throw "MSI uninstall log was not found: $uninstallLog"
              }

              Write-Host 'PASS: MSI uninstalled cleanly and removed ARP/PATH entries.'
            displayName: Validate installed registry/PATH state and uninstall
            condition: succeededOrFailed()

          - pwsh: |
              $logsRoot = Join-Path $env:SIGNED_ARTIFACT_ROOT 'logs'
              New-Item -ItemType Directory -Path $logsRoot -Force | Out-Null

              if (Test-Path $env:TEST_OUTPUT_ROOT) {
                Copy-Item (Join-Path $env:TEST_OUTPUT_ROOT '*') $logsRoot -Recurse -Force
              }
            displayName: Collect MSI test logs
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: Publish MSI test logs
            condition: succeededOrFailed()
            inputs:
              targetPath: $(SIGNED_ARTIFACT_ROOT)
              artifact: cirrus-msi-validation-test-${{ parameters.runtime_identifier }}
              publishLocation: pipeline
