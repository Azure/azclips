# Azure DevOps equivalent of .github/workflows/msix-build-opus.yml
#
# Builds a multi-architecture MSIX bundle for the Cirrus CLI (`azv2`).
#   * Multi-arch matrix (x64 + arm64) bundled into a single .msixbundle
#   * Automated version stamping (manifest + assembly) from the run number
#   * Optional signing (skipped unless PFX pipeline secrets are present)
#   * Optional Windows App Certification Kit (WACK) validation
#   * Generates an .appinstaller for auto-update distribution
#   * On a tag ref (refs/tags/v*) — also publishes a GitHub Release
#
# Trigger: manual only.  Run via "Run pipeline" in the Azure DevOps UI or
#   az pipelines run --name msix-build-opus --branch naga/test-pr \
#     --parameters version=1.0.123.0 runWack=false
#
# Required pipeline variables (mark BOTH as secret to enable signing):
#   Base64_Encoded_Pfx   - base64 of your code-signing .pfx
#   Pfx_Key              - .pfx password
#
# Optional pipeline variable + service connection for GitHub Release on tag:
#   GitHubServiceConnection - name of an Azure DevOps "GitHub" service connection

name: msix-build-opus_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
  - name: version
    displayName: "4-part version (e.g. 1.0.123.0). Leave blank to auto-derive from run number."
    type: string
    default: ""
  - name: runWack
    displayName: "Run Windows App Certification Kit validation"
    type: boolean
    default: false
  - name: publishGitHubRelease
    displayName: "Publish a GitHub Release with the bundle (requires gitHubConnection)."
    type: boolean
    default: false
  - name: gitHubConnection
    displayName: "Name of a GitHub service connection. Only used when publishGitHubRelease=true."
    type: string
    default: "github.com_naga-nandyala"

variables:
  CLI_PROJECT: src/CLI/Core.Cli.csproj
  EXT_PROJECT: src/Extensions/Extension/Extensions.Extension.csproj
  APPX_MANIFEST: src/CLI/Core.Cli.appxmanifest
  ASSETS_DIR: assets
  PACKAGE_NAME: cirrus-cli
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  Codeql.Enabled: false
  Codeql.SkipTaskAutoInjection: true
  AdvancedSecurity.CodeQL.Enabled: false
  ComponentGovernance.Enabled: false
  skipComponentGovernanceDetection: true
  runCodesignValidationInjection: false
  CredScan.Enabled: false
  BinSkim.Enabled: false
  PoliCheck.Enabled: false
  RoslynAnalyzers.Enabled: false
  SdtReport.Enabled: false
  TSAUpload.Enabled: false
  NugetSecurityAnalysisWarningLevel: none
  skipNugetSecurityAnalysis: true

stages:
  # ----------------------------------------------------------------------------
  # 1. Compute version once so every arch stamps the same value.
  # ----------------------------------------------------------------------------
  - stage: Version
    displayName: Resolve version
    jobs:
      - job: Calc
        displayName: Calculate version
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: |
              set -euo pipefail
              userInput="${{ parameters.version }}"
              if [[ -n "$userInput" ]]; then
                v="$userInput"
              elif [[ "$(Build.SourceBranch)" == refs/tags/v* ]]; then
                raw="${BUILD_SOURCEBRANCH#refs/tags/v}"
                IFS='.' read -ra parts <<< "$raw"
                while [ ${#parts[@]} -lt 4 ]; do parts+=("0"); done
                v="${parts[0]}.${parts[1]}.${parts[2]}.${parts[3]}"
              else
                v="1.0.$(Build.BuildId).0"
              fi
              echo "Resolved version: $v"
              echo "##vso[task.setvariable variable=version;isOutput=true]$v"
            name: calc
            displayName: Compute version

  # ----------------------------------------------------------------------------
  # 2. Build a self-contained publish + per-arch .msix.
  # ----------------------------------------------------------------------------
  - stage: Build
    displayName: Build per-arch MSIX
    dependsOn: Version
    variables:
      VERSION: $[ stageDependencies.Version.Calc.outputs['calc.version'] ]
    jobs:
      - job: BuildMsix
        displayName: Build MSIX
        pool:
          vmImage: windows-latest
        strategy:
          matrix:
            x64:
              arch: x64
              rid: win-x64
            arm64:
              arch: arm64
              rid: win-arm64
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Install .NET (from global.json)
            inputs:
              packageType: sdk
              useGlobalJson: true

          - powershell: |
              $manifest = "$(APPX_MANIFEST)"
              $xml = [xml](Get-Content $manifest)
              $xml.Package.Identity.Version = "$(VERSION)"
              $xml.Package.Identity.ProcessorArchitecture = "$(arch)"
              $xml.Save((Resolve-Path $manifest))
              Write-Host "Stamped manifest version=$(VERSION) arch=$(arch)"
            displayName: Stamp version in manifest

          - script: dotnet restore cirrus.slnx
            displayName: Restore

          - powershell: |
              dotnet publish "$(CLI_PROJECT)" `
                -c "$(CONFIGURATION)" `
                -r "$(rid)" `
                --self-contained true `
                -p:Version=$(VERSION) `
                -p:AssemblyVersion=$(VERSION) `
                -p:FileVersion=$(VERSION) `
                -o "publish/$(rid)"
              if ($LASTEXITCODE -ne 0) { throw "dotnet publish (CLI) failed ($LASTEXITCODE)" }
            displayName: Publish CLI (self-contained)

          - powershell: |
              dotnet publish "$(EXT_PROJECT)" `
                -c "$(CONFIGURATION)" `
                -r "$(rid)" `
                -o "publish/$(rid)/Extensions/Extension"
              if ($LASTEXITCODE -ne 0) { throw "dotnet publish (Extension) failed ($LASTEXITCODE)" }
            displayName: Publish Extension

          - powershell: |
              Copy-Item "$(APPX_MANIFEST)" "publish/$(rid)/AppxManifest.xml" -Force
              if (Test-Path "$(ASSETS_DIR)") {
                $dest = "publish/$(rid)/Assets"
                New-Item -ItemType Directory -Force -Path $dest | Out-Null
                Copy-Item "$(ASSETS_DIR)/*" $dest -Recurse -Force
              } else {
                Write-Warning "Assets dir '$(ASSETS_DIR)' not found — manifest may reference missing logos."
              }
            displayName: Stage MSIX layout

          - powershell: |
              $root = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
              $bin = Get-ChildItem $root -Directory |
                Where-Object { $_.Name -match '^10\.' } |
                Sort-Object Name -Descending |
                Select-Object -First 1
              if (-not $bin) { throw "No Windows 10 SDK found under $root" }
              $hostTools = Join-Path $bin.FullName 'x64'
              Write-Host "##vso[task.setvariable variable=MAKEAPPX]$hostTools\MakeAppx.exe"
              Write-Host "##vso[task.setvariable variable=SIGNTOOL]$hostTools\signtool.exe"
            displayName: Locate Windows 10 SDK tooling

          - powershell: |
              New-Item -ItemType Directory -Force -Path "bin/$(CONFIGURATION)" | Out-Null
              $out = "bin/$(CONFIGURATION)/$(PACKAGE_NAME)-$(VERSION)-$(arch).msix"
              & "$(MAKEAPPX)" pack /d "publish/$(rid)" /p "$out" /nv
              if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed ($LASTEXITCODE)" }
              Write-Host "Produced: $out"
            displayName: Pack MSIX

          - task: PublishPipelineArtifact@1
            displayName: Publish per-arch MSIX artifact
            inputs:
              targetPath: bin/$(CONFIGURATION)
              artifact: msix-$(arch)
              publishLocation: pipeline

  # ----------------------------------------------------------------------------
  # 3. Combine per-arch MSIX files into a single .msixbundle, optionally sign,
  #    optionally validate with WACK, and (on tags) generate .appinstaller +
  #    publish a GitHub Release.
  # ----------------------------------------------------------------------------
  - stage: BundleSignRelease
    displayName: Bundle, sign & release
    dependsOn:
      - Version
      - Build
    variables:
      VERSION: $[ stageDependencies.Version.Calc.outputs['calc.version'] ]
    jobs:
      - job: BundleSignRelease
        displayName: Bundle / sign / release
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: Download per-arch MSIX artifacts
            inputs:
              patterns: msix-*/**
              path: $(Pipeline.Workspace)/incoming

          - powershell: |
              $stage = "bundle-input"
              New-Item -ItemType Directory -Force -Path $stage | Out-Null
              Get-ChildItem "$(Pipeline.Workspace)/incoming" -Recurse -Filter *.msix | ForEach-Object {
                Copy-Item $_.FullName (Join-Path $stage $_.Name) -Force
              }
              Get-ChildItem $stage
            displayName: Stage MSIX files for bundling

          - powershell: |
              $root = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
              $bin = Get-ChildItem $root -Directory |
                Where-Object { $_.Name -match '^10\.' } |
                Sort-Object Name -Descending |
                Select-Object -First 1
              if (-not $bin) { throw "No Windows 10 SDK found under $root" }
              $hostTools = Join-Path $bin.FullName 'x64'
              Write-Host "##vso[task.setvariable variable=MAKEAPPX]$hostTools\MakeAppx.exe"
              Write-Host "##vso[task.setvariable variable=SIGNTOOL]$hostTools\signtool.exe"
              $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
              Write-Host "##vso[task.setvariable variable=APPCERT]$appcert"
            displayName: Locate SDK tooling

          - powershell: |
              New-Item -ItemType Directory -Force -Path "bin/$(CONFIGURATION)" | Out-Null
              $out = "bin/$(CONFIGURATION)/$(PACKAGE_NAME)-$(VERSION).msixbundle"
              & "$(MAKEAPPX)" bundle /d bundle-input /p "$out" /bv $(VERSION)
              if ($LASTEXITCODE -ne 0) { throw "MakeAppx bundle failed ($LASTEXITCODE)" }
              Write-Host "##vso[task.setvariable variable=BUNDLE_PATH]$out"
              Write-Host "Bundle: $out"
            displayName: Create .msixbundle

          # ------------------------------------------------------------------
          # Signing — runs only when both pipeline secret variables are set.
          # Define these in the pipeline as SECRET variables:
          #   Base64_Encoded_Pfx, Pfx_Key
          # Swap this for the Azure Trusted Signing task when ready.
          # ------------------------------------------------------------------
          - powershell: |
              $b64 = $env:SIGN_PFX_B64
              $pwd = $env:SIGN_PFX_PWD
              # Treat unset/empty/whitespace OR unexpanded macro literals as "not configured".
              if ([string]::IsNullOrWhiteSpace($b64) -or [string]::IsNullOrWhiteSpace($pwd) `
                  -or $b64 -like '*$(*)*' -or $pwd -like '*$(*)*') {
                Write-Host "##vso[task.logissue type=warning]Signing skipped - Base64_Encoded_Pfx / Pfx_Key pipeline variables not set. Bundle is UNSIGNED and cannot be installed without sideload trust."
                exit 0
              }
              # Strip whitespace/newlines that can sneak in when pasting base64.
              $b64 = ($b64 -replace '\s','')
              $pfx = "signing.pfx"
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($b64))
              & "$(SIGNTOOL)" sign `
                /f $pfx /p $pwd `
                /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
                "$(BUNDLE_PATH)"
              $rc = $LASTEXITCODE
              Remove-Item $pfx -Force
              if ($rc -ne 0) { throw "signtool failed ($rc)" }
            displayName: Sign bundle (PFX, if configured)
            env:
              SIGN_PFX_B64: $(Base64_Encoded_Pfx)
              SIGN_PFX_PWD: $(Pfx_Key)

          # ------------------------------------------------------------------
          # Optional WACK validation (heavy; only when requested).
          # ------------------------------------------------------------------
          - powershell: |
              if (-not (Test-Path "$(APPCERT)")) {
                Write-Warning "WACK not installed on this runner ($(APPCERT)). Skipping."
                exit 0
              }
              & "$(APPCERT)" reset
              & "$(APPCERT)" test -appxpackagepath "$(BUNDLE_PATH)" -reportoutputpath wack-report.xml
              if ($LASTEXITCODE -ne 0) { throw "WACK failed ($LASTEXITCODE) — see wack-report.xml" }
            displayName: Windows App Certification Kit
            condition: and(succeeded(), eq('${{ parameters.runWack }}', 'true'))

          - task: PublishPipelineArtifact@1
            displayName: Upload WACK report
            condition: and(succeededOrFailed(), eq('${{ parameters.runWack }}', 'true'))
            inputs:
              targetPath: wack-report.xml
              artifact: wack-report
              publishLocation: pipeline

          # ------------------------------------------------------------------
          # .appinstaller — only meaningful when we have a stable download URL.
          # On tag refs we emit one pointing at the GitHub Release asset URL.
          # ------------------------------------------------------------------
          - powershell: |
              $bundleName  = Split-Path "$(BUNDLE_PATH)" -Leaf
              $tag         = "$(Build.SourceBranchName)"
              $repo        = "$(Build.Repository.Name)"
              $baseUrl     = "https://github.com/$repo/releases/download/$tag"
              $publisher   = "CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US"
              $version     = "$(VERSION)"
              $packageName = "$(PACKAGE_NAME)"
              $appinstaller = "bin/$(CONFIGURATION)/$packageName.appinstaller"
              $lines = @(
                '<?xml version="1.0" encoding="utf-8"?>',
                "<AppInstaller xmlns=`"http://schemas.microsoft.com/appx/appinstaller/2018`" Version=`"$version`" Uri=`"$baseUrl/$packageName.appinstaller`">",
                "  <MainBundle Name=`"Cirrus.CLI`" Version=`"$version`" Publisher=`"$publisher`" Uri=`"$baseUrl/$bundleName`" />",
                '  <UpdateSettings>',
                '    <OnLaunch HoursBetweenUpdateChecks="12" ShowPrompt="true" UpdateBlocksActivation="false" />',
                '    <AutomaticBackgroundTask />',
                '  </UpdateSettings>',
                '</AppInstaller>'
              )
              $lines | Set-Content -Path $appinstaller -Encoding utf8
              Get-Content $appinstaller
            displayName: Generate .appinstaller (tags only)
            condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))

          - task: PublishPipelineArtifact@1
            displayName: Upload bundle artifact
            inputs:
              targetPath: bin/$(CONFIGURATION)
              artifact: $(PACKAGE_NAME)-$(VERSION)
              publishLocation: pipeline

          # ------------------------------------------------------------------
          # Publish a GitHub Release — fully opt-in at queue time.
          # Emitted only when BOTH:
          #   * publishGitHubRelease = true
          #   * gitHubConnection is a non-empty service connection name
          # (ADO validates service connection names at compile time, so we
          # gate at template-time rather than via runtime `condition:`.)
          # The runtime tag-ref check has been removed so you can also
          # publish from a branch — you decide when you trigger.
          # ------------------------------------------------------------------
          - ${{ if and(eq(parameters.publishGitHubRelease, true), ne(parameters.gitHubConnection, '')) }}:
            - task: GitHubRelease@1
              displayName: Create GitHub Release
              inputs:
                gitHubConnection: ${{ parameters.gitHubConnection }}
                repositoryName: $(Build.Repository.Name)
                action: create
                target: $(Build.SourceVersion)
                tagSource: gitTag
                title: Cirrus CLI $(Build.SourceBranchName)
                releaseNotesSource: inline
                releaseNotesInline: "Automated release from pipeline $(Build.BuildNumber)."
                assets: |
                  bin/$(CONFIGURATION)/*.msixbundle
                  bin/$(CONFIGURATION)/*.appinstaller
                addChangeLog: true
