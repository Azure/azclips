name: naga-macos-tarball-assembly-test-$(Date:yyyyMMdd).$(Rev:r)

trigger: none
pr: none

parameters:
  - name: source_project
    displayName: Source project containing signing artifacts
    type: string
    default: release

  - name: source_pipeline_definition_id
    displayName: Source signing pipeline definition id
    type: string
    default: '1218'

  - name: source_build_id
    displayName: Source signing build id
    type: string
    default: '320736'

  - name: signing_inputs_artifact_prefix
    displayName: macOS signing inputs artifact prefix
    type: string
    default: macos-signing-inputs

  - name: notarized_bundles_artifact_prefix
    displayName: macOS signed/notarization bundle artifact prefix
    type: string
    default: macos-notarization-bundles

variables:
- template: templates/variables.yml
- name: Codeql.Enabled
  value: false
- name: Codeql.SkipTaskAutoInjection
  value: true
- name: AdvancedSecurity.CodeQL.Enabled
  value: false
- name: ComponentGovernance.Enabled
  value: false
- name: skipComponentGovernanceDetection
  value: true
- name: runCodesignValidationInjection
  value: false
- name: CredScan.Enabled
  value: false
- name: BinSkim.Enabled
  value: false
- name: PoliCheck.Enabled
  value: false
- name: RoslynAnalyzers.Enabled
  value: false
- name: SdtReport.Enabled
  value: false
- name: TSAUpload.Enabled
  value: false
- name: NugetSecurityAnalysisWarningLevel
  value: none
- name: skipNugetSecurityAnalysis
  value: true

jobs:
- job: assemble_macos_tarballs
  displayName: Assemble macOS tarballs from imported signing artifacts
  strategy:
    matrix:
      arm64:
        MacOSArchitecture: arm64
        MacOSVmImage: ${{ variables.macos_arm64_pool }}
      x64:
        MacOSArchitecture: x64
        MacOSVmImage: ${{ variables.macos_intel_pool }}
  pool:
    vmImage: $(MacOSVmImage)
  steps:
  - checkout: none

  - bash: |
      set -euo pipefail
      if [[ -z '${{ parameters.source_pipeline_definition_id }}' ]]; then
        echo 'ERROR: source_pipeline_definition_id is required.'
        exit 1
      fi
      if [[ -z '${{ parameters.source_build_id }}' ]]; then
        echo 'ERROR: source_build_id is required.'
        exit 1
      fi
      if ! [[ '${{ parameters.source_build_id }}' =~ ^[0-9]+$ ]]; then
        echo "ERROR: source_build_id must be numeric. Got: ${{ parameters.source_build_id }}"
        exit 1
      fi
    displayName: Validate source signing run inputs

  - task: DownloadPipelineArtifact@2
    displayName: Download macOS signing inputs ($(MacOSArchitecture))
    inputs:
      buildType: specific
      project: ${{ parameters.source_project }}
      definition: ${{ parameters.source_pipeline_definition_id }}
      buildVersionToDownload: specific
      pipelineId: ${{ parameters.source_build_id }}
      artifactName: ${{ parameters.signing_inputs_artifact_prefix }}-$(MacOSArchitecture)
      targetPath: $(Pipeline.Workspace)/macos-signing-inputs

  - task: DownloadPipelineArtifact@2
    displayName: Download macOS notarized bundles ($(MacOSArchitecture))
    inputs:
      buildType: specific
      project: ${{ parameters.source_project }}
      definition: ${{ parameters.source_pipeline_definition_id }}
      buildVersionToDownload: specific
      pipelineId: ${{ parameters.source_build_id }}
      artifactName: ${{ parameters.notarized_bundles_artifact_prefix }}-$(MacOSArchitecture)
      targetPath: $(Pipeline.Workspace)/macos-notarized-bundles

  - bash: |
      set -euo pipefail
      input_root="$(Pipeline.Workspace)/macos-signing-inputs"
      notarized_bundle_root="$(Pipeline.Workspace)/macos-notarized-bundles"
      final_contents_root="$(Build.ArtifactStagingDirectory)/final-contents"
      output_root="$(Build.ArtifactStagingDirectory)/signed-macos"
      mkdir -p "$final_contents_root" "$output_root"

      if [[ ! -d "$input_root/tarballs" ]]; then
        echo "ERROR: macOS signing inputs did not contain tarballs directory: $input_root/tarballs"
        find "$input_root" -maxdepth 3 -print | sort
        exit 1
      fi

      if [[ ! -d "$notarized_bundle_root" ]]; then
        echo "ERROR: macOS notarized bundle artifact directory missing: $notarized_bundle_root"
        exit 1
      fi

      verification_errors=0
      tarball_count=0
      for tarball in "$input_root"/tarballs/*.tar.gz; do
        [[ -f "$tarball" ]] || continue
        tarball_count=$((tarball_count + 1))
        tarball_name=$(basename "$tarball")
        base_name="${tarball_name%.tar.gz}"
        content_dir="$final_contents_root/$base_name"
        notarized_zip="$notarized_bundle_root/$base_name-signed.zip"
        mach_o_count=0

        rm -rf "$content_dir"
        mkdir -p "$content_dir"

        if [[ ! -f "$notarized_zip" ]]; then
          echo "ERROR: Notarized macOS bundle not found: $notarized_zip"
          echo 'Available notarized bundle files:'
          find "$notarized_bundle_root" -maxdepth 2 -type f -print | sort
          verification_errors=1
          continue
        fi

        unzip -q "$notarized_zip" -d "$content_dir"
        echo "Extracted notarized macOS bundle: $(basename "$notarized_zip")"

        find "$content_dir" -name "*.so" -exec chmod +x {} \;
        find "$content_dir" -name "*.dylib" -exec chmod +x {} \;
        chmod +x "$content_dir/azv2" 2>/dev/null || true
        chmod +x "$content_dir/bin/azv2" 2>/dev/null || true
        chmod +x "$content_dir/libexec/bin/azv2" 2>/dev/null || true

        while IFS= read -r -d '' candidate; do
          if ! file "$candidate" | grep -q 'Mach-O'; then
            continue
          fi

          mach_o_count=$((mach_o_count + 1))
          if ! codesign -v "$candidate" 2>/dev/null; then
            echo "ERROR: Basic codesign verification failed: $candidate"
            verification_errors=1
          fi
          if ! codesign --verify --deep --strict "$candidate" 2>/dev/null; then
            echo "ERROR: Strict codesign verification failed: $candidate"
            verification_errors=1
          fi
          signature_details=$(codesign -dvvv "$candidate" 2>&1 || true)
          if ! printf '%s\n' "$signature_details" | grep -Eq 'Authority=.*Developer ID|TeamIdentifier=UBF8T346G9'; then
            echo "ERROR: Developer ID certificate missing: $candidate"
            printf '%s\n' "$signature_details" | grep -E '^(Authority|TeamIdentifier|Identifier|CDHash)=' || true
            verification_errors=1
          fi
        done < <(find "$content_dir" -type f -print0)

        if [[ "$mach_o_count" -eq 0 ]]; then
          echo "ERROR: No Mach-O binaries found in notarized payload: $base_name"
          verification_errors=1
        fi

        tar -czf "$output_root/$base_name.tar.gz" --preserve-permissions -C "$content_dir" .
        shasum -a 256 "$output_root/$base_name.tar.gz" > "$output_root/$base_name.tar.gz.sha256"
        echo "Created signed macOS tarball: $base_name.tar.gz"
      done

      if [[ "$tarball_count" -eq 0 ]]; then
        echo "ERROR: No source macOS tarballs found in $input_root/tarballs"
        exit 1
      fi

      if [[ "$verification_errors" -ne 0 ]]; then
        exit 1
      fi
    displayName: Verify and assemble signed macOS tarballs

  - task: PublishPipelineArtifact@1
    displayName: Publish assembled macOS tarballs ($(MacOSArchitecture))
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/signed-macos
      artifact: naga-macos-tarball-assembly-test-$(MacOSArchitecture)
      publishLocation: pipeline
