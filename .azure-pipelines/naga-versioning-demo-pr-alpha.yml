name: cirrus-versioning-demo-pr-alpha-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

pr:
  branches:
    include:
    - '*'

variables:
- name: Codeql.Enabled
  value: false
- name: Codeql.SkipTaskAutoInjection
  value: true
- name: AdvancedSecurity.CodeQL.Enabled
  value: false
- name: ComponentGovernance.Enabled
  value: false
- name: skipComponentGovernanceDetection
  value: true
- name: runCodesignValidationInjection
  value: false
- name: CredScan.Enabled
  value: false
- name: BinSkim.Enabled
  value: false
- name: PoliCheck.Enabled
  value: false
- name: RoslynAnalyzers.Enabled
  value: false
- name: SdtReport.Enabled
  value: false
- name: TSAUpload.Enabled
  value: false
- name: NugetSecurityAnalysisWarningLevel
  value: none
- name: skipNugetSecurityAnalysis
  value: true
- name: DemoPipelineName
  value: naga-versioning-demo
- name: DemoBranch
  value: naga/test-pr
- name: BaseVersion
  value: 0.1.0
- name: BumpType
  value: patch

stages:
- stage: QueuePrAlphaDemo
  displayName: Queue PR Alpha Versioning Demo
  jobs:
  - job: QueueDemo
    displayName: Queue Demo Pipeline
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        set -euo pipefail

        pr_number="${SYSTEM_PULLREQUEST_PULLREQUESTNUMBER:-}"
        if [[ -z "$pr_number" ]]; then
          pr_number="${SYSTEM_PULLREQUEST_PULLREQUESTID:-}"
        fi

        if [[ -z "$pr_number" ]]; then
          echo "ERROR: Could not derive PR number from System.PullRequest variables."
          exit 1
        fi

        echo "Derived PR number: $pr_number"
        echo "##vso[task.setvariable variable=DerivedPrNumber]$pr_number"
      displayName: Derive PR number

    - template: templates/versioning-demo/queue-versioning-demo.yml
      parameters:
        demo_pipeline_name: $(DemoPipelineName)
        demo_branch: $(DemoBranch)
        base_version: $(BaseVersion)
        bump_type: $(BumpType)
        release_channel: pr-alpha
        release_date: utc
        pr_number: $(DerivedPrNumber)
        sequence: $(Build.BuildId)