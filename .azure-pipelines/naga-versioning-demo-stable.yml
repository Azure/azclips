name: cirrus-versioning-demo-stable-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
- name: Codeql.Enabled
  value: false
- name: Codeql.SkipTaskAutoInjection
  value: true
- name: AdvancedSecurity.CodeQL.Enabled
  value: false
- name: ComponentGovernance.Enabled
  value: false
- name: skipComponentGovernanceDetection
  value: true
- name: runCodesignValidationInjection
  value: false
- name: CredScan.Enabled
  value: false
- name: BinSkim.Enabled
  value: false
- name: PoliCheck.Enabled
  value: false
- name: RoslynAnalyzers.Enabled
  value: false
- name: SdtReport.Enabled
  value: false
- name: TSAUpload.Enabled
  value: false
- name: NugetSecurityAnalysisWarningLevel
  value: none
- name: skipNugetSecurityAnalysis
  value: true
- name: DemoPipelineName
  value: naga-versioning-demo
- name: DemoBranch
  value: naga/test-pr
- name: BaseVersion
  value: 0.1.0
- name: BumpType
  value: patch

stages:
- stage: QueueStableDemo
  displayName: Queue Stable Versioning Demo
  jobs:
  - job: QueueDemo
    displayName: Queue Demo Pipeline
    pool:
      vmImage: ubuntu-latest
    steps:
    - template: templates/versioning-demo/queue-versioning-demo.yml
      parameters:
        demo_pipeline_name: $(DemoPipelineName)
        demo_branch: $(DemoBranch)
        base_version: $(BaseVersion)
        bump_type: $(BumpType)
        release_channel: stable
        release_date: utc
        pr_number: '1'
        sequence: $(Build.BuildId)