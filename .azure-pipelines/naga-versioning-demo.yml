name: cirrus-versioning-template-demo-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
- template: templates/variables.yml
- name: Codeql.Enabled
  value: false
- name: Codeql.SkipTaskAutoInjection
  value: true
- name: AdvancedSecurity.CodeQL.Enabled
  value: false
- name: ComponentGovernance.Enabled
  value: false
- name: skipComponentGovernanceDetection
  value: true
- name: runCodesignValidationInjection
  value: false
- name: CredScan.Enabled
  value: false
- name: BinSkim.Enabled
  value: false
- name: PoliCheck.Enabled
  value: false
- name: RoslynAnalyzers.Enabled
  value: false
- name: SdtReport.Enabled
  value: false
- name: TSAUpload.Enabled
  value: false
- name: NugetSecurityAnalysisWarningLevel
  value: none
- name: skipNugetSecurityAnalysis
  value: true

stages:
- template: templates/versioning/stages/resolve-version.yml
  parameters:
    stage_name: DemoPrAlpha
    display_name: Demo PR Alpha Version
    ubuntu_pool: $(ubuntu_pool)
    bump_type: patch
    release_channel: pr-alpha
    release_date: utc
    pr_number: '257'
    sequence: auto
    publish_output: true
    artifact_name: versioning-demo-pr-alpha

- template: templates/versioning/stages/resolve-version.yml
  parameters:
    stage_name: DemoMainRc
    display_name: Demo Main RC Version
    ubuntu_pool: $(ubuntu_pool)
    bump_type: patch
    release_channel: main-rc
    release_date: utc
    sequence: auto
    publish_output: true
    artifact_name: versioning-demo-main-rc

- template: templates/versioning/stages/resolve-version.yml
  parameters:
    stage_name: DemoStable
    display_name: Demo Stable Version
    ubuntu_pool: $(ubuntu_pool)
    bump_type: patch
    release_channel: stable
    release_date: utc
    sequence: auto
    publish_output: true
    artifact_name: versioning-demo-stable