name: cirrus-versioning-stable-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    exclude:
    - '*'
  tags:
    include:
    - 'v*'

pr: none

variables:
- template: templates/variables.yml
- name: Codeql.Enabled
  value: false
- name: Codeql.SkipTaskAutoInjection
  value: true
- name: AdvancedSecurity.CodeQL.Enabled
  value: false
- name: ComponentGovernance.Enabled
  value: false
- name: skipComponentGovernanceDetection
  value: true
- name: runCodesignValidationInjection
  value: false
- name: CredScan.Enabled
  value: false
- name: BinSkim.Enabled
  value: false
- name: PoliCheck.Enabled
  value: false
- name: RoslynAnalyzers.Enabled
  value: false
- name: SdtReport.Enabled
  value: false
- name: TSAUpload.Enabled
  value: false
- name: NugetSecurityAnalysisWarningLevel
  value: none
- name: skipNugetSecurityAnalysis
  value: true

stages:
- template: templates/versioning/stages/resolve-version.yml
  parameters:
    stage_name: ResolveVersion
    display_name: Resolve Stable Version
    ubuntu_pool: $(ubuntu_pool)
    bump_type: patch
    release_channel: stable
    release_date: utc
    sequence: auto
    publish_output: true
    artifact_name: versioning-stable

- stage: BuildSignPublishPreview
  displayName: Build Sign Publish Preview
  dependsOn: ResolveVersion
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.ResolveVersion.Resolve.outputs['SetVersion.ArtifactVersion'] ]
    PipelineFlow: $[ stageDependencies.ResolveVersion.Resolve.outputs['SetVersion.PipelineFlow'] ]
    ReleaseChannel: $[ stageDependencies.ResolveVersion.Resolve.outputs['SetVersion.ReleaseChannel'] ]
  jobs:
  - job: ShowStableReleaseIntent
    displayName: Show Stable Release Intent
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: none
    - script: |
        set -euo pipefail
        echo "ArtifactVersion=$(ArtifactVersion)"
        echo "ReleaseChannel=$(ReleaseChannel)"
        echo "PipelineFlow=$(PipelineFlow)"
        echo "Stable-triggered production flow would continue with build, signing, and GitHub release publishing here."
      displayName: Show resolved stable version