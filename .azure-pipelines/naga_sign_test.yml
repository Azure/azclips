name: naga-sign-test-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: alphaBuild
    project: public
    source: azclips-alpha-build
    trigger: none

variables:
- template: templates/variables.yml
- ${{ if eq(variables['System.TeamProject'], 'release') }}:
  - group: 'AME ESRP Variable Group'
- name: SourceProject
  value: ${{ variables.public_project }}
- name: SourcePipelineName
  value: azclips-alpha-build
- name: SourceArtifactName
  value: Final_Build_Distribution
- name: ESRPServiceConnection
  value: ${{ variables.esrp_service_connection }}

stages:
- stage: Preflight
  displayName: Validate Signing Test Input
  jobs:
  - job: ValidateInput
    displayName: Validate Selected Alpha Build
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: none
    - template: templates/dist/steps/validate-release-project.yml
      parameters:
        error_message: naga_sign_test must run in the 'release' project for ESRP access.
    - bash: |
        set -euo pipefail
        source_build_id='$(resources.pipeline.alphaBuild.runID)'

        if ! [[ "$source_build_id" =~ ^[0-9]+$ ]]; then
          echo "ERROR: Select an azclips-alpha-build resource version when queueing this pipeline. Got: $source_build_id"
          exit 1
        fi

        echo "Alpha source project: $(SourceProject)"
        echo "Alpha source pipeline: $(SourcePipelineName)"
        echo "Alpha source build id: $source_build_id"
        echo "Alpha source run name: $(resources.pipeline.alphaBuild.runName)"
        echo "Alpha source branch: $(resources.pipeline.alphaBuild.sourceBranch)"
        echo "Alpha source commit: $(resources.pipeline.alphaBuild.sourceCommit)"
        echo "Alpha source artifact: $(SourceArtifactName)"
      displayName: Validate Alpha Build Source

- stage: SignLinuxTrial
  displayName: Sign Linux Checksum Manifest Trial
  dependsOn: Preflight
  jobs:
  - job: SignLinuxTarballs
    displayName: Sign All Linux Tarball Checksums
    pool:
      vmImage: $(ubuntu_pool)
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Alpha Build Artifacts
      inputs:
        buildType: specific
        project: $(SourceProject)
        definition: $(SourcePipelineName)
        buildVersionToDownload: specific
        pipelineId: $(resources.pipeline.alphaBuild.runID)
        artifact: $(SourceArtifactName)
        path: $(Pipeline.Workspace)/alpha-build
    - bash: |
        set -euo pipefail
        source_root="$(Pipeline.Workspace)/alpha-build"
        signing_root="$(Build.ArtifactStagingDirectory)/linux-sign-test"
        mkdir -p "$signing_root"

        candidates=()
        while IFS= read -r candidate; do
          name="$(basename "$candidate")"
          if [[ "$name" =~ ^azcli(-lean)?-.+-(linux-(x64|arm64)|linux-musl-(x64|arm64))\.tar\.gz$ ]]; then
            candidates+=("$candidate")
          fi
        done < <(find "$source_root" -type f -name 'azcli-*.tar.gz' | sort)

        if [[ ${#candidates[@]} -ne 8 ]]; then
          echo "ERROR: Expected eight Linux CLI tarballs (full and lean for four RIDs); found ${#candidates[@]}."
          printf '  %s\n' "${candidates[@]}"
          exit 1
        fi

        for candidate in "${candidates[@]}"; do
          cp "$candidate" "$signing_root/"
        done

        cd "$signing_root"
        mapfile -t target_names < <(find . -maxdepth 1 -type f -name 'azcli-*.tar.gz' -printf '%f\n' | sort)
        if [[ ${#target_names[@]} -ne 8 ]]; then
          echo 'ERROR: Linux tarball basenames were not unique after collection.'
          exit 1
        fi

        sha256sum "${target_names[@]}" > SHA256SUMS
        cp SHA256SUMS SHA256SUMS.sig

        echo 'Prepared signing input for these Linux tarballs:'
        cat SHA256SUMS
      displayName: Prepare All Linux Checksums
    - task: EsrpCodeSigning@6
      displayName: ESRP Sign Linux Checksum Manifest
      inputs:
        ConnectedServiceName: $(ESRPServiceConnection)
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        batchSignPolicyFile: ''
        ciPolicyFile: ''
        FolderPath: '$(Build.ArtifactStagingDirectory)/linux-sign-test'
        UseMinimatch: true
        Pattern: 'SHA256SUMS.sig'
        signConfigType: inlineSignParams
        inlineOperation: |
          [
            {
              "KeyCode": "CP-500207-Pgp",
              "OperationCode": "LinuxSign",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]
    - bash: |
        set -euo pipefail
        signing_root="$(Build.ArtifactStagingDirectory)/linux-sign-test"
        cd "$signing_root"

        checksum_output="$(sha256sum --check SHA256SUMS)"
        printf '%s\n' "$checksum_output"
        checked_count="$(printf '%s\n' "$checksum_output" | awk '/: OK$/ { count++ } END { print count + 0 }')"
        if [[ "$checked_count" -ne 8 ]]; then
          echo "ERROR: Expected eight verified Linux tarballs; got $checked_count."
          exit 1
        fi
        if cmp --silent SHA256SUMS SHA256SUMS.sig; then
          echo 'ERROR: ESRP did not replace SHA256SUMS.sig with a detached signature.'
          exit 1
        fi

        gpg --batch --list-packets SHA256SUMS.sig
        echo 'ESRP produced a structurally valid OpenPGP detached signature.'
        ls -lh
      displayName: Validate ESRP Signing Result
    - task: PublishPipelineArtifact@1
      displayName: Publish Linux Signing Test Output
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/linux-sign-test'
        artifact: linux-sign-test
        publishLocation: pipeline
