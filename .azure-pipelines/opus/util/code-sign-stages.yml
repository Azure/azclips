## Multi-stage code-signing template (single ADO release project model).
##
## All stages run inside the same `release` project as the entry pipeline.
## Mirrors the structural shape of `templates/dist/stages/sign-with-esrp.yml`
## but adds opus enhancements:
##   - PowerShell + JS script signing (CP-230012)
##   - Third-party DLL signing with `Append: /as` (CP-231522)
##   - MSI signing (when present)
##   - Per-pass `SigntoolVerify` and RFC3161 timestamp
##   - Test-DLL exclusion patterns
##   - PowerShell-based release manifest (no Python heredoc)
##
## Stages emitted:
##   1. SignNugetArtifacts        (windows pool)
##   2. SignWindowsArtifacts      (windows pool)
##   3. CollectLinuxArtifacts     (ubuntu pool)
##   4. CollectMacOSArtifacts     (ubuntu pool)
##   5. ValidateNugetArtifacts    (windows pool)
##   6. ValidateWindowsArtifacts  (windows pool)
##   7. ValidateLinuxArtifacts    (ubuntu pool)
##   8. ValidateMacOSArtifacts    (ubuntu pool)
##   9. AssembleSignedArtifacts   (ubuntu pool)

parameters:
  - name: windows_pool
    type: string
    default: 'windows-latest'
  - name: ubuntu_pool
    type: string
    default: 'ubuntu-latest'
  - name: dependency_stage
    type: string
    default: 'Preflight'
  - name: source_pipeline_name
    type: string
    default: 'cirrus-build'
  - name: source_build_id
    type: string
    default: ''
  - name: signed_artifact_name
    type: string
    default: 'Distribution_Signed'
  - name: esrp_service_connection
    type: string
    default: ''
  - name: esrp_nuget_keycode
    type: string
    default: 'CP-401405'
  - name: esrp_authenticode_keycode
    type: string
    default: 'CP-230012'
  - name: esrp_third_party_keycode
    type: string
    default: 'CP-231522'
  - name: rfc3161_timestamp
    type: string
    default: '/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256'

stages:

# ---------------------------------------------------------------- 1. NuGet
- stage: SignNugetArtifacts
  displayName: Sign NuGet Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: SignNuget
    displayName: Sign NuGet Artifacts
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        version: '8.0.x'
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: $(System.TeamProject)
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - task: PowerShell@2
      displayName: Filter NuGet Release Artifacts
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = "$(Pipeline.Workspace)/unsigned-all"
          $targetRoot = "$(Pipeline.Workspace)/unsigned"
          Remove-Item $targetRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null
          $allNupkgs = Get-ChildItem -Path $sourceRoot -Recurse -File |
              Where-Object { $_.Name -like '*.nupkg' -and $_.Name -notlike '*.snupkg' }
          $selected = $allNupkgs | Where-Object { $_.Name -like 'Microsoft.Azure.Cirrus*.nupkg' }
          if (-not $selected) {
            throw "No Cirrus NuGet release artifacts found under $sourceRoot (expected Microsoft.Azure.Cirrus*.nupkg)"
          }
          foreach ($asset in $selected) {
            Copy-Item $asset.FullName -Destination (Join-Path $targetRoot $asset.Name) -Force
          }
          Write-Host "Selected $($selected.Count) Cirrus NuGet release artifacts."
    - task: PowerShell@2
      displayName: Stage Signing Inputs
      inputs:
        targetType: filePath
        filePath: .azure-pipelines/opus/scripts/Stage-SigningInputs.ps1
        arguments: >-
          -UnsignedRoot "$(Pipeline.Workspace)/unsigned"
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PowerShell@2
      displayName: List NuGet Artifacts To Be Signed
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $nupkgRoot = "$(Pipeline.Workspace)/signing-work/nupkg"
          $files = Get-ChildItem -Path $nupkgRoot -File | Sort-Object Name
          if (-not $files) { throw "No .nupkg files found for signing in $nupkgRoot" }
          Write-Host "NuGet signing candidates ($($files.Count))"
          foreach ($file in $files) { Write-Host ("  {0}  ({1} bytes)" -f $file.Name, $file.Length) }
    - task: EsrpCodeSigning@5
      displayName: Sign NuGet Packages [NuGetSign + NuGetVerify]
      condition: eq(variables['HasNupkg'], 'true')
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/signing-work/nupkg'
        UseMinimatch: true
        Pattern: 'Microsoft.Azure.Cirrus*.nupkg'
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_nuget_keycode }}",
              "OperationCode": "NuGetSign",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            },
            {
              "KeyCode": "${{ parameters.esrp_nuget_keycode }}",
              "OperationCode": "NuGetVerify",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]
    - task: PowerShell@2
      displayName: Verify Signed NuGet Outputs
      inputs:
        targetType: filePath
        filePath: .azure-pipelines/opus/scripts/Verify-Signatures.ps1
        arguments: >-
          -Root "$(Pipeline.Workspace)/signing-work/nupkg"
          -Mode ReleaseDrop
        pwsh: true
    - task: PowerShell@2
      displayName: Collect Signed NuGet Outputs
      inputs:
        targetType: filePath
        filePath: .azure-pipelines/opus/scripts/Collect-SignedArtifacts.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PublishPipelineArtifact@1
      displayName: Publish Signed NuGet Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-release
        artifact: signed-nuget
        publishLocation: pipeline

# ------------------------------------------------------------ 2. Windows
- stage: SignWindowsArtifacts
  displayName: Sign Windows Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: SignWindows
    displayName: Sign Windows Artifacts
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        version: '8.0.x'
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: $(System.TeamProject)
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - task: PowerShell@2
      displayName: Filter Windows Release Artifacts
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = "$(Pipeline.Workspace)/unsigned-all"
          $targetRoot = "$(Pipeline.Workspace)/unsigned"
          Remove-Item $targetRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null
          $selected = Get-ChildItem -Path $sourceRoot -Recurse -File |
              Where-Object { $_.Name -like '*win-*.zip' -or $_.Extension -eq '.msi' }
          if (-not $selected) { throw "No Windows release artifacts found under $sourceRoot" }
          foreach ($asset in $selected) {
            Copy-Item $asset.FullName -Destination (Join-Path $targetRoot $asset.Name) -Force
          }
          Write-Host "Selected $($selected.Count) Windows release artifacts."
    - task: PowerShell@2
      displayName: Stage Signing Inputs
      inputs:
        targetType: filePath
        filePath: .azure-pipelines/opus/scripts/Stage-SigningInputs.ps1
        arguments: >-
          -UnsignedRoot "$(Pipeline.Workspace)/unsigned"
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PowerShell@2
      displayName: List Windows Artifacts To Be Signed
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $windowsRoot = "$(Pipeline.Workspace)/signing-work/windows-extracted"
          if (-not (Test-Path $windowsRoot)) { throw "Windows signing input folder not found: $windowsRoot" }
          $files = Get-ChildItem -Path $windowsRoot -Recurse -File | Where-Object {
              $_.Extension -in '.dll','.exe','.ps1','.psm1','.psd1','.ps1xml','.js' -and
              $_.Name -notlike '*.Test.dll' -and $_.Name -notlike '*Test*.dll' -and
              $_.Name -notlike '*.Tests.dll'
          } | Sort-Object FullName
          if (-not $files) { throw "No Windows files found for signing in $windowsRoot" }
          Write-Host "Windows signing candidates ($($files.Count))"
          foreach ($file in $files) {
            $rel = $file.FullName.Substring($windowsRoot.Length).TrimStart('\','/')
            Write-Host ("  {0}  ({1} bytes)" -f $rel, $file.Length)
          }

    # 1P binaries: Cirrus*, Az.*, azv2.exe (excludes tests via pattern below)
    - task: EsrpCodeSigning@5
      displayName: Sign Windows Binaries [1P Authenticode + Verify]
      condition: eq(variables['HasWindowsPayload'], 'true')
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
        UseMinimatch: true
        Pattern: |
          **/azv2.exe
          **/Microsoft.Azure.Cirrus*.dll
          **/Microsoft.Azure.Cirrus*.exe
          **/Cirrus*.dll
          **/Az.*.dll
          !**/*.Test.dll
          !**/*Test*.dll
          !**/*.Tests.dll
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolSign",
              "Parameters": {
                "OpusName": "Microsoft",
                "OpusInfo": "http://www.microsoft.com",
                "FileDigest": "/fd SHA256",
                "PageHash": "/NPH",
                "TimeStamp": "${{ parameters.rfc3161_timestamp }}"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            },
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolVerify",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    # PowerShell + JS scripts (Authenticode, no PageHash)
    - task: EsrpCodeSigning@5
      displayName: Sign Windows Scripts [Authenticode + Verify]
      condition: eq(variables['HasWindowsPayload'], 'true')
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
        UseMinimatch: true
        Pattern: |
          **/*.ps1
          **/*.psm1
          **/*.psd1
          **/*.ps1xml
          **/*.js
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolSign",
              "Parameters": {
                "OpusName": "Microsoft",
                "OpusInfo": "http://www.microsoft.com",
                "FileDigest": "/fd SHA256",
                "TimeStamp": "${{ parameters.rfc3161_timestamp }}"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            },
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolVerify",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    # 3P DLLs (Newtonsoft.Json, Azure.*, etc.) — Append /as
    - task: EsrpCodeSigning@5
      displayName: Sign Third-Party DLLs [Append /as + Verify]
      condition: eq(variables['HasWindowsPayload'], 'true')
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
        UseMinimatch: true
        Pattern: |
          **/*.dll
          !**/azv2.exe
          !**/Microsoft.Azure.Cirrus*.dll
          !**/Microsoft.Azure.Cirrus*.exe
          !**/Cirrus*.dll
          !**/Az.*.dll
          !**/*.Test.dll
          !**/*Test*.dll
          !**/*.Tests.dll
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_third_party_keycode }}",
              "OperationCode": "SigntoolSign",
              "Parameters": {
                "OpusName": "Microsoft",
                "OpusInfo": "http://www.microsoft.com",
                "Append": "/as",
                "FileDigest": "/fd SHA256",
                "PageHash": "/NPH",
                "TimeStamp": "${{ parameters.rfc3161_timestamp }}"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            },
            {
              "KeyCode": "${{ parameters.esrp_third_party_keycode }}",
              "OperationCode": "SigntoolVerify",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    # MSI installer (when present)
    - task: EsrpCodeSigning@5
      displayName: Sign MSI Installer [Authenticode + Verify]
      condition: eq(variables['HasMsi'], 'true')
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/signing-work/msi'
        UseMinimatch: true
        Pattern: '*.msi'
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolSign",
              "Parameters": {
                "OpusName": "Microsoft",
                "OpusInfo": "http://www.microsoft.com",
                "FileDigest": "/fd SHA256",
                "TimeStamp": "${{ parameters.rfc3161_timestamp }}"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            },
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolVerify",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    - task: PowerShell@2
      displayName: Verify Windows Payload Signatures
      inputs:
        targetType: filePath
        filePath: .azure-pipelines/opus/scripts/Verify-Signatures.ps1
        arguments: >-
          -Root "$(Pipeline.Workspace)/signing-work/windows-extracted"
          -Mode WindowsPayload
        pwsh: true
    - task: PowerShell@2
      displayName: Repack Signed Windows Zips
      inputs:
        targetType: filePath
        filePath: .azure-pipelines/opus/scripts/Repack-WindowsZips.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PowerShell@2
      displayName: Collect Signed MSI Outputs
      inputs:
        targetType: filePath
        filePath: .azure-pipelines/opus/scripts/Collect-SignedArtifacts.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PublishPipelineArtifact@1
      displayName: Publish Signed Windows Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-release
        artifact: signed-windows
        publishLocation: pipeline

# ------------------------------------------------------------- 3. Linux
- stage: CollectLinuxArtifacts
  displayName: Collect Linux Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: CollectLinux
    displayName: Collect Linux Release Artifacts
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: $(System.TeamProject)
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - bash: |
        set -euo pipefail
        source_root="$(Pipeline.Workspace)/unsigned-all"
        out_dir="$(Build.ArtifactStagingDirectory)/collected-linux"
        mkdir -p "$out_dir"
        mapfile -t linux_assets < <(
          find "$source_root" -type f \( -name '*linux*.tar.gz' -o -name '*linux*.zip' \) | sort
        )
        if [[ ${#linux_assets[@]} -eq 0 ]]; then
          echo "ERROR: No Linux release artifacts found under $source_root"
          exit 1
        fi
        printf 'Linux release artifacts (%s):\n' "${#linux_assets[@]}"
        printf '  %s\n' "${linux_assets[@]}"
        for asset in "${linux_assets[@]}"; do cp "$asset" "$out_dir/"; done
      displayName: Collect Linux Release Artifacts
    - task: PublishPipelineArtifact@1
      displayName: Publish Collected Linux Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/collected-linux
        artifact: collected-linux
        publishLocation: pipeline

# ------------------------------------------------------------- 4. macOS
- stage: CollectMacOSArtifacts
  displayName: Collect macOS Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: CollectMac
    displayName: Collect macOS Release Artifacts
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: $(System.TeamProject)
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - bash: |
        set -euo pipefail
        source_root="$(Pipeline.Workspace)/unsigned-all"
        out_dir="$(Build.ArtifactStagingDirectory)/collected-macos"
        mkdir -p "$out_dir"
        mapfile -t mac_assets < <(
          find "$source_root" -type f \( -name '*mac*.tar.gz' -o -name '*macos*.tar.gz' -o -name '*osx*.tar.gz' -o -name '*darwin*.tar.gz' -o -name '*mac*.zip' -o -name '*macos*.zip' \) | sort
        )
        if [[ ${#mac_assets[@]} -eq 0 ]]; then
          echo "ERROR: No macOS release artifacts found under $source_root"
          exit 1
        fi
        printf 'macOS release artifacts (%s):\n' "${#mac_assets[@]}"
        printf '  %s\n' "${mac_assets[@]}"
        for asset in "${mac_assets[@]}"; do cp "$asset" "$out_dir/"; done
      displayName: Collect macOS Release Artifacts
    - task: PublishPipelineArtifact@1
      displayName: Publish Collected macOS Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/collected-macos
        artifact: collected-macos
        publishLocation: pipeline

# ----------------------------------------------- 5. Validate NuGet
- stage: ValidateNugetArtifacts
  displayName: Validate NuGet Artifacts
  dependsOn: SignNugetArtifacts
  jobs:
  - job: ValidateNuget
    displayName: Validate Signed NuGet Packages
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: none
    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        version: '8.0.x'
    - task: DownloadPipelineArtifact@2
      displayName: Download Signed NuGet Artifacts
      inputs:
        buildType: current
        artifactName: signed-nuget
        targetPath: $(Pipeline.Workspace)/signed-nuget
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $nupkgs = Get-ChildItem -Path "$(Pipeline.Workspace)/signed-nuget" -Recurse -File -Filter '*.nupkg' |
            Where-Object { $_.Name -notlike '*.snupkg' }
        if (-not $nupkgs) { throw 'No signed .nupkg files found in signed-nuget artifact.' }
        foreach ($pkg in $nupkgs) {
          dotnet nuget verify --all $pkg.FullName | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "NuGet verification failed for $($pkg.Name)" }
        }
      displayName: Verify NuGet Signatures (dotnet nuget verify --all)

# --------------------------------------------- 6. Validate Windows
- stage: ValidateWindowsArtifacts
  displayName: Validate Windows Artifacts
  dependsOn: SignWindowsArtifacts
  jobs:
  - job: ValidateWindows
    displayName: Validate Signed Windows Payloads
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Signed Windows Artifacts
      inputs:
        buildType: current
        artifactName: signed-windows
        targetPath: $(Pipeline.Workspace)/signed-windows
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $verifyRoot = "$(Pipeline.Workspace)/verify-win"
        New-Item -ItemType Directory -Path $verifyRoot -Force | Out-Null
        $zips = Get-ChildItem -Path "$(Pipeline.Workspace)/signed-windows" -Recurse -File |
            Where-Object { $_.Name -like '*win-*.zip' }
        if (-not $zips) { throw 'No signed Windows zip files found in signed-windows artifact.' }
        foreach ($zip in $zips) {
          $extract = Join-Path $verifyRoot $zip.BaseName
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force
        }
        $failures = New-Object System.Collections.Generic.List[string]
        $candidates = Get-ChildItem -Path $verifyRoot -Recurse -File | Where-Object {
            $_.Extension -in '.dll','.exe','.ps1','.psm1','.psd1','.ps1xml' -and
            $_.Name -notlike '*.Test.dll' -and $_.Name -notlike '*Test*.dll' -and
            $_.Name -notlike '*.Tests.dll'
        }
        foreach ($f in $candidates) {
          $sig = Get-AuthenticodeSignature -FilePath $f.FullName
          if ($sig.Status -ne 'Valid') {
            $failures.Add("[$($sig.Status)] $($f.FullName)")
          }
        }
        # Also verify any signed MSIs
        $msis = Get-ChildItem -Path "$(Pipeline.Workspace)/signed-windows" -File -Filter '*.msi' -ErrorAction SilentlyContinue
        foreach ($m in $msis) {
          $sig = Get-AuthenticodeSignature -FilePath $m.FullName
          if ($sig.Status -ne 'Valid') {
            $failures.Add("[$($sig.Status)] $($m.FullName)")
          }
        }
        if ($failures.Count -gt 0) {
          Write-Error ("Authenticode verification failed for {0} item(s):`n{1}" -f $failures.Count, ($failures -join "`n"))
          throw 'Authenticode verification failed.'
        }
        Write-Host "Verified $($candidates.Count) binaries/scripts and $($msis.Count) MSIs."
      displayName: Verify Windows Authenticode Signatures

# ------------------------------------------- 7. Validate Linux/macOS
- stage: ValidateLinuxArtifacts
  displayName: Validate Linux Artifacts
  dependsOn: CollectLinuxArtifacts
  jobs:
  - job: ValidateLinux
    displayName: Validate Linux Artifact Set
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Collected Linux Artifacts
      inputs:
        buildType: current
        artifactName: collected-linux
        targetPath: $(Pipeline.Workspace)/collected-linux
    - bash: |
        set -euo pipefail
        count=$(find "$(Pipeline.Workspace)/collected-linux" -type f \( -name '*linux*.tar.gz' -o -name '*linux*.zip' \) | wc -l | tr -d ' ')
        if [[ "$count" == "0" ]]; then
          echo 'ERROR: No Linux artifacts found after collection.'
          exit 1
        fi
        echo "Linux artifact count: $count"
      displayName: Validate Linux Artifact Presence

- stage: ValidateMacOSArtifacts
  displayName: Validate macOS Artifacts
  dependsOn: CollectMacOSArtifacts
  jobs:
  - job: ValidateMacOS
    displayName: Validate macOS Artifact Set
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Collected macOS Artifacts
      inputs:
        buildType: current
        artifactName: collected-macos
        targetPath: $(Pipeline.Workspace)/collected-macos
    - bash: |
        set -euo pipefail
        count=$(find "$(Pipeline.Workspace)/collected-macos" -type f \( -name '*mac*.tar.gz' -o -name '*macos*.tar.gz' -o -name '*osx*.tar.gz' -o -name '*darwin*.tar.gz' -o -name '*mac*.zip' -o -name '*macos*.zip' \) | wc -l | tr -d ' ')
        if [[ "$count" == "0" ]]; then
          echo 'ERROR: No macOS artifacts found after collection.'
          exit 1
        fi
        echo "macOS artifact count: $count"
      displayName: Validate macOS Artifact Presence

# ---------------------------------------------- 8. Assemble + Manifest
- stage: AssembleSignedArtifacts
  displayName: Assemble Signed Artifacts
  dependsOn:
  - ValidateNugetArtifacts
  - ValidateWindowsArtifacts
  - ValidateLinuxArtifacts
  - ValidateMacOSArtifacts
  jobs:
  - job: Assemble
    displayName: Assemble Final Signed Artifact
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: self
      clean: true
    - task: DownloadPipelineArtifact@2
      displayName: Download Signed NuGet
      inputs:
        buildType: current
        artifactName: signed-nuget
        targetPath: $(Pipeline.Workspace)/signed-nuget
    - task: DownloadPipelineArtifact@2
      displayName: Download Signed Windows
      inputs:
        buildType: current
        artifactName: signed-windows
        targetPath: $(Pipeline.Workspace)/signed-windows
    - task: DownloadPipelineArtifact@2
      displayName: Download Collected Linux
      inputs:
        buildType: current
        artifactName: collected-linux
        targetPath: $(Pipeline.Workspace)/collected-linux
    - task: DownloadPipelineArtifact@2
      displayName: Download Collected macOS
      inputs:
        buildType: current
        artifactName: collected-macos
        targetPath: $(Pipeline.Workspace)/collected-macos
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $release = "$(Build.ArtifactStagingDirectory)/signed-release"
        New-Item -ItemType Directory -Path $release -Force | Out-Null
        foreach ($src in 'signed-nuget','signed-windows','collected-linux','collected-macos') {
          $dir = "$(Pipeline.Workspace)/$src"
          if (Test-Path $dir) {
            Get-ChildItem -Path $dir -File -Recurse | ForEach-Object {
              Copy-Item $_.FullName -Destination (Join-Path $release $_.Name) -Force
            }
          }
        }
        Get-ChildItem -Path $release | Sort-Object Name | Format-Table Name,Length -AutoSize | Out-String | Write-Host
      displayName: Combine Signed Artifacts
    - task: PowerShell@2
      displayName: Generate Release Manifest (SHA-256)
      inputs:
        targetType: filePath
        filePath: .azure-pipelines/opus/scripts/New-ReleaseManifest.ps1
        arguments: >-
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PublishPipelineArtifact@1
      displayName: Publish Final Signed Artifact
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-release
        artifact: ${{ parameters.signed_artifact_name }}
        publishLocation: pipeline
