parameters:
- name: ubuntu_pool
  type: string
  default: 'pool-ubuntu-2204'
- name: PackagingScriptsRoot
  type: string
- name: PackagingCommonOutRoot
  type: string

jobs:
- job: BuildCommonOutputs
  displayName: CLI Common Output
  timeoutInMinutes: 30
  pool:
    name: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - script: |
      set -euo pipefail
      chmod +x "${{ parameters.PackagingScriptsRoot }}/common/build_common.sh"
      OUT_ROOT="${{ parameters.PackagingCommonOutRoot }}" "${{ parameters.PackagingScriptsRoot }}/common/build_common.sh"
    displayName: Build CLI Common

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI Common
    inputs:
      targetPath: ${{ parameters.PackagingCommonOutRoot }}
      artifact: Distribution_Common
      publishLocation: pipeline
