parameters:
- name: amd64_pool
  type: string
  default: 'pool-ubuntu-latest-multi-core'
- name: arm64_pool
  type: string
  default: 'pool-ubuntu-latest-arm64'
- name: PackagingScriptsRoot
  type: string
- name: PackagingLinuxOutRoot
  type: string
- name: PackagingDockerOutRoot
  type: string
- name: ps_modules_artifact_name
  type: string
  default: 'PSModules'
- name: cli_base_image
  type: string
  default: 'mcr.microsoft.com/dotnet/runtime-deps:10.0-noble'
- name: pwsh_base_image
  type: string
  default: 'mcr.microsoft.com/dotnet/runtime:10.0-noble'

jobs:
- job: BuildDockerImages
  displayName: Docker Image
  timeoutInMinutes: 30
  strategy:
    matrix:
      cli_linux_glibc_lean_amd64:
        Pool: ${{ parameters.amd64_pool }}
        Rid: linux-x64
        ImageFlavor: cli
        PackageProfile: lean
        Platform: linux/amd64
        BaseImage: ${{ parameters.cli_base_image }}
        ImageVariant: noble
        DistributionArtifact: Distribution_Linux_Lean
        DockerArtifact: Docker_CLI_Linux_Glibc_Lean_Amd64
      cli_linux_glibc_lean_arm64:
        Pool: ${{ parameters.arm64_pool }}
        Rid: linux-arm64
        ImageFlavor: cli
        PackageProfile: lean
        Platform: linux/arm64
        BaseImage: ${{ parameters.cli_base_image }}
        ImageVariant: noble
        DistributionArtifact: Distribution_Linux_Arm64_Lean
        DockerArtifact: Docker_CLI_Linux_Glibc_Lean_Arm64
      cli_linux_glibc_full_amd64:
        Pool: ${{ parameters.amd64_pool }}
        Rid: linux-x64
        ImageFlavor: cli
        PackageProfile: full
        Platform: linux/amd64
        BaseImage: ${{ parameters.cli_base_image }}
        ImageVariant: noble
        DistributionArtifact: Distribution_Linux_Full
        DockerArtifact: Docker_CLI_Linux_Glibc_Full_Amd64
      cli_linux_glibc_full_arm64:
        Pool: ${{ parameters.arm64_pool }}
        Rid: linux-arm64
        ImageFlavor: cli
        PackageProfile: full
        Platform: linux/arm64
        BaseImage: ${{ parameters.cli_base_image }}
        ImageVariant: noble
        DistributionArtifact: Distribution_Linux_Arm64_Full
        DockerArtifact: Docker_CLI_Linux_Glibc_Full_Arm64
      powershell_linux_glibc_amd64:
        Pool: ${{ parameters.amd64_pool }}
        Rid: linux-x64
        ImageFlavor: pwsh
        PackageProfile: none
        Platform: linux/amd64
        BaseImage: ${{ parameters.pwsh_base_image }}
        ImageVariant: noble
        DistributionArtifact: ${{ parameters.ps_modules_artifact_name }}
        DockerArtifact: Docker_PowerShell_Linux_Glibc_Amd64
      powershell_linux_glibc_arm64:
        Pool: ${{ parameters.arm64_pool }}
        Rid: linux-arm64
        ImageFlavor: pwsh
        PackageProfile: none
        Platform: linux/arm64
        BaseImage: ${{ parameters.pwsh_base_image }}
        ImageVariant: noble
        DistributionArtifact: ${{ parameters.ps_modules_artifact_name }}
        DockerArtifact: Docker_PowerShell_Linux_Glibc_Arm64
  pool:
    name: $(Pool)
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    retryCountOnTaskFailure: 3

  - script: |
      set -euo pipefail
      chmod +x "${{ parameters.PackagingScriptsRoot }}/linux/docker/install_docker.sh"
      "${{ parameters.PackagingScriptsRoot }}/linux/docker/install_docker.sh"
    displayName: Install Docker

  - task: DownloadPipelineArtifact@2
    displayName: Get Docker Source Artifact
    inputs:
      artifact: $(DistributionArtifact)
      path: ${{ parameters.PackagingLinuxOutRoot }}/$(DistributionArtifact)

  - script: |
      set -euo pipefail
      if [[ "$(ImageFlavor)" != "cli" ]]; then
        exit 0
      fi
      tarball_dir="${{ parameters.PackagingLinuxOutRoot }}/$(DistributionArtifact)/Release/tarball"
      mapfile -t tarball_candidates < <(find "$tarball_dir" -maxdepth 1 -type f -name '*.tar.gz' 2>/dev/null | sort)
      if [[ ${#tarball_candidates[@]} -eq 0 ]]; then
        echo "ERROR: No tarball found under $tarball_dir"
        exit 1
      fi
      if [[ ${#tarball_candidates[@]} -gt 1 ]]; then
        echo "ERROR: Expected exactly one tarball under $tarball_dir, found ${#tarball_candidates[@]}:"
        printf '%s\n' "${tarball_candidates[@]}"
        exit 1
      fi
      echo "##vso[task.setvariable variable=ResolvedTarballPath]${tarball_candidates[0]}"
    displayName: Locate CLI Tarball

  - script: |
      set -euo pipefail
      if [[ "$(ImageFlavor)" != "pwsh" ]]; then
        exit 0
      fi
      module_repo="${{ parameters.PackagingLinuxOutRoot }}/$(DistributionArtifact)/artifacts/PSGallery/local-repo"
      if [[ ! -d "$module_repo" ]]; then
        echo "ERROR: PS module local repository was not found at $module_repo"
        exit 1
      fi
      echo "##vso[task.setvariable variable=ResolvedModuleRepo]$module_repo"
    displayName: Locate PowerShell Module Repository

  - script: |
      set -euo pipefail
      if [[ "$(ImageFlavor)" == "cli" ]]; then
        chmod +x "${{ parameters.PackagingScriptsRoot }}/linux/docker/build_cli_docker_image.sh"
        ARTIFACT_VERSION="$(ArtifactVersion)" \
        OUT_ROOT="${{ parameters.PackagingDockerOutRoot }}" \
        RID="$(Rid)" \
        PLATFORM="$(Platform)" \
        PACKAGE_PROFILE="$(PackageProfile)" \
        BASE_IMAGE="$(BaseImage)" \
        IMAGE_VARIANT="$(ImageVariant)" \
        DOCKERFILE="${{ parameters.PackagingScriptsRoot }}/linux/docker/Dockerfile.cli" \
        TARBALL_PATH="$(ResolvedTarballPath)" \
        "${{ parameters.PackagingScriptsRoot }}/linux/docker/build_cli_docker_image.sh"
      else
        chmod +x "${{ parameters.PackagingScriptsRoot }}/linux/docker/build_pwsh_docker_image.sh"
        ARTIFACT_VERSION="$(ArtifactVersion)" \
        OUT_ROOT="${{ parameters.PackagingDockerOutRoot }}" \
        PLATFORM="$(Platform)" \
        BASE_IMAGE="$(BaseImage)" \
        IMAGE_VARIANT="$(ImageVariant)" \
        DOCKERFILE="${{ parameters.PackagingScriptsRoot }}/linux/docker/Dockerfile.pwsh" \
        MODULE_REPO_ROOT="$(ResolvedModuleRepo)" \
        "${{ parameters.PackagingScriptsRoot }}/linux/docker/build_pwsh_docker_image.sh"
      fi
    displayName: Build Docker Image

  - script: |
      set -euo pipefail
      chmod +x "${{ parameters.PackagingScriptsRoot }}/linux/docker/test_docker_image.sh"
      IMAGE_TAG="$(DockerImageTag)" \
      IMAGE_FLAVOR="$(ImageFlavor)" \
      PLATFORM="$(Platform)" \
      "${{ parameters.PackagingScriptsRoot }}/linux/docker/test_docker_image.sh"
    displayName: Smoke Test Docker Image

  - task: PublishPipelineArtifact@1
    displayName: Publish Docker Image
    inputs:
      targetPath: ${{ parameters.PackagingDockerOutRoot }}/Release/docker
      artifact: $(DockerArtifact)
      publishLocation: pipeline
