parameters:
- name: ubuntu_pool
  type: string
  default: 'ubuntu-latest'
- name: PackagingScriptsRoot
  type: string
- name: PackagingCommonOutRoot
  type: string
- name: PackagingLinuxOutRoot
  type: string

jobs:
- job: BuildLinuxOutput
  displayName: CLI Linux Tarball
  timeoutInMinutes: 30
  strategy:
    matrix:
      linux_x64_lean:
        Rid: linux-x64
        BuildProfile: lean
        DistributionArtifact: Distribution_Linux_Lean
      linux_arm64_lean:
        Rid: linux-arm64
        BuildProfile: lean
        DistributionArtifact: Distribution_Linux_Arm64_Lean
      linux_x64_full:
        Rid: linux-x64
        BuildProfile: full
        DistributionArtifact: Distribution_Linux_Full
      linux_arm64_full:
        Rid: linux-arm64
        BuildProfile: full
        DistributionArtifact: Distribution_Linux_Arm64_Full
  pool:
    vmImage: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    retryCountOnTaskFailure: 3

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - task: DownloadPipelineArtifact@2
    displayName: Get CLI Common
    inputs:
      artifact: Distribution_Common
      path: ${{ parameters.PackagingCommonOutRoot }}

  - script: |
      set -euo pipefail
      chmod +x "${{ parameters.PackagingScriptsRoot }}/linux/tarball/build_linux_tarball.sh"
      ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT="${{ parameters.PackagingLinuxOutRoot }}" COMMON_OUT_ROOT="${{ parameters.PackagingCommonOutRoot }}" PACKAGE_PROFILE="$(BuildProfile)" RID="$(Rid)" "${{ parameters.PackagingScriptsRoot }}/linux/tarball/build_linux_tarball.sh"
    displayName: Build CLI Linux Tarball

  - bash: |
      set -euo pipefail
      sudo apt-get update -qq
      sudo apt-get install -y -qq gettext-base
      tools_root="$(Agent.TempDirectory)/nfpm-2.46.3"
      mkdir -p "$tools_root"
      curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.46.3/nfpm_2.46.3_Linux_x86_64.tar.gz \
        | tar -xz -C "$tools_root" nfpm
      echo "##vso[task.prependpath]$tools_root"
    displayName: Install DEB Packaging Tools
    condition: and(succeeded(), eq(variables['Rid'], 'linux-x64'), eq(variables['BuildProfile'], 'full'))

  - bash: |
      set -euo pipefail
      PACKAGE_VERSION="$(ArtifactVersion)" \
        OUT_ROOT="${{ parameters.PackagingLinuxOutRoot }}" \
        PACKAGE_PROFILE="$(BuildProfile)" \
        RID="$(Rid)" \
        bash "${{ parameters.PackagingScriptsRoot }}/linux/deb/build_linux_deb.sh"
    displayName: Build CLI Ubuntu DEB
    condition: and(succeeded(), eq(variables['Rid'], 'linux-x64'), eq(variables['BuildProfile'], 'full'))

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI Linux
    inputs:
      targetPath: ${{ parameters.PackagingLinuxOutRoot }}
      artifact: $(DistributionArtifact)
      publishLocation: pipeline
