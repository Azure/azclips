parameters:
- name: ubuntu_pool
  type: string
  default: 'pool-ubuntu-2204'
- name: ubuntu_arm64_pool
  type: string
  default: 'pool-ubuntu-latest-arm64'
- name: PackagingScriptsRoot
  type: string
- name: PackagingCommonOutRoot
  type: string
- name: PackagingLinuxOutRoot
  type: string

jobs:
- job: BuildLinuxOutput
  displayName: CLI Linux Tarball
  timeoutInMinutes: 30
  strategy:
    matrix:
      linux_x64_lean:
        Rid: linux-x64
        BuildProfile: lean
        DistributionArtifact: Distribution_Linux_Lean
        PoolName: ${{ parameters.ubuntu_pool }}
      linux_arm64_lean:
        Rid: linux-arm64
        BuildProfile: lean
        DistributionArtifact: Distribution_Linux_Arm64_Lean
        PoolName: ${{ parameters.ubuntu_arm64_pool }}
      linux_x64_full:
        Rid: linux-x64
        BuildProfile: full
        DistributionArtifact: Distribution_Linux_Full
        PoolName: ${{ parameters.ubuntu_pool }}
      linux_arm64_full:
        Rid: linux-arm64
        BuildProfile: full
        DistributionArtifact: Distribution_Linux_Arm64_Full
        PoolName: ${{ parameters.ubuntu_arm64_pool }}
      linux_musl_x64_lean:
        Rid: linux-musl-x64
        BuildProfile: lean
        DistributionArtifact: Distribution_Linux_Musl_X64_Lean
        PoolName: ${{ parameters.ubuntu_pool }}
      linux_musl_arm64_lean:
        Rid: linux-musl-arm64
        BuildProfile: lean
        DistributionArtifact: Distribution_Linux_Musl_Arm64_Lean
        PoolName: ${{ parameters.ubuntu_arm64_pool }}
      linux_musl_x64_full:
        Rid: linux-musl-x64
        BuildProfile: full
        DistributionArtifact: Distribution_Linux_Musl_X64_Full
        PoolName: ${{ parameters.ubuntu_pool }}
      linux_musl_arm64_full:
        Rid: linux-musl-arm64
        BuildProfile: full
        DistributionArtifact: Distribution_Linux_Musl_Arm64_Full
        PoolName: ${{ parameters.ubuntu_arm64_pool }}
  pool:
    name: $(PoolName)
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - task: DownloadPipelineArtifact@2
    displayName: Get CLI Common
    inputs:
      artifact: Distribution_Common
      path: ${{ parameters.PackagingCommonOutRoot }}

  - script: |
      set -euo pipefail
      chmod +x "${{ parameters.PackagingScriptsRoot }}/linux/tarball/build_linux_tarball.sh"
      ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT="${{ parameters.PackagingLinuxOutRoot }}" COMMON_OUT_ROOT="${{ parameters.PackagingCommonOutRoot }}" PACKAGE_PROFILE="$(BuildProfile)" RID="$(Rid)" "${{ parameters.PackagingScriptsRoot }}/linux/tarball/build_linux_tarball.sh"
    displayName: Build CLI Linux Tarball

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI Linux
    inputs:
      targetPath: ${{ parameters.PackagingLinuxOutRoot }}
      artifact: $(DistributionArtifact)
      publishLocation: pipeline
