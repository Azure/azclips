parameters:
- name: macos_arm64_pool
  type: string
- name: macos_intel_pool
  type: string
- name: PackagingScriptsRoot
  type: string
- name: PackagingCommonOutRoot
  type: string
- name: PackagingMacOSOutRoot
  type: string

jobs:
- job: BuildMacOSOutput
  displayName: CLI macOS Tarball
  timeoutInMinutes: 60
  strategy:
    matrix:
      osx_arm64:
        Rid: osx-arm64
        LeanDistributionArtifact: Distribution_MacOS_Lean
        FullDistributionArtifact: Distribution_MacOS_Full
        VmImage: ${{ parameters.macos_arm64_pool }}
      osx_x64:
        Rid: osx-x64
        LeanDistributionArtifact: Distribution_MacOS_Intel_Lean
        FullDistributionArtifact: Distribution_MacOS_Intel_Full
        VmImage: ${{ parameters.macos_intel_pool }}
  pool:
    vmImage: $(VmImage)
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - task: DownloadPipelineArtifact@2
    displayName: Get CLI Common
    inputs:
      artifact: Distribution_Common
      path: ${{ parameters.PackagingCommonOutRoot }}

  - script: |
      set -euo pipefail
      rm -rf "${{ parameters.PackagingMacOSOutRoot }}"
      chmod +x "${{ parameters.PackagingScriptsRoot }}/macos/tarball/build_macos_tarball.sh"
      ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT="${{ parameters.PackagingMacOSOutRoot }}" COMMON_OUT_ROOT="${{ parameters.PackagingCommonOutRoot }}" PACKAGE_PROFILE=lean RID="$(Rid)" "${{ parameters.PackagingScriptsRoot }}/macos/tarball/build_macos_tarball.sh"
    displayName: Build CLI macOS Lean Tarball

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI macOS Lean
    inputs:
      targetPath: ${{ parameters.PackagingMacOSOutRoot }}
      artifact: $(LeanDistributionArtifact)
      publishLocation: pipeline

  - script: |
      set -euo pipefail
      rm -rf "${{ parameters.PackagingMacOSOutRoot }}"
      chmod +x "${{ parameters.PackagingScriptsRoot }}/macos/tarball/build_macos_tarball.sh"
      ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT="${{ parameters.PackagingMacOSOutRoot }}" COMMON_OUT_ROOT="${{ parameters.PackagingCommonOutRoot }}" PACKAGE_PROFILE=full RID="$(Rid)" "${{ parameters.PackagingScriptsRoot }}/macos/tarball/build_macos_tarball.sh"
    displayName: Build CLI macOS Full Tarball

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI macOS Full
    inputs:
      targetPath: ${{ parameters.PackagingMacOSOutRoot }}
      artifact: $(FullDistributionArtifact)
      publishLocation: pipeline
