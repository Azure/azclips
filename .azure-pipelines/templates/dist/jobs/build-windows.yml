parameters:
- name: windows_pool
  type: string
  default: 'pool-windows-2022'
- name: windows_arm64_pool
  type: string
  default: 'pool-windows-2025-gen2-arm64'
- name: PackagingScriptsRoot
  type: string
- name: PackagingCommonOutRoot
  type: string
- name: PackagingWindowsOutRoot
  type: string

jobs:
- job: BuildWindowsOutput
  displayName: CLI Windows Zip
  timeoutInMinutes: 30
  strategy:
    matrix:
      win_x64_lean:
        Rid: win-x64
        BuildProfile: lean
        DistributionArtifact: Distribution_Windows_Lean
        PoolName: ${{ parameters.windows_pool }}
      win_arm64_lean:
        Rid: win-arm64
        BuildProfile: lean
        DistributionArtifact: Distribution_Windows_Arm64_Lean
        PoolName: ${{ parameters.windows_arm64_pool }}
      win_x64_full:
        Rid: win-x64
        BuildProfile: full
        DistributionArtifact: Distribution_Windows_Full
        PoolName: ${{ parameters.windows_pool }}
      win_arm64_full:
        Rid: win-arm64
        BuildProfile: full
        DistributionArtifact: Distribution_Windows_Arm64_Full
        PoolName: ${{ parameters.windows_arm64_pool }}
  pool:
    name: $(PoolName)
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    retryCountOnTaskFailure: 3

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - task: DownloadPipelineArtifact@2
    displayName: Get CLI Common
    inputs:
      artifact: Distribution_Common
      path: ${{ parameters.PackagingCommonOutRoot }}

  - task: PowerShell@2
    displayName: Build CLI Windows Zip
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $env:ARTIFACT_VERSION = "$(ArtifactVersion)"
        $env:PACKAGE_PROFILE = "$(BuildProfile)"
        & "${{ parameters.PackagingScriptsRoot }}/windows/zip/build_win_zip.ps1" -OutRoot "${{ parameters.PackagingWindowsOutRoot }}" -CommonOutRoot "${{ parameters.PackagingCommonOutRoot }}" -Rid "$(Rid)"
      pwsh: true

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI Windows
    inputs:
      targetPath: ${{ parameters.PackagingWindowsOutRoot }}
      artifact: $(DistributionArtifact)
      publishLocation: pipeline
