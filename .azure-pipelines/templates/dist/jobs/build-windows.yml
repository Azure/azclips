parameters:
- name: windows_pool
  type: string
  default: 'windows-latest'
- name: PackagingScriptsRoot
  type: string
- name: PackagingCommonOutRoot
  type: string
- name: PackagingWindowsOutRoot
  type: string

jobs:
- job: BuildWindowsOutput
  displayName: Windows Zip
  timeoutInMinutes: 60
  strategy:
    matrix:
      win_x64_lean:
        Rid: win-x64
        BuildProfile: lean
        DistributionArtifact: Distribution_Windows_Lean
        CliZipPath: ${{ parameters.PackagingWindowsOutRoot }}/Release/zip/azv2-lean-win-x64-$(ArtifactVersion).zip
      win_arm64_lean:
        Rid: win-arm64
        BuildProfile: lean
        DistributionArtifact: Distribution_Windows_Arm64_Lean
        CliZipPath: ${{ parameters.PackagingWindowsOutRoot }}/Release/zip/azv2-lean-win-arm64-$(ArtifactVersion).zip
      win_x64_full:
        Rid: win-x64
        BuildProfile: full
        DistributionArtifact: Distribution_Windows_Full
        CliZipPath: ${{ parameters.PackagingWindowsOutRoot }}/Release/zip/azv2-win-x64-$(ArtifactVersion).zip
      win_arm64_full:
        Rid: win-arm64
        BuildProfile: full
        DistributionArtifact: Distribution_Windows_Arm64_Full
        CliZipPath: ${{ parameters.PackagingWindowsOutRoot }}/Release/zip/azv2-win-arm64-$(ArtifactVersion).zip
  pool:
    vmImage: ${{ parameters.windows_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - task: DownloadPipelineArtifact@2
    displayName: Get Common
    inputs:
      artifact: Distribution_Common
      path: ${{ parameters.PackagingCommonOutRoot }}

  - task: PowerShell@2
    displayName: Build Windows Zip
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $env:ARTIFACT_VERSION = "$(ArtifactVersion)"
        $env:PACKAGE_PROFILE = "$(BuildProfile)"
        & "${{ parameters.PackagingScriptsRoot }}/windows/zip/build_win_zip.ps1" -OutRoot "${{ parameters.PackagingWindowsOutRoot }}" -CommonOutRoot "${{ parameters.PackagingCommonOutRoot }}" -Rid "$(Rid)" -CliWinZipPath "$(CliZipPath)"
      pwsh: true

  - task: PublishPipelineArtifact@1
    displayName: Publish Windows
    inputs:
      targetPath: ${{ parameters.PackagingWindowsOutRoot }}
      artifact: $(DistributionArtifact)
      publishLocation: pipeline
