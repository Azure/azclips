    displayName: Download Linux musl x64 Full Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_Linux_Musl_X64_Full
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_Linux_Musl_X64_Full

  - task: DownloadPipelineArtifact@2
    displayName: Download Linux musl Arm64 Full Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_Linux_Musl_Arm64_Full
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_Linux_Musl_Arm64_Full

  - task: DownloadPipelineArtifact@2
    displayName: Download Docker CLI Azure Linux 3 Lean Amd64 Image Artifacts
    condition: and(succeeded(), eq(${{ parameters.build_docker_images }}, true), eq(${{ parameters.build_cli_docker_images }}, true), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Docker_CLI_AzureLinux3_Lean_Amd64
      path: $(Pipeline.Workspace)/distribution-artifacts/Docker_CLI_AzureLinux3_Lean_Amd64

  - task: DownloadPipelineArtifact@2
    displayName: Download Docker CLI Azure Linux 3 Lean Arm64 Image Artifacts
    condition: and(succeeded(), eq(${{ parameters.build_docker_images }}, true), eq(${{ parameters.build_cli_docker_images }}, true), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Docker_CLI_AzureLinux3_Lean_Arm64
      path: $(Pipeline.Workspace)/distribution-artifacts/Docker_CLI_AzureLinux3_Lean_Arm64

  - task: DownloadPipelineArtifact@2
    displayName: Download Docker CLI Azure Linux 3 Full Amd64 Image Artifacts
    condition: and(succeeded(), eq(${{ parameters.build_docker_images }}, true), eq(${{ parameters.build_cli_docker_images }}, true), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Docker_CLI_AzureLinux3_Full_Amd64
      path: $(Pipeline.Workspace)/distribution-artifacts/Docker_CLI_AzureLinux3_Full_Amd64

  - task: DownloadPipelineArtifact@2
    displayName: Download Docker CLI Azure Linux 3 Full Arm64 Image Artifacts
    condition: and(succeeded(), eq(${{ parameters.build_docker_images }}, true), eq(${{ parameters.build_cli_docker_images }}, true), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Docker_CLI_AzureLinux3_Full_Arm64
      path: $(Pipeline.Workspace)/distribution-artifacts/Docker_CLI_AzureLinux3_Full_Arm64

  - task: DownloadPipelineArtifact@2
    displayName: Download Docker PowerShell Azure Linux 3 Amd64 Image Artifacts
    condition: and(succeeded(), eq(${{ parameters.build_docker_images }}, true), eq(${{ parameters.build_powershell_docker_images }}, true), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Docker_PowerShell_AzureLinux3_Amd64
      path: $(Pipeline.Workspace)/distribution-artifacts/Docker_PowerShell_AzureLinux3_Amd64

  - task: DownloadPipelineArtifact@2
    displayName: Download Docker PowerShell Azure Linux 3 Arm64 Image Artifacts
    condition: and(succeeded(), eq(${{ parameters.build_docker_images }}, true), eq(${{ parameters.build_powershell_docker_images }}, true), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Docker_PowerShell_AzureLinux3_Arm64
      path: $(Pipeline.Workspace)/distribution-artifacts/Docker_PowerShell_AzureLinux3_Arm64

  - task: DownloadPipelineArtifact@2
    displayName: Download Windows Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_Windows_Lean
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_Windows_Lean

  - task: DownloadPipelineArtifact@2
    displayName: Download Windows Arm64 Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_Windows_Arm64_Lean
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_Windows_Arm64_Lean

  - task: DownloadPipelineArtifact@2
    displayName: Download Windows Full Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_Windows_Full
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_Windows_Full

  - task: DownloadPipelineArtifact@2
    displayName: Download Windows Arm64 Full Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_Windows_Arm64_Full
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_Windows_Arm64_Full

  - task: DownloadPipelineArtifact@2
    displayName: Download macOS Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_MacOS_Lean
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_MacOS_Lean

  - task: DownloadPipelineArtifact@2
    displayName: Download macOS Intel Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_MacOS_Intel_Lean
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_MacOS_Intel_Lean

  - task: DownloadPipelineArtifact@2
    displayName: Download macOS Full Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_MacOS_Full
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_MacOS_Full

  - task: DownloadPipelineArtifact@2
    displayName: Download macOS Intel Full Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_MacOS_Intel_Full
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_MacOS_Intel_Full

  - task: DownloadPipelineArtifact@2
    displayName: Download PS Modules Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['BuildPSModulesResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: ${{ parameters.ps_modules_artifact_name }}
      path: $(Pipeline.Workspace)/distribution-artifacts/${{ parameters.ps_modules_artifact_name }}

  - bash: |
      set -euo pipefail

      source_root="$(Pipeline.Workspace)/distribution-artifacts"
      final_root="$(Pipeline.Workspace)/${{ parameters.final_artifact_name }}"
      archives_root="$final_root/archives"
      cli_extensions_root="$final_root/CLIextensions"
      ps_modules_root="$final_root/PSModules"
      docker_images_root="$final_root/DockerImages"

      rm -rf "$final_root"
      mkdir -p "$archives_root" "$cli_extensions_root" "$ps_modules_root" "$docker_images_root"

      if [[ ! -d "$source_root" ]]; then
        echo "ERROR: Distribution artifact download root not found: $source_root"
        exit 1
      fi

      mapfile -t archives < <(find "$source_root" -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
      if [[ ${#archives[@]} -eq 0 ]]; then
        echo "ERROR: No distribution archives found under $source_root"
        exit 1
      fi

      for archive in "${archives[@]}"; do
        cp "$archive" "$archives_root/"
      done

      mapfile -t extension_packages < <(find "$source_root" -path '*/extensions-pack/*.nupkg' -type f | sort)
      for package in "${extension_packages[@]}"; do
        cp "$package" "$cli_extensions_root/"
      done

      mapfile -t docker_images < <(find "$source_root" -path '*/Docker_*/*' -type f -name '*.tar' | sort)
      for image in "${docker_images[@]}"; do
        cp "$image" "$docker_images_root/"
      done
      echo "Collected ${#docker_images[@]} docker image(s)."

      ps_module_repo_root="$source_root/${{ parameters.ps_modules_artifact_name }}/artifacts/PSGallery/local-repo"
      if [[ ! -d "$ps_module_repo_root" ]]; then
        echo "ERROR: PS module artifact root not found: $ps_module_repo_root"
        exit 1
      fi

      mapfile -t ps_module_packages < <(find "$ps_module_repo_root" -type f -name 'Az.*.nupkg' | sort)
      if [[ ${#ps_module_packages[@]} -eq 0 ]]; then
        echo "ERROR: No Az PowerShell module packages found under $ps_module_repo_root"
        exit 1
      fi

      for package in "${ps_module_packages[@]}"; do
        cp "$package" "$ps_modules_root/"
      done

      chmod +x "$(Build.SourcesDirectory)/devops/scripts/packaging/common/create_component_archives.sh"
      ARTIFACT_VERSION="$(ArtifactVersion)" "$(Build.SourcesDirectory)/devops/scripts/packaging/common/create_component_archives.sh" \
        --cli-extensions-root "$cli_extensions_root" \
        --ps-modules-root "$ps_modules_root" \
        --output-root "$archives_root"

      manifest="$final_root/manifest.txt"
      {
        echo "artifact_name=${{ parameters.final_artifact_name }}"
        echo "build_id=$(Build.BuildId)"
        echo "build_number=$(Build.BuildNumber)"
        echo "source_branch=$(Build.SourceBranch)"
        echo "source_version=$(Build.SourceVersion)"
        echo ""
        echo "archives:"
        find "$archives_root" -type f -printf '%P\n' | sort | sed 's/^/  /'
        echo ""
        echo "CLIextensions:"
        find "$cli_extensions_root" -type f -printf '%P\n' | sort | sed 's/^/  /'
        echo ""
        echo "PSModules:"
        find "$ps_modules_root" -type f -printf '%P\n' | sort | sed 's/^/  /'
        echo ""
        echo "DockerImages:"
        find "$docker_images_root" -type f -printf '%P\n' | sort | sed 's/^/  /'
      } > "$manifest"

      echo "Final distribution outputs:"
      find "$final_root" -type f | sort
    displayName: Collect Final Distribution Outputs
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['BuildPSModulesResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))

  - task: PublishPipelineArtifact@1
    displayName: Publish Final Distribution Outputs
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['BuildPSModulesResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      targetPath: $(Pipeline.Workspace)/${{ parameters.final_artifact_name }}
      artifact: ${{ parameters.final_artifact_name }}
      publishLocation: pipeline
