parameters:
- name: ubuntu_pool
  type: string
- name: final_artifact_name
  type: string
  default: 'Final_Build_Distribution'
- name: ps_modules_artifact_name
  type: string
  default: 'PSModules'
- name: build_docker_images
  type: boolean
  default: true
- name: build_cli_docker_images
  type: boolean
  default: true
- name: build_powershell_docker_images
  type: boolean
  default: true

jobs:
- job: Summary
  displayName: Summary
  pool:
    name: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - script: |
      echo "BuildCommon: $(BuildCommonResult)"
      echo "BuildLinux: $(BuildLinuxResult)"
      echo "BuildDocker: $(BuildDockerResult)"
      echo "BuildWindows: $(BuildWindowsResult)"
      echo "BuildMacOS: $(BuildMacOSResult)"
      echo "Test: $(TestResult)"
      echo "Benchmark: $(BenchmarkResult)"
      echo "BuildPSModules: $(BuildPSModulesResult)"
      echo "PSBinaryAnalysis: $(PSBinaryAnalysisResult)"
      echo "ValidateLinux: $(ValidateLinuxResult)"
      echo "ValidateDocker: $(ValidateDockerResult)"
      echo "ValidateWindows: $(ValidateWindowsResult)"
      echo "ValidateMacOS: $(ValidateMacOSResult)"
      echo "ComponentGovernance: $(ComponentGovernanceResult)"
    displayName: Stage Summary

  - bash: |
      echo '##vso[task.logissue type=warning]Guardian security analysis was not run for this fork PR. Successful job results reflect the remaining build/artifact/functional checks, not CredScan, PoliCheck, or BinSkim approval. Rerun security validation on trusted sources before release.'
    displayName: Report Fork Security Coverage
    condition: and(succeeded(), eq(variables['System.PullRequest.IsFork'], 'True'))

  - bash: |
      set -euo pipefail

      case "$(ComponentGovernanceResult)" in
        Succeeded|SucceededWithIssues)
          echo "Component Governance completed with acceptable result: $(ComponentGovernanceResult)"
          ;;
        *)
          echo "ERROR: Component Governance did not complete successfully. Result: $(ComponentGovernanceResult)"
          exit 1
          ;;
      esac
    displayName: Validate Component Governance Result

  - bash: |
      set -euo pipefail
      if [[ "$(BuildPSModulesResult)" != "Succeeded" || "$(PSBinaryAnalysisResult)" != "Succeeded" ]]; then
        echo "ERROR: PowerShell module build and BinSkim validation must both succeed. Build: $(BuildPSModulesResult); BinSkim: $(PSBinaryAnalysisResult)"
        exit 1
      fi
    displayName: Validate PowerShell Security Result

  - bash: |
      set -euo pipefail
      if [[ "$(ValidateWindowsResult)" != "Succeeded" ]]; then
        echo "ERROR: Windows validation, including x64 and ARM64 BinSkim, must succeed. Result: $(ValidateWindowsResult)"
        exit 1
      fi
    displayName: Validate Windows Security Result

  - bash: |
      set -euo pipefail
      if [[ "$(ValidateDockerResult)" != "Succeeded" ]]; then
        echo "ERROR: Docker image validation did not complete successfully. Result: $(ValidateDockerResult)"
        exit 1
      fi
    displayName: Validate Docker Image Result

  - task: DownloadPipelineArtifact@2
    displayName: Download Common Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_Common
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_Common

  - task: DownloadPipelineArtifact@2
    displayName: Download Linux Distribution Artifacts
    condition: and(succeeded(), eq(variables['BuildCommonResult'], 'Succeeded'), eq(variables['BuildLinuxResult'], 'Succeeded'), eq(variables['BuildDockerResult'], 'Succeeded'), eq(variables['BuildWindowsResult'], 'Succeeded'), eq(variables['BuildMacOSResult'], 'Succeeded'), eq(variables['TestResult'], 'Succeeded'), eq(variables['BenchmarkResult'], 'Succeeded'), eq(variables['ValidateLinuxResult'], 'Succeeded'), eq(variables['ValidateWindowsResult'], 'Succeeded'), eq(variables['ValidateMacOSResult'], 'Succeeded'))
    inputs:
      artifact: Distribution_Linux_Lean
      path: $(Pipeline.Workspace)/distribution-artifacts/Distribution_Linux_Lean

  - task: DownloadPipelineArtifact@2
