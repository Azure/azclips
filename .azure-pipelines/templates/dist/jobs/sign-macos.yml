parameters:
- name: windows_pool
  type: string
- name: SourceProject
  type: string
  default: 'public'
- name: source_pipeline_name
  type: string
  default: 'azclips-adhoc-build'
- name: source_build_id
  type: string
  default: ''
- name: source_artifact_name
  type: string
  default: 'Final_Build_Distribution'
- name: source_artifact_source
  type: string
  default: 'specific'
- name: esrp_service_connection
  type: string
  default: ''
- name: esrp_apple_keycode
  type: string
  default: ''
- name: macos_bundle_id
  type: string
  default: 'com.microsoft.azclips.cli'
- name: macos_arm64_pool
  type: string
- name: macos_intel_pool
  type: string

jobs:
  - job: AnalyzeMacOS
    displayName: Analyze macOS Artifacts
    strategy:
      matrix:
        arm64:
          MacOSArchitecture: arm64
          MacOSRid: osx-arm64
          MacOSVmImage: ${{ parameters.macos_arm64_pool }}
        x64:
          MacOSArchitecture: x64
          MacOSRid: osx-x64
          MacOSVmImage: ${{ parameters.macos_intel_pool }}
    pool:
      vmImage: $(MacOSVmImage)
    timeoutInMinutes: 60
    steps:
    - checkout: self
      clean: true
    - ${{ if eq(parameters.source_artifact_source, 'current') }}:
      - task: DownloadPipelineArtifact@2
        displayName: Download Unsigned Distribution Artifacts
        inputs:
          artifact: ${{ parameters.source_artifact_name }}
          path: $(Pipeline.Workspace)/unsigned-all
    - ${{ if ne(parameters.source_artifact_source, 'current') }}:
      - task: DownloadPipelineArtifact@2
        displayName: Download Unsigned Distribution Artifacts
        inputs:
          buildType: specific
          project: ${{ parameters.SourceProject }}
          definition: ${{ parameters.source_pipeline_name }}
          buildVersionToDownload: specific
          pipelineId: ${{ parameters.source_build_id }}
          artifactName: ${{ parameters.source_artifact_name }}
          targetPath: $(Pipeline.Workspace)/unsigned-all
    - bash: |
        set -euo pipefail
        source_root="$(Pipeline.Workspace)/unsigned-all"
        work_root="$(Build.ArtifactStagingDirectory)/macos-signing-inputs"
        tarball_dir="$work_root/tarballs"
        contents_dir="$work_root/contents"
        mapping_tsv="$work_root/file-mapping.tsv"
        entitlements_source="$(Build.SourcesDirectory)/devops/scripts/packaging/macos/signing/azclips-runtime.entitlements.plist"
        current_arch="$(MacOSArchitecture)"
        current_rid="$(MacOSRid)"
        asset_arch_label="macos-$current_arch"
        if [[ "$current_arch" == "x64" ]]; then
          asset_arch_label="macos-x86_64"
        fi
        mkdir -p "$tarball_dir" "$contents_dir"
        : > "$mapping_tsv"
        if [[ ! -f "$entitlements_source" ]]; then
          echo "ERROR: macOS signing entitlements file was not found: $entitlements_source"
          exit 1
        fi
        cp "$entitlements_source" "$work_root/azclips-runtime.entitlements.plist"

        verify_dotnet_entitlements() {
          local candidate="$1"
          local entitlements
          entitlements=$(codesign -d --entitlements - "$candidate" 2>&1 || true)
          for entitlement in \
            'com.apple.security.cs.allow-jit' \
            'com.apple.security.cs.allow-unsigned-executable-memory' \
            'com.apple.security.cs.disable-library-validation'; do
            if ! printf '%s\n' "$entitlements" | grep -q "$entitlement"; then
              echo "ERROR: Required .NET entitlement '$entitlement' missing after pre-sign: $candidate"
              return 1
            fi
          done
        }

        requires_dotnet_entitlements() {
          case "$(basename "$1")" in
            az|azclips-agent)
              return 0
              ;;
            *)
              return 1
              ;;
          esac
        }

        is_recognized_code_bundle() {
          local candidate="$1"

          case "$(basename "$candidate")" in
            *.framework)
              [[ -f "$candidate/Resources/Info.plist" ]] ||
                [[ -n "$(find "$candidate/Versions" -mindepth 3 -maxdepth 3 -path '*/Resources/Info.plist' -print -quit 2>/dev/null)" ]]
              ;;
            *.app|*.xpc|*.appex|*.plugin|*.bundle)
              [[ -f "$candidate/Contents/Info.plist" ]]
              ;;
            *)
              return 1
              ;;
          esac
        }

        path_contains_recognized_code_bundle() {
          local content_root="$1"
          local relative_path="$2"
          local candidate="$content_root"
          local component

          while [[ -n "$relative_path" ]]; do
            component="${relative_path%%/*}"
            candidate="$candidate/$component"
            if is_recognized_code_bundle "$candidate"; then
              return 0
            fi
            if [[ "$relative_path" != */* ]]; then
              break
            fi
            relative_path="${relative_path#*/}"
          done

          return 1
        }

        raw_mac_assets=()
        while IFS= read -r asset; do
          raw_mac_assets+=("$asset")
        done < <(find "$source_root" -type f \( -name '*mac*.tar.gz' -o -name '*macos*.tar.gz' -o -name '*osx*.tar.gz' -o -name '*darwin*.tar.gz' \) | sort)

        mac_assets=()
        for asset in "${raw_mac_assets[@]}"; do
          name=$(basename "$asset" | tr '[:upper:]' '[:lower:]')
          if [[ "$name" == *"$current_rid"* || "$name" == *"$asset_arch_label"* || "$name" == *"darwin-$current_arch"* ]]; then
            mac_assets+=("$asset")
          fi
        done

        if [[ ${#mac_assets[@]} -eq 0 ]]; then
          echo "ERROR: No macOS release artifacts matched architecture $current_arch ($current_rid) under $source_root"
          exit 1
        fi

        echo "macOS architecture selected: $current_arch ($current_rid)"
        printf 'macOS release artifacts (%s):\n' "${#mac_assets[@]}"
        printf '  %s\n' "${mac_assets[@]}"

        total_binaries=0
        total_bundles=0
        for asset in "${mac_assets[@]}"; do
          file_name=$(basename "$asset")
          base_name="${file_name%.tar.gz}"
          content_root="$contents_dir/$base_name"

          cp "$asset" "$tarball_dir/$file_name"
          mkdir -p "$content_root"
          tar -xzf "$asset" -C "$content_root"

          unknown_code_containers=0
          while IFS= read -r -d '' info_plist; do
            bundle_candidate="${info_plist%/Contents/Info.plist}"
            if is_recognized_code_bundle "$bundle_candidate"; then
              continue
            fi

            while IFS= read -r -d '' candidate_file; do
              if file "$candidate_file" | grep -q 'Mach-O'; then
                echo "ERROR: Unrecognized macOS code container contains Mach-O code: $bundle_candidate"
                unknown_code_containers=1
                break
              fi
            done < <(find "$bundle_candidate" -type f -print0)
          done < <(find "$content_root" -type f -path '*/Contents/Info.plist' -print0)

          if [[ "$unknown_code_containers" -ne 0 ]]; then
            echo 'ERROR: Refusing to sign a payload containing unrecognized macOS code containers.'
            exit 1
          fi

          while IFS= read -r -d '' bundle; do
            if ! is_recognized_code_bundle "$bundle"; then
              continue
            fi

            relative_path="${bundle#$content_root/}"
            parent_path=''
            if [[ "$relative_path" == */* ]]; then
              parent_path="${relative_path%/*}"
            fi
            if [[ -n "$parent_path" ]] && path_contains_recognized_code_bundle "$content_root" "$parent_path"; then
              continue
            fi

            safe_relative=$(printf '%s' "$relative_path" | sed 's#[/\\]#__#g; s#[^A-Za-z0-9._-]#_#g')
            zip_name="${base_name}__${safe_relative}.zip"

            printf '%s\t%s\t%s\tbundle\n' "$zip_name" "$base_name" "$relative_path" >> "$mapping_tsv"
            total_bundles=$((total_bundles + 1))
          done < <(find "$content_root" -type d \( \
            -name '*.app' -o \
            -name '*.framework' -o \
            -name '*.xpc' -o \
            -name '*.appex' -o \
            -name '*.plugin' -o \
            -name '*.bundle' \
          \) -print0)

          while IFS= read -r -d '' binary; do
            if ! file "$binary" | grep -q 'Mach-O'; then
              continue
            fi

            relative_path="${binary#$content_root/}"
            if path_contains_recognized_code_bundle "$content_root" "$relative_path"; then
              continue
            fi
            if requires_dotnet_entitlements "$binary"; then
              chmod +x "$binary"
              codesign --force --sign - --options runtime --entitlements "$entitlements_source" "$binary"
              verify_dotnet_entitlements "$binary"
            fi

            safe_relative=$(printf '%s' "$relative_path" | sed 's#[/\\]#__#g; s#[^A-Za-z0-9._-]#_#g')
            zip_name="${base_name}__${safe_relative}.zip"

            printf '%s\t%s\t%s\tfile\n' "$zip_name" "$base_name" "$relative_path" >> "$mapping_tsv"
            total_binaries=$((total_binaries + 1))
          done < <(find "$content_root" -type f -print0)
        done

        if [[ $((total_binaries + total_bundles)) -eq 0 ]]; then
          echo 'ERROR: No Mach-O binaries or recognized code bundles were found in the selected macOS artifacts.'
          exit 1
        fi

        to_be_signed_dir="$work_root/toBeSigned"
        hashes_tsv="$work_root/zip-hashes-before.tsv"
        mkdir -p "$to_be_signed_dir"
        : > "$hashes_tsv"

        total_signing_zips=0
        while IFS=$'\t' read -r zip_name base_name relative_path item_type; do
          [[ -z "$base_name" ]] && continue
          signing_path="$contents_dir/$base_name/$relative_path"
          zip_path="$to_be_signed_dir/$zip_name"

          case "$item_type" in
            file)
              [[ -f "$signing_path" ]] || { echo "ERROR: Signing input file not found: $signing_path"; exit 1; }
              ;;
            bundle)
              [[ -d "$signing_path" ]] || { echo "ERROR: Signing input bundle not found: $signing_path"; exit 1; }
              ;;
            *)
              echo "ERROR: Unsupported signing input type '$item_type' for $base_name/$relative_path"
              exit 1
              ;;
          esac

          rm -f "$zip_path"
          (
            cd "$(dirname "$signing_path")"
            zip -r -y -q "$zip_path" "$(basename "$signing_path")"
          )
          zip_hash=$(shasum -a 256 "$zip_path" | awk '{print $1}')
          printf '%s\t%s\n' "$zip_name" "$zip_hash" >> "$hashes_tsv"
          total_signing_zips=$((total_signing_zips + 1))
        done < "$mapping_tsv"

        echo "Prepared $total_binaries Mach-O binaries and $total_bundles code bundles in $total_signing_zips symlink-preserving ZIPs for Developer ID signing."
      displayName: Prepare macOS Signing Inputs
    - task: PublishPipelineArtifact@1
      displayName: Publish macOS Signing Inputs
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/macos-signing-inputs
        artifact: macos-signing-inputs-$(MacOSArchitecture)
        publishLocation: pipeline

  - job: SignMacOSBinaries
    displayName: ESRP Sign macOS Binaries
    dependsOn: AnalyzeMacOS
    condition: succeeded()
    strategy:
      matrix:
        arm64:
          MacOSArchitecture: arm64
        x64:
          MacOSArchitecture: x64
    pool:
      name: ${{ parameters.windows_pool }}
    timeoutInMinutes: 60
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download macOS Signing Inputs
      inputs:
        buildType: current
        artifactName: macos-signing-inputs-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/macos-signing-inputs
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $entitlementsPath = "$(Pipeline.Workspace)/macos-signing-inputs/azclips-runtime.entitlements.plist"
        if (-not (Test-Path $entitlementsPath)) {
          throw "macOS signing entitlements file was not found: $entitlementsPath"
        }

        $jsonSafeEntitlementsPath = $entitlementsPath.Replace('\', '/')
        Write-Host "##vso[task.setvariable variable=MacOSEntitlementsPath]$jsonSafeEntitlementsPath"
      displayName: Resolve macOS Entitlements Path For ESRP
    - task: EsrpCodeSigning@6
      displayName: Sign macOS Binaries [MacAppDeveloperSign]
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/macos-signing-inputs/toBeSigned'
        Pattern: '*.zip'
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_apple_keycode }}",
              "OperationCode": "MacAppDeveloperSign",
              "Parameters": {
                "Hardening": "--options=runtime",
                "Entitlements": "$(MacOSEntitlementsPath)",
                "OpusInfo": "http://Microsoft.com"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $signedZipsDir = "$(Pipeline.Workspace)/macos-signing-inputs/toBeSigned"
        $mappingPath = "$(Pipeline.Workspace)/macos-signing-inputs/file-mapping.tsv"
        $hashesPath = "$(Pipeline.Workspace)/macos-signing-inputs/zip-hashes-before.tsv"
        $outputDir = "$(Build.ArtifactStagingDirectory)/macos-signed-zips"

        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

        $originalHashes = @{}
        Get-Content $hashesPath | ForEach-Object {
          if ([string]::IsNullOrWhiteSpace($_)) {
            return
          }
          $parts = $_ -split "`t", 2
          if ($parts.Count -eq 2) {
            $originalHashes[$parts[0]] = $parts[1]
          }
        }

        $count = 0
        $unchangedZips = @()
        Get-Content $mappingPath | ForEach-Object {
          if ([string]::IsNullOrWhiteSpace($_)) {
            return
          }

          $parts = $_ -split "`t", 4
          if ($parts.Count -ne 4) {
            throw "Invalid file mapping row: $_"
          }

          $zipName = $parts[0]
          $baseName = $parts[1]
          $relativePath = $parts[2]
          $itemType = $parts[3]
          $zipPath = Join-Path $signedZipsDir $zipName

          if (-not (Test-Path $zipPath)) {
            throw "Signed zip not found: $zipPath"
          }

          $signedHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          if ($originalHashes.ContainsKey($zipName) -and $originalHashes[$zipName] -eq $signedHash) {
            $unchangedZips += $zipName
          }

          if ($itemType -notin @('file', 'bundle')) {
            throw "Unsupported signing input type '$itemType': $_"
          }

          Copy-Item -Path $zipPath -Destination (Join-Path $outputDir $zipName) -Force
          $count++
        }

        Write-Host "Collected $count signed macOS ZIPs without extracting them on Windows."
        if ($unchangedZips.Count -gt 0) {
          Write-Host "##vso[task.logissue type=error]ESRP did not modify $($unchangedZips.Count) macOS signing ZIP(s). MacAppDeveloperSign did not produce signed output."
          $unchangedZips | Select-Object -First 20 | ForEach-Object { Write-Host "  unchanged: $_" }
          throw 'ESRP macOS signing output matched the unsigned input.'
        }
      displayName: Collect Signed macOS ZIPs
    - task: PublishPipelineArtifact@1
      displayName: Publish Signed macOS ZIPs
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/macos-signed-zips
        artifact: macos-signed-zips-$(MacOSArchitecture)
        publishLocation: pipeline

  - job: CreateMacOSNotarizationBundles
    displayName: Create macOS Notarization Bundles
    dependsOn:
    - AnalyzeMacOS
    - SignMacOSBinaries
    condition: succeeded()
    strategy:
      matrix:
        arm64:
          MacOSArchitecture: arm64
          MacOSVmImage: ${{ parameters.macos_arm64_pool }}
        x64:
          MacOSArchitecture: x64
          MacOSVmImage: ${{ parameters.macos_intel_pool }}
    pool:
      vmImage: $(MacOSVmImage)
    timeoutInMinutes: 60
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download macOS Signing Inputs
      inputs:
        buildType: current
        artifactName: macos-signing-inputs-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/macos-signing-inputs
    - task: DownloadPipelineArtifact@2
      displayName: Download Signed macOS ZIPs
      inputs:
        buildType: current
        artifactName: macos-signed-zips-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/macos-signed-zips
    - bash: |
        set -euo pipefail
        input_root="$(Pipeline.Workspace)/macos-signing-inputs"
        signed_zip_root="$(Pipeline.Workspace)/macos-signed-zips"
        signed_extract_root="$(Pipeline.Workspace)/macos-signed-extract"
        signed_contents_root="$(Build.ArtifactStagingDirectory)/signed-contents"
        notarization_root="$(Build.ArtifactStagingDirectory)/macos-notarization-bundles"
        mkdir -p "$signed_extract_root" "$signed_contents_root" "$notarization_root"

        verify_macho_signature() {
          local candidate="$1"
          local signature_details
          local failed=0

          if ! codesign --verify --deep --strict --verbose=4 "$candidate"; then
            echo "ERROR: Strict codesign verification failed before notarization: $candidate"
            failed=1
          fi

          signature_details=$(codesign -dvvv "$candidate" 2>&1 || true)
          if ! printf '%s\n' "$signature_details" | grep -q 'TeamIdentifier=UBF8T346G9'; then
            echo "ERROR: Microsoft TeamIdentifier missing before notarization: $candidate"
            failed=1
          fi
          if ! printf '%s\n' "$signature_details" | grep -q 'flags=.*runtime'; then
            echo "ERROR: Hardened runtime flag missing before notarization: $candidate"
            failed=1
          fi
          if ! printf '%s\n' "$signature_details" | grep -q '^Timestamp='; then
            echo "ERROR: Signing timestamp missing before notarization: $candidate"
            failed=1
          fi

          return "$failed"
        }

        verify_code_bundle() {
          local candidate="$1"
          local signature_details
          local failed=0

          if ! codesign --verify --deep --strict --verbose=4 "$candidate"; then
            echo "ERROR: Strict code bundle verification failed before notarization: $candidate"
            failed=1
          fi

          signature_details=$(codesign -dvvv "$candidate" 2>&1 || true)
          if ! printf '%s\n' "$signature_details" | grep -q 'TeamIdentifier=UBF8T346G9'; then
            echo "ERROR: Microsoft TeamIdentifier missing from code bundle before notarization: $candidate"
            failed=1
          fi
          if ! printf '%s\n' "$signature_details" | grep -q 'flags=.*runtime'; then
            echo "ERROR: Hardened runtime flag missing from code bundle before notarization: $candidate"
            failed=1
          fi
          if ! printf '%s\n' "$signature_details" | grep -q '^Timestamp='; then
            echo "ERROR: Signing timestamp missing from code bundle before notarization: $candidate"
            failed=1
          fi

          return "$failed"
        }

        verify_dotnet_entitlements() {
          local candidate="$1"
          local entitlements
          local failed=0

          entitlements=$(codesign -d --entitlements - "$candidate" 2>&1 || true)
          for entitlement in \
            'com.apple.security.cs.allow-jit' \
            'com.apple.security.cs.allow-unsigned-executable-memory' \
            'com.apple.security.cs.disable-library-validation'; do
            if ! printf '%s\n' "$entitlements" | grep -q "$entitlement"; then
              echo "ERROR: Required .NET entitlement '$entitlement' missing before notarization: $candidate"
              failed=1
            fi
          done

          return "$failed"
        }

        cp -R "$input_root/contents/." "$signed_contents_root/"

        while IFS=$'\t' read -r zip_name base_name relative_path item_type; do
          [[ -z "$base_name" ]] && continue
          signed_zip="$signed_zip_root/$zip_name"
          extract_root="$signed_extract_root/${zip_name%.zip}"
          signed_item="$extract_root/$(basename "$relative_path")"
          target="$signed_contents_root/$base_name/$relative_path"
          if [[ ! -f "$signed_zip" ]]; then
            echo "ERROR: Signed ZIP not found: $signed_zip"
            exit 1
          fi

          rm -rf "$extract_root"
          mkdir -p "$extract_root"
          unzip -q "$signed_zip" -d "$extract_root"

          expected_item_name=$(basename "$relative_path")
          package_sidecar_name="${expected_item_name%.*}.pkg"
          while IFS= read -r -d '' extracted_item; do
            extracted_name=$(basename "$extracted_item")
            if [[ "$extracted_name" == "$expected_item_name" ]]; then
              continue
            fi
            if [[ "$item_type" == bundle && "$extracted_name" == "$package_sidecar_name" && -f "$extracted_item" ]]; then
              echo "Ignoring ESRP package sidecar after bundle signing: $extracted_name"
              continue
            fi

            echo "ERROR: Unexpected top-level item '$extracted_name' in signed ZIP: $signed_zip"
            exit 1
          done < <(find "$extract_root" -mindepth 1 -maxdepth 1 -print0)

          case "$item_type" in
            file)
              if [[ ! -f "$signed_item" ]]; then
                echo "ERROR: Signed binary not found: $signed_item"
                exit 1
              fi
              cp "$signed_item" "$target"
              chmod +x "$target" || true
              ;;
            bundle)
              if [[ ! -d "$signed_item" ]]; then
                echo "ERROR: Signed code bundle not found: $signed_item"
                exit 1
              fi
              rm -rf "$target"
              cp -R "$signed_item" "$target"
              ;;
            *)
              echo "ERROR: Unsupported signing input type '$item_type' for $base_name/$relative_path"
              exit 1
              ;;
          esac
        done < "$input_root/file-mapping.tsv"

        verification_errors=0
        while IFS= read -r -d '' candidate; do
          if file "$candidate" | grep -q 'Mach-O'; then
            chmod +x "$candidate"
          fi
        done < <(find "$signed_contents_root" -type f -print0)

        total_code_bundles=0
        while IFS=$'\t' read -r _zip_name base_name relative_path item_type; do
          [[ "$item_type" == bundle ]] || continue
          candidate="$signed_contents_root/$base_name/$relative_path"
          total_code_bundles=$((total_code_bundles + 1))
          if ! verify_code_bundle "$candidate"; then
            verification_errors=1
          fi
        done < "$input_root/file-mapping.tsv"

        total_macho=0
        while IFS= read -r -d '' candidate; do
          if ! file "$candidate" | grep -q 'Mach-O'; then
            continue
          fi

          total_macho=$((total_macho + 1))
          if ! verify_macho_signature "$candidate"; then
            verification_errors=1
          fi

          case "$(basename "$candidate")" in
            az|azclips-agent)
              if ! verify_dotnet_entitlements "$candidate"; then
                verification_errors=1
              fi
              ;;
          esac
        done < <(find "$signed_contents_root" -type f -print0)

        if [[ "$total_macho" -eq 0 ]]; then
          echo 'ERROR: No Mach-O binaries found before notarization.'
          verification_errors=1
        fi
        if [[ "$verification_errors" -ne 0 ]]; then
          echo 'ERROR: macOS payload validation failed; notarization ZIPs will not be created.'
          exit 1
        fi
        echo "Validated $total_macho signed Mach-O binaries and $total_code_bundles code bundles before notarization."

        for content_dir in "$signed_contents_root"/*; do
          [[ -d "$content_dir" ]] || continue
          base_name=$(basename "$content_dir")
          (
            cd "$content_dir"
            zip -r -y -q "$notarization_root/$base_name-signed.zip" .
          )
          echo "Created notarization bundle: $base_name-signed.zip"
        done
      displayName: Create Notarization ZIPs
    - task: PublishPipelineArtifact@1
      displayName: Publish macOS Notarization Bundles
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/macos-notarization-bundles
        artifact: macos-notarization-bundles-$(MacOSArchitecture)
        publishLocation: pipeline

  - job: NotarizeMacOSBundles
    displayName: ESRP Notarize macOS Bundles
    dependsOn: CreateMacOSNotarizationBundles
    condition: succeeded()
    strategy:
      matrix:
        arm64:
          MacOSArchitecture: arm64
        x64:
          MacOSArchitecture: x64
    pool:
      name: ${{ parameters.windows_pool }}
    timeoutInMinutes: 60
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download macOS Notarization Bundles
      inputs:
        buildType: current
        artifactName: macos-notarization-bundles-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/toNotarize
    - task: EsrpCodeSigning@6
      displayName: Notarize macOS Bundles [MacAppNotarize]
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        batchSignPolicyFile: ''
        ciPolicyFile: ''
        FolderPath: '$(Pipeline.Workspace)/toNotarize'
        UseMinimatch: true
        Pattern: '*.zip'
        signConfigType: inlineSignParams
        SessionTimeout: '120'
        MaxConcurrency: '1'
        MaxRetryAttempts: '3'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_apple_keycode }}",
              "OperationCode": "MacAppNotarize",
              "Parameters": {
                "BundleId": "${{ parameters.macos_bundle_id }}",
                "OpusInfo": "http://Microsoft.com"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]
    # Loose Mach-O binaries cannot be stapled; this artifact records the exact
    # bundle payloads that successfully passed Apple's notarization service.
    - task: PublishPipelineArtifact@1
      displayName: Publish Notarized macOS Bundles
      inputs:
        targetPath: $(Pipeline.Workspace)/toNotarize
        artifact: macos-notarized-bundles-$(MacOSArchitecture)
        publishLocation: pipeline
  - job: CreateSignedMacOSTarballs
    displayName: Create Signed macOS Tarballs
    dependsOn:
    - AnalyzeMacOS
    - SignMacOSBinaries
    - NotarizeMacOSBundles
    condition: succeeded()
    strategy:
      matrix:
        arm64:
          MacOSArchitecture: arm64
          MacOSVmImage: ${{ parameters.macos_arm64_pool }}
        x64:
          MacOSArchitecture: x64
          MacOSVmImage: ${{ parameters.macos_intel_pool }}
    pool:
      vmImage: $(MacOSVmImage)
    timeoutInMinutes: 60
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download macOS Signing Inputs
      inputs:
        buildType: current
        artifactName: macos-signing-inputs-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/macos-signing-inputs
    - task: DownloadPipelineArtifact@2
      displayName: Download Notarized macOS Bundles
      inputs:
        buildType: current
        artifactName: macos-notarized-bundles-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/macos-notarized-bundles
    - bash: |
        set -euo pipefail
        input_root="$(Pipeline.Workspace)/macos-signing-inputs"
        notarized_bundle_root="$(Pipeline.Workspace)/macos-notarized-bundles"
        final_contents_root="$(Build.ArtifactStagingDirectory)/final-contents"
        output_root="$(Build.ArtifactStagingDirectory)/signed-macos"
        mkdir -p "$final_contents_root" "$output_root"

        verify_macho_signature() {
          local candidate="$1"
          local signature_details
          local failed=0

          if ! codesign -v "$candidate" 2>/dev/null; then
            echo "ERROR: Basic codesign verification failed: $candidate"
            failed=1
          fi
          if ! codesign --verify --deep --strict "$candidate" 2>/dev/null; then
            echo "ERROR: Strict codesign verification failed: $candidate"
            failed=1
          fi

          signature_details=$(codesign -dvvv "$candidate" 2>&1 || true)
          if ! printf '%s\n' "$signature_details" | grep -q 'TeamIdentifier=UBF8T346G9'; then
            echo "ERROR: Microsoft TeamIdentifier missing: $candidate"
            printf '%s\n' "$signature_details" | grep -E '^(Authority|TeamIdentifier|Identifier|CDHash)=' || true
            failed=1
          fi
          if ! printf '%s\n' "$signature_details" | grep -q 'flags=.*runtime'; then
            echo "ERROR: Hardened runtime flag missing: $candidate"
            printf '%s\n' "$signature_details" | grep -E '^(CodeDirectory|Runtime Version) ' || true
            failed=1
          fi
          if ! printf '%s\n' "$signature_details" | grep -q '^Timestamp='; then
            echo "ERROR: Signing timestamp missing: $candidate"
            failed=1
          fi

          return "$failed"
        }

        verify_dotnet_entitlements() {
          local candidate="$1"
          local entitlements
          local failed=0

          entitlements=$(codesign -d --entitlements - "$candidate" 2>&1 || true)
          for entitlement in \
            'com.apple.security.cs.allow-jit' \
            'com.apple.security.cs.allow-unsigned-executable-memory' \
            'com.apple.security.cs.disable-library-validation'; do
            if ! printf '%s\n' "$entitlements" | grep -q "$entitlement"; then
              echo "ERROR: Required .NET entitlement '$entitlement' missing: $candidate"
              failed=1
            fi
          done

          return "$failed"
        }

        find_az_entrypoint() {
          local content_dir="$1"
          if [[ -f "$content_dir/az" ]]; then
            printf '%s\n' "$content_dir/az"
          elif [[ -f "$content_dir/libexec/bin/az" ]]; then
            printf '%s\n' "$content_dir/libexec/bin/az"
          elif [[ -e "$content_dir/bin/az" ]]; then
            printf '%s\n' "$content_dir/bin/az"
          fi
        }

        verification_errors=0
        for tarball in "$input_root"/tarballs/*.tar.gz; do
          [[ -f "$tarball" ]] || continue
          tarball_name=$(basename "$tarball")
          base_name="${tarball_name%.tar.gz}"
          content_dir="$final_contents_root/$base_name"
          mach_o_count=0
          notarized_zip="$notarized_bundle_root/$base_name-signed.zip"

          rm -rf "$content_dir"
          mkdir -p "$content_dir"

          if [[ ! -f "$notarized_zip" ]]; then
            echo "ERROR: Notarized macOS bundle not found: $notarized_zip"
            verification_errors=1
            continue
          fi

          if ! unzip -tq "$notarized_zip" >/dev/null; then
            echo "ERROR: Notarized macOS bundle failed ZIP integrity test: $notarized_zip"
            verification_errors=1
            continue
          fi

          unzip -q "$notarized_zip" -d "$content_dir"
          echo "Extracted notarized macOS bundle: $(basename "$notarized_zip")"

          if [[ -e "$content_dir/libexec/bin/az" ]]; then
            mkdir -p "$content_dir/bin"
            if [[ -L "$content_dir/bin/az" ]]; then
              echo "bin/az symlink preserved"
            else
              rm -f "$content_dir/bin/az"
              ln -s ../libexec/bin/az "$content_dir/bin/az"
              echo "Recreated symlink: bin/az -> ../libexec/bin/az"
            fi
          fi

          find "$content_dir" -name "*.so" -exec chmod +x {} \;
          find "$content_dir" -name "*.dylib" -exec chmod +x {} \;
          chmod +x "$content_dir/az" 2>/dev/null || true
          chmod +x "$content_dir/bin/az" 2>/dev/null || true
          chmod +x "$content_dir/libexec/bin/az" 2>/dev/null || true

          while IFS= read -r -d '' candidate; do
            candidate_info="$(file "$candidate")"
            if [[ "$candidate_info" != *"Mach-O"* ]]; then
              continue
            fi

            mach_o_count=$((mach_o_count + 1))
            if ! verify_macho_signature "$candidate"; then
              verification_errors=1
            fi
          done < <(find "$content_dir" -type f -print0)

          if [[ "$mach_o_count" -eq 0 ]]; then
            echo "ERROR: No Mach-O binaries found in signed payload: $base_name"
            verification_errors=1
          fi

          entrypoint="$(find_az_entrypoint "$content_dir")"
          if [[ -z "$entrypoint" ]]; then
            echo "ERROR: Signed payload does not contain an az entrypoint: $base_name"
            verification_errors=1
          else
            if ! verify_dotnet_entitlements "$entrypoint"; then
              verification_errors=1
            fi

            host_arch="$(uname -m)"
            entrypoint_info="$(file "$entrypoint" 2>/dev/null || true)"
            runnable=true
            if [[ "$host_arch" == "arm64" ]]; then
              if [[ "$entrypoint_info" != *"arm64"* && "$entrypoint_info" != *"universal"* ]]; then
                runnable=false
              fi
            elif [[ "$host_arch" == "x86_64" ]]; then
              if [[ "$entrypoint_info" != *"x86_64"* && "$entrypoint_info" != *"universal"* ]]; then
                runnable=false
              fi
            fi

            if [[ "$runnable" == "true" ]]; then
              smoke_home="$content_dir/.azclips-smoke-home"
              mkdir -p "$smoke_home"
              if ! HOME="$smoke_home" "$entrypoint" --help >/tmp/azclips-signed-help.txt 2>&1; then
                echo "ERROR: Signed macOS payload failed to launch: $base_name"
                cat /tmp/azclips-signed-help.txt
                verification_errors=1
              else
                echo "Signed macOS payload launch check passed: $base_name"
              fi
              rm -rf "$smoke_home"
            else
              echo "Skipping signed payload launch check for $base_name; host architecture '$host_arch' is not compatible with: $entrypoint_info"
            fi
          fi

          tar -czf "$output_root/$base_name.tar.gz" --preserve-permissions -C "$content_dir" .
          shasum -a 256 "$output_root/$base_name.tar.gz" > "$output_root/$base_name.tar.gz.sha256"
          echo "Created signed macOS tarball: $base_name.tar.gz"
        done

        if [[ "$verification_errors" -ne 0 ]]; then
          exit 1
        fi
      displayName: Verify And Package Signed macOS Tarballs
    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      displayName: Generate SBOM For Signed macOS Artifacts
      inputs:
        BuildDropPath: $(Build.ArtifactStagingDirectory)/signed-macos
    - task: PublishPipelineArtifact@1
      displayName: Publish Signed macOS Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-macos
        artifact: signed-macos-$(MacOSArchitecture)
        publishLocation: pipeline
