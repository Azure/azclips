parameters:
- name: windows_pool
  type: string
- name: SourceProject
  type: string
  default: 'public'
- name: source_pipeline_name
  type: string
  default: 'azclips-adhoc-build'
- name: source_build_id
  type: string
  default: ''
- name: source_artifact_name
  type: string
  default: 'Final_Build_Distribution'
- name: source_artifact_source
  type: string
  default: 'specific'
- name: esrp_service_connection
  type: string
  default: ''
- name: esrp_nuget_keycode
  type: string
  default: ''
- name: esrp_enable_nuget_verify
  type: boolean
  default: true

jobs:
  - job: SignNuget
    displayName: Sign NuGet Artifacts
    pool:
      name: ${{ parameters.windows_pool }}
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true
    - ${{ if eq(parameters.source_artifact_source, 'current') }}:
      - task: DownloadPipelineArtifact@2
        displayName: Download Unsigned Distribution Artifacts
        inputs:
          artifact: ${{ parameters.source_artifact_name }}
          path: $(Pipeline.Workspace)/unsigned-all
    - ${{ if ne(parameters.source_artifact_source, 'current') }}:
      - task: DownloadPipelineArtifact@2
        displayName: Download Unsigned Distribution Artifacts
        inputs:
          buildType: specific
          project: ${{ parameters.SourceProject }}
          definition: ${{ parameters.source_pipeline_name }}
          buildVersionToDownload: specific
          pipelineId: ${{ parameters.source_build_id }}
          artifact: ${{ parameters.source_artifact_name }}
          path: $(Pipeline.Workspace)/unsigned-all
    - task: PowerShell@2
      displayName: Filter NuGet Release Artifacts
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = "$(Pipeline.Workspace)/unsigned-all"
          $targetRoot = "$(Pipeline.Workspace)/unsigned"
          Remove-Item $targetRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null
          $allNupkgs = Get-ChildItem -Path $sourceRoot -Recurse -File | Where-Object {
            $_.Name -like '*.nupkg' -and $_.Name -notlike '*.snupkg'
          }
          $selected = $allNupkgs | Where-Object {
            $_.Name -like 'Microsoft.Azure.Azclips*.nupkg' -or
            $_.Name -like 'azcli.extensions.*.nupkg'
          }
          if (-not $selected) {
            throw "No NuGet release artifacts found under $sourceRoot (expected Microsoft.Azure.Azclips*.nupkg or azcli.extensions.*.nupkg)"
          }
          foreach ($asset in $selected) {
            Copy-Item $asset.FullName -Destination (Join-Path $targetRoot $asset.Name) -Force
          }
          Write-Host "Selected $($selected.Count) Azclips NuGet release artifacts."

          $excluded = $allNupkgs | Where-Object {
            $_.Name -notlike 'Microsoft.Azure.Azclips*.nupkg' -and
            $_.Name -notlike 'azcli.extensions.*.nupkg'
          }
          if ($excluded) {
            Write-Host "Excluded non-Azclips nupkgs from ESRP submission:"
            foreach ($pkg in $excluded) {
              Write-Host "  $($pkg.Name)"
            }
          }
    - task: PowerShell@2
      displayName: Prepare Signing Inputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/prepare_signing_inputs.ps1
        arguments: >-
          -UnsignedRoot "$(Pipeline.Workspace)/unsigned"
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PowerShell@2
      displayName: List NuGet Artifacts To Be Signed
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $nupkgRoot = "$(Pipeline.Workspace)/signing-work/nupkg"
          if (-not (Test-Path $nupkgRoot)) {
            throw "NuGet signing input folder not found: $nupkgRoot"
          }

          $files = Get-ChildItem -Path $nupkgRoot -File | Where-Object {
            $_.Name -like 'Microsoft.Azure.Azclips*.nupkg' -or
            $_.Name -like 'azcli.extensions.*.nupkg'
          } | Sort-Object Name
          if (-not $files) {
            throw "No .nupkg files found for signing in $nupkgRoot"
          }

          Write-Host "NuGet signing candidates ($($files.Count))"
          foreach ($file in $files) {
            Write-Host ("  {0}  ({1} bytes)" -f $file.Name, $file.Length)
          }

          $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host "NuGet total bytes to sign: $totalBytes"
    - task: EsrpCodeSigning@6
      displayName: Sign NuGet Packages [NuGetSign]
      condition: eq(variables['HasNupkg'], 'true')
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        batchSignPolicyFile: ''
        ciPolicyFile: ''
        FolderPath: '$(Pipeline.Workspace)/signing-work/nupkg'
        UseMinimatch: true
        Pattern: '*.nupkg'
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_nuget_keycode }}",
              "OperationCode": "NuGetSign",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]
    - ${{ if eq(parameters.esrp_enable_nuget_verify, true) }}:
      - task: EsrpCodeSigning@6
        displayName: Verify NuGet Packages In ESRP [NuGetVerify]
        condition: eq(variables['HasNupkg'], 'true')
        inputs:
          ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/signing-work/nupkg'
          UseMinimatch: true
          Pattern: '*.nupkg'
          signConfigType: inlineSignParams
          SessionTimeout: '60'
          MaxConcurrency: '25'
          MaxRetryAttempts: '5'
          inlineOperation: |
            [
              {
                "KeyCode": "${{ parameters.esrp_nuget_keycode }}",
                "OperationCode": "NuGetVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]
    - task: PowerShell@2
      displayName: Verify Signed Outputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/verify_signed_outputs.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -RequireNupkg $true
        pwsh: true
    - task: PowerShell@2
      displayName: Repack Signed Outputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/repack_signed_outputs.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PublishPipelineArtifact@1
      displayName: Publish Signed NuGet Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-release
        artifact: signed-nuget
        publishLocation: pipeline
