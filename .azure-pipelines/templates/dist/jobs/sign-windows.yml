parameters:
- name: windows_pool
  type: string
  default: 'windows-latest'
- name: SourceProject
  type: string
  default: 'public'
- name: source_pipeline_name
  type: string
  default: 'cirrus-adhoc-build'
- name: source_build_id
  type: string
  default: ''
- name: source_artifact_name
  type: string
  default: 'Distribution_Final'
- name: esrp_service_connection
  type: string
  default: ''
- name: esrp_authenticode_keycode
  type: string
  default: 'CP-230012'
- name: esrp_enable_windows_verify
  type: boolean
  default: true
- name: esrp_enable_windows_timestamp
  type: boolean
  default: true
- name: esrp_require_windows_strong_name
  type: boolean
  default: false
- name: windows_sign_architectures
  type: object
  default:
  - x64

jobs:
  - job: SignWindows
    displayName: Sign Windows Artifacts
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        version: '8.0.x'
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: ${{ parameters.SourceProject }}
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        artifactName: ${{ parameters.source_artifact_name }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - task: PowerShell@2
      displayName: Filter Windows Release Artifacts
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = "$(Pipeline.Workspace)/unsigned-all"
          $targetRoot = "$(Pipeline.Workspace)/unsigned"
          $architectureCsv = '${{ join(',', parameters.windows_sign_architectures) }}'
          $architectures = $architectureCsv.Split(',') |
            ForEach-Object { "$($_)".Trim().ToLowerInvariant() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if (-not $architectures) {
            throw "windows_sign_architectures resolved to an empty list."
          }

          Write-Host "Windows signing architectures: $($architectures -join ', ')"

          Remove-Item $targetRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null

          $allWindowsAssets = Get-ChildItem -Path $sourceRoot -Recurse -File | Where-Object {
            $_.Name -like '*win-*.zip'
          }

          $selected = foreach ($asset in $allWindowsAssets) {
            $name = $asset.Name.ToLowerInvariant()
            foreach ($arch in $architectures) {
              if ($name.Contains($arch)) {
                $asset
                break
              }
            }
          }

          if (-not $selected) {
            throw "No Windows release artifacts matched architectures [$($architectures -join ', ')] under $sourceRoot"
          }

          foreach ($asset in $selected) {
            Copy-Item $asset.FullName -Destination (Join-Path $targetRoot $asset.Name) -Force
          }
          Write-Host "Selected $($selected.Count) Windows release artifacts."
    - task: PowerShell@2
      displayName: Prepare Signing Inputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/prepare_signing_inputs.ps1
        arguments: >-
          -UnsignedRoot "$(Pipeline.Workspace)/unsigned"
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PowerShell@2
      displayName: List Windows Artifacts To Be Signed
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $windowsRoot = "$(Pipeline.Workspace)/signing-work/windows-extracted"
          if (-not (Test-Path $windowsRoot)) {
            throw "Windows signing input folder not found: $windowsRoot"
          }

          $files = Get-ChildItem -Path $windowsRoot -Recurse -File | Where-Object {
            $_.Name -ieq 'azv2.exe' -or
            $_.Name -like 'Microsoft.Azure.Cirrus*.dll' -or
            $_.Name -like 'Microsoft.Azure.Cirrus*.exe'
          } | Sort-Object FullName

          if (-not $files) {
            throw "No Windows binaries found for signing in $windowsRoot"
          }

          Write-Host "Windows signing candidates ($($files.Count))"
          foreach ($file in $files) {
            $relative = $file.FullName.Substring($windowsRoot.Length).TrimStart('\\')
            Write-Host ("  {0}  ({1} bytes)" -f $relative, $file.Length)
          }

          $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host "Windows total bytes to sign: $totalBytes"
    - ${{ if eq(parameters.esrp_enable_windows_timestamp, true) }}:
      - task: EsrpCodeSigning@5
        displayName: Sign Windows Payload [azv2.exe]
        condition: eq(variables['HasWindowsPayload'], 'true')
        inputs:
          ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
          UseMinimatch: true
          Pattern: '**/azv2.exe'
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "http://www.microsoft.com",
                  "FileDigest": "/fd \"SHA256\"",
                  "PageHash": "/NPH",
                  "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
              },
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]
      - task: EsrpCodeSigning@5
        displayName: Sign Windows Payload [Cirrus DLLs]
        condition: eq(variables['HasWindowsPayload'], 'true')
        inputs:
          ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
          UseMinimatch: true
          Pattern: '**/Microsoft.Azure.Cirrus*.dll'
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "http://www.microsoft.com",
                  "FileDigest": "/fd \"SHA256\"",
                  "PageHash": "/NPH",
                  "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
              },
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]
      - task: EsrpCodeSigning@5
        displayName: Sign Windows Payload [Cirrus EXEs]
        condition: eq(variables['HasWindowsPayload'], 'true')
        inputs:
          ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
          UseMinimatch: true
          Pattern: '**/Microsoft.Azure.Cirrus*.exe'
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "http://www.microsoft.com",
                  "FileDigest": "/fd \"SHA256\"",
                  "PageHash": "/NPH",
                  "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
              },
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]
    - ${{ if ne(parameters.esrp_enable_windows_timestamp, true) }}:
      - task: EsrpCodeSigning@5
        displayName: Sign Windows Payload [azv2.exe]
        condition: eq(variables['HasWindowsPayload'], 'true')
        inputs:
          ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
          UseMinimatch: true
          Pattern: '**/azv2.exe'
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "http://www.microsoft.com",
                  "FileDigest": "/fd \"SHA256\"",
                  "PageHash": "/NPH"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
              },
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolVerify",
                "Parameters": {},
                "ToolName": "sign",
