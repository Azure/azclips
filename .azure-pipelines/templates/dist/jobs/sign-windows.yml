    - task: PowerShell@2
      displayName: Verify Signed Outputs
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $requireStrongName = [System.Convert]::ToBoolean('${{ parameters.esrp_require_windows_strong_name }}')
          & "$(Build.SourcesDirectory)/devops/scripts/packaging/signing/verify_signed_outputs.ps1" `
            -WorkingRoot "$(Pipeline.Workspace)/signing-work" `
            -RequireWindowsAuthenticode $true `
            -RequireStrongName $requireStrongName
    - task: PowerShell@2
      displayName: Repack Signed Outputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/repack_signed_outputs.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      displayName: Generate SBOM For Signed Windows Artifacts
      inputs:
        BuildDropPath: $(Build.ArtifactStagingDirectory)/signed-release
    - task: PublishPipelineArtifact@1
      displayName: Publish Signed Windows Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-release
        artifact: signed-windows
        publishLocation: pipeline
