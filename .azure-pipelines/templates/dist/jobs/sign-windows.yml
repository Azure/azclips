    - ${{ if eq(parameters.esrp_enable_windows_verify, true) }}:
      - task: EsrpCodeSigning@5
        displayName: Verify Windows Payload In ESRP [azv2.exe]
        condition: eq(variables['HasWindowsPayload'], 'true')
        inputs:
