parameters:
- name: ubuntu_pool
  type: string
  default: 'pool-ubuntu-2204'

jobs:
- job: UnitTests
  displayName: Unit Tests
  timeoutInMinutes: 30
  pool:
    name: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    retryCountOnTaskFailure: 3

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - script: |
      set -euo pipefail
      dotnet restore azclips.slnx
      dotnet test azclips.slnx -c Release --verbosity normal
    displayName: Run Unit Tests
