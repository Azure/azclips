parameters:
- name: ubuntu_pool
  type: string
- name: windows_pool
  type: string

jobs:
- job: UnitTests
  displayName: Unit Tests (Linux)
  timeoutInMinutes: 30
  pool:
    name: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - bash: |
      set -euo pipefail
      python3 -m unittest discover -s devops/scripts/ci -p test_pipeline_input_safety.py -v
    displayName: Run Pipeline Input Safety Tests

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - script: |
      set -euo pipefail
      dotnet restore azclips.slnx
      dotnet build azclips.slnx -c Release --no-restore
      dotnet test azclips.slnx -c Release --no-build --no-restore --verbosity normal --filter "FullyQualifiedName!~Scenario.Tests&Category!=LocalOnly"
    displayName: Run Unit Tests

- job: UnitTestsWindows
  displayName: Unit Tests (Windows)
  timeoutInMinutes: 30
  pool:
    name: ${{ parameters.windows_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - task: PowerShell@2
    displayName: Run Unit Tests
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        dotnet restore azclips.slnx
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build azclips.slnx -c Release --no-restore
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test azclips.slnx -c Release --no-build --no-restore --verbosity normal --filter "FullyQualifiedName!~Scenario.Tests&Category!=LocalOnly" --logger trx --results-directory "$(Agent.TempDirectory)/windows-unit-tests"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  - task: PublishTestResults@2
    displayName: Publish Windows Unit Test Results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '$(Agent.TempDirectory)/windows-unit-tests/**/*.trx'
      testRunTitle: Windows Unit Tests

# The scenario suite runs apart from the unit tests so a recording failure surfaces as its
# own check, and the suite can grow without stretching the unit job.
- job: ScenarioTests
  displayName: Scenario Tests
  timeoutInMinutes: 30
  pool:
    name: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - script: |
      set -euo pipefail
      dotnet restore tests/Scenario.Tests/Scenario.Tests.csproj
      dotnet build tests/Scenario.Tests/Scenario.Tests.csproj -c Release --no-restore
      dotnet test tests/Scenario.Tests/Scenario.Tests.csproj -c Release --no-build --no-restore --verbosity normal
    displayName: Run Scenario Tests
