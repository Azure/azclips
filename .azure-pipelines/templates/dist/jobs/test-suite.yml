parameters:
- name: ubuntu_pool
  type: string
  default: 'ubuntu-latest'

jobs:
- job: UnitTests
  displayName: Unit Tests
  timeoutInMinutes: 60
  pool:
    vmImage: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    retryCountOnTaskFailure: 3

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - script: |
      set -euo pipefail
      dotnet restore cirrus.slnx
      dotnet build cirrus.slnx --no-restore -c Release
      dotnet test cirrus.slnx --no-build -c Release --verbosity normal
    displayName: Run Unit Tests

  - script: |
      set -euo pipefail
      dotnet run --project tools/Help/Cirrus.Help.Tool/Cirrus.Help.Tool.csproj --configuration Release -- \
        --artifacts-root artifacts/Release \
        --output-root artifacts/help
    displayName: Validate Help Content

  - script: |
      set -euo pipefail
      dotnet restore tools/Help/Cirrus.Help.Tool.Tests/Cirrus.Help.Tool.Tests.csproj
      dotnet build tools/Help/Cirrus.Help.Tool.Tests/Cirrus.Help.Tool.Tests.csproj --no-restore --configuration Release
      dotnet test tools/Help/Cirrus.Help.Tool.Tests/Cirrus.Help.Tool.Tests.csproj --no-build --configuration Release --verbosity normal
    displayName: Run Help Tool Tests
