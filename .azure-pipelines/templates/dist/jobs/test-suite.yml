parameters:
- name: ubuntu_pool
  type: string
  default: 'ubuntu-latest'

jobs:
- job: UnitTests
  displayName: Unit Tests
  timeoutInMinutes: 60
  pool:
    vmImage: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    retryCountOnTaskFailure: 3

  - task: UseDotNet@2
    displayName: .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true

  - script: |
      set -euo pipefail
      dotnet restore cirrus.slnx
      dotnet test cirrus.slnx -c Release --verbosity normal
    displayName: Run Unit Tests
