parameters:
- name: amd64_pool
  type: string
  default: 'pool-ubuntu-latest-multi-core'
- name: arm64_pool
  type: string
  default: 'pool-ubuntu-latest-arm64'
- name: PackagingScriptsRoot
  type: string

jobs:
- job: DockerValidation
  displayName: Docker Validation
  timeoutInMinutes: 30
  strategy:
    matrix:
      cli_amd64_noble:
        Pool: ${{ parameters.amd64_pool }}
        ImageFlavor: cli
        Platform: linux/amd64
        ImageRepository: azclips
        ImageVariant: noble
        DockerArtifact: Docker_CLI_Noble_Amd64
      cli_arm64_noble:
        Pool: ${{ parameters.arm64_pool }}
        ImageFlavor: cli
        Platform: linux/arm64
        ImageRepository: azclips
        ImageVariant: noble
        DockerArtifact: Docker_CLI_Noble_Arm64
      pwsh_amd64_noble:
        Pool: ${{ parameters.amd64_pool }}
        ImageFlavor: pwsh
        Platform: linux/amd64
        ImageRepository: azclips-powershell
        ImageVariant: noble
        DockerArtifact: Docker_Pwsh_Noble_Amd64
      pwsh_arm64_noble:
        Pool: ${{ parameters.arm64_pool }}
        ImageFlavor: pwsh
        Platform: linux/arm64
        ImageRepository: azclips-powershell
        ImageVariant: noble
        DockerArtifact: Docker_Pwsh_Noble_Arm64
  pool:
    name: $(Pool)
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    retryCountOnTaskFailure: 3

  - script: |
      set -euo pipefail
      chmod +x "${{ parameters.PackagingScriptsRoot }}/linux/docker/install_docker.sh"
      "${{ parameters.PackagingScriptsRoot }}/linux/docker/install_docker.sh"
    displayName: Install Docker

  - task: DownloadPipelineArtifact@2
    displayName: Download Docker Image Artifact
    inputs:
      artifact: $(DockerArtifact)
      path: $(Pipeline.Workspace)/docker-validation/$(DockerArtifact)

  - script: |
      set -euo pipefail
      artifact_dir="$(Pipeline.Workspace)/docker-validation/$(DockerArtifact)"
      mapfile -t image_archives < <(find "$artifact_dir" -maxdepth 1 -type f -name '*.tar' | sort)
      if [[ ${#image_archives[@]} -ne 1 ]]; then
        echo "ERROR: Expected exactly one Docker image archive under $artifact_dir, found ${#image_archives[@]}."
        printf '%s\n' "${image_archives[@]}"
        exit 1
      fi

      docker load --input "${image_archives[0]}"
      arch_label="${PLATFORM#linux/}"
      image_tag="$(ImageRepository):$(ArtifactVersion)-$(ImageVariant)-$arch_label"
      chmod +x "${{ parameters.PackagingScriptsRoot }}/linux/docker/test_docker_image.sh"
      IMAGE_TAG="$image_tag" \
      IMAGE_FLAVOR="$(ImageFlavor)" \
      PLATFORM="$(Platform)" \
      "${{ parameters.PackagingScriptsRoot }}/linux/docker/test_docker_image.sh"
    displayName: Load and Validate Docker Image
