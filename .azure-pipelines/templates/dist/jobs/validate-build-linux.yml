parameters:
- name: ubuntu_pool
  type: string
- name: ubuntu_arm64_pool
  type: string
- name: PackagingScriptsRoot
  type: string
- name: PackagingCommonOutRoot
  type: string
- name: PackagingLinuxOutRoot
  type: string

jobs:
- job: LinuxValidation
  displayName: CLI Linux Validation
  timeoutInMinutes: 120
  strategy:
    matrix:
      linux_x64:
        Architecture: x64
        GlibcRid: linux-x64
        MuslRid: linux-musl-x64
        GlibcLeanDistributionArtifact: Distribution_Linux_Lean
        GlibcFullDistributionArtifact: Distribution_Linux_Full
        MuslLeanDistributionArtifact: Distribution_Linux_Musl_X64_Lean
        MuslFullDistributionArtifact: Distribution_Linux_Musl_X64_Full
        PoolName: ${{ parameters.ubuntu_pool }}
      linux_arm64:
        Architecture: arm64
        GlibcRid: linux-arm64
        MuslRid: linux-musl-arm64
        GlibcLeanDistributionArtifact: Distribution_Linux_Arm64_Lean
        GlibcFullDistributionArtifact: Distribution_Linux_Arm64_Full
        MuslLeanDistributionArtifact: Distribution_Linux_Musl_Arm64_Lean
        MuslFullDistributionArtifact: Distribution_Linux_Musl_Arm64_Full
        PoolName: ${{ parameters.ubuntu_arm64_pool }}
  pool:
    name: $(PoolName)
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: DownloadPipelineArtifact@2
    displayName: Get Linux glibc Lean Dist
    inputs:
      artifact: $(GlibcLeanDistributionArtifact)
      path: ${{ parameters.PackagingLinuxOutRoot }}

  - task: DownloadPipelineArtifact@2
    displayName: Get Linux glibc Full Dist
    inputs:
      artifact: $(GlibcFullDistributionArtifact)
      path: ${{ parameters.PackagingLinuxOutRoot }}

  - task: DownloadPipelineArtifact@2
    displayName: Get Linux musl Lean Dist
    inputs:
      artifact: $(MuslLeanDistributionArtifact)
      path: ${{ parameters.PackagingLinuxOutRoot }}

  - task: DownloadPipelineArtifact@2
    displayName: Get Linux musl Full Dist
    inputs:
      artifact: $(MuslFullDistributionArtifact)
      path: ${{ parameters.PackagingLinuxOutRoot }}

  - task: DownloadPipelineArtifact@2
    displayName: Get CLI Common
    inputs:
      artifact: Distribution_Common
      path: ${{ parameters.PackagingCommonOutRoot }}

  - script: |
      set -euo pipefail
      chmod +x "${{ parameters.PackagingScriptsRoot }}/linux/tarball/test_linux_tarball_bundled_plus_ext.sh"
      ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT="${{ parameters.PackagingLinuxOutRoot }}" COMMON_OUT_ROOT="${{ parameters.PackagingCommonOutRoot }}" PACKAGE_PROFILE=lean RID="$(GlibcRid)" "${{ parameters.PackagingScriptsRoot }}/linux/tarball/test_linux_tarball_bundled_plus_ext.sh"
    displayName: Validate CLI Linux glibc Lean Tarball

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI Linux glibc Lean Sim
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Build.SourcesDirectory)/devops/sim/linux-tarball-bundled-plus-ext
      artifact: Validate_Linux_Sim_$(GlibcRid)_lean
      publishLocation: pipeline

  - script: |
      set -euo pipefail
      ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT="${{ parameters.PackagingLinuxOutRoot }}" COMMON_OUT_ROOT="${{ parameters.PackagingCommonOutRoot }}" PACKAGE_PROFILE=full RID="$(GlibcRid)" "${{ parameters.PackagingScriptsRoot }}/linux/tarball/test_linux_tarball_bundled_plus_ext.sh"
    displayName: Validate CLI Linux glibc Full Tarball
    condition: succeededOrFailed()

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI Linux glibc Full Sim
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Build.SourcesDirectory)/devops/sim/linux-tarball-bundled-plus-ext
      artifact: Validate_Linux_Sim_$(GlibcRid)_full
      publishLocation: pipeline

  - bash: |
      set -euo pipefail
      sudo apt-get update
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
      sudo systemctl start docker
      sudo docker version
    displayName: Install Docker for Alpine ARM64 Validation
    condition: and(succeededOrFailed(), eq(variables['Architecture'], 'arm64'))

  - bash: |
      set -euo pipefail
      docker_command=(docker)
      if [[ "$(Architecture)" == "arm64" ]]; then
        docker_command=(sudo docker)
      fi
      "${docker_command[@]}" run --rm \
        -v "$(Build.SourcesDirectory):/src" \
        -v "${{ parameters.PackagingLinuxOutRoot }}:/out/linux" \
        -v "${{ parameters.PackagingCommonOutRoot }}:/out/common" \
        -w /src \
        alpine:3.22 \
        sh -c 'apk add --no-cache bash ca-certificates icu-libs krb5-libs libgcc libssl3 libstdc++ zlib >/dev/null && ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT=/out/linux COMMON_OUT_ROOT=/out/common PACKAGE_PROFILE=lean RID="$(MuslRid)" bash devops/scripts/packaging/linux/tarball/test_linux_tarball_bundled_plus_ext.sh'
    displayName: Validate CLI Linux musl Lean Tarball
    condition: succeededOrFailed()

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI Linux musl Lean Sim
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Build.SourcesDirectory)/devops/sim/linux-tarball-bundled-plus-ext
      artifact: Validate_Linux_Sim_$(MuslRid)_lean
      publishLocation: pipeline

  - bash: |
      set -euo pipefail
      docker_command=(docker)
      if [[ "$(Architecture)" == "arm64" ]]; then
        docker_command=(sudo docker)
      fi
      "${docker_command[@]}" run --rm \
        -v "$(Build.SourcesDirectory):/src" \
        -v "${{ parameters.PackagingLinuxOutRoot }}:/out/linux" \
        -v "${{ parameters.PackagingCommonOutRoot }}:/out/common" \
        -w /src \
        alpine:3.22 \
        sh -c 'apk add --no-cache bash ca-certificates icu-libs krb5-libs libgcc libssl3 libstdc++ zlib >/dev/null && ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT=/out/linux COMMON_OUT_ROOT=/out/common PACKAGE_PROFILE=full RID="$(MuslRid)" bash devops/scripts/packaging/linux/tarball/test_linux_tarball_bundled_plus_ext.sh'
    displayName: Validate CLI Linux musl Full Tarball
    condition: succeededOrFailed()

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI Linux musl Full Sim
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Build.SourcesDirectory)/devops/sim/linux-tarball-bundled-plus-ext
      artifact: Validate_Linux_Sim_$(MuslRid)_full
      publishLocation: pipeline
