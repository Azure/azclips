parameters:
- name: ubuntu_pool
  type: string
  default: 'pool-ubuntu-2204'
- name: PackagingScriptsRoot
  type: string
- name: PackagingCommonOutRoot
  type: string
- name: PackagingLinuxOutRoot
  type: string

jobs:
- job: LinuxValidation
  displayName: CLI Linux Validation
  timeoutInMinutes: 30
  strategy:
    matrix:
      linux_x64_lean:
        Rid: linux-x64
        BuildProfile: lean
        DistributionArtifact: Distribution_Linux_Lean
        SkipRuntime: false
      linux_arm64_lean:
        Rid: linux-arm64
        BuildProfile: lean
        DistributionArtifact: Distribution_Linux_Arm64_Lean
        SkipRuntime: true
      linux_x64_full:
        Rid: linux-x64
        BuildProfile: full
        DistributionArtifact: Distribution_Linux_Full
        SkipRuntime: false
      linux_arm64_full:
        Rid: linux-arm64
        BuildProfile: full
        DistributionArtifact: Distribution_Linux_Arm64_Full
        SkipRuntime: true
      linux_musl_x64_lean:
        Rid: linux-musl-x64
        BuildProfile: lean
        DistributionArtifact: Distribution_Linux_Musl_X64_Lean
        SkipRuntime: true
      linux_musl_arm64_lean:
        Rid: linux-musl-arm64
        BuildProfile: lean
        DistributionArtifact: Distribution_Linux_Musl_Arm64_Lean
        SkipRuntime: true
      linux_musl_x64_full:
        Rid: linux-musl-x64
        BuildProfile: full
        DistributionArtifact: Distribution_Linux_Musl_X64_Full
        SkipRuntime: true
      linux_musl_arm64_full:
        Rid: linux-musl-arm64
        BuildProfile: full
        DistributionArtifact: Distribution_Linux_Musl_Arm64_Full
        SkipRuntime: true
  pool:
    name: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    retryCountOnTaskFailure: 3

  - task: DownloadPipelineArtifact@2
    displayName: Get Linux Dist
    inputs:
      artifact: $(DistributionArtifact)
      path: ${{ parameters.PackagingLinuxOutRoot }}

  - task: DownloadPipelineArtifact@2
    displayName: Get CLI Common
    inputs:
      artifact: Distribution_Common
      path: ${{ parameters.PackagingCommonOutRoot }}

  - script: |
      set -euo pipefail
      chmod +x "${{ parameters.PackagingScriptsRoot }}/linux/tarball/test_linux_tarball_bundled_plus_ext.sh"
      ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT="${{ parameters.PackagingLinuxOutRoot }}" COMMON_OUT_ROOT="${{ parameters.PackagingCommonOutRoot }}" PACKAGE_PROFILE="$(BuildProfile)" RID="$(Rid)" SKIP_RUNTIME="$(SkipRuntime)" "${{ parameters.PackagingScriptsRoot }}/linux/tarball/test_linux_tarball_bundled_plus_ext.sh"
    displayName: Validate CLI Linux Tarball

  - bash: |
      set -euo pipefail
      docker run --rm \
        -v "$(Build.SourcesDirectory):/src" \
        -v "${{ parameters.PackagingLinuxOutRoot }}:/out/linux" \
        -v "${{ parameters.PackagingCommonOutRoot }}:/out/common" \
        -w /src \
        alpine:3.22 \
        sh -c 'apk add --no-cache bash ca-certificates icu-libs krb5-libs libgcc libssl3 libstdc++ zlib >/dev/null && ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT=/out/linux COMMON_OUT_ROOT=/out/common PACKAGE_PROFILE="$(BuildProfile)" RID="$(Rid)" SKIP_RUNTIME=false bash devops/scripts/packaging/linux/tarball/test_linux_tarball_bundled_plus_ext.sh'
    displayName: Validate CLI Linux musl Tarball in Alpine
    condition: and(succeeded(), eq(variables['Rid'], 'linux-musl-x64'))

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI Linux Sim
    condition: always()
    inputs:
      targetPath: $(Build.SourcesDirectory)/devops/sim/linux-tarball-bundled-plus-ext
      artifact: Validate_Linux_Sim_$(Rid)_$(BuildProfile)
      publishLocation: pipeline
