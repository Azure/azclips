parameters:
- name: macos_arm64_pool
  type: string
- name: macos_intel_pool
  type: string
- name: PackagingScriptsRoot
  type: string
- name: PackagingCommonOutRoot
  type: string

jobs:
- job: MacOSValidation
  displayName: CLI macOS Validation
  timeoutInMinutes: 60
  strategy:
    matrix:
      osx_arm64:
        Rid: osx-arm64
        LeanDistributionArtifact: Distribution_MacOS_Lean
        FullDistributionArtifact: Distribution_MacOS_Full
        VmImage: ${{ parameters.macos_arm64_pool }}
      osx_x64:
        Rid: osx-x64
        LeanDistributionArtifact: Distribution_MacOS_Intel_Lean
        FullDistributionArtifact: Distribution_MacOS_Intel_Full
        VmImage: ${{ parameters.macos_intel_pool }}
  pool:
    vmImage: $(VmImage)
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: DownloadPipelineArtifact@2
    displayName: Get macOS Lean Dist
    inputs:
      artifact: $(LeanDistributionArtifact)
      path: $(Agent.TempDirectory)/validation/macos/$(Rid)/lean/artifact

  - task: DownloadPipelineArtifact@2
    displayName: Get macOS Full Dist
    inputs:
      artifact: $(FullDistributionArtifact)
      path: $(Agent.TempDirectory)/validation/macos/$(Rid)/full/artifact

  - task: DownloadPipelineArtifact@2
    displayName: Get CLI Common
    inputs:
      artifact: Distribution_Common
      path: ${{ parameters.PackagingCommonOutRoot }}

  - script: |
      set -euo pipefail
      chmod +x "${{ parameters.PackagingScriptsRoot }}/macos/tarball/test_macos_tarball_bundled_plus_ext.sh"
      ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT="$(Agent.TempDirectory)/validation/macos/$(Rid)/lean/artifact" COMMON_OUT_ROOT="${{ parameters.PackagingCommonOutRoot }}" SIM_ROOT="$(Agent.TempDirectory)/validation/macos/$(Rid)/lean/sim" PACKAGE_PROFILE=lean RID="$(Rid)" "${{ parameters.PackagingScriptsRoot }}/macos/tarball/test_macos_tarball_bundled_plus_ext.sh"
    displayName: Validate CLI macOS Lean Tarball

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI macOS Lean Sim
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Agent.TempDirectory)/validation/macos/$(Rid)/lean/sim
      artifact: Validate_MacOS_Sim_$(Rid)_lean
      publishLocation: pipeline

  - script: |
      set -euo pipefail
      chmod +x "${{ parameters.PackagingScriptsRoot }}/macos/tarball/test_macos_tarball_bundled_plus_ext.sh"
      ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT="$(Agent.TempDirectory)/validation/macos/$(Rid)/full/artifact" COMMON_OUT_ROOT="${{ parameters.PackagingCommonOutRoot }}" SIM_ROOT="$(Agent.TempDirectory)/validation/macos/$(Rid)/full/sim" PACKAGE_PROFILE=full RID="$(Rid)" "${{ parameters.PackagingScriptsRoot }}/macos/tarball/test_macos_tarball_bundled_plus_ext.sh"
    displayName: Validate CLI macOS Full Tarball
    condition: succeededOrFailed()

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI macOS Full Sim
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Agent.TempDirectory)/validation/macos/$(Rid)/full/sim
      artifact: Validate_MacOS_Sim_$(Rid)_full
      publishLocation: pipeline
