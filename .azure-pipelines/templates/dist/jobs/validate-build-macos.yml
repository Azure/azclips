parameters:
- name: macos_arm64_pool
  type: string
  default: 'macOS-15-arm64'
- name: macos_intel_pool
  type: string
  default: 'macOS-15'
- name: PackagingScriptsRoot
  type: string
- name: PackagingCommonOutRoot
  type: string
- name: PackagingMacOSOutRoot
  type: string

jobs:
- job: MacOSValidation
  displayName: CLI macOS Validation
  timeoutInMinutes: 30
  strategy:
    matrix:
      osx_arm64_lean:
        Rid: osx-arm64
        BuildProfile: lean
        DistributionArtifact: Distribution_MacOS_Lean
        VmImage: ${{ parameters.macos_arm64_pool }}
      osx_x64_lean:
        Rid: osx-x64
        BuildProfile: lean
        DistributionArtifact: Distribution_MacOS_Intel_Lean
        VmImage: ${{ parameters.macos_intel_pool }}
      osx_arm64_full:
        Rid: osx-arm64
        BuildProfile: full
        DistributionArtifact: Distribution_MacOS_Full
        VmImage: ${{ parameters.macos_arm64_pool }}
      osx_x64_full:
        Rid: osx-x64
        BuildProfile: full
        DistributionArtifact: Distribution_MacOS_Intel_Full
        VmImage: ${{ parameters.macos_intel_pool }}
  pool:
    vmImage: $(VmImage)
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    retryCountOnTaskFailure: 3

  - task: DownloadPipelineArtifact@2
    displayName: Get macOS Dist
    inputs:
      artifact: $(DistributionArtifact)
      path: ${{ parameters.PackagingMacOSOutRoot }}

  - task: DownloadPipelineArtifact@2
    displayName: Get CLI Common
    inputs:
      artifact: Distribution_Common
      path: ${{ parameters.PackagingCommonOutRoot }}

  - script: |
      set -euo pipefail
      chmod +x "${{ parameters.PackagingScriptsRoot }}/macos/tarball/test_macos_tarball_bundled_plus_ext.sh"
      ARTIFACT_VERSION="$(ArtifactVersion)" OUT_ROOT="${{ parameters.PackagingMacOSOutRoot }}" COMMON_OUT_ROOT="${{ parameters.PackagingCommonOutRoot }}" PACKAGE_PROFILE="$(BuildProfile)" RID="$(Rid)" "${{ parameters.PackagingScriptsRoot }}/macos/tarball/test_macos_tarball_bundled_plus_ext.sh"
    displayName: Validate CLI macOS Tarball

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI macOS Sim
    condition: always()
    inputs:
      targetPath: $(Build.SourcesDirectory)/devops/sim/macos-tarball-bundled-plus-ext
      artifact: Validate_MacOS_Sim_$(Rid)_$(BuildProfile)
      publishLocation: pipeline
