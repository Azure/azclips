parameters:
- name: windows_pool
  type: string
- name: windows_arm64_pool
  type: string
- name: PackagingScriptsRoot
  type: string
- name: PackagingCommonOutRoot
  type: string
- name: PackagingWindowsOutRoot
  type: string

jobs:
- job: WindowsValidation
  displayName: CLI Windows Validation
  timeoutInMinutes: 60
  strategy:
    matrix:
      win_x64:
        Rid: win-x64
        LeanDistributionArtifact: Distribution_Windows_Lean
        FullDistributionArtifact: Distribution_Windows_Full
        PoolName: ${{ parameters.windows_pool }}
      win_arm64:
        Rid: win-arm64
        LeanDistributionArtifact: Distribution_Windows_Arm64_Lean
        FullDistributionArtifact: Distribution_Windows_Arm64_Full
        PoolName: ${{ parameters.windows_arm64_pool }}
  pool:
    name: $(PoolName)
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: DownloadPipelineArtifact@2
    displayName: Get Windows Lean Dist
    inputs:
      artifact: $(LeanDistributionArtifact)
      path: ${{ parameters.PackagingWindowsOutRoot }}

  - task: DownloadPipelineArtifact@2
    displayName: Get Windows Full Dist
    inputs:
      artifact: $(FullDistributionArtifact)
      path: ${{ parameters.PackagingWindowsOutRoot }}

  - task: DownloadPipelineArtifact@2
    displayName: Get CLI Common
    inputs:
      artifact: Distribution_Common
      path: ${{ parameters.PackagingCommonOutRoot }}

  - task: UseDotNet@2
    displayName: .NET SDK for PowerShell
    condition: eq(variables['Rid'], 'win-arm64')
    inputs:
      packageType: sdk
      useGlobalJson: true

  - task: PowerShell@2
    displayName: Install PowerShell ARM64
    condition: eq(variables['Rid'], 'win-arm64')
    inputs:
      targetType: inline
      pwsh: false
      script: |
        $ErrorActionPreference = 'Stop'
        $project = Join-Path $env:BUILD_SOURCESDIRECTORY 'src/PS/Accounts/Cmdlets.Accounts.csproj'
        $packageData = (& dotnet msbuild $project '-getItem:PackageReference' '-verbosity:quiet' | Out-String) | ConvertFrom-Json
        $versions = @($packageData.Items.PackageReference | Where-Object Identity -eq 'System.Management.Automation' | Select-Object -ExpandProperty Version -Unique)
        if ($versions.Count -ne 1) {
          throw "Expected one System.Management.Automation version in $project; found: $($versions -join ', ')."
        }

        $version = $versions[0]
        $installDir = Join-Path $env:AGENT_TEMPDIRECTORY "pwsh-$version-arm64"
        if (Test-Path $installDir) {
          Remove-Item -Path $installDir -Recurse -Force
        }
        dotnet tool install --tool-path $installDir PowerShell --version $version
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to install PowerShell $version."
        }

        & (Join-Path $installDir 'pwsh.exe') -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
        if ($LASTEXITCODE -ne 0) {
          throw "PowerShell $version failed to start."
        }
        Write-Host "##vso[task.prependpath]$installDir"

  - task: PowerShell@2
    displayName: Validate CLI Windows Lean Zip
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $env:ARTIFACT_VERSION = "$(ArtifactVersion)"
        $env:PACKAGE_PROFILE = 'lean'
        & "${{ parameters.PackagingScriptsRoot }}/windows/zip/test_windows_zip_bundled_plus_ext.ps1" -OutRoot "${{ parameters.PackagingWindowsOutRoot }}" -CommonOutRoot "${{ parameters.PackagingCommonOutRoot }}" -Rid "$(Rid)"

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI Windows Lean Sim
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Build.SourcesDirectory)/devops/sim/win-zip-bundled-plus-ext
      artifact: Validate_Windows_Sim_$(Rid)_lean
      publishLocation: pipeline

  - task: PowerShell@2
    displayName: Validate CLI Windows Full Zip
    condition: succeededOrFailed()
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $env:ARTIFACT_VERSION = "$(ArtifactVersion)"
        $env:PACKAGE_PROFILE = 'full'
        & "${{ parameters.PackagingScriptsRoot }}/windows/zip/test_windows_zip_bundled_plus_ext.ps1" -OutRoot "${{ parameters.PackagingWindowsOutRoot }}" -CommonOutRoot "${{ parameters.PackagingCommonOutRoot }}" -Rid "$(Rid)"

  - task: PublishPipelineArtifact@1
    displayName: Publish CLI Windows Full Sim
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Build.SourcesDirectory)/devops/sim/win-zip-bundled-plus-ext
      artifact: Validate_Windows_Sim_$(Rid)_full
      publishLocation: pipeline
