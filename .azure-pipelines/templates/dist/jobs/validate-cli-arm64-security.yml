parameters:
- name: windows_pool
  type: string

jobs:
- job: CLIArm64BinaryAnalysis
  displayName: BinSkim Validation Windows ARM64
  condition: succeeded()
  timeoutInMinutes: 30
  pool:
    name: ${{ parameters.windows_pool }}
  workspace:
    clean: all
  steps:
  - checkout: none

  - task: DownloadPipelineArtifact@2
    displayName: Download ARM64 Lean CLI Outputs
    inputs:
      artifact: Distribution_Windows_Arm64_Lean
      path: $(Pipeline.Workspace)/cli-arm64-security/Distribution_Windows_Arm64_Lean

  - task: DownloadPipelineArtifact@2
    displayName: Download ARM64 Full CLI Outputs
    inputs:
      artifact: Distribution_Windows_Arm64_Full
      path: $(Pipeline.Workspace)/cli-arm64-security/Distribution_Windows_Arm64_Full

  - task: PowerShell@2
    displayName: Prepare CLI ARM64 BinSkim Targets
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $artifactRoot = '$(Pipeline.Workspace)/cli-arm64-security'
        $resultsRoot = '$(Agent.TempDirectory)/cli-arm64-binskim'
        New-Item -ItemType Directory -Force -Path $resultsRoot | Out-Null

        $targets = @(foreach ($artifact in @('Distribution_Windows_Arm64_Lean', 'Distribution_Windows_Arm64_Full')) {
          $scanRoot = Join-Path $artifactRoot "$artifact/publish/cli/win-arm64"
          if (-not (Test-Path -LiteralPath (Join-Path $scanRoot 'az.exe') -PathType Leaf)) {
            throw "Missing ARM64 CLI executable in $artifact at $scanRoot."
          }

          $binaries = @(Get-ChildItem -LiteralPath $scanRoot -Recurse -File |
            Where-Object {
              $_.Extension -in @('.dll', '.exe') -and
              $_.Name -notlike 'msalruntime*.dll' -and
              $_.FullName.Replace('\', '/') -notlike '*/Microsoft.Azure.Azclips.Extensions.Agent/deps/runtimes/*/native/*'
            } |
            Sort-Object FullName)
          if ($binaries.Count -eq 0) {
            throw "No binaries found for BinSkim in $artifact."
          }
          Write-Host "Selected $($binaries.Count) binaries from $artifact for BinSkim."
          $binaries | ForEach-Object { '"{0}"' -f $_.FullName }
        })
        $targets | Set-Content -LiteralPath (Join-Path $resultsRoot 'FilesToScan.rsp') -Encoding utf8

  - task: securedevelopmentteam.vss-secure-development-tools.build-task-binskim.BinSkim@4
    displayName: Run CLI ARM64 BinSkim
    inputs:
      InputType: CommandLine
      arguments: 'analyze "@$(Agent.TempDirectory)/cli-arm64-binskim/FilesToScan.rsp" --config default --recurse --statistics'

  - task: securedevelopmentteam.vss-secure-development-tools.build-task-publishsecurityanalysislogs.PublishSecurityAnalysisLogs@3
    displayName: Publish CLI ARM64 Security Analysis Logs
    condition: succeededOrFailed()
    inputs:
      ArtifactName: CodeAnalysisLogs_CLI_ARM64
      ArtifactType: Container
      PublishProcessedResults: false
      AllTools: true

  - task: securedevelopmentteam.vss-secure-development-tools.build-task-postanalysis.PostAnalysis@2
    displayName: Analyze CLI ARM64 BinSkim Results
    condition: succeededOrFailed()
    inputs:
      GdnBreakAllTools: false
      GdnBreakGdnToolBinSkim: true
      GdnBreakGdnToolBinSkimSeverity: Error
