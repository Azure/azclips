parameters:
- name: ubuntu_pool
  type: string
  default: 'ubuntu-latest'
- name: ps_modules_artifact_name
  type: string
  default: 'PSModules'

jobs:
- job: PowerShellLinuxValidation
  displayName: PS Linux Validation
  timeoutInMinutes: 60
  strategy:
    matrix:
      alpine_3_21:
        DistributionName: Alpine 3.21
        ContainerImage: alpine:3.21
        DistributionFamily: alpine
      alpine_3_22:
        DistributionName: Alpine 3.22
        ContainerImage: alpine:3.22
        DistributionFamily: alpine
      alpine_3_23:
        DistributionName: Alpine 3.23
        ContainerImage: alpine:3.23
        DistributionFamily: alpine
      alpine_3_24:
        DistributionName: Alpine 3.24
        ContainerImage: alpine:3.24
        DistributionFamily: alpine
      debian_13:
        DistributionName: Debian 13
        ContainerImage: debian:13-slim
        DistributionFamily: debian
      ubuntu_24_04:
        DistributionName: Ubuntu 24.04
        ContainerImage: ubuntu:24.04
        DistributionFamily: debian
      ubuntu_26_04:
        DistributionName: Ubuntu 26.04
        ContainerImage: ubuntu:26.04
        DistributionFamily: debian
      rhel_8:
        DistributionName: RHEL 8 (UBI)
        ContainerImage: registry.access.redhat.com/ubi8/ubi:latest
        DistributionFamily: rhel
      rhel_9:
        DistributionName: RHEL 9 (UBI)
        ContainerImage: registry.access.redhat.com/ubi9/ubi:latest
        DistributionFamily: rhel
      rhel_10:
        DistributionName: RHEL 10 (UBI)
        ContainerImage: registry.access.redhat.com/ubi10/ubi:latest
        DistributionFamily: rhel
  pool:
    vmImage: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    retryCountOnTaskFailure: 3

  - task: DownloadPipelineArtifact@2
    displayName: Download PS Module Packages
    inputs:
      artifact: ${{ parameters.ps_modules_artifact_name }}
      path: $(Pipeline.Workspace)/${{ parameters.ps_modules_artifact_name }}

  - bash: |
      set -euo pipefail

      echo "Validating PowerShell cmdlets on $(DistributionName) with $(ContainerImage)"
      docker pull "$(ContainerImage)"
      docker run --rm \
        --entrypoint /bin/sh \
        -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
        -e POWERSHELL_TELEMETRY_OPTOUT=1 \
        -v "$(Build.SourcesDirectory):/src:ro" \
        -v "$(Pipeline.Workspace)/${{ parameters.ps_modules_artifact_name }}:/artifacts:ro" \
        "$(ContainerImage)" \
        -c "sh /src/devops/scripts/packaging/powershell/test_az_modules_on_linux.sh '$(DistributionFamily)' /artifacts /src"
    displayName: Validate Cmdlets on $(DistributionName)