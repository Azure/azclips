parameters:
- name: ubuntu_pool
  type: string
  default: 'ubuntu-latest'
- name: macos_arm64_pool
  type: string
  default: 'macOS-15-arm64'
- name: macos_intel_pool
  type: string
  default: 'macOS-15'
- name: ps_modules_artifact_name
  type: string
  default: 'PSModules'
- name: limit_testing
  type: boolean
  default: false

jobs:
- job: GeneratePowerShellValidationMatrix
  displayName: Generate PS Validation Matrix
  pool:
    ${{ if startsWith(parameters.ubuntu_pool, 'pool-') }}:
      name: ${{ parameters.ubuntu_pool }}
    ${{ else }}:
      vmImage: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    retryCountOnTaskFailure: 3

  - pwsh: |
      & ./tests/Scripts/PS/PSModuleLifecycleFixtures.ps1
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & pwsh -NoProfile -File ./tests/Scripts/PS/PSSmokeFixtures.ps1
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & pwsh -NoProfile -File ./tests/Scripts/PS/PSDependencyFixtures.ps1
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & pwsh -NoProfile -File ./tests/Scripts/PS/PSDependencyRuntimeFixtures.ps1
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & pwsh -NoProfile -File ./tests/Scripts/PS/PSUpgradeReleaseFixtures.ps1
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & pwsh -NoProfile -File ./tests/Scripts/PS/PSUpgradeFixtures.ps1
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & ./tests/Scripts/PS/PSValidationPipelineFixtures.ps1
      exit $LASTEXITCODE
    displayName: Test PS Validation Scripts

  - pwsh: |
      & pwsh -NoProfile -File ./devops/scripts/packaging/powershell/test_ps_smoke.ps1 `
        -CoverageOnly `
        -ReportRoot (Join-Path $env:AGENT_TEMPDIRECTORY 'azclips-ps-smoke-coverage')
      exit $LASTEXITCODE
    displayName: Validate Azure PS Smoke-Test Coverage

  - task: PublishPipelineArtifact@1
    displayName: Publish PS Smoke-Test Coverage
    condition: always()
    inputs:
      targetPath: $(Agent.TempDirectory)/azclips-ps-smoke-coverage
      artifact: Validate_PS_Smoke_Coverage
      publishLocation: pipeline

  - bash: |
      set -euo pipefail
      matrix_args=()
      if [[ "${{ parameters.limit_testing }}" == "True" || "${{ parameters.limit_testing }}" == "true" ]]; then
        matrix_args+=(--limit-testing)
      fi
      bash devops/scripts/packaging/powershell/generate_ps_validation_matrix.sh \
        --pool '${{ parameters.ubuntu_pool }}' \
        --pool-for 'macos_arm64=${{ parameters.macos_arm64_pool }}' \
        --pool-for 'macos_x64=${{ parameters.macos_intel_pool }}' \
        --azure-variable matrix \
        "${matrix_args[@]}"
    name: GenerateMatrix
    displayName: Generate PS Validation Matrix

- job: PreparePowerShellUpgradeBaseline
  displayName: Prepare Released PowerShell Upgrade Baseline
  pool:
    ${{ if startsWith(parameters.ubuntu_pool, 'pool-') }}:
      name: ${{ parameters.ubuntu_pool }}
    ${{ else }}:
      vmImage: ${{ parameters.ubuntu_pool }}
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    persistCredentials: true
    retryCountOnTaskFailure: 3

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $false
      $global:LASTEXITCODE = 0
      try {
        $version = (Import-PowerShellDataFile ./src/PS/Az/Az.psd1).ModuleVersion
        & ./devops/scripts/packaging/powershell/prepare_ps_upgrade_baseline.ps1 `
          -TargetVersion $version `
          -DestinationRoot (Join-Path $env:AGENT_TEMPDIRECTORY 'azclips-ps-upgrade-baseline') `
          -UseCheckoutCredentials
        if ($LASTEXITCODE -ne 0) { throw 'PowerShell upgrade baseline preparation failed.' }
      }
      finally {
        $headers = @(& git config --local --name-only --get-regexp '^http\..*\.extraheader$')
        if ($LASTEXITCODE -notin 0, 1) { throw 'Could not inspect persisted checkout authorization.' }
        foreach ($header in $headers) {
          & git config --local --unset-all $header
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove persisted checkout authorization.' }
        }
        $global:LASTEXITCODE = 0
      }
    displayName: Download and Verify Released PowerShell Bundle

  - task: PublishPipelineArtifact@1
    displayName: Publish PowerShell Upgrade Baseline
    inputs:
      targetPath: $(Agent.TempDirectory)/azclips-ps-upgrade-baseline
      artifact: PSUpgradeBaseline
      publishLocation: pipeline

- job: PowerShellValidation
  dependsOn:
  - GeneratePowerShellValidationMatrix
  - PreparePowerShellUpgradeBaseline
  condition: and(not(canceled()), in(dependencies.GeneratePowerShellValidationMatrix.result, 'Succeeded', 'SucceededWithIssues'))
  displayName: PS Validation
  timeoutInMinutes: 60
  variables:
    PsValidationBootstrapped: 'false'
    PsValidationInstalled: 'false'
    PsUpgradeBaselineResult: $[ dependencies.PreparePowerShellUpgradeBaseline.result ]
  strategy:
    matrix: $[ dependencies.GeneratePowerShellValidationMatrix.outputs['GenerateMatrix.matrix'] ]
  pool:
    name: $(DistributionPoolName)
    vmImage: $(DistributionVmImage)
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    retryCountOnTaskFailure: 3

  - task: DownloadPipelineArtifact@2
    displayName: Download PS Module Packages
    inputs:
      artifact: ${{ parameters.ps_modules_artifact_name }}
      path: $(Pipeline.Workspace)/${{ parameters.ps_modules_artifact_name }}

  # Validation is split into one step per phase so that a failure points straight at
  # the phase that broke. Each distribution owns a small bootstrap script whose only
  # responsibility is installing the PowerShell 7 dependency; every phase after that
  # is the centralized flow that every agent shares.
  - template: ../steps/ps-validation-phase.yml
    parameters:
      phase: Bootstrap
      display_name: Install PowerShell $(PowerShellVersion)
      ps_modules_artifact_name: ${{ parameters.ps_modules_artifact_name }}

  - template: ../steps/ps-validation-phase.yml
    parameters:
      phase: Dependencies
      display_name: Validate Azure PS Dependencies
      ps_modules_artifact_name: ${{ parameters.ps_modules_artifact_name }}

  # Bootstrap already succeeded, so a missing/failed download cannot suppress
  # dependency, fresh-install, or smoke coverage. Upgrade records the missing input.
  - task: DownloadPipelineArtifact@2
    displayName: Download PowerShell Upgrade Baseline
    condition: and(succeededOrFailed(), eq(variables['PsValidationBootstrapped'], 'true'), in(variables['PsUpgradeBaselineResult'], 'Succeeded', 'SucceededWithIssues'))
    inputs:
      artifact: PSUpgradeBaseline
      path: $(Pipeline.Workspace)/${{ parameters.ps_modules_artifact_name }}/upgrade-baseline

  - template: ../steps/ps-validation-phase.yml
    parameters:
      phase: Upgrade
      display_name: Upgrade Azure PS v$(AzVersion)
      ps_modules_artifact_name: ${{ parameters.ps_modules_artifact_name }}

  - template: ../steps/ps-validation-phase.yml
    parameters:
      phase: Install
      display_name: Install Azure PS v$(AzVersion)
      ps_modules_artifact_name: ${{ parameters.ps_modules_artifact_name }}

  # Run the credential-free, configured module smoke tests against the installed modules.
  - template: ../steps/ps-validation-phase.yml
    parameters:
      phase: Validate
      display_name: Validate Azure PS v$(AzVersion)
      ps_modules_artifact_name: ${{ parameters.ps_modules_artifact_name }}

  - template: ../steps/ps-validation-phase.yml
    parameters:
      phase: Uninstall
      display_name: Uninstall Azure PS v$(AzVersion)
      ps_modules_artifact_name: ${{ parameters.ps_modules_artifact_name }}

  # The container is started detached so that it survives between phase steps, so it
  # has to be removed explicitly even when a phase failed.
  - bash: |
      docker rm --force "azclips-psval-$(System.JobId)" >/dev/null 2>&1 || true
    condition: and(always(), eq(variables['ValidationMode'], 'container'))
    displayName: Clean Up Validation Container

  - pwsh: |
      & "$env:BUILD_SOURCESDIRECTORY/devops/scripts/packaging/powershell/complete_ps_validation_artifacts.ps1" `
        -ReportRoot (Join-Path $env:AGENT_TEMPDIRECTORY "azclips-ps-validation-reports-$env:SYSTEM_JOBID") `
        -ValidationKey $env:PS_VALIDATION_KEY `
        -JobStatus $env:AGENT_JOBSTATUS
    env:
      PS_VALIDATION_KEY: $(ValidationKey)
    condition: always()
    displayName: Finalize PS Validation Artifacts

  - task: PublishPipelineArtifact@1
    displayName: Publish PS Validation Artifacts
    condition: always()
    inputs:
      targetPath: $(Agent.TempDirectory)/azclips-ps-validation-reports-$(System.JobId)
      artifact: Validate_PS_Sim_$(ValidationKey)
      publishLocation: pipeline
