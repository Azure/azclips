parameters:
- name: windows_pool
  type: string
- name: ps_modules_artifact_name
  type: string

jobs:
- job: PSBinaryAnalysis
  displayName: Analyze PowerShell Module Binaries
  condition: succeeded()
  timeoutInMinutes: 30
  pool:
    name: ${{ parameters.windows_pool }}
  workspace:
    clean: all
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - task: DownloadPipelineArtifact@2
    displayName: Download PowerShell Module Outputs
    inputs:
      artifact: ${{ parameters.ps_modules_artifact_name }}
      path: $(Pipeline.Workspace)/ps-module-security

  - task: PowerShell@2
    displayName: Prepare PowerShell BinSkim Targets
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $scanRoot = '$(Pipeline.Workspace)/ps-module-security/artifacts/PSGallery/modules'
        $reportRoot = '$(Pipeline.Workspace)/.gdn/.r/binskim'
        if (Test-Path -LiteralPath $reportRoot) {
          Remove-Item -LiteralPath $reportRoot -Recurse -Force
        }

        if (-not (Test-Path -LiteralPath $scanRoot -PathType Container)) {
          throw "PowerShell shipping payload was not found at $scanRoot."
        }

        $excludedNames = @('msalruntime.dll', 'msalruntime_arm64.dll', 'msalruntime_x86.dll')
        $binaries = @(Get-ChildItem -LiteralPath $scanRoot -Recurse -File |
          Where-Object { $_.Extension -in @('.dll', '.exe') -and $_.Name -notin $excludedNames } |
          Sort-Object FullName)
        if ($binaries.Count -eq 0) {
          throw "No binaries found for BinSkim under $scanRoot."
        }
        if (-not ($binaries | Where-Object { $_.Name -like 'Microsoft.Azure.Azclips.Cmdlets.*.dll' })) {
          throw "No PowerShell cmdlet assemblies found under $scanRoot."
        }

        Write-Host "Selected $($binaries.Count) PowerShell shipping payload binaries for BinSkim."

  - task: securedevelopmentteam.vss-secure-development-tools.build-task-binskim.BinSkim@4
    displayName: Run PowerShell BinSkim
    inputs:
      InputType: Basic
      AnalyzeTargetGlob: '$(Pipeline.Workspace)/ps-module-security/artifacts/PSGallery/modules/**/*.dll;$(Pipeline.Workspace)/ps-module-security/artifacts/PSGallery/modules/**/*.exe;-:file|**/msalruntime.dll;-:file|**/msalruntime_arm64.dll;-:file|**/msalruntime_x86.dll'

  - task: PowerShell@2
    displayName: Verify PowerShell BinSkim Scan Health
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)/devops/scripts/compliance/verify_binskim_results.ps1
      arguments: '-ReportRoot "$(Pipeline.Workspace)/.gdn/.r/binskim"'
      pwsh: true

  - template: ../steps/publish-artifact.yml
    parameters:
      display_name: Publish PowerShell Security Analysis Logs
      condition: succeededOrFailed()
      artifact_type: security_analysis_logs
      artifact_name: CodeAnalysisLogs_PSModules

  - task: securedevelopmentteam.vss-secure-development-tools.build-task-postanalysis.PostAnalysis@2
    displayName: Analyze PowerShell BinSkim Results
    condition: succeededOrFailed()
    inputs:
      GdnBreakAllTools: false
      GdnBreakGdnToolBinSkim: true
      GdnBreakGdnToolBinSkimSeverity: Error
