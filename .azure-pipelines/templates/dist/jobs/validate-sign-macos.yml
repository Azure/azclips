parameters:
- name: macos_arm64_pool
  type: string
- name: macos_intel_pool
  type: string

jobs:
- job: ValidateMacOS
  displayName: Validate Signed macOS Artifacts
  strategy:
    matrix:
      arm64:
        MacOSArchitecture: arm64
        MacOSVmImage: ${{ parameters.macos_arm64_pool }}
      x64:
        MacOSArchitecture: x64
        MacOSVmImage: ${{ parameters.macos_intel_pool }}
  pool:
    vmImage: $(MacOSVmImage)
  steps:
  - checkout: none
  - task: DownloadPipelineArtifact@2
    displayName: Download Signed macOS Artifacts
    inputs:
      buildType: current
      artifactName: signed-macos-$(MacOSArchitecture)
      targetPath: $(Pipeline.Workspace)/signed-macos
  - bash: |
      set -euo pipefail
      root="$(Pipeline.Workspace)/signed-macos"
      tarballs=()
      while IFS= read -r tarball; do
        tarballs+=("$tarball")
      done < <(find "$root" -type f \( -name '*mac*.tar.gz' -o -name '*macos*.tar.gz' -o -name '*osx*.tar.gz' -o -name '*darwin*.tar.gz' \) | sort)
      if [[ ${#tarballs[@]} -eq 0 ]]; then
        echo 'ERROR: No signed macOS tarballs found.'
        exit 1
      fi

      errors=0
      total_macho=0
      host_arch="$(uname -m)"

      verify_macho_signature() {
        local candidate="$1"
        local signature_details
        local failed=0

        if ! codesign -v "$candidate" 2>/dev/null; then
          echo "ERROR: Basic codesign verification failed: $candidate"
          failed=1
        fi
        if ! codesign --verify --deep --strict "$candidate" 2>/dev/null; then
          echo "ERROR: Strict codesign verification failed: $candidate"
          failed=1
        fi

        signature_details=$(codesign -dvvv "$candidate" 2>&1 || true)
        if ! printf '%s\n' "$signature_details" | grep -q 'TeamIdentifier=UBF8T346G9'; then
          echo "ERROR: Microsoft TeamIdentifier missing: $candidate"
          printf '%s\n' "$signature_details" | grep -E '^(Authority|TeamIdentifier|Identifier|CDHash)=' || true
          failed=1
        fi
        if ! printf '%s\n' "$signature_details" | grep -q 'flags=.*runtime'; then
          echo "ERROR: Hardened runtime flag missing: $candidate"
          printf '%s\n' "$signature_details" | grep -E '^(CodeDirectory|Runtime Version) ' || true
          failed=1
        fi
        if ! printf '%s\n' "$signature_details" | grep -q '^Timestamp='; then
          echo "ERROR: Signing timestamp missing: $candidate"
          failed=1
        fi

        return "$failed"
      }

      verify_dotnet_entitlements() {
        local candidate="$1"
        local entitlements
        local failed=0

        entitlements=$(codesign -d --entitlements - "$candidate" 2>&1 || true)
        for entitlement in \
          'com.apple.security.cs.allow-jit' \
          'com.apple.security.cs.allow-unsigned-executable-memory' \
          'com.apple.security.cs.disable-library-validation'; do
          if ! printf '%s\n' "$entitlements" | grep -q "$entitlement"; then
            echo "ERROR: Required .NET entitlement '$entitlement' missing: $candidate"
            failed=1
          fi
        done

        return "$failed"
      }

      find_az_entrypoint() {
        local verify_dir="$1"
        if [[ -f "$verify_dir/az" ]]; then
          printf '%s\n' "$verify_dir/az"
        elif [[ -f "$verify_dir/libexec/bin/az" ]]; then
          printf '%s\n' "$verify_dir/libexec/bin/az"
        elif [[ -e "$verify_dir/bin/az" ]]; then
          printf '%s\n' "$verify_dir/bin/az"
        fi
      }

      verify_required_dotnet_entitlements() {
        local az_binary="$1"
        local apphost_dir
        local agent_binary
        local failed=0

        apphost_dir="$(cd "$(dirname "$az_binary")" && pwd -P)"
        agent_binary="$apphost_dir/azclips-agent"

        if ! verify_dotnet_entitlements "$az_binary"; then
          failed=1
        fi

        if [[ ! -f "$agent_binary" ]]; then
          echo "ERROR: Required .NET binary not found next to az entrypoint: $agent_binary"
          failed=1
        elif ! verify_dotnet_entitlements "$agent_binary"; then
          failed=1
        fi

        return "$failed"
      }

      for tarball in "${tarballs[@]}"; do
        verify_dir="$(Pipeline.Workspace)/verify-macos/$(basename "${tarball%.tar.gz}")"
        mkdir -p "$verify_dir"
        tar -xzf "$tarball" -C "$verify_dir"

        tarball_macho=0
        while IFS= read -r -d '' candidate; do
          if ! file "$candidate" | grep -q 'Mach-O'; then
            continue
          fi

          tarball_macho=$((tarball_macho + 1))
          total_macho=$((total_macho + 1))
          if ! verify_macho_signature "$candidate"; then
            errors=1
          fi
        done < <(find "$verify_dir" -type f -print0)

        if [[ "$tarball_macho" -eq 0 ]]; then
          echo "ERROR: No Mach-O binaries found in $tarball"
          errors=1
        fi

        az_binary="$(find_az_entrypoint "$verify_dir")"
        if [[ ! -f "$az_binary" ]]; then
          echo "ERROR: az binary not found in signed macOS tarball: $tarball"
          errors=1
          continue
        fi

        if ! verify_required_dotnet_entitlements "$az_binary"; then
          errors=1
        fi

        chmod +x "$az_binary" || true
        binary_info="$(file "$az_binary" 2>/dev/null || true)"
        echo "Signed az binary info: $binary_info"

        is_runnable=true
        if [[ "$host_arch" == "arm64" ]]; then
          if [[ "$binary_info" != *"arm64"* && "$binary_info" != *"universal"* ]]; then
            is_runnable=false
          fi
        elif [[ "$host_arch" == "x86_64" ]]; then
          if [[ "$binary_info" != *"x86_64"* && "$binary_info" != *"universal"* ]]; then
            is_runnable=false
          fi
        fi

        if [[ "$is_runnable" == "true" ]]; then
          if ! HOME="$verify_dir/home" "$az_binary" --help >/tmp/azclips-signed-help.txt 2>&1; then
            echo "ERROR: Signed az runtime smoke test failed: $tarball"
            cat /tmp/azclips-signed-help.txt
            errors=1
          else
            echo "PASS: Signed az runtime smoke test completed."
          fi
        else
          echo "NOTE: Host architecture '$host_arch' is not compatible with signed binary; skipping runtime smoke test."
        fi
      done

      echo "Validated $total_macho signed macOS Mach-O binaries."
      if [[ "$errors" -ne 0 ]]; then
        exit 1
      fi
    displayName: Verify macOS Developer ID Signatures
