parameters:
- name: windows_pool
  type: string

stages:
- stage: AgentEvaluationChecks
  displayName: Agent Evaluation Offline Checks
  dependsOn: []
  jobs:
  - job: TestEvaluationHarness
    displayName: Test evaluation harness without Azure or model access
    timeoutInMinutes: 15
    pool:
      name: ${{ parameters.windows_pool }}
    steps:
    - checkout: self
      clean: true
      fetchDepth: 1

    - task: NodeTool@0
      displayName: Node.js 24
      inputs:
        versionSpec: '24.x'

    - pwsh: |
        npm ci --legacy-peer-deps
        exit $LASTEXITCODE
      workingDirectory: Agent/eval
      displayName: Install evaluation test dependencies

    - pwsh: |
        npm test
        exit $LASTEXITCODE
      workingDirectory: Agent/eval
      displayName: Run offline evaluation tests
