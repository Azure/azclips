parameters:
- name: artifact_version_override
  type: string
  default: 'auto'
- name: bump_type
  type: string
  default: 'patch'
- name: release_channel
  type: string
  default: 'auto'
- name: release_date
  type: string
  default: 'auto'
- name: pr_number
  type: string
  default: 'auto'
- name: sequence
  type: string
  default: 'auto'
- name: ubuntu_pool
  type: string
- name: ubuntu_arm64_pool
  type: string
- name: windows_pool
  type: string
- name: windows_arm64_pool
  type: string
- name: macos_arm64_pool
  type: string
- name: macos_intel_pool
  type: string
- name: final_artifact_name
  type: string
  default: 'Final_Build_Distribution'
- name: ps_modules_artifact_name
  type: string
  default: 'PSModules'
- name: build_docker_images
  type: boolean
  default: true
- name: build_cli_docker_images
  type: boolean
  default: true
- name: build_powershell_docker_images
  type: boolean
  default: true
- name: include_docker_images_in_final_distribution
  type: boolean
  default: true
- name: limit_ps_testing
  type: boolean
  default: false
- name: skip_ps_version_check
  type: boolean
  default: false

stages:
- template: init-resolve-version.yml
  parameters:
    artifact_version_override: ${{ parameters.artifact_version_override }}
    bump_type: ${{ parameters.bump_type }}
    release_channel: ${{ parameters.release_channel }}
    release_date: ${{ parameters.release_date }}
    pr_number: ${{ parameters.pr_number }}
    sequence: ${{ parameters.sequence }}
    ubuntu_pool: ${{ parameters.ubuntu_pool }}

- template: component-governance.yml
  parameters:
    stage_name: ComponentGovernance
    display_name: Component Governance
    windows_pool: ${{ parameters.windows_pool }}
    depends_on: Init

- stage: BuildCommon
  displayName: Build (CLI) Common
  dependsOn: Init
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: ../jobs/build-common.yml
    parameters:
      ubuntu_pool: ${{ parameters.ubuntu_pool }}
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)

- template: build-ps-modules.yml
  parameters:
    ubuntu_pool: ${{ parameters.ubuntu_pool }}
    windows_pool: ${{ parameters.windows_pool }}
    final_artifact_name: ${{ parameters.ps_modules_artifact_name }}
    generate_help_artifacts: true
    depends_on: Init

- stage: BuildLinux
  displayName: Build (CLI) Linux
  dependsOn:
  - Init
  - BuildCommon
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: ../jobs/build-linux.yml
    parameters:
      ubuntu_pool: ${{ parameters.ubuntu_pool }}
      ubuntu_arm64_pool: ${{ parameters.ubuntu_arm64_pool }}
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingLinuxOutRoot: $(PackagingLinuxOutRoot)

- stage: BuildDockerAzureLinux3
  displayName: Build Docker Azure Linux 3 Images
  dependsOn:
  - Init
  - BuildLinux
  - ${{ if eq(parameters.build_powershell_docker_images, true) }}:
    - BuildPSModules
  condition: and(succeeded(), eq(${{ parameters.build_docker_images }}, true), or(eq(${{ parameters.build_cli_docker_images }}, true), eq(${{ parameters.build_powershell_docker_images }}, true)))
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: ../jobs/build-docker.yml
    parameters:
      amd64_pool: ${{ parameters.ubuntu_pool }}
      arm64_pool: ${{ parameters.ubuntu_arm64_pool }}
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingLinuxOutRoot: $(PackagingLinuxOutRoot)
      PackagingDockerOutRoot: $(PackagingDockerOutRoot)
      ps_modules_artifact_name: ${{ parameters.ps_modules_artifact_name }}
      ${{ if and(eq(parameters.build_cli_docker_images, true), eq(parameters.build_powershell_docker_images, true)) }}:
        image_flavor: all
      ${{ elseif eq(parameters.build_cli_docker_images, true) }}:
        image_flavor: cli
      ${{ else }}:
        image_flavor: pwsh

- stage: BuildWindows
  displayName: Build (CLI) Windows
  dependsOn:
  - Init
  - BuildCommon
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: ../jobs/build-windows.yml
    parameters:
      windows_pool: ${{ parameters.windows_pool }}
      windows_arm64_pool: ${{ parameters.windows_arm64_pool }}
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingWindowsOutRoot: $(PackagingWindowsOutRoot)

- stage: BuildMacOS
  displayName: Build (CLI) macOS
  dependsOn:
  - Init
  - BuildCommon
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: ../jobs/build-macos.yml
    parameters:
      macos_arm64_pool: ${{ parameters.macos_arm64_pool }}
      macos_intel_pool: ${{ parameters.macos_intel_pool }}
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingMacOSOutRoot: $(PackagingMacOSOutRoot)

- stage: Test
  displayName: Test
  dependsOn:
  - Init
  - BuildCommon
  condition: succeeded()
  jobs:
  - template: ../jobs/test-suite.yml
    parameters:
      ubuntu_pool: ${{ parameters.ubuntu_pool }}
      windows_pool: ${{ parameters.windows_pool }}
      macos_arm64_pool: ${{ parameters.macos_arm64_pool }}

- stage: Benchmark
  displayName: Benchmark
  dependsOn:
  - Init
  - BuildCommon
  condition: succeeded()
  jobs:
  - template: ../jobs/benchmark-suite.yml
    parameters:
      ubuntu_pool: ${{ parameters.ubuntu_pool }}

- stage: ValidateLinux
  displayName: Validate (CLI) Linux
  dependsOn:
  - Init
  - BuildLinux
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: ../jobs/validate-build-linux.yml
    parameters:
      ubuntu_pool: ${{ parameters.ubuntu_pool }}
      ubuntu_arm64_pool: ${{ parameters.ubuntu_arm64_pool }}
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingLinuxOutRoot: $(PackagingLinuxOutRoot)

- stage: ValidatePS
  displayName: Validate (PS)
  dependsOn:
  - BuildPSModules
  condition: succeeded()
  jobs:
  - template: ../jobs/validate-ps-build.yml
    parameters:
      ubuntu_pool: ${{ parameters.ubuntu_pool }}
      macos_arm64_pool: ${{ parameters.macos_arm64_pool }}
      macos_intel_pool: ${{ parameters.macos_intel_pool }}
      ps_modules_artifact_name: ${{ parameters.ps_modules_artifact_name }}
      limit_testing: ${{ parameters.limit_ps_testing }}
      skip_version_check: ${{ parameters.skip_ps_version_check }}

- stage: ValidateDockerAzureLinux3
  displayName: Validate Docker Azure Linux 3 Images
  dependsOn:
  - Init
  - BuildDockerAzureLinux3
  condition: and(succeeded(), eq(${{ parameters.build_docker_images }}, true), or(eq(${{ parameters.build_cli_docker_images }}, true), eq(${{ parameters.build_powershell_docker_images }}, true)))
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: ../jobs/validate-build-docker.yml
    parameters:
      amd64_pool: ${{ parameters.ubuntu_pool }}
      arm64_pool: ${{ parameters.ubuntu_arm64_pool }}
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      ${{ if and(eq(parameters.build_cli_docker_images, true), eq(parameters.build_powershell_docker_images, true)) }}:
        image_flavor: all
      ${{ elseif eq(parameters.build_cli_docker_images, true) }}:
        image_flavor: cli
      ${{ else }}:
        image_flavor: pwsh

- stage: ValidateWindows
  displayName: Validate (CLI) Windows
  dependsOn:
  - Init
  - BuildWindows
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: ../jobs/validate-build-windows.yml
    parameters:
      windows_pool: ${{ parameters.windows_pool }}
      windows_arm64_pool: ${{ parameters.windows_arm64_pool }}
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingWindowsOutRoot: $(PackagingWindowsOutRoot)

- stage: ValidateMacOS
  displayName: Validate (CLI) macOS
  dependsOn:
  - Init
  - BuildMacOS
  condition: succeeded()
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: ../jobs/validate-build-macos.yml
    parameters:
      macos_arm64_pool: ${{ parameters.macos_arm64_pool }}
      macos_intel_pool: ${{ parameters.macos_intel_pool }}
      PackagingScriptsRoot: $(PackagingScriptsRoot)
      PackagingCommonOutRoot: $(PackagingCommonOutRoot)
      PackagingMacOSOutRoot: $(PackagingMacOSOutRoot)

- stage: Finalize
  displayName: Finalize Build
  dependsOn:
  - Init
  - BuildCommon
  - BuildLinux
  - ${{ if and(eq(parameters.build_docker_images, true), eq(parameters.include_docker_images_in_final_distribution, true), or(eq(parameters.build_cli_docker_images, true), eq(parameters.build_powershell_docker_images, true))) }}:
    - BuildDockerAzureLinux3
    - ValidateDockerAzureLinux3
  - BuildWindows
  - BuildMacOS
  - Test
  - Benchmark
  - BuildPSModules
  - ValidatePSModules
  - ValidateLinux
  - ValidatePS
  - ValidateWindows
  - ValidateMacOS
  - ComponentGovernance
  condition: |
    and(
      succeeded(),
      eq(dependencies.Init.result, 'Succeeded'),
      eq(dependencies.BuildCommon.result, 'Succeeded'),
      eq(dependencies.BuildLinux.result, 'Succeeded'),
      eq(dependencies.BuildWindows.result, 'Succeeded'),
      eq(dependencies.BuildMacOS.result, 'Succeeded'),
      eq(dependencies.Test.result, 'Succeeded'),
      eq(dependencies.Benchmark.result, 'Succeeded'),
      eq(dependencies.BuildPSModules.result, 'Succeeded'),
      eq(dependencies.ValidatePSModules.result, 'Succeeded'),
      eq(dependencies.ValidateLinux.result, 'Succeeded'),
      in(dependencies.ValidatePS.result, 'Succeeded', 'SucceededWithIssues'),
      eq(dependencies.ValidateWindows.result, 'Succeeded'),
      eq(dependencies.ValidateMacOS.result, 'Succeeded'),
      in(dependencies.ComponentGovernance.result, 'Succeeded', 'SucceededWithIssues'),
      or(
        not(${{ and(eq(parameters.build_docker_images, true), eq(parameters.include_docker_images_in_final_distribution, true), or(eq(parameters.build_cli_docker_images, true), eq(parameters.build_powershell_docker_images, true))) }}),
        and(
          eq(dependencies.BuildDockerAzureLinux3.result, 'Succeeded'),
          eq(dependencies.ValidateDockerAzureLinux3.result, 'Succeeded')
        )
      )
    )
  variables:
    ArtifactVersion: $[ stageDependencies.Init.Start.outputs['SetCoreVersion.ArtifactVersion'] ]
  jobs:
  - template: ../jobs/finalize-build-summary.yml
    parameters:
      ubuntu_pool: ${{ parameters.ubuntu_pool }}
      final_artifact_name: ${{ parameters.final_artifact_name }}
      ps_modules_artifact_name: ${{ parameters.ps_modules_artifact_name }}
      build_docker_images: ${{ and(eq(parameters.build_docker_images, true), eq(parameters.include_docker_images_in_final_distribution, true), or(eq(parameters.build_cli_docker_images, true), eq(parameters.build_powershell_docker_images, true))) }}
      build_cli_docker_images: ${{ parameters.build_cli_docker_images }}
      build_powershell_docker_images: ${{ parameters.build_powershell_docker_images }}
