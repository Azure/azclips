parameters:
- name: ubuntu_pool
  type: string
  default: 'ubuntu-latest'
- name: SourceProject
  type: string
  default: 'public'
- name: GitHubTargetRepo
  type: string
  default: 'naga-nandyala/cirrus'
- name: GitHubReleasePrefix
  type: string
  default: 'dist'
- name: GitHubServiceConnection
  type: string
- name: source_pipeline_definition_id
  type: string
- name: source_build_id
  type: string
- name: distribution_version
  type: string

stages:
- stage: PublishToGitHubRelease
  displayName: Publish To GitHub Release
  jobs:
  - job: PublishArtifacts
    displayName: Publish Release Assets
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: Download Distribution Artifacts
      inputs:
        buildType: specific
        project: ${{ parameters.SourceProject }}
        definition: ${{ parameters.source_pipeline_definition_id }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        targetPath: $(Pipeline.Workspace)/distBuild

    - script: |
        set -euo pipefail
        echo "Pipeline workspace: $(Pipeline.Workspace)"
        find "$(Pipeline.Workspace)/distBuild" -maxdepth 4 -type f | sort | sed -n '1,300p'
      displayName: Inspect Downloaded Artifacts

    - script: |
        set -euo pipefail
        if [[ -z "${{ parameters.source_pipeline_definition_id }}" ]]; then
          echo "ERROR: source_pipeline_definition_id is required"
          exit 1
        fi

        if [[ -z "${{ parameters.source_build_id }}" ]]; then
          echo "ERROR: source_build_id is required"
          exit 1
        fi

        if [[ -z "${{ parameters.distribution_version }}" ]]; then
          echo "ERROR: distribution_version is required"
          exit 1
        fi

        source_build_id="${{ parameters.source_build_id }}"
        source_pipeline_definition_id="${{ parameters.source_pipeline_definition_id }}"

        assets_root="$(Pipeline.Workspace)/distBuild"
        mapfile -t assets < <(find "$assets_root" -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.nupkg' \) ! -name '*.snupkg' | sort)

        if [[ ${#assets[@]} -eq 0 ]]; then
          echo "ERROR: No .tar.gz, .zip, or .nupkg assets found under $assets_root"
          exit 1
        fi

        echo "Assets to upload (${#assets[@]}):"
        printf '  %s\n' "${assets[@]}"

        core_distribution_version="${{ parameters.distribution_version }}"
        core_distribution_version="${core_distribution_version## }"
        core_distribution_version="${core_distribution_version%% }"

        mapfile -t nupkgs < <(printf '%s\n' "${assets[@]}" | grep -E '\.nupkg$' || true)

        package_versions_tmp="$(mktemp)"

        for pkg in "${nupkgs[@]}"; do
          base_name="$(basename "$pkg" .nupkg)"
          package_name="$base_name"
          package_version="unknown"

          if [[ "$base_name" =~ ^(.+)\.([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)$ ]]; then
            package_name="${BASH_REMATCH[1]}"
            package_version="${BASH_REMATCH[2]}"
          fi

          package_file_name="$(basename "$pkg")"
          echo "$package_name,$package_version,$package_file_name" >> "$package_versions_tmp"
        done

        safe_version="${core_distribution_version//[^0-9A-Za-z._-]/-}"
        tag_name="${{ parameters.GitHubReleasePrefix }}-${safe_version}-build-${source_build_id}"
        release_name="Distribution ${core_distribution_version} build ${source_build_id}"

        release_dir="$(Build.ArtifactStagingDirectory)/release"
        rm -rf "$release_dir"
        mkdir -p "$release_dir"

        package_versions_file="$release_dir/package-versions.csv"
        {
          echo "package_name,package_version,file_name"
          if [[ -s "$package_versions_tmp" ]]; then
            cat "$package_versions_tmp"
          fi
        } > "$package_versions_file"
        rm -f "$package_versions_tmp"

        for asset in "${assets[@]}"; do
          cp "$asset" "$release_dir/"
        done

        echo "Release asset staging directory contents:"
        ls -lh "$release_dir"

        echo "##vso[task.setvariable variable=ReleaseTag]$tag_name"
        echo "##vso[task.setvariable variable=ReleaseName]$release_name"
        echo "##vso[task.setvariable variable=SourceBuildId]$source_build_id"
        echo "##vso[task.setvariable variable=SourcePipelineDefinitionId]$source_pipeline_definition_id"
      displayName: Prepare Release Tag And Assets

    - task: GitHubRelease@1
      displayName: Delete Existing GitHub Release (If Any)
      continueOnError: true
      inputs:
        gitHubConnection: '${{ parameters.GitHubServiceConnection }}'
        repositoryName: '${{ parameters.GitHubTargetRepo }}'
        action: 'delete'
        tag: '$(ReleaseTag)'

    - task: GitHubRelease@1
      displayName: Create GitHub Release
      inputs:
        gitHubConnection: '${{ parameters.GitHubServiceConnection }}'
        repositoryName: '${{ parameters.GitHubTargetRepo }}'
        action: 'create'
        target: 'main'
        tagSource: 'userSpecifiedTag'
        tag: '$(ReleaseTag)'
        title: '$(ReleaseName)'
        releaseNotesSource: 'inline'
        releaseNotesInline: |
          Automated distribution release.
          Source build id: $(SourceBuildId)
        assets: '$(Build.ArtifactStagingDirectory)/release/*'
        addChangeLog: false
