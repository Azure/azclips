parameters:
- name: windows_pool
  type: string
  default: 'windows-latest'
- name: ubuntu_pool
  type: string
  default: 'ubuntu-latest'
- name: dependency_stage
  type: string
  default: 'Preflight'
- name: SourceProject
  type: string
  default: 'public'
- name: source_pipeline_name
  type: string
  default: 'cirrus-build'
- name: source_build_id
  type: string
  default: ''
- name: signed_artifact_name
  type: string
  default: 'signed-dist'
- name: esrp_service_connection
  type: string
  default: ''
- name: esrp_nuget_keycode
  type: string
  default: 'CP-401405-NuGet'
- name: esrp_authenticode_keycode
  type: string
  default: 'CP-230012'

stages:
- stage: SignNugetArtifacts
  displayName: Sign NuGet Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: SignNuget
    displayName: Sign NuGet Artifacts
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: ${{ parameters.SourceProject }}
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - task: PowerShell@2
      displayName: Filter NuGet Release Artifacts
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = "$(Pipeline.Workspace)/unsigned-all"
          $targetRoot = "$(Pipeline.Workspace)/unsigned"
          Remove-Item $targetRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null
          $selected = Get-ChildItem -Path $sourceRoot -Recurse -File | Where-Object {
            $_.Name -like '*.nupkg' -and $_.Name -notlike '*.snupkg'
          }
          if (-not $selected) {
            throw "No NuGet release artifacts found under $sourceRoot"
          }
          foreach ($asset in $selected) {
            Copy-Item $asset.FullName -Destination (Join-Path $targetRoot $asset.Name) -Force
          }
          Write-Host "Selected $($selected.Count) NuGet release artifacts."
    - task: PowerShell@2
      displayName: Prepare Signing Inputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/prepare_signing_inputs.ps1
        arguments: >-
          -UnsignedRoot "$(Pipeline.Workspace)/unsigned"
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PowerShell@2
      displayName: List NuGet Artifacts To Be Signed
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $nupkgRoot = "$(Pipeline.Workspace)/signing-work/nupkg"
          if (-not (Test-Path $nupkgRoot)) {
            throw "NuGet signing input folder not found: $nupkgRoot"
          }

          $files = Get-ChildItem -Path $nupkgRoot -File -Filter '*.nupkg' | Sort-Object Name
          if (-not $files) {
            throw "No .nupkg files found for signing in $nupkgRoot"
          }

          Write-Host "NuGet signing candidates ($($files.Count))"
          foreach ($file in $files) {
            Write-Host ("  {0}  ({1} bytes)" -f $file.Name, $file.Length)
          }

          $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host "NuGet total bytes to sign: $totalBytes"
    - task: EsrpCodeSigning@5
      displayName: Sign NuGet Packages [NuGetSign]
      condition: eq(variables['HasNupkg'], 'true')
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/signing-work/nupkg'
        Pattern: '*.nupkg'
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_nuget_keycode }}",
              "OperationCode": "NuGetSign",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]
    - task: PowerShell@2
      displayName: Verify Signed Outputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/verify_signed_outputs.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
        pwsh: true
    - task: PowerShell@2
      displayName: Repack Signed Outputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/repack_signed_outputs.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PublishPipelineArtifact@1
      displayName: Publish Signed NuGet Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-release
        artifact: signed-nuget
        publishLocation: pipeline

- stage: SignWindowsArtifacts
  displayName: Sign Windows Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: SignWindows
    displayName: Sign Windows Artifacts
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: ${{ parameters.SourceProject }}
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - task: PowerShell@2
      displayName: Filter Windows Release Artifacts
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = "$(Pipeline.Workspace)/unsigned-all"
          $targetRoot = "$(Pipeline.Workspace)/unsigned"
          Remove-Item $targetRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null
          $selected = Get-ChildItem -Path $sourceRoot -Recurse -File | Where-Object {
            $_.Name -like '*win-*.zip'
          }
          if (-not $selected) {
            throw "No Windows release artifacts found under $sourceRoot"
          }
          foreach ($asset in $selected) {
            Copy-Item $asset.FullName -Destination (Join-Path $targetRoot $asset.Name) -Force
          }
          Write-Host "Selected $($selected.Count) Windows release artifacts."
    - task: PowerShell@2
      displayName: Prepare Signing Inputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/prepare_signing_inputs.ps1
        arguments: >-
          -UnsignedRoot "$(Pipeline.Workspace)/unsigned"
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PowerShell@2
      displayName: List Windows Artifacts To Be Signed
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $windowsRoot = "$(Pipeline.Workspace)/signing-work/windows-extracted"
          if (-not (Test-Path $windowsRoot)) {
            throw "Windows signing input folder not found: $windowsRoot"
          }

          $files = Get-ChildItem -Path $windowsRoot -Recurse -File | Where-Object {
            $_.Name -ieq 'azv2.exe' -or
            $_.Name -like 'Microsoft.Azure.Cirrus*.dll' -or
            $_.Name -like 'Microsoft.Azure.Cirrus*.exe'
          } | Sort-Object FullName

          if (-not $files) {
            throw "No Windows binaries found for signing in $windowsRoot"
          }

          Write-Host "Windows signing candidates ($($files.Count))"
          foreach ($file in $files) {
            $relative = $file.FullName.Substring($windowsRoot.Length).TrimStart('\\')
            Write-Host ("  {0}  ({1} bytes)" -f $relative, $file.Length)
          }

          $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host "Windows total bytes to sign: $totalBytes"
    - task: EsrpCodeSigning@5
      displayName: Sign Windows Payload [azv2.exe]
      condition: eq(variables['HasWindowsPayload'], 'true')
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
        Pattern: 'azv2.exe'
        signConfigType: inlineSignParams
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolSign",
              "Parameters": {
                "OpusName": "Microsoft",
                "OpusInfo": "http://www.microsoft.com",
                "FileDigest": "/fd SHA256",
                "PageHash": "/NPH",
                "TimeStamp": "/tr http://timestamp.digicert.com /td sha256"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            },
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolVerify",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    - task: EsrpCodeSigning@5
      displayName: Sign Windows Payload [Cirrus DLLs]
      condition: eq(variables['HasWindowsPayload'], 'true')
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
        Pattern: 'Microsoft.Azure.Cirrus*.dll'
        signConfigType: inlineSignParams
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolSign",
              "Parameters": {
                "OpusName": "Microsoft",
                "OpusInfo": "http://www.microsoft.com",
                "FileDigest": "/fd SHA256",
                "PageHash": "/NPH",
                "TimeStamp": "/tr http://timestamp.digicert.com /td sha256"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            },
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolVerify",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    - task: EsrpCodeSigning@5
      displayName: Sign Windows Payload [Cirrus EXEs]
      condition: eq(variables['HasWindowsPayload'], 'true')
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
        Pattern: 'Microsoft.Azure.Cirrus*.exe'
        signConfigType: inlineSignParams
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolSign",
              "Parameters": {
                "OpusName": "Microsoft",
                "OpusInfo": "http://www.microsoft.com",
                "FileDigest": "/fd SHA256",
                "PageHash": "/NPH",
                "TimeStamp": "/tr http://timestamp.digicert.com /td sha256"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            },
            {
              "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
              "OperationCode": "SigntoolVerify",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]
    - task: PowerShell@2
      displayName: Verify Signed Outputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/verify_signed_outputs.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
        pwsh: true
    - task: PowerShell@2
      displayName: Repack Signed Outputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/repack_signed_outputs.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PublishPipelineArtifact@1
      displayName: Publish Signed Windows Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-release
        artifact: signed-windows
        publishLocation: pipeline

- stage: CollectLinuxArtifacts
  displayName: Collect Linux Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: CollectLinux
    displayName: Collect Linux Release Artifacts
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: ${{ parameters.SourceProject }}
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - bash: |
        set -euo pipefail
        source_root="$(Pipeline.Workspace)/unsigned-all"
        out_dir="$(Build.ArtifactStagingDirectory)/collected-linux"
        mkdir -p "$out_dir"
        mapfile -t linux_assets < <(
          find "$source_root" -type f \( -name '*linux*.tar.gz' -o -name '*linux*.zip' \) | sort
        )
        if [[ ${#linux_assets[@]} -eq 0 ]]; then
          echo "ERROR: No Linux release artifacts found under $source_root"
          exit 1
        fi
        printf 'Linux release artifacts (%s):\n' "${#linux_assets[@]}"
        printf '  %s\n' "${linux_assets[@]}"
        for asset in "${linux_assets[@]}"; do
          cp "$asset" "$out_dir/"
        done
      displayName: Collect Linux Release Artifacts
    - task: PublishPipelineArtifact@1
      displayName: Publish Collected Linux Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/collected-linux
        artifact: collected-linux
        publishLocation: pipeline

- stage: CollectMacOSArtifacts
  displayName: Collect macOS Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: CollectMac
    displayName: Collect macOS Release Artifacts
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: ${{ parameters.SourceProject }}
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - bash: |
        set -euo pipefail
        source_root="$(Pipeline.Workspace)/unsigned-all"
        out_dir="$(Build.ArtifactStagingDirectory)/collected-macos"
        mkdir -p "$out_dir"
        mapfile -t mac_assets < <(
          find "$source_root" -type f \( -name '*mac*.tar.gz' -o -name '*macos*.tar.gz' -o -name '*osx*.tar.gz' -o -name '*darwin*.tar.gz' -o -name '*mac*.zip' -o -name '*macos*.zip' \) | sort
        )
        if [[ ${#mac_assets[@]} -eq 0 ]]; then
          echo "ERROR: No macOS release artifacts found under $source_root"
          exit 1
        fi
        printf 'macOS release artifacts (%s):\n' "${#mac_assets[@]}"
        printf '  %s\n' "${mac_assets[@]}"
        for asset in "${mac_assets[@]}"; do
          cp "$asset" "$out_dir/"
        done
      displayName: Collect macOS Release Artifacts
    - task: PublishPipelineArtifact@1
      displayName: Publish Collected macOS Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/collected-macos
        artifact: collected-macos
        publishLocation: pipeline

- stage: ValidateNugetArtifacts
  displayName: Validate NuGet Artifacts
  dependsOn: SignNugetArtifacts
  jobs:
  - job: ValidateNuget
    displayName: Validate Signed NuGet Packages
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: none
    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true
    - task: DownloadPipelineArtifact@2
      displayName: Download Signed NuGet Artifacts
      inputs:
        buildType: current
        artifactName: signed-nuget
        targetPath: $(Pipeline.Workspace)/signed-nuget
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $nupkgs = Get-ChildItem -Path "$(Pipeline.Workspace)/signed-nuget" -Recurse -File -Filter '*.nupkg'
        if (-not $nupkgs) {
          throw 'No signed .nupkg files found in signed-nuget artifact.'
        }
        foreach ($pkg in $nupkgs) {
          dotnet nuget verify --all $pkg.FullName | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet verification failed for $($pkg.Name)"
          }
        }
      displayName: Verify NuGet Signatures

- stage: ValidateWindowsArtifacts
  displayName: Validate Windows Artifacts
  dependsOn: SignWindowsArtifacts
  jobs:
  - job: ValidateWindows
    displayName: Validate Signed Windows Payloads
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Signed Windows Artifacts
      inputs:
        buildType: current
        artifactName: signed-windows
        targetPath: $(Pipeline.Workspace)/signed-windows
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $zips = Get-ChildItem -Path "$(Pipeline.Workspace)/signed-windows" -Recurse -File | Where-Object { $_.Name -like '*win-*.zip' }
        if (-not $zips) {
          throw 'No signed Windows zip files found in signed-windows artifact.'
        }
        foreach ($zip in $zips) {
          $extract = Join-Path "$(Pipeline.Workspace)/verify-win" $zip.BaseName
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force
        }
        $toVerify = Get-ChildItem -Path "$(Pipeline.Workspace)/verify-win" -Recurse -File | Where-Object {
          $_.Name -ieq 'azv2.exe' -or
          $_.Name -like 'Microsoft.Azure.Cirrus*.dll' -or
          $_.Name -like 'Microsoft.Azure.Cirrus*.exe'
        }
        foreach ($file in $toVerify) {
          $signature = Get-AuthenticodeSignature -FilePath $file.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode verification failed for $($file.FullName). Status: $($signature.Status)"
          }
        }
      displayName: Verify Windows Signatures

- stage: ValidateLinuxArtifacts
  displayName: Validate Linux Artifacts
  dependsOn: CollectLinuxArtifacts
  jobs:
  - job: ValidateLinux
    displayName: Validate Linux Artifact Set
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Collected Linux Artifacts
      inputs:
        buildType: current
        artifactName: collected-linux
        targetPath: $(Pipeline.Workspace)/collected-linux
    - bash: |
        set -euo pipefail
        count=$(find "$(Pipeline.Workspace)/collected-linux" -type f \( -name '*linux*.tar.gz' -o -name '*linux*.zip' \) | wc -l | tr -d ' ')
        if [[ "$count" == "0" ]]; then
          echo 'ERROR: No Linux artifacts found after collection.'
          exit 1
        fi
        echo "Linux artifact count: $count"
      displayName: Validate Linux Artifact Presence

- stage: ValidateMacOSArtifacts
  displayName: Validate macOS Artifacts
  dependsOn: CollectMacOSArtifacts
  jobs:
  - job: ValidateMacOS
    displayName: Validate macOS Artifact Set
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Collected macOS Artifacts
      inputs:
        buildType: current
        artifactName: collected-macos
        targetPath: $(Pipeline.Workspace)/collected-macos
    - bash: |
        set -euo pipefail
        count=$(find "$(Pipeline.Workspace)/collected-macos" -type f \( -name '*mac*.tar.gz' -o -name '*macos*.tar.gz' -o -name '*osx*.tar.gz' -o -name '*darwin*.tar.gz' -o -name '*mac*.zip' -o -name '*macos*.zip' \) | wc -l | tr -d ' ')
        if [[ "$count" == "0" ]]; then
          echo 'ERROR: No macOS artifacts found after collection.'
          exit 1
        fi
        echo "macOS artifact count: $count"
      displayName: Validate macOS Artifact Presence

- stage: AssembleSignedArtifacts
  displayName: Assemble Signed Artifacts
  dependsOn:
  - ValidateNugetArtifacts
  - ValidateWindowsArtifacts
  - ValidateLinuxArtifacts
  - ValidateMacOSArtifacts
  jobs:
  - job: ValidateAndAssemble
    displayName: Validate And Assemble Final Signed Artifact
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: Download Signed Windows Artifacts
      inputs:
        buildType: current
        artifactName: signed-windows
        targetPath: $(Pipeline.Workspace)/signed-windows

    - task: DownloadPipelineArtifact@2
      displayName: Download Signed NuGet Artifacts
      inputs:
        buildType: current
        artifactName: signed-nuget
        targetPath: $(Pipeline.Workspace)/signed-nuget

    - task: DownloadPipelineArtifact@2
      displayName: Download Collected Linux Artifacts
      inputs:
        buildType: current
        artifactName: collected-linux
        targetPath: $(Pipeline.Workspace)/collected-linux

    - task: DownloadPipelineArtifact@2
      displayName: Download Collected macOS Artifacts
      inputs:
        buildType: current
        artifactName: collected-macos
        targetPath: $(Pipeline.Workspace)/collected-macos

    - bash: |
        set -euo pipefail
        release_dir="$(Build.ArtifactStagingDirectory)/signed-release"
        mkdir -p "$release_dir"

        cp -v "$(Pipeline.Workspace)/signed-windows"/* "$release_dir/" 2>/dev/null || true
        cp -v "$(Pipeline.Workspace)/signed-nuget"/* "$release_dir/" 2>/dev/null || true
        cp -v "$(Pipeline.Workspace)/collected-linux"/* "$release_dir/" 2>/dev/null || true
        cp -v "$(Pipeline.Workspace)/collected-macos"/* "$release_dir/" 2>/dev/null || true

        python3 - <<'PY'
        import hashlib
        import json
        import os

        release_dir = os.path.join(os.environ['BUILD_ARTIFACTSTAGINGDIRECTORY'], 'signed-release')
        entries = []
        for name in sorted(os.listdir(release_dir)):
          path = os.path.join(release_dir, name)
          if not os.path.isfile(path):
            continue
          h = hashlib.sha256()
          with open(path, 'rb') as f:
            while True:
              chunk = f.read(1024 * 1024)
              if not chunk:
                break
              h.update(chunk)
          entries.append({
            'file': name,
            'sha256': h.hexdigest(),
            'size': os.path.getsize(path),
          })

        with open(os.path.join(release_dir, 'signing-manifest.json'), 'w', encoding='utf-8') as f:
          json.dump(entries, f, indent=2)
        PY

        echo "Final signed release contents:"
        ls -al "$release_dir"
      displayName: Assemble Final Signed Artifact

    - task: PublishPipelineArtifact@1
      displayName: Publish Final Signed Artifact
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-release
        artifact: ${{ parameters.signed_artifact_name }}
        publishLocation: pipeline
