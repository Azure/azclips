        publishLocation: pipeline

- stage: CollectLinuxArtifacts
  displayName: Collect Linux Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: CollectLinux
    displayName: Collect Linux Release Artifacts
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: ${{ parameters.SourceProject }}
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        artifactName: ${{ parameters.source_artifact_name }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - bash: |
        set -euo pipefail
        source_root="$(Pipeline.Workspace)/unsigned-all"
        out_dir="$(Build.ArtifactStagingDirectory)/collected-linux"
        arch_csv='${{ join(',', parameters.linux_collect_architectures) }}'
        mkdir -p "$out_dir"

        mapfile -t raw_linux_assets < <(
          find "$source_root" -type f \( -name '*linux*.tar.gz' -o -name '*linux*.zip' \) | sort
        )

        IFS=',' read -r -a allowed_arches <<< "$arch_csv"

        if [[ ${#allowed_arches[@]} -eq 0 ]]; then
          echo 'ERROR: linux_collect_architectures resolved to an empty list.'
          exit 1
        fi

        linux_assets=()
        for asset in "${raw_linux_assets[@]}"; do
          name=$(basename "$asset" | tr '[:upper:]' '[:lower:]')
          for arch in "${allowed_arches[@]}"; do
            if [[ "$name" == *"$arch"* ]]; then
              linux_assets+=("$asset")
              break
            fi
          done
        done

        if [[ ${#linux_assets[@]} -eq 0 ]]; then
          echo "ERROR: No Linux release artifacts matched architectures [${allowed_arches[*]}] under $source_root"
          exit 1
        fi

        echo "Linux architectures selected: ${allowed_arches[*]}"
        printf 'Linux release artifacts (%s):\n' "${#linux_assets[@]}"
        printf '  %s\n' "${linux_assets[@]}"
        for asset in "${linux_assets[@]}"; do
          cp "$asset" "$out_dir/"
        done
      displayName: Collect Linux Release Artifacts
    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      displayName: Generate SBOM For Collected Linux Artifacts
      inputs:
        BuildDropPath: $(Build.ArtifactStagingDirectory)/collected-linux
    - task: PublishPipelineArtifact@1
      displayName: Publish Collected Linux Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/collected-linux
        artifact: collected-linux
        publishLocation: pipeline

- stage: SignMacOSArtifacts
  displayName: Sign And Notarize macOS Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: AnalyzeMacOS
    displayName: Analyze macOS Artifacts
    strategy:
      matrix:
        arm64:
          MacOSArchitecture: arm64
          MacOSRid: osx-arm64
          MacOSVmImage: ${{ parameters.macos_arm64_pool }}
        x64:
          MacOSArchitecture: x64
          MacOSRid: osx-x64
          MacOSVmImage: ${{ parameters.macos_intel_pool }}
    pool:
      vmImage: $(MacOSVmImage)
    timeoutInMinutes: 60
    steps:
    - checkout: self
      clean: true
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: ${{ parameters.SourceProject }}
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        artifactName: ${{ parameters.source_artifact_name }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - bash: |
        set -euo pipefail
        source_root="$(Pipeline.Workspace)/unsigned-all"
        work_root="$(Build.ArtifactStagingDirectory)/macos-signing-inputs"
        tarball_dir="$work_root/tarballs"
        contents_dir="$work_root/contents"
        mapping_tsv="$work_root/file-mapping.tsv"
        current_arch="$(MacOSArchitecture)"
        current_rid="$(MacOSRid)"
        mkdir -p "$tarball_dir" "$contents_dir"
        : > "$mapping_tsv"

        raw_mac_assets=()
        while IFS= read -r asset; do
          raw_mac_assets+=("$asset")
        done < <(find "$source_root" -type f \( -name '*mac*.tar.gz' -o -name '*macos*.tar.gz' -o -name '*osx*.tar.gz' -o -name '*darwin*.tar.gz' \) | sort)

        mac_assets=()
        for asset in "${raw_mac_assets[@]}"; do
          name=$(basename "$asset" | tr '[:upper:]' '[:lower:]')
          if [[ "$name" == *"$current_rid"* || "$name" == *"macos-$current_arch"* || "$name" == *"darwin-$current_arch"* ]]; then
            mac_assets+=("$asset")
          fi
        done

        if [[ ${#mac_assets[@]} -eq 0 ]]; then
          echo "ERROR: No macOS release artifacts matched architecture $current_arch ($current_rid) under $source_root"
          exit 1
        fi

        echo "macOS architecture selected: $current_arch ($current_rid)"
        printf 'macOS release artifacts (%s):\n' "${#mac_assets[@]}"
        printf '  %s\n' "${mac_assets[@]}"

        total_binaries=0
        for asset in "${mac_assets[@]}"; do
          file_name=$(basename "$asset")
          base_name="${file_name%.tar.gz}"
          content_root="$contents_dir/$base_name"

          cp "$asset" "$tarball_dir/$file_name"
          mkdir -p "$content_root"
          tar -xzf "$asset" -C "$content_root"

          while IFS= read -r -d '' binary; do
            if ! file "$binary" | grep -q 'Mach-O'; then
              continue
            fi

            relative_path="${binary#$content_root/}"
            safe_relative=$(printf '%s' "$relative_path" | sed 's#[/\\]#__#g; s#[^A-Za-z0-9._-]#_#g')
            zip_name="${base_name}__${safe_relative}.zip"

            printf '%s\t%s\t%s\n' "$zip_name" "$base_name" "$relative_path" >> "$mapping_tsv"
            total_binaries=$((total_binaries + 1))
          done < <(find "$content_root" -type f -print0)
        done

        if [[ "$total_binaries" -eq 0 ]]; then
          echo 'ERROR: No Mach-O binaries were found in the selected macOS artifacts.'
          exit 1
        fi

        echo "Prepared $total_binaries Mach-O binaries for Developer ID signing."
      displayName: Prepare macOS Signing Inputs
    - task: PublishPipelineArtifact@1
      displayName: Publish macOS Signing Inputs
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/macos-signing-inputs
        artifact: macos-signing-inputs-$(MacOSArchitecture)
        publishLocation: pipeline

  - job: SignMacOSBinaries
    displayName: ESRP Sign macOS Binaries
    dependsOn: AnalyzeMacOS
    condition: succeeded()
    strategy:
      matrix:
        arm64:
          MacOSArchitecture: arm64
        x64:
          MacOSArchitecture: x64
    pool:
      vmImage: ${{ parameters.windows_pool }}
    timeoutInMinutes: 60
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download macOS Signing Inputs
      inputs:
        buildType: current
        artifactName: macos-signing-inputs-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/macos-signing-inputs
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $inputRoot = "$(Pipeline.Workspace)/macos-signing-inputs"
        $mappingPath = Join-Path $inputRoot 'file-mapping.tsv'
        $toBeSignedDir = Join-Path $inputRoot 'toBeSigned'
        $hashesPath = Join-Path $inputRoot 'zip-hashes-before.tsv'

        New-Item -ItemType Directory -Path $toBeSignedDir -Force | Out-Null
        if (Test-Path $hashesPath) {
          Remove-Item -Force $hashesPath
        }

        $count = 0
        Get-Content $mappingPath | ForEach-Object {
          if ([string]::IsNullOrWhiteSpace($_)) {
            return
          }

          $parts = $_ -split "`t", 3
          if ($parts.Count -ne 3) {
            throw "Invalid file mapping row: $_"
          }

          $zipName = $parts[0]
          $baseName = $parts[1]
          $relativePath = $parts[2]
          $binaryPath = "$inputRoot/contents/$baseName/$relativePath"
          $zipPath = Join-Path $toBeSignedDir $zipName

          if (-not (Test-Path $binaryPath)) {
            throw "Binary to sign not found: $binaryPath"
          }

          Compress-Archive -Path $binaryPath -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          "$zipName`t$hash" | Add-Content -Path $hashesPath
          $count++
        }

        Write-Host "Created $count ZIP files for ESRP signing."
      displayName: Create macOS Binary ZIPs For ESRP
    - task: EsrpCodeSigning@5
      displayName: Sign macOS Binaries [MacAppDeveloperSign]
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        FolderPath: '$(Pipeline.Workspace)/macos-signing-inputs/toBeSigned'
        Pattern: '*.zip'
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_apple_keycode }}",
              "OperationCode": "MacAppDeveloperSign",
              "Parameters": {
                "Hardening": "--options=runtime",
                "OpusInfo": "http://Microsoft.com"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $signedZipsDir = "$(Pipeline.Workspace)/macos-signing-inputs/toBeSigned"
        $mappingPath = "$(Pipeline.Workspace)/macos-signing-inputs/file-mapping.tsv"
        $hashesPath = "$(Pipeline.Workspace)/macos-signing-inputs/zip-hashes-before.tsv"
        $outputDir = "$(Build.ArtifactStagingDirectory)/macos-signed-binaries"
        $tempRoot = "$(Pipeline.Workspace)/macos-signed-extract"

        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null

        $originalHashes = @{}
        Get-Content $hashesPath | ForEach-Object {
          if ([string]::IsNullOrWhiteSpace($_)) {
            return
          }
          $parts = $_ -split "`t", 2
          if ($parts.Count -eq 2) {
            $originalHashes[$parts[0]] = $parts[1]
          }
        }

        $count = 0
        $unchangedZips = @()
        Get-Content $mappingPath | ForEach-Object {
          if ([string]::IsNullOrWhiteSpace($_)) {
            return
          }

          $parts = $_ -split "`t", 3
          if ($parts.Count -ne 3) {
            throw "Invalid file mapping row: $_"
          }

          $zipName = $parts[0]
          $baseName = $parts[1]
          $relativePath = $parts[2]
          $zipPath = Join-Path $signedZipsDir $zipName

          if (-not (Test-Path $zipPath)) {
            throw "Signed zip not found: $zipPath"
          }

          $signedHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          if ($originalHashes.ContainsKey($zipName) -and $originalHashes[$zipName] -eq $signedHash) {
            $unchangedZips += $zipName
          }

          $extractPath = Join-Path $tempRoot ([IO.Path]::GetFileNameWithoutExtension($zipName))
          if (Test-Path $extractPath) {
            Remove-Item -Recurse -Force $extractPath
          }
          New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          $extractedFile = Get-ChildItem -Path $extractPath -File | Select-Object -First 1
          if (-not $extractedFile) {
            throw "Signed zip did not contain a file: $zipPath"
          }

          $targetPath = "$outputDir/$baseName/$relativePath"
          $targetDir = Split-Path $targetPath -Parent
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          Copy-Item -Path $extractedFile.FullName -Destination $targetPath -Force
          $count++
        }

        Write-Host "Extracted $count signed macOS binaries."
        if ($unchangedZips.Count -gt 0) {
          Write-Host "##vso[task.logissue type=error]ESRP did not modify $($unchangedZips.Count) macOS signing ZIP(s). MacAppDeveloperSign did not produce signed output."
          $unchangedZips | Select-Object -First 20 | ForEach-Object { Write-Host "  unchanged: $_" }
          throw 'ESRP macOS signing output matched the unsigned input.'
        }
      displayName: Extract Signed macOS Binaries
    - task: PublishPipelineArtifact@1
      displayName: Publish Signed macOS Binaries
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/macos-signed-binaries
        artifact: macos-signed-binaries-$(MacOSArchitecture)
        publishLocation: pipeline

  - job: CreateMacOSNotarizationBundles
    displayName: Create macOS Notarization Bundles
    dependsOn:
    - AnalyzeMacOS
    - SignMacOSBinaries
    condition: succeeded()
    strategy:
      matrix:
        arm64:
          MacOSArchitecture: arm64
          MacOSVmImage: ${{ parameters.macos_arm64_pool }}
        x64:
          MacOSArchitecture: x64
          MacOSVmImage: ${{ parameters.macos_intel_pool }}
    pool:
      vmImage: $(MacOSVmImage)
    timeoutInMinutes: 60
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download macOS Signing Inputs
      inputs:
        buildType: current
        artifactName: macos-signing-inputs-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/macos-signing-inputs
    - task: DownloadPipelineArtifact@2
      displayName: Download Signed macOS Binaries
      inputs:
        buildType: current
        artifactName: macos-signed-binaries-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/macos-signed-binaries
    - bash: |
        set -euo pipefail
        input_root="$(Pipeline.Workspace)/macos-signing-inputs"
        signed_binary_root="$(Pipeline.Workspace)/macos-signed-binaries"
        signed_contents_root="$(Build.ArtifactStagingDirectory)/signed-contents"
        notarization_root="$(Build.ArtifactStagingDirectory)/macos-notarization-bundles"
        mkdir -p "$signed_contents_root" "$notarization_root"

        cp -R "$input_root/contents/." "$signed_contents_root/"

        while IFS=$'\t' read -r _zip_name base_name relative_path; do
          [[ -z "$base_name" ]] && continue
          signed_file="$signed_binary_root/$base_name/$relative_path"
          target="$signed_contents_root/$base_name/$relative_path"
          if [[ -z "$signed_file" ]]; then
            echo "ERROR: Empty signed file path for $base_name/$relative_path"
            exit 1
          fi
          if [[ ! -f "$signed_file" ]]; then
            echo "ERROR: Signed binary not found: $signed_file"
            exit 1
          fi

          cp "$signed_file" "$target"
          chmod +x "$target" || true
        done < "$input_root/file-mapping.tsv"

        for content_dir in "$signed_contents_root"/*; do
          [[ -d "$content_dir" ]] || continue
          base_name=$(basename "$content_dir")
          (
            cd "$content_dir"
            zip -r -y -q "$notarization_root/$base_name-signed.zip" .
          )
          echo "Created notarization bundle: $base_name-signed.zip"
        done
      displayName: Create Notarization ZIPs
    - task: PublishPipelineArtifact@1
      displayName: Publish macOS Notarization Bundles
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/macos-notarization-bundles
        artifact: macos-notarization-bundles-$(MacOSArchitecture)
        publishLocation: pipeline

  - job: NotarizeMacOSBundles
    displayName: ESRP Notarize macOS Bundles
    dependsOn: CreateMacOSNotarizationBundles
    condition: succeeded()
    strategy:
      matrix:
        arm64:
          MacOSArchitecture: arm64
        x64:
          MacOSArchitecture: x64
    pool:
      vmImage: ${{ parameters.windows_pool }}
    timeoutInMinutes: 120
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download macOS Notarization Bundles
      inputs:
        buildType: current
        artifactName: macos-notarization-bundles-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/toNotarize
    - task: EsrpCodeSigning@5
      displayName: Notarize macOS Bundles [MacAppNotarize]
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        batchSignPolicyFile: ''
        ciPolicyFile: ''
        FolderPath: '$(Pipeline.Workspace)/toNotarize'
        UseMinimatch: true
        Pattern: '*.zip'
        signConfigType: inlineSignParams
        SessionTimeout: '120'
        MaxConcurrency: '1'
        MaxRetryAttempts: '3'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_apple_keycode }}",
              "OperationCode": "MacAppNotarize",
              "Parameters": {
                "BundleId": "${{ parameters.macos_bundle_id }}",
                "OpusInfo": "http://Microsoft.com"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]
    # Loose Mach-O binaries cannot be stapled; this artifact records the exact
    # bundle payloads that successfully passed Apple's notarization service.
    - task: PublishPipelineArtifact@1
      displayName: Publish Notarized macOS Bundles
      inputs:
        targetPath: $(Pipeline.Workspace)/toNotarize
        artifact: macos-notarized-bundles-$(MacOSArchitecture)
        publishLocation: pipeline
  - job: CreateSignedMacOSTarballs
    displayName: Create Signed macOS Tarballs
    dependsOn:
    - AnalyzeMacOS
    - SignMacOSBinaries
    - NotarizeMacOSBundles
    condition: succeeded()
    strategy:
      matrix:
        arm64:
          MacOSArchitecture: arm64
          MacOSVmImage: ${{ parameters.macos_arm64_pool }}
        x64:
          MacOSArchitecture: x64
          MacOSVmImage: ${{ parameters.macos_intel_pool }}
    pool:
      vmImage: $(MacOSVmImage)
    timeoutInMinutes: 90
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download macOS Signing Inputs
      inputs:
        buildType: current
        artifactName: macos-signing-inputs-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/macos-signing-inputs
    - task: DownloadPipelineArtifact@2
      displayName: Download Notarized macOS Bundles
      inputs:
        buildType: current
        artifactName: macos-notarized-bundles-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/macos-notarized-bundles
    - bash: |
        set -euo pipefail
        input_root="$(Pipeline.Workspace)/macos-signing-inputs"
        notarized_bundle_root="$(Pipeline.Workspace)/macos-notarized-bundles"
        final_contents_root="$(Build.ArtifactStagingDirectory)/final-contents"
        output_root="$(Build.ArtifactStagingDirectory)/signed-macos"
        mkdir -p "$final_contents_root" "$output_root"

        verification_errors=0
        for tarball in "$input_root"/tarballs/*.tar.gz; do
          [[ -f "$tarball" ]] || continue
          tarball_name=$(basename "$tarball")
          base_name="${tarball_name%.tar.gz}"
          content_dir="$final_contents_root/$base_name"
          mach_o_count=0
          notarized_zip="$notarized_bundle_root/$base_name-signed.zip"

          rm -rf "$content_dir"
          mkdir -p "$content_dir"

          if [[ ! -f "$notarized_zip" ]]; then
            echo "ERROR: Notarized macOS bundle not found: $notarized_zip"
            verification_errors=1
            continue
          fi

          unzip -q "$notarized_zip" -d "$content_dir"
          echo "Extracted notarized macOS bundle: $(basename "$notarized_zip")"

          if [[ -e "$content_dir/libexec/bin/azv2" ]]; then
            mkdir -p "$content_dir/bin"
            if [[ -L "$content_dir/bin/azv2" ]]; then
              echo "bin/azv2 symlink preserved"
            else
              rm -f "$content_dir/bin/azv2"
              ln -s ../libexec/bin/azv2 "$content_dir/bin/azv2"
              echo "Recreated symlink: bin/azv2 -> ../libexec/bin/azv2"
            fi
          fi

          find "$content_dir" -name "*.so" -exec chmod +x {} \;
          find "$content_dir" -name "*.dylib" -exec chmod +x {} \;
          chmod +x "$content_dir/azv2" 2>/dev/null || true
          chmod +x "$content_dir/bin/azv2" 2>/dev/null || true
          chmod +x "$content_dir/libexec/bin/azv2" 2>/dev/null || true

          while IFS= read -r -d '' candidate; do
            if ! file "$candidate" | grep -q 'Mach-O'; then
              continue
            fi

            mach_o_count=$((mach_o_count + 1))
            if ! codesign -v "$candidate" 2>/dev/null; then
              echo "ERROR: Basic codesign verification failed: $candidate"
              verification_errors=1
            fi
            if ! codesign --verify --deep --strict "$candidate" 2>/dev/null; then
              echo "ERROR: Strict codesign verification failed: $candidate"
              verification_errors=1
            fi
            signature_details=$(codesign -dvvv "$candidate" 2>&1 || true)
            if ! printf '%s\n' "$signature_details" | grep -Eq 'Authority=.*Developer ID|TeamIdentifier=UBF8T346G9'; then
              echo "ERROR: Developer ID certificate missing: $candidate"
              printf '%s\n' "$signature_details" | grep -E '^(Authority|TeamIdentifier|Identifier|CDHash)=' || true
              verification_errors=1
            fi
          done < <(find "$content_dir" -type f -print0)

          if [[ "$mach_o_count" -eq 0 ]]; then
            echo "ERROR: No Mach-O binaries found in signed payload: $base_name"
            verification_errors=1
          fi

          tar -czf "$output_root/$base_name.tar.gz" --preserve-permissions -C "$content_dir" .
          shasum -a 256 "$output_root/$base_name.tar.gz" > "$output_root/$base_name.tar.gz.sha256"
          echo "Created signed macOS tarball: $base_name.tar.gz"
        done

        if [[ "$verification_errors" -ne 0 ]]; then
          exit 1
        fi
      displayName: Verify And Package Signed macOS Tarballs
    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      displayName: Generate SBOM For Signed macOS Artifacts
      inputs:
        BuildDropPath: $(Build.ArtifactStagingDirectory)/signed-macos
    - task: PublishPipelineArtifact@1
      displayName: Publish Signed macOS Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-macos
        artifact: signed-macos-$(MacOSArchitecture)
        publishLocation: pipeline

- stage: ValidateNugetArtifacts
  displayName: Validate NuGet Artifacts
  dependsOn: SignNugetArtifacts
  jobs:
  - job: ValidateNuget
    displayName: Validate Signed NuGet Packages
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: none
    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        version: '8.0.x'
    - task: DownloadPipelineArtifact@2
      displayName: Download Signed NuGet Artifacts
      inputs:
        buildType: current
        artifactName: signed-nuget
        targetPath: $(Pipeline.Workspace)/signed-nuget
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $nupkgs = Get-ChildItem -Path "$(Pipeline.Workspace)/signed-nuget" -Recurse -File -Filter '*.nupkg'
        if (-not $nupkgs) {
          throw 'No signed .nupkg files found in signed-nuget artifact.'
        }
        foreach ($pkg in $nupkgs) {
          dotnet nuget verify --all $pkg.FullName | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet verification failed for $($pkg.Name)"
          }
        }
      displayName: Verify NuGet Signatures

- stage: ValidateWindowsArtifacts
  displayName: Validate Windows Artifacts
  dependsOn: SignWindowsArtifacts
  jobs:
  - job: ValidateWindows
    displayName: Validate Signed Windows Payloads
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Signed Windows Artifacts
      inputs:
        buildType: current
        artifactName: signed-windows
        targetPath: $(Pipeline.Workspace)/signed-windows
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $zips = Get-ChildItem -Path "$(Pipeline.Workspace)/signed-windows" -Recurse -File | Where-Object { $_.Name -like '*win-*.zip' }
        if (-not $zips) {
          throw 'No signed Windows zip files found in signed-windows artifact.'
        }
        foreach ($zip in $zips) {
          $extract = Join-Path "$(Pipeline.Workspace)/verify-win" $zip.BaseName
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force
        }
        $toVerify = Get-ChildItem -Path "$(Pipeline.Workspace)/verify-win" -Recurse -File | Where-Object {
          $_.Name -ieq 'azv2.exe' -or
          $_.Name -like 'Microsoft.Azure.Cirrus*.dll' -or
          $_.Name -like 'Microsoft.Azure.Cirrus*.exe'
        }
        foreach ($file in $toVerify) {
          $signature = Get-AuthenticodeSignature -FilePath $file.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode verification failed for $($file.FullName). Status: $($signature.Status)"
          }
        }
        if ('${{ parameters.esrp_require_windows_strong_name }}' -eq 'true') {
          $dlls = $toVerify | Where-Object { $_.Name -like 'Microsoft.Azure.Cirrus*.dll' }
          if (-not $dlls) {
            throw 'Strong-name policy requires at least one Cirrus DLL in signed Windows payload.'
          }

          foreach ($dll in $dlls) {
            try {
              $assemblyName = [System.Reflection.AssemblyName]::GetAssemblyName($dll.FullName)
            }
            catch {
              throw "Strong-name verification failed for $($dll.FullName). Unable to read managed assembly metadata."
            }

            $token = $assemblyName.GetPublicKeyToken()
            if (-not $token -or $token.Length -eq 0) {
              throw "Strong-name verification failed for $($dll.FullName). Public key token is missing."
            }
          }
        }
      displayName: Verify Windows Signatures

- stage: ValidateLinuxArtifacts
  displayName: Validate Linux Artifacts
  dependsOn: CollectLinuxArtifacts
  jobs:
  - job: ValidateLinux
    displayName: Validate Linux Artifact Set
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Collected Linux Artifacts
      inputs:
        buildType: current
        artifactName: collected-linux
        targetPath: $(Pipeline.Workspace)/collected-linux
    - bash: |
        set -euo pipefail
        count=$(find "$(Pipeline.Workspace)/collected-linux" -type f \( -name '*linux*.tar.gz' -o -name '*linux*.zip' \) | wc -l | tr -d ' ')
        if [[ "$count" == "0" ]]; then
          echo 'ERROR: No Linux artifacts found after collection.'
          exit 1
        fi
        echo "Linux artifact count: $count"
      displayName: Validate Linux Artifact Presence

- stage: ValidateMacOSArtifacts
  displayName: Validate macOS Artifacts
  dependsOn: SignMacOSArtifacts
  jobs:
  - job: ValidateMacOS
    displayName: Validate Signed macOS Artifacts
    strategy:
      matrix:
        arm64:
          MacOSArchitecture: arm64
          MacOSVmImage: ${{ parameters.macos_arm64_pool }}
        x64:
          MacOSArchitecture: x64
          MacOSVmImage: ${{ parameters.macos_intel_pool }}
    pool:
      vmImage: $(MacOSVmImage)
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download Signed macOS Artifacts
      inputs:
        buildType: current
        artifactName: signed-macos-$(MacOSArchitecture)
        targetPath: $(Pipeline.Workspace)/signed-macos
    - bash: |
        set -euo pipefail
        root="$(Pipeline.Workspace)/signed-macos"
        tarballs=()
        while IFS= read -r tarball; do
          tarballs+=("$tarball")
        done < <(find "$root" -type f \( -name '*mac*.tar.gz' -o -name '*macos*.tar.gz' -o -name '*osx*.tar.gz' -o -name '*darwin*.tar.gz' \) | sort)
        if [[ ${#tarballs[@]} -eq 0 ]]; then
          echo 'ERROR: No signed macOS tarballs found.'
          exit 1
        fi

        errors=0
        total_macho=0
        for tarball in "${tarballs[@]}"; do
          verify_dir="$(Pipeline.Workspace)/verify-macos/$(basename "${tarball%.tar.gz}")"
          mkdir -p "$verify_dir"
          tar -xzf "$tarball" -C "$verify_dir"

          tarball_macho=0
          while IFS= read -r -d '' candidate; do
            if ! file "$candidate" | grep -q 'Mach-O'; then
              continue
            fi

            tarball_macho=$((tarball_macho + 1))
            total_macho=$((total_macho + 1))
            if ! codesign -v "$candidate" 2>/dev/null; then
              echo "ERROR: Basic codesign verification failed: $candidate"
              errors=1
            fi
            if ! codesign --verify --deep --strict "$candidate" 2>/dev/null; then
              echo "ERROR: Strict codesign verification failed: $candidate"
              errors=1
            fi
            signature_details=$(codesign -dvvv "$candidate" 2>&1 || true)
            if ! printf '%s\n' "$signature_details" | grep -Eq 'Authority=.*Developer ID|TeamIdentifier=UBF8T346G9'; then
              echo "ERROR: Developer ID certificate missing: $candidate"
              printf '%s\n' "$signature_details" | grep -E '^(Authority|TeamIdentifier|Identifier|CDHash)=' || true
              errors=1
            fi
          done < <(find "$verify_dir" -type f -print0)

          if [[ "$tarball_macho" -eq 0 ]]; then
            echo "ERROR: No Mach-O binaries found in $tarball"
            errors=1
          fi
        done

        echo "Validated $total_macho signed macOS Mach-O binaries."
        if [[ "$errors" -ne 0 ]]; then
          exit 1
        fi
      displayName: Verify macOS Developer ID Signatures

- stage: AssembleSignedArtifacts
  displayName: Assemble Signed Artifacts
  dependsOn:
  - ValidateNugetArtifacts
  - ValidateWindowsArtifacts
  - ValidateLinuxArtifacts
  - ValidateMacOSArtifacts
  jobs:
  - job: ValidateAndAssemble
    displayName: Validate And Assemble Final Signed Artifact
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: Download Signed Windows Artifacts
      inputs:
        buildType: current
        artifactName: signed-windows
        targetPath: $(Pipeline.Workspace)/signed-windows

    - task: DownloadPipelineArtifact@2
      displayName: Download Signed NuGet Artifacts
      inputs:
        buildType: current
        artifactName: signed-nuget
        targetPath: $(Pipeline.Workspace)/signed-nuget

    - task: DownloadPipelineArtifact@2
      displayName: Download Collected Linux Artifacts
      inputs:
        buildType: current
        artifactName: collected-linux
        targetPath: $(Pipeline.Workspace)/collected-linux

    - task: DownloadPipelineArtifact@2
      displayName: Download Signed macOS Artifacts [arm64]
      inputs:
        buildType: current
        artifactName: signed-macos-arm64
        targetPath: $(Pipeline.Workspace)/signed-macos/arm64

    - task: DownloadPipelineArtifact@2
      displayName: Download Signed macOS Artifacts [x64]
      inputs:
        buildType: current
        artifactName: signed-macos-x64
        targetPath: $(Pipeline.Workspace)/signed-macos/x64

    - bash: |
        set -euo pipefail
        release_dir="$(Build.ArtifactStagingDirectory)/signed-release"
        mkdir -p "$release_dir"

        cp -v "$(Pipeline.Workspace)/signed-windows"/* "$release_dir/" 2>/dev/null || true
        cp -v "$(Pipeline.Workspace)/signed-nuget"/* "$release_dir/" 2>/dev/null || true
        cp -v "$(Pipeline.Workspace)/collected-linux"/* "$release_dir/" 2>/dev/null || true
        find "$(Pipeline.Workspace)/signed-macos" -maxdepth 2 -type f -exec cp -v {} "$release_dir/" \;

        python3 - <<'PY'
        import hashlib
        import json
        import os

        release_dir = os.path.join(os.environ['BUILD_ARTIFACTSTAGINGDIRECTORY'], 'signed-release')
        source_project = '${{ parameters.SourceProject }}'
        source_pipeline_name = '${{ parameters.source_pipeline_name }}'
        source_build_id = '${{ parameters.source_build_id }}'
        source_artifact_name = '${{ parameters.source_artifact_name }}'

        files = [
          name
          for name in sorted(os.listdir(release_dir))
          if os.path.isfile(os.path.join(release_dir, name))
        ]

        checks = {
          'nupkg': any(name.endswith('.nupkg') for name in files),
          'windows_zip': any('win-' in name and name.endswith('.zip') for name in files),
          'linux_archive': any('linux' in name and (name.endswith('.tar.gz') or name.endswith('.zip')) for name in files),
          'macos_archive': any(
            any(token in name for token in ('mac', 'macos', 'osx', 'darwin')) and (name.endswith('.tar.gz') or name.endswith('.zip'))
            for name in files
          ),
        }

        missing = [kind for kind, present in checks.items() if not present]
        if missing:
          raise SystemExit(f'Assemble validation failed. Missing expected artifact categories: {", ".join(missing)}')

        entries = []
        for name in files:
          path = os.path.join(release_dir, name)
          h = hashlib.sha256()
          with open(path, 'rb') as f:
            while True:
              chunk = f.read(1024 * 1024)
              if not chunk:
                break
              h.update(chunk)
          entries.append({
            'file': name,
            'sha256': h.hexdigest(),
            'size': os.path.getsize(path),
          })

        with open(os.path.join(release_dir, 'signing-manifest.json'), 'w', encoding='utf-8') as f:
          json.dump(entries, f, indent=2)

        provenance = {
          'source': {
            'project': source_project,
            'pipeline': source_pipeline_name,
            'buildId': source_build_id,
            'artifact': source_artifact_name,
          },
          'signingRun': {
            'project': os.getenv('SYSTEM_TEAMPROJECT', ''),
            'pipeline': os.getenv('BUILD_DEFINITIONNAME', ''),
            'buildId': os.getenv('BUILD_BUILDID', ''),
            'buildNumber': os.getenv('BUILD_BUILDNUMBER', ''),
            'sourceBranch': os.getenv('BUILD_SOURCEBRANCH', ''),
            'sourceVersion': os.getenv('BUILD_SOURCEVERSION', ''),
          },
          'policy': {
            'esrpNugetVerifyEnabled': '${{ parameters.esrp_enable_nuget_verify }}',
            'esrpWindowsVerifyEnabled': '${{ parameters.esrp_enable_windows_verify }}',
            'windowsTimestampEnabled': '${{ parameters.esrp_enable_windows_timestamp }}',
            'windowsTimestampSetting': '/tr "http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer" /td sha256',
            'windowsStrongNameRequired': '${{ parameters.esrp_require_windows_strong_name }}',
            'macosBundleId': '${{ parameters.macos_bundle_id }}',
            'macosAppleKeyCode': '${{ parameters.esrp_apple_keycode }}',
          },
          'verificationMatrix': checks,
        }

        with open(os.path.join(release_dir, 'signing-provenance.json'), 'w', encoding='utf-8') as f:
          json.dump(provenance, f, indent=2)
        PY

        echo "Final signed release contents:"
        ls -al "$release_dir"
      displayName: Assemble Final Signed Artifact

    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      displayName: Generate SBOM For Final Signed Artifact
      inputs:
        BuildDropPath: $(Build.ArtifactStagingDirectory)/signed-release

    - task: PublishPipelineArtifact@1
      displayName: Publish Final Signed Artifact
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-release
        artifact: ${{ parameters.signed_artifact_name }}
        publishLocation: pipeline
