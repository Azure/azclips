            ]
    - ${{ if ne(parameters.esrp_enable_windows_timestamp, true) }}:
      - task: EsrpCodeSigning@5
        displayName: Sign Windows Payload [azv2.exe]
        condition: eq(variables['HasWindowsPayload'], 'true')
        inputs:
          ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
          AppRegistrationClientId: '$(ESRPAppClientId)'
