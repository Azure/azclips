parameters:
- name: windows_pool
  type: string
  default: 'windows-latest'
- name: ubuntu_pool
  type: string
  default: 'ubuntu-latest'
- name: dependency_stage
  type: string
  default: 'Preflight'
- name: SourceProject
  type: string
  default: 'public'
- name: source_pipeline_name
  type: string
  default: 'cirrus-adhoc-build'
- name: source_build_id
  type: string
  default: ''
- name: source_artifact_name
  type: string
  default: 'Distribution_Final'
- name: signed_artifact_name
  type: string
  default: 'signed-dist'
- name: esrp_service_connection
  type: string
  default: ''
- name: esrp_nuget_keycode
  type: string
  default: 'CP-401405'
- name: esrp_authenticode_keycode
  type: string
  default: 'CP-230012'
- name: esrp_apple_keycode
  type: string
  default: 'CP-401337-Apple'
- name: macos_bundle_id
  type: string
  default: 'com.microsoft.cirrus.cli'
- name: macos_arm64_pool
  type: string
  default: 'macOS-15-arm64'
- name: macos_intel_pool
  type: string
  default: 'macOS-15'
- name: esrp_enable_nuget_verify
  type: boolean
  default: true
- name: esrp_enable_windows_verify
  type: boolean
  default: true
- name: esrp_enable_windows_timestamp
  type: boolean
  default: true
- name: esrp_require_windows_strong_name
  type: boolean
  default: false
- name: windows_sign_architectures
  type: object
  default:
  - x64
- name: linux_collect_architectures
  type: object
  default:
  - x64
  - arm64

stages:
- stage: SignNugetArtifacts
  displayName: Sign NuGet Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: SignNuget
    displayName: Sign NuGet Artifacts
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        version: '8.0.x'
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: ${{ parameters.SourceProject }}
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        artifactName: ${{ parameters.source_artifact_name }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - task: PowerShell@2
      displayName: Filter NuGet Release Artifacts
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = "$(Pipeline.Workspace)/unsigned-all"
          $targetRoot = "$(Pipeline.Workspace)/unsigned"
          Remove-Item $targetRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null
          $allNupkgs = Get-ChildItem -Path $sourceRoot -Recurse -File | Where-Object {
            $_.Name -like '*.nupkg' -and $_.Name -notlike '*.snupkg'
          }
          $selected = $allNupkgs | Where-Object {
            $_.Name -like 'Microsoft.Azure.Cirrus*.nupkg'
          }
          if (-not $selected) {
            throw "No Cirrus NuGet release artifacts found under $sourceRoot (expected Microsoft.Azure.Cirrus*.nupkg)"
          }
          foreach ($asset in $selected) {
            Copy-Item $asset.FullName -Destination (Join-Path $targetRoot $asset.Name) -Force
          }
          Write-Host "Selected $($selected.Count) Cirrus NuGet release artifacts."

          $excluded = $allNupkgs | Where-Object {
            $_.Name -notlike 'Microsoft.Azure.Cirrus*.nupkg'
          }
          if ($excluded) {
            Write-Host "Excluded non-Cirrus nupkgs from ESRP submission:"
            foreach ($pkg in $excluded) {
              Write-Host "  $($pkg.Name)"
            }
          }
    - task: PowerShell@2
      displayName: Prepare Signing Inputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/prepare_signing_inputs.ps1
        arguments: >-
          -UnsignedRoot "$(Pipeline.Workspace)/unsigned"
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PowerShell@2
      displayName: List NuGet Artifacts To Be Signed
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $nupkgRoot = "$(Pipeline.Workspace)/signing-work/nupkg"
          if (-not (Test-Path $nupkgRoot)) {
            throw "NuGet signing input folder not found: $nupkgRoot"
          }

          $files = Get-ChildItem -Path $nupkgRoot -File | Where-Object {
            $_.Name -like 'Microsoft.Azure.Cirrus*.nupkg'
          } | Sort-Object Name
          if (-not $files) {
            throw "No Cirrus .nupkg files found for signing in $nupkgRoot"
          }

          Write-Host "NuGet signing candidates ($($files.Count))"
          foreach ($file in $files) {
            Write-Host ("  {0}  ({1} bytes)" -f $file.Name, $file.Length)
          }

          $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host "NuGet total bytes to sign: $totalBytes"
    - task: EsrpCodeSigning@5
      displayName: Sign NuGet Packages [NuGetSign]
      condition: eq(variables['HasNupkg'], 'true')
      inputs:
        ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
        AppRegistrationClientId: '$(ESRPAppClientId)'
        AppRegistrationTenantId: '$(ESRPAppTenantId)'
        AuthAKVName: '$(ESRPKVName)'
        AuthCertName: '$(ESRPAuthCertName)'
        AuthSignCertName: '$(ESRPSignCertName)'
        batchSignPolicyFile: ''
        ciPolicyFile: ''
        FolderPath: '$(Pipeline.Workspace)/signing-work/nupkg'
        UseMinimatch: true
        Pattern: 'Microsoft.Azure.Cirrus*.nupkg'
        signConfigType: inlineSignParams
        SessionTimeout: '60'
        MaxConcurrency: '25'
        MaxRetryAttempts: '5'
        inlineOperation: |
          [
            {
              "KeyCode": "${{ parameters.esrp_nuget_keycode }}",
              "OperationCode": "NuGetSign",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]
    - ${{ if eq(parameters.esrp_enable_nuget_verify, true) }}:
      - task: EsrpCodeSigning@5
        displayName: Verify NuGet Packages In ESRP [NuGetVerify]
        condition: eq(variables['HasNupkg'], 'true')
        inputs:
          ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/signing-work/nupkg'
          UseMinimatch: true
          Pattern: 'Microsoft.Azure.Cirrus*.nupkg'
          signConfigType: inlineSignParams
          SessionTimeout: '60'
          MaxConcurrency: '25'
          MaxRetryAttempts: '5'
          inlineOperation: |
            [
              {
                "KeyCode": "${{ parameters.esrp_nuget_keycode }}",
                "OperationCode": "NuGetVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]
    - task: PowerShell@2
      displayName: Verify Signed Outputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/verify_signed_outputs.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -RequireNupkg $true
        pwsh: true
    - task: PowerShell@2
      displayName: Repack Signed Outputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/repack_signed_outputs.ps1
        arguments: >-
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PublishPipelineArtifact@1
      displayName: Publish Signed NuGet Artifacts
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/signed-release
        artifact: signed-nuget
        publishLocation: pipeline

- stage: SignWindowsArtifacts
  displayName: Sign Windows Artifacts
  dependsOn: ${{ parameters.dependency_stage }}
  jobs:
  - job: SignWindows
    displayName: Sign Windows Artifacts
    pool:
      vmImage: ${{ parameters.windows_pool }}
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: Setup .NET SDK
      inputs:
        packageType: sdk
        version: '8.0.x'
    - task: DownloadPipelineArtifact@2
      displayName: Download Unsigned Distribution Artifacts
      inputs:
        buildType: specific
        project: ${{ parameters.SourceProject }}
        definition: ${{ parameters.source_pipeline_name }}
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.source_build_id }}
        artifactName: ${{ parameters.source_artifact_name }}
        targetPath: $(Pipeline.Workspace)/unsigned-all
    - task: PowerShell@2
      displayName: Filter Windows Release Artifacts
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = "$(Pipeline.Workspace)/unsigned-all"
          $targetRoot = "$(Pipeline.Workspace)/unsigned"
          $architectureCsv = '${{ join(',', parameters.windows_sign_architectures) }}'
          $architectures = $architectureCsv.Split(',') |
            ForEach-Object { "$($_)".Trim().ToLowerInvariant() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if (-not $architectures) {
            throw "windows_sign_architectures resolved to an empty list."
          }

          Write-Host "Windows signing architectures: $($architectures -join ', ')"

          Remove-Item $targetRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null

          $allWindowsAssets = Get-ChildItem -Path $sourceRoot -Recurse -File | Where-Object {
            $_.Name -like '*win-*.zip'
          }

          $selected = foreach ($asset in $allWindowsAssets) {
            $name = $asset.Name.ToLowerInvariant()
            foreach ($arch in $architectures) {
              if ($name.Contains($arch)) {
                $asset
                break
              }
            }
          }

          if (-not $selected) {
            throw "No Windows release artifacts matched architectures [$($architectures -join ', ')] under $sourceRoot"
          }

          foreach ($asset in $selected) {
            Copy-Item $asset.FullName -Destination (Join-Path $targetRoot $asset.Name) -Force
          }
          Write-Host "Selected $($selected.Count) Windows release artifacts."
    - task: PowerShell@2
      displayName: Prepare Signing Inputs
      inputs:
        targetType: filePath
        filePath: devops/scripts/packaging/signing/prepare_signing_inputs.ps1
        arguments: >-
          -UnsignedRoot "$(Pipeline.Workspace)/unsigned"
          -WorkingRoot "$(Pipeline.Workspace)/signing-work"
          -ReleaseRoot "$(Build.ArtifactStagingDirectory)/signed-release"
        pwsh: true
    - task: PowerShell@2
      displayName: List Windows Artifacts To Be Signed
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $windowsRoot = "$(Pipeline.Workspace)/signing-work/windows-extracted"
          if (-not (Test-Path $windowsRoot)) {
            throw "Windows signing input folder not found: $windowsRoot"
          }

          $files = Get-ChildItem -Path $windowsRoot -Recurse -File | Where-Object {
            $_.Name -ieq 'azv2.exe' -or
            $_.Name -like 'Microsoft.Azure.Cirrus*.dll' -or
            $_.Name -like 'Microsoft.Azure.Cirrus*.exe'
          } | Sort-Object FullName

          if (-not $files) {
            throw "No Windows binaries found for signing in $windowsRoot"
          }

          Write-Host "Windows signing candidates ($($files.Count))"
          foreach ($file in $files) {
            $relative = $file.FullName.Substring($windowsRoot.Length).TrimStart('\\')
            Write-Host ("  {0}  ({1} bytes)" -f $relative, $file.Length)
          }

          $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host "Windows total bytes to sign: $totalBytes"
    - ${{ if eq(parameters.esrp_enable_windows_timestamp, true) }}:
      - task: EsrpCodeSigning@5
        displayName: Sign Windows Payload [azv2.exe]
        condition: eq(variables['HasWindowsPayload'], 'true')
        inputs:
          ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
          UseMinimatch: true
          Pattern: '**/azv2.exe'
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "http://www.microsoft.com",
                  "FileDigest": "/fd \"SHA256\"",
                  "PageHash": "/NPH",
                  "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
              },
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
              }
            ]
      - task: EsrpCodeSigning@5
        displayName: Sign Windows Payload [Cirrus DLLs]
        condition: eq(variables['HasWindowsPayload'], 'true')
        inputs:
          ConnectedServiceName: '${{ parameters.esrp_service_connection }}'
          AppRegistrationClientId: '$(ESRPAppClientId)'
          AppRegistrationTenantId: '$(ESRPAppTenantId)'
          AuthAKVName: '$(ESRPKVName)'
          AuthCertName: '$(ESRPAuthCertName)'
          AuthSignCertName: '$(ESRPSignCertName)'
          batchSignPolicyFile: ''
          ciPolicyFile: ''
          FolderPath: '$(Pipeline.Workspace)/signing-work/windows-extracted'
          UseMinimatch: true
          Pattern: '**/Microsoft.Azure.Cirrus*.dll'
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "http://www.microsoft.com",
                  "FileDigest": "/fd \"SHA256\"",
                  "PageHash": "/NPH",
                  "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
              },
              {
                "KeyCode": "${{ parameters.esrp_authenticode_keycode }}",
                "OperationCode": "SigntoolVerify",
