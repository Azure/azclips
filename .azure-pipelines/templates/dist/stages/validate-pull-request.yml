parameters:
- name: stage_name
  type: string
  default: ValidatePullRequest
- name: display_name
  type: string
  default: Validate Pull Request
- name: ubuntu_pool
  type: string
  default: 'ubuntu-latest'
- name: depends_on
  type: object
  default: []
- name: github_token
  type: string
  default: ''
- name: github_repository
  type: string
  default: ''

stages:
- stage: ${{ parameters.stage_name }}
  displayName: ${{ parameters.display_name }}
  dependsOn: ${{ parameters.depends_on }}
  condition: succeeded()
  jobs:
  - job: CheckPullRequest
    displayName: Check Pull Request Title and History Notes
    pool:
      vmImage: ${{ parameters.ubuntu_pool }}
    steps:
    - checkout: self
    - bash: |
        set -euo pipefail

        python3 - <<'PY'
        import json
        import os
        import subprocess
        import sys
        import urllib.error
        import urllib.request

        pr_number = os.environ.get('SYSTEM_PULLREQUEST_PULLREQUESTNUMBER')
        repository = os.environ.get('GITHUB_REPOSITORY_NAME') or os.environ.get('BUILD_REPOSITORY_NAME')

        if not pr_number:
            print('No pull request number found; skipping pull request metadata validation.')
            sys.exit(0)
        if not repository:
            print('BUILD_REPOSITORY_NAME is not set.', file=sys.stderr)
            sys.exit(1)

        headers = {
            'Accept': 'application/vnd.github+json',
            'User-Agent': 'azclips-pr-title-check',
            'X-GitHub-Api-Version': '2022-11-28'
        }
        token = os.environ.get('GH_TOKEN') or os.environ.get('GITHUB_TOKEN')
        has_token = bool(token and not token.startswith('$('))
        if has_token:
            headers['Authorization'] = f'Bearer {token}'

        def get_error_body(error):
            try:
                return error.read().decode('utf-8', errors='replace').strip()
            except Exception:
                return ''

        request = urllib.request.Request(
            f'https://api.github.com/repos/{repository}/pulls/{pr_number}',
            headers=headers
        )

        try:
            with urllib.request.urlopen(request) as response:
                pull_request = json.load(response)
        except urllib.error.HTTPError as error:
            error_body = get_error_body(error)
            error_message = ''
            try:
                error_message = json.loads(error_body).get('message', '')
            except json.JSONDecodeError:
                error_message = error_body.strip()
            print(
                f'Failed to fetch pull request metadata from GitHub: HTTP {error.code} {error.reason}. '
                f'Repository: {repository}. Pull request: #{pr_number}. Token available: {has_token}.',
                file=sys.stderr
            )
            if error_body:
                print(f'GitHub response body: {error_body}', file=sys.stderr)
            oauth_scopes = error.headers.get('X-OAuth-Scopes')
            accepted_scopes = error.headers.get('X-Accepted-OAuth-Scopes')
            if oauth_scopes:
                print(f'GitHub token scopes: {oauth_scopes}', file=sys.stderr)
            if accepted_scopes:
                print(f'GitHub accepted scopes: {accepted_scopes}', file=sys.stderr)
            if error.code in (403, 404):
                print(
                    'Private repositories require GH_TOKEN/GITHUB_TOKEN with access to read pull request metadata. '
                    'For a fine-grained PAT, grant repository access to Azure/azclips and Pull requests: Read-only. '
                    'If the Azure organization enforces SAML SSO, authorize the token for the organization.',
                    file=sys.stderr
                )
            if error_message:
                print(f'GitHub API message: {error_message}', file=sys.stderr)
            sys.exit(1)
        except urllib.error.URLError as error:
            print(f'Failed to fetch pull request metadata from GitHub: {error.reason}', file=sys.stderr)
            sys.exit(1)

        title = pull_request.get('title') or ''
        body = pull_request.get('body') or ''

        print(f'Check pull request title and history notes: #{pr_number}')
        print(title)

        subprocess.run(
            ['python3', 'devops/scripts/ci/check_pull_request.py', title, body],
            check=True
        )
        PY
      displayName: Check PR title and history notes
      env:
        GH_TOKEN: ${{ parameters.github_token }}
        GITHUB_REPOSITORY_NAME: ${{ parameters.github_repository }}
