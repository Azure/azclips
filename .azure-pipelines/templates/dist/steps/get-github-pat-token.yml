# Fetch a pre-minted GitHub PAT from Azure Key Vault for later steps.
# The Azure service connection needs Key Vault Secrets User (RBAC) or Get secret permission.
parameters:
- name: azureSubscription
  type: string
- name: keyVaultName
  type: string
- name: secretName
  type: string
- name: outputVariable
  type: string
  default: GH_TOKEN
- name: execCondition
  type: string
  default: succeeded()

steps:
- task: AzurePowerShell@5
  displayName: Get GitHub PAT from Key Vault
  condition: ${{ parameters.execCondition }}
  inputs:
    azureSubscription: ${{ parameters.azureSubscription }}
    azurePowerShellVersion: LatestVersion
    pwsh: true
    ScriptType: InlineScript
    Inline: |
      $ghToken = Get-AzKeyVaultSecret -VaultName "${{ parameters.keyVaultName }}" -Name "${{ parameters.secretName }}" -AsPlainText
      if ([string]::IsNullOrWhiteSpace($ghToken)) {
        throw "GitHub PAT secret '${{ parameters.secretName }}' in vault '${{ parameters.keyVaultName }}' was empty or not found."
      }

      Write-Host "##vso[task.setvariable variable=${{ parameters.outputVariable }};issecret=true]$ghToken"
