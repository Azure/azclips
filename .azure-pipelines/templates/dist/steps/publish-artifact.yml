# Publishes a build artifact so that "Rerun failed jobs" does not fail with
# "Artifact <name> already exists": artifact names are immutable within a build,
# so a retried job cannot publish under the name its earlier attempt already used.
# This covers publishes that also run after failures, which "Rerun failed jobs"
# would otherwise always collide with. It does not protect success-only publishes
# from "Rerun all jobs", which reruns jobs that already succeeded and published.
#
# retry_mode:
#   suffix - Attempt 1 publishes <artifact_name>; retries publish
#            <artifact_name>_attempt<N>, keeping every attempt's output. Use for
#            diagnostics that nothing downloads by name.
#   reuse  - Retries skip publishing when an earlier attempt already published
#            <artifact_name>, checked through the build artifacts REST API with the
#            job's System.AccessToken. Use only for artifacts that downstream jobs
#            download by name and whose content is identical on every attempt.
#            Supports only artifact_type 'pipeline' and requires bash and curl.
parameters:
- name: display_name
  type: string
- name: artifact_name
  type: string
- name: condition
  type: string
  default: succeeded()
- name: retry_mode
  type: string
  default: suffix
  values:
  - suffix
  - reuse
- name: artifact_type
  type: string
  default: pipeline
  values:
  - pipeline
  - security_analysis_logs
# Required for pipeline artifacts; security analysis logs collect their own files.
- name: target_path
  type: string
  default: ''

steps:
- ${{ if eq(parameters.retry_mode, 'reuse') }}:
  - bash: |
      set -euo pipefail
      if [[ ! "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
        echo "##[error]Artifact name must contain only letters, digits, '.', '_' or '-'."
        exit 1
      fi
      url="${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECTID}/_apis/build/builds/${BUILD_BUILDID}/artifacts?artifactName=${ARTIFACT_NAME}&api-version=7.1"
      # Bounded so a hung request fails this step instead of the whole job timing out.
      status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
        --connect-timeout 10 --max-time 30 --retry 3 --retry-max-time 120 \
        --header "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" "$url" || true)"
      case "$status" in
        200)
          echo "Artifact '$ARTIFACT_NAME' was published by an earlier attempt; reusing it."
          exists=true
          ;;
        404)
          exists=false
          ;;
        *)
          echo "##[error]Could not check whether artifact '$ARTIFACT_NAME' exists (HTTP $status)."
          exit 1
          ;;
      esac
      echo "##vso[task.setvariable variable=PublishArtifactAlreadyExists]$exists"
    displayName: ${{ parameters.display_name }} (Check Earlier Attempt)
    condition: and(${{ parameters.condition }}, ne(variables['System.JobAttempt'], '1'))
    env:
      ARTIFACT_NAME: ${{ parameters.artifact_name }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    timeoutInMinutes: 5

  - task: PublishPipelineArtifact@1
    displayName: ${{ parameters.display_name }}
    condition: and(${{ parameters.condition }}, ne(variables['PublishArtifactAlreadyExists'], 'true'))
    inputs:
      targetPath: ${{ parameters.target_path }}
      artifact: ${{ parameters.artifact_name }}
      publishLocation: pipeline

- ${{ if and(eq(parameters.retry_mode, 'suffix'), eq(parameters.artifact_type, 'pipeline')) }}:
  - task: PublishPipelineArtifact@1
    displayName: ${{ parameters.display_name }}
    condition: and(${{ parameters.condition }}, eq(variables['System.JobAttempt'], '1'))
    inputs:
      targetPath: ${{ parameters.target_path }}
      artifact: ${{ parameters.artifact_name }}
      publishLocation: pipeline

  - task: PublishPipelineArtifact@1
    displayName: ${{ parameters.display_name }} (Retry)
    condition: and(${{ parameters.condition }}, ne(variables['System.JobAttempt'], '1'))
    inputs:
      targetPath: ${{ parameters.target_path }}
      artifact: ${{ parameters.artifact_name }}_attempt$(System.JobAttempt)
      publishLocation: pipeline

- ${{ if and(eq(parameters.retry_mode, 'suffix'), eq(parameters.artifact_type, 'security_analysis_logs')) }}:
  - task: securedevelopmentteam.vss-secure-development-tools.build-task-publishsecurityanalysislogs.PublishSecurityAnalysisLogs@3
    displayName: ${{ parameters.display_name }}
    condition: and(${{ parameters.condition }}, eq(variables['System.JobAttempt'], '1'))
    inputs:
      ArtifactName: ${{ parameters.artifact_name }}
      ArtifactType: Container
      PublishProcessedResults: false
      AllTools: true

  - task: securedevelopmentteam.vss-secure-development-tools.build-task-publishsecurityanalysislogs.PublishSecurityAnalysisLogs@3
    displayName: ${{ parameters.display_name }} (Retry)
    condition: and(${{ parameters.condition }}, ne(variables['System.JobAttempt'], '1'))
    inputs:
      ArtifactName: ${{ parameters.artifact_name }}_attempt$(System.JobAttempt)
      ArtifactType: Container
      PublishProcessedResults: false
      AllTools: true
