# Publishes a pipeline artifact so that "Rerun failed jobs" does not fail with
# "Artifact <name> already exists": pipeline artifact names are immutable within a
# build, so a retried job cannot publish under the name its earlier attempt used.
# (Container/build artifacts, such as PublishSecurityAnalysisLogs, merge uploads to
# the same name instead of failing, so they do not need this template.)
#
# Use it for publishes that also run after failures, which "Rerun failed jobs"
# would otherwise always collide with, and for jobs that publish several artifacts
# before a step that can still fail. It does not protect success-only publishes
# from "Rerun all jobs", which reruns jobs that already succeeded and published.
#
# retry_mode:
#   suffix - Attempt 1 publishes <artifact_name>; retries publish
#            <artifact_name>_attempt<N>. The plain name therefore keeps the first
#            (failed) attempt's output and the latest attempt has the highest
#            suffix. Use for diagnostics that nothing downloads by name.
#   reuse  - Skips publishing when an earlier attempt already published
#            <artifact_name>, checked through the build artifacts REST API with the
#            job's System.AccessToken. The check runs on every attempt so access
#            problems surface as a warning on attempt 1 instead of failing a later
#            retry unexpectedly. Use only for artifacts that downstream jobs download
#            by name and whose content is identical on every attempt. Requires bash
#            and curl.
parameters:
- name: display_name
  type: string
- name: artifact_name
  type: string
- name: target_path
  type: string
- name: condition
  type: string
  default: succeeded()
- name: retry_mode
  type: string
  default: suffix
  values:
  - suffix
  - reuse

steps:
- ${{ if eq(parameters.retry_mode, 'reuse') }}:
  - bash: |
      set -euo pipefail
      # Start unknown so publishing needs a successful check from this call, never an
      # earlier call's result.
      echo "##vso[task.setvariable variable=PublishArtifactAlreadyExists]unknown"
      if [[ ! "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
        echo "##[error]Artifact name must contain only letters, digits, '.', '_' or '-'."
        exit 1
      fi
      url="${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECTID}/_apis/build/builds/${BUILD_BUILDID}/artifacts?artifactName=${ARTIFACT_NAME}&api-version=7.1"
      # Bounded so a hung request fails this step instead of the whole job timing out.
      curl_exit=0
      status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
        --connect-timeout 10 --max-time 30 --retry 3 --retry-max-time 120 \
        --header "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" "$url")" || curl_exit=$?
      if [[ "$curl_exit" == "0" && "$status" == "200" ]]; then
        echo "Artifact '$ARTIFACT_NAME' was already published in this build; reusing it."
        echo "##vso[task.setvariable variable=PublishArtifactAlreadyExists]true"
      elif [[ "$curl_exit" == "0" && "$status" == "404" ]]; then
        echo "##vso[task.setvariable variable=PublishArtifactAlreadyExists]false"
      else
        message="Could not check whether artifact '$ARTIFACT_NAME' exists (HTTP $status, curl exit $curl_exit)."
        if [[ "$SYSTEM_JOBATTEMPT" == "1" ]]; then
          # Nothing can have been published by an earlier attempt yet, so publish anyway.
          echo "##[warning]$message Job reruns will fail until this is fixed."
          echo "##vso[task.setvariable variable=PublishArtifactAlreadyExists]false"
        else
          echo "##[error]$message"
          exit 1
        fi
      fi
    displayName: ${{ parameters.display_name }} (Check Earlier Attempt)
    condition: ${{ parameters.condition }}
    env:
      ARTIFACT_NAME: ${{ parameters.artifact_name }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    timeoutInMinutes: 5

  - task: PublishPipelineArtifact@1
    displayName: ${{ parameters.display_name }}
    condition: and(${{ parameters.condition }}, eq(variables['PublishArtifactAlreadyExists'], 'false'))
    inputs:
      targetPath: ${{ parameters.target_path }}
      artifact: ${{ parameters.artifact_name }}
      publishLocation: pipeline

- ${{ if eq(parameters.retry_mode, 'suffix') }}:
  - task: PublishPipelineArtifact@1
    displayName: ${{ parameters.display_name }}
    condition: and(${{ parameters.condition }}, eq(variables['System.JobAttempt'], '1'))
    inputs:
      targetPath: ${{ parameters.target_path }}
      artifact: ${{ parameters.artifact_name }}
      publishLocation: pipeline

  - task: PublishPipelineArtifact@1
    displayName: ${{ parameters.display_name }} (Retry)
    condition: and(${{ parameters.condition }}, ne(variables['System.JobAttempt'], '1'))
    inputs:
      targetPath: ${{ parameters.target_path }}
      artifact: ${{ parameters.artifact_name }}_attempt$(System.JobAttempt)
      publishLocation: pipeline
