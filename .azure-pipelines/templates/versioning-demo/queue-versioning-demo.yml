parameters:
- name: demo_pipeline_name
  type: string
  default: naga-versioning-demo
- name: demo_branch
  type: string
  default: naga/test-pr
- name: base_version
  type: string
  default: '0.1.0'
- name: bump_type
  type: string
  default: patch
- name: release_channel
  type: string
- name: release_date
  type: string
  default: utc
- name: pr_number
  type: string
  default: '1'
- name: sequence
  type: string

steps:
- checkout: none

- script: |
    set -euo pipefail

    demo_pipeline_name='${{ parameters.demo_pipeline_name }}'
    demo_branch='${{ parameters.demo_branch }}'
    base_version='${{ parameters.base_version }}'
    bump_type='${{ parameters.bump_type }}'
    release_channel='${{ parameters.release_channel }}'
    release_date='${{ parameters.release_date }}'
    pr_number='${{ parameters.pr_number }}'
    sequence='${{ parameters.sequence }}'

    if [[ -z "${AZURE_DEVOPS_EXT_PAT:-}" ]]; then
      echo "ERROR: System.AccessToken is not available. Enable 'Allow scripts to access the OAuth token' for this pipeline."
      exit 1
    fi

    if ! command -v az >/dev/null 2>&1; then
      echo "ERROR: Azure CLI is not available on this agent."
      exit 1
    fi

    if ! az extension show --name azure-devops --only-show-errors >/dev/null 2>&1; then
      az extension add --name azure-devops --only-show-errors
    fi

    az devops configure --defaults organization="$(System.CollectionUri)" project="$(System.TeamProject)"

    run_parameters=(
      "base_version=$base_version"
      "bump_type=$bump_type"
      "release_channel=$release_channel"
      "release_date=$release_date"
      "pr_number=$pr_number"
      "sequence=$sequence"
    )

    echo "Queueing $demo_pipeline_name on $demo_branch"
    printf '  %s\n' "${run_parameters[@]}"

    az pipelines run \
      --name "$demo_pipeline_name" \
      --branch "$demo_branch" \
      --parameters "${run_parameters[@]}" \
      --output table
  displayName: Queue versioning demo pipeline
  env:
    AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)