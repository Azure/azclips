name: "🐞 Bug Report"
description: Report a problem you encountered while testing AzCLIPS.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us test **AzCLIPS**!

        - Please make sure you are running the latest public-preview build.
        - Search the [existing issues](https://github.com/Azure/azclips/issues) first to avoid duplicates.
        - **⚠ Remove any sensitive information** (usernames, passwords, tokens, subscription IDs, tenant IDs) before submitting.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      description: Which experience are you reporting a bug for?
      options:
        - CLI (`az`)
        - PowerShell
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
      placeholder: |
        Command/Script:
        Expected:
        Actual:
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably reproduce the issue.
      placeholder: |
        1. Run `az login`
        2. Run `az group create ...`
        3. See error
    validations:
      required: false
  - type: textarea
    id: error
    attributes:
      label: Errors & debug output
      description: Paste the error message and any relevant debug output.
      placeholder: |
        CLI debug:
        az <your command> --debug

        PowerShell debug:
        <your command> -Debug
        $DebugPreference = 'Continue'

        Paste error/debug output here.
        ⚠ Remove sensitive information (tokens, subscription IDs, tenant IDs).
      render: shell
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: >
        Provide your version and OS. For the CLI, paste the output of `az version`.
        For PowerShell, paste the output of `$PSVersionTable` and the installed azclips module version.
      placeholder: |
        azclips build: 
        OS: Windows 11 / Ubuntu 22.04 / macOS 14
        Shell: PowerShell 7.5 / bash / zsh
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else that helps.
    validations:
      required: false
