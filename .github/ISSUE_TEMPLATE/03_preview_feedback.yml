name: "💬 Preview Feedback"
description: Share your overall experience, first impressions, or usability feedback on the private preview.
labels: ["feedback", "private-preview"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for taking the time to share feedback on the **azclips** private preview.
        This is for general impressions and experience feedback — for a specific defect, use the Bug Report template instead.
  - type: dropdown
    id: surface
    attributes:
      label: What did you try?
      options:
        - CLI (`az`)
        - PowerShell
        - Both
    validations:
      required: true
  - type: textarea
    id: worked-well
    attributes:
      label: What worked well?
      description: What did you like? What felt intuitive?
    validations:
      required: false
  - type: textarea
    id: friction
    attributes:
      label: What was confusing or frustrating?
      description: Where did you get stuck, surprised, or slowed down?
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: What's missing for you to adopt it?
      description: Commands, behaviors, docs, or guarantees you'd need before relying on azclips.
    validations:
      required: false
  - type: dropdown
    id: rating
    attributes:
      label: Overall impression
      description: 1 = poor, 5 = excellent.
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
    validations:
      required: false
