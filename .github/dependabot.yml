# Dependabot configuration
#
# Goal: make Dependabot pull request titles pass the repository PR title check in
# devops/scripts/ci/check_pull_request.py, which requires every title to start with
# "[Component Name]" (customer-facing) or "{Component Name}" (non-customer-facing).
#
# How this works:
# - commit-message.prefix sets the start of the commit message and PR title. The
#   trailing space in the prefix stops Dependabot from inserting a ":" after it, so
#   titles read like "{Packaging} bump <dep> from x to y" and satisfy the check.
# - Each ecosystem checks weekly for major, minor, and patch version updates.
# - open-pull-requests-limit bounds the number of concurrent version-update PRs.
#   Security-update PRs are not subject to this limit.
# - Routine npm and NuGet updates for the same dependency are grouped across
#   directories. Security updates remain separate from version-update groups.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/toolkit"
      - "/toolkit/packages/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      toolkit-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        group-by: "dependency-name"
    commit-message:
      prefix: "{Packaging} "

  - package-ecosystem: "npm"
    directory: "/wiki"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "{Packaging} "

  - package-ecosystem: "nuget"
    directories:
      - "/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        group-by: "dependency-name"
    commit-message:
      prefix: "{Packaging} "

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "{Packaging} "

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "{DevOps} "
