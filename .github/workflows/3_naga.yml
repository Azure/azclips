name: (3_naga) Build Learn Step By Step

on:
  push:
    branches:
      - naga/test-pr
  workflow_dispatch:

jobs:
  build-artifacts:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug]   # change to [Debug, Release] when ready

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore cirrus.slnx

      - name: Build solution
        run: dotnet build cirrus.slnx --configuration ${{ matrix.configuration }} --no-restore

      - name: Execute unit tests
        run: dotnet test cirrus.slnx --no-build --configuration ${{ matrix.configuration }} --verbosity normal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build Artifacts (${{ matrix.configuration }}-windows-latest)
          path: artifacts/${{ matrix.configuration }}

  publish-cli:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug]   # change to [Debug, Release] when ready

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore CLI project
        run: dotnet restore src/CLI/Core.Cli.csproj -r win-x64

      - name: Publish the CLI application
        run: dotnet publish src/CLI/Core.Cli.csproj -c ${{ matrix.configuration }} -r win-x64 --self-contained --no-restore -o ./publish/${{ matrix.configuration }}/win-x64

      - name: Copy appx manifest
        run: Copy-Item src/CLI/Core.Cli.appxmanifest ./publish/${{ matrix.configuration }}/win-x64/AppxManifest.xml

      - name: Update appx manifest publisher for dev signing
        run: |
          $manifestPath = "./publish/${{ matrix.configuration }}/win-x64/AppxManifest.xml"
          (Get-Content $manifestPath) |
            ForEach-Object {
              $_ -replace 'Publisher="CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US"', 'Publisher="CN=Cirrus Dev Signer"'
            } |
            ForEach-Object {
              $_ -replace '<PublisherDisplayName>Microsoft Corporation</PublisherDisplayName>', '<PublisherDisplayName>Cirrus Dev Signer</PublisherDisplayName>'
            } |
            Set-Content $manifestPath

      - name: Copy appx assets
        run: |
          $assetsSource = "assets"
          $assetsDestination = "./publish/${{ matrix.configuration }}/win-x64/Assets"
          if (Test-Path $assetsSource) {
            New-Item -ItemType Directory -Path $assetsDestination -Force | Out-Null
            Copy-Item "$assetsSource\*" $assetsDestination -Recurse -Force
          }

      - name: Create the appx package
        run: |
          $windowsKitBinRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
          $latestBinDir = Get-ChildItem -Path $windowsKitBinRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object -Property Name -Descending |
            Select-Object -First 1
          if (-not $latestBinDir) {
            throw "No Windows SDK bin directory found under $windowsKitBinRoot"
          }
          $makeAppxPath = Join-Path -Path $latestBinDir.FullName -ChildPath "x64\MakeAppx.exe"
          New-Item -ItemType Directory -Path "./bin/${{ matrix.configuration }}" -Force | Out-Null
          & $makeAppxPath pack /d "./publish/${{ matrix.configuration }}/win-x64" /p "./bin/${{ matrix.configuration }}/azv2-win-x64.msix" /nv

      - name: Decode the pfx
        run: |
          $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
          [IO.File]::WriteAllBytes("./GitHubActionsWorkflow.pfx", $pfx_cert_byte)

      - name: Sign the appx package
        run: |
          $windowsKitBinRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
          $latestBinDir = Get-ChildItem -Path $windowsKitBinRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object -Property Name -Descending |
            Select-Object -First 1
          if (-not $latestBinDir) {
            throw "No Windows SDK bin directory found under $windowsKitBinRoot"
          }
          $signtoolPath = Join-Path -Path $latestBinDir.FullName -ChildPath "x64\signtool.exe"
          & $signtoolPath sign /v /f "./GitHubActionsWorkflow.pfx" /p "${{ secrets.PFX_KEY }}" /fd SHA256 "./bin/${{ matrix.configuration }}/azv2-win-x64.msix"

      - name: Remove the pfx
        run: Remove-Item -Path "./GitHubActionsWorkflow.pfx" -Force

      - name: Upload published CLI
        uses: actions/upload-artifact@v4
        with:
          name: Published CLI (${{ matrix.configuration }}-win-x64)
          path: ./publish/${{ matrix.configuration }}/win-x64

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: MSIX Package (${{ matrix.configuration }}-win-x64)
          path: ./bin/${{ matrix.configuration }}/azv2-win-x64.msix

  publish-extension:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug]   # change to [Debug, Release] when ready

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore extension project
        run: dotnet restore src/Extensions/Extension/Extensions.Extension.csproj -r win-x64

      - name: Publish the Extension (az extension)
        run: dotnet publish src/Extensions/Extension/Extensions.Extension.csproj -c ${{ matrix.configuration }} -r win-x64 --no-restore -o ./publish/${{ matrix.configuration }}/win-x64/Extensions/Extension

      - name: Upload published Extension
        uses: actions/upload-artifact@v4
        with:
          name: Published Extension (${{ matrix.configuration }}-win-x64)
          path: ./publish/${{ matrix.configuration }}/win-x64/Extensions/Extension

  discover-extensions:
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.discover-extensions.outputs.extensions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: discover-extensions
        run: |
          extensions=$(find src/Extensions -name "*.csproj" -type f | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "extensions=$extensions" >> $GITHUB_OUTPUT

      - name: Print discovered extensions
        run: echo "${{ steps.discover-extensions.outputs.extensions }}"          

  build-extension:
    needs: discover-extensions
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.discover-extensions.outputs.extensions) }}
        configuration: [Debug]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Extension Metadata
        id: extract-metadata
        shell: pwsh
        run: |
          $csprojPath = "${{ matrix.extension }}"
          [xml]$csproj = Get-Content $csprojPath

          $assemblyName = $csproj.Project.PropertyGroup.AssemblyName | Where-Object { $_ } | Select-Object -First 1
          $extName = $csproj.Project.PropertyGroup.ExtName | Where-Object { $_ } | Select-Object -First 1

          if (-not $assemblyName) {
            Write-Error "AssemblyName not found in $csprojPath"
            exit 1
          }

          if (-not $extName) {
            Write-Error "ExtName not found in $csprojPath"
            exit 1
          }

          Write-Host "AssemblyName: $assemblyName"
          Write-Host "ExtName: $extName"

          echo "assembly_name=$assemblyName" >> $env:GITHUB_OUTPUT
          echo "ext_name=$extName" >> $env:GITHUB_OUTPUT

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Extension
        run: dotnet restore "${{ matrix.extension }}"

      - name: Build Extension
        run: dotnet build "${{ matrix.extension }}" --configuration ${{ matrix.configuration }} --no-restore

      - name: Upload Extension Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Extension - ${{ steps.extract-metadata.outputs.ext_name }} (${{ matrix.configuration }})
          path: ./artifacts/${{ matrix.configuration }}/${{ steps.extract-metadata.outputs.ext_name }}

  discover-powershell-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover-modules.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: discover-modules
        run: |
          modules=$(find src/PS -name "*.psm1" -type f | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> $GITHUB_OUTPUT

      - name: Print discovered PowerShell modules
        run: echo "${{ steps.discover-modules.outputs.modules }}"

  build-powershell-module:
    needs: discover-powershell-modules
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover-powershell-modules.outputs.modules) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PowerShell latest
        shell: powershell
        run: |
          winget install --id Microsoft.PowerShell --source winget --disable-interactivity --accept-source-agreements

      - name: Extract Extension Metadata
        id: extract-metadata
        shell: pwsh
        run: |
          $psm1Path = "${{ matrix.module }}"
          $moduleName = [System.IO.Path]::GetFileNameWithoutExtension($psm1Path)
          $moduleDir = [System.IO.Path]::GetDirectoryName($psm1Path)

          if (-not $moduleName) {
            Write-Error "Module name could not be determined from $psm1Path"
            exit 1
          }

          Write-Host "Module Name: $moduleName"

          echo "module_name=$moduleName" >> $env:GITHUB_OUTPUT
          echo "module_dir=$moduleDir" >> $env:GITHUB_OUTPUT
          echo "extension_project_path=src/Extensions/${moduleName}/Extensions.${moduleName}.csproj" >> $env:GITHUB_OUTPUT

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Extension
        run: dotnet restore ${{ steps.extract-metadata.outputs.extension_project_path }}

      - name: Build Corresponding Extension
        run: dotnet build ${{ steps.extract-metadata.outputs.extension_project_path }} --configuration Debug --no-restore

      - name: Test Module Import
        shell: pwsh
        run: |
          $moduleName = "${{ steps.extract-metadata.outputs.module_name }}"
          $moduleDir = "${{ steps.extract-metadata.outputs.module_dir }}"

          Write-Host "Testing import of module: $moduleName from $moduleDir"

          try {
            Import-Module ./$moduleDir -Force -ErrorAction Stop
            Write-Host "Module $moduleName imported successfully."
            $commands = Get-Command -Module $moduleName
            if ($commands.Count -eq 0) {
              Write-Error "No commands found in $moduleName module"
              exit 1
            }
            Write-Host "Found $($commands.Count) commands in $moduleName module"
          } catch {
            Write-Error "Failed to import module $moduleName. $_"
            exit 1
          }