name: (3_naga) Build Learn Step By Step

on:
  push:
    branches:
      - naga/test-pr
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      matrix:
        # os: [windows-latest, ubuntu-latest]
        os: [windows-latest]        
        # configuration: [Debug, Release]
        configuration: [Debug]        

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore the application
        run: dotnet restore cirrus.slnx

      - name: Build the solution
        run: dotnet build cirrus.slnx --configuration ${{ matrix.configuration }} --no-restore

    #   - name: Execute unit tests
    #     run: dotnet test cirrus.slnx --no-build --configuration ${{ matrix.configuration }} --verbosity normal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build Artifacts (${{ matrix.configuration }}-${{ matrix.os }})
          path: artifacts/${{ matrix.configuration }}        

      - name: Publish the CLI application
        run: dotnet publish src/CLI/Core.Cli.csproj -c ${{ matrix.configuration }} -r win-x64 --self-contained -o ./publish/${{ matrix.configuration }}/win-x64          