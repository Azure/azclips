name: (3_naga) Build Learn Step By Step

on:
  push:
    branches:
      - naga/test-pr
  workflow_dispatch:

env:
  Solution_Name: cirrus.slnx
  Certificate_Directory: .
  Publish_Root: ./publish
  Bin_Root: ./bin

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start workflow
        run: echo "Starting 3_naga workflow"

  build-artifacts:
    needs: start
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [win-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore $env:Solution_Name

      - name: Build solution
        run: dotnet build $env:Solution_Name --configuration ${{ matrix.configuration }} --no-restore

      - name: Execute unit tests
        run: dotnet test $env:Solution_Name --no-build --configuration ${{ matrix.configuration }} --verbosity normal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build Artifacts (${{ matrix.configuration }}-${{ matrix.platform }})
          path: artifacts/${{ matrix.configuration }}

  publish-cli:
    needs: start
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [win-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore CLI project
        run: dotnet restore src/CLI/Core.Cli.csproj -r ${{ matrix.platform }}

      - name: Publish the CLI application
        run: dotnet publish src/CLI/Core.Cli.csproj -c ${{ matrix.configuration }} -r ${{ matrix.platform }} --self-contained --no-restore -o ${{ env.Publish_Root }}/${{ matrix.configuration }}/${{ matrix.platform }}

      - name: Copy appx manifest
        run: Copy-Item src/CLI/Core.Cli.appxmanifest ${{ env.Publish_Root }}/${{ matrix.configuration }}/${{ matrix.platform }}/AppxManifest.xml

      - name: Update appx manifest publisher for dev signing
        run: |
          $manifestPath = "${{ env.Publish_Root }}/${{ matrix.configuration }}/${{ matrix.platform }}/AppxManifest.xml"
          (Get-Content $manifestPath) |
            ForEach-Object {
              $_ -replace 'Publisher="CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US"', 'Publisher="CN=Cirrus Dev Signer"'
            } |
            ForEach-Object {
              $_ -replace '<PublisherDisplayName>Microsoft Corporation</PublisherDisplayName>', '<PublisherDisplayName>Cirrus Dev Signer</PublisherDisplayName>'
            } |
            Set-Content $manifestPath

      - name: Copy appx assets
        run: |
          $assetsSource = "assets"
          $assetsDestination = "${{ env.Publish_Root }}/${{ matrix.configuration }}/${{ matrix.platform }}/Assets"
          if (Test-Path $assetsSource) {
            New-Item -ItemType Directory -Path $assetsDestination -Force | Out-Null
            Copy-Item "$assetsSource\*" $assetsDestination -Recurse -Force
          }

      - name: Create the appx package
        run: |
          $windowsKitBinRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
          $latestBinDir = Get-ChildItem -Path $windowsKitBinRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object -Property Name -Descending |
            Select-Object -First 1
          if (-not $latestBinDir) {
            throw "No Windows SDK bin directory found under $windowsKitBinRoot"
          }
          $sdkArch = if ("${{ matrix.platform }}" -eq "win-x86") { "x86" } else { "x64" }
          $makeAppxPath = Join-Path -Path $latestBinDir.FullName -ChildPath "$sdkArch\MakeAppx.exe"
          New-Item -ItemType Directory -Path "${{ env.Bin_Root }}/${{ matrix.configuration }}" -Force | Out-Null
          & $makeAppxPath pack /d "${{ env.Publish_Root }}/${{ matrix.configuration }}/${{ matrix.platform }}" /p "${{ env.Bin_Root }}/${{ matrix.configuration }}/azv2-${{ matrix.platform }}.msix" /nv

      - name: Decode the pfx
        run: |
          $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
          $certificatePath = Join-Path -Path $env:Certificate_Directory -ChildPath GitHubActionsWorkflow.pfx
          [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

      - name: Sign the appx package
        run: |
          $windowsKitBinRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
          $latestBinDir = Get-ChildItem -Path $windowsKitBinRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object -Property Name -Descending |
            Select-Object -First 1
          if (-not $latestBinDir) {
            throw "No Windows SDK bin directory found under $windowsKitBinRoot"
          }
          $signtoolPath = Join-Path -Path $latestBinDir.FullName -ChildPath "x64\signtool.exe"
          & $signtoolPath sign /v /f "$env:Certificate_Directory/GitHubActionsWorkflow.pfx" /p "${{ secrets.PFX_KEY }}" /fd SHA256 "${{ env.Bin_Root }}/${{ matrix.configuration }}/azv2-${{ matrix.platform }}.msix"

      - name: Remove the pfx
        run: Remove-Item -Path "$env:Certificate_Directory\GitHubActionsWorkflow.pfx" -Force

      - name: Upload published CLI
        uses: actions/upload-artifact@v4
        with:
          name: Published CLI (${{ matrix.configuration }}-${{ matrix.platform }})
          path: ${{ env.Publish_Root }}/${{ matrix.configuration }}/${{ matrix.platform }}

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: MSIX Package (${{ matrix.configuration }}-${{ matrix.platform }})
          path: ${{ env.Bin_Root }}/${{ matrix.configuration }}/azv2-${{ matrix.platform }}.msix

  publish-cli-linux:
    needs: start
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [linux-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore CLI project
        run: dotnet restore src/CLI/Core.Cli.csproj -r ${{ matrix.platform }}

      - name: Publish the CLI application (Linux)
        run: dotnet publish src/CLI/Core.Cli.csproj -c ${{ matrix.configuration }} -r ${{ matrix.platform }} --self-contained --no-restore -o ${{ env.Publish_Root }}/${{ matrix.configuration }}/${{ matrix.platform }}

      - name: Create Linux tarball
        run: |
          mkdir -p "${{ env.Bin_Root }}/${{ matrix.configuration }}"
          tar -czf "${{ env.Bin_Root }}/${{ matrix.configuration }}/azv2-${{ matrix.platform }}.tar.gz" -C "${{ env.Publish_Root }}/${{ matrix.configuration }}/${{ matrix.platform }}" .

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: Linux Tarball (${{ matrix.configuration }}-${{ matrix.platform }})
          path: ${{ env.Bin_Root }}/${{ matrix.configuration }}/azv2-${{ matrix.platform }}.tar.gz

  publish-extension:
    needs: start
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [win-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore extension project
        run: dotnet restore src/Extensions/Extension/Extensions.Extension.csproj -r ${{ matrix.platform }}

      - name: Publish the Extension (az extension)
        run: dotnet publish src/Extensions/Extension/Extensions.Extension.csproj -c ${{ matrix.configuration }} -r ${{ matrix.platform }} --no-restore -o ${{ env.Publish_Root }}/${{ matrix.configuration }}/${{ matrix.platform }}/Extensions/Extension

      - name: Upload published Extension
        uses: actions/upload-artifact@v4
        with:
          name: Published Extension (${{ matrix.configuration }}-${{ matrix.platform }})
          path: ${{ env.Publish_Root }}/${{ matrix.configuration }}/${{ matrix.platform }}/Extensions/Extension

  discover-extensions:
    needs: start
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.discover-extensions.outputs.extensions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: discover-extensions
        run: |
          extensions=$(find src/Extensions -name "*.csproj" -type f | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "extensions=$extensions" >> $GITHUB_OUTPUT

      - name: Print discovered extensions
        run: echo "${{ steps.discover-extensions.outputs.extensions }}"          

  build-extension:
    needs: discover-extensions
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.discover-extensions.outputs.extensions) }}
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Extension Metadata
        id: extract-metadata
        shell: pwsh
        run: |
          $csprojPath = "${{ matrix.extension }}"
          [xml]$csproj = Get-Content $csprojPath

          $assemblyName = $csproj.Project.PropertyGroup.AssemblyName | Where-Object { $_ } | Select-Object -First 1
          $extName = $csproj.Project.PropertyGroup.ExtName | Where-Object { $_ } | Select-Object -First 1

          if (-not $assemblyName) {
            Write-Error "AssemblyName not found in $csprojPath"
            exit 1
          }

          if (-not $extName) {
            Write-Error "ExtName not found in $csprojPath"
            exit 1
          }

          Write-Host "AssemblyName: $assemblyName"
          Write-Host "ExtName: $extName"

          echo "assembly_name=$assemblyName" >> $env:GITHUB_OUTPUT
          echo "ext_name=$extName" >> $env:GITHUB_OUTPUT

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Extension
        run: dotnet restore "${{ matrix.extension }}"

      - name: Build Extension
        run: dotnet build "${{ matrix.extension }}" --configuration ${{ matrix.configuration }} --no-restore

      - name: Upload Extension Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Extension - ${{ steps.extract-metadata.outputs.ext_name }} (${{ matrix.configuration }})
          path: ./artifacts/${{ matrix.configuration }}/${{ steps.extract-metadata.outputs.ext_name }}

  pack-extension-packages:
    needs: discover-extensions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.discover-extensions.outputs.extensions) }}
        configuration: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Extension Metadata
        id: extract-metadata
        shell: pwsh
        run: |
          $csprojPath = "${{ matrix.extension }}"
          [xml]$csproj = Get-Content $csprojPath

          $packageId = $csproj.Project.PropertyGroup.PackageId | Where-Object { $_ } | Select-Object -First 1
          if (-not $packageId) {
            Write-Error "PackageId not found in $csprojPath"
            exit 1
          }

          echo "package_id=$packageId" >> $env:GITHUB_OUTPUT

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Extension
        run: dotnet restore "${{ matrix.extension }}"

      - name: Build Extension (Generates NuGet Package)
        run: dotnet build "${{ matrix.extension }}" --configuration ${{ matrix.configuration }} --no-restore

      - name: Upload Extension NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: Extension NuGet Package (${{ steps.extract-metadata.outputs.package_id }}-${{ matrix.configuration }})
          path: ./artifacts/${{ matrix.configuration }}/${{ steps.extract-metadata.outputs.package_id }}/*.nupkg

  discover-powershell-modules:
    needs: start
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover-modules.outputs.modules }}
      has-modules: ${{ steps.discover-modules.outputs.has-modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: discover-modules
        run: |
          modules=$(find src/PS -name "*.psd1" -type f | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$modules" = "[]" ]; then
            echo "has-modules=false" >> $GITHUB_OUTPUT
          else
            echo "has-modules=true" >> $GITHUB_OUTPUT
          fi
          echo "modules=$modules" >> $GITHUB_OUTPUT

      - name: Print discovered PowerShell modules
        run: echo "${{ steps.discover-modules.outputs.modules }}"

  build-powershell-module:
    needs: discover-powershell-modules
    if: ${{ needs.discover-powershell-modules.outputs.has-modules == 'true' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover-powershell-modules.outputs.modules) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PowerShell latest
        shell: powershell
        run: |
          winget install --id Microsoft.PowerShell --source winget --disable-interactivity --accept-source-agreements

      - name: Extract Extension Metadata
        id: extract-metadata
        shell: pwsh
        run: |
          $moduleManifestPath = "${{ matrix.module }}"
          $moduleName = [System.IO.Path]::GetFileNameWithoutExtension($moduleManifestPath)
          $moduleDir = [System.IO.Path]::GetDirectoryName($moduleManifestPath)

          if (-not $moduleName) {
            Write-Error "Module name could not be determined from $moduleManifestPath"
            exit 1
          }

          Write-Host "Module Name: $moduleName"

          echo "module_name=$moduleName" >> $env:GITHUB_OUTPUT
          echo "module_dir=$moduleDir" >> $env:GITHUB_OUTPUT
          echo "module_manifest_path=$moduleManifestPath" >> $env:GITHUB_OUTPUT
          echo "cmdlets_project_path=src/PS/${moduleName}/Cmdlets.${moduleName}.csproj" >> $env:GITHUB_OUTPUT
          echo "extension_project_path=src/Extensions/${moduleName}/Extensions.${moduleName}.csproj" >> $env:GITHUB_OUTPUT

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Extension
        run: dotnet restore ${{ steps.extract-metadata.outputs.extension_project_path }}

      - name: Restore Cmdlets Project
        run: dotnet restore ${{ steps.extract-metadata.outputs.cmdlets_project_path }}

      - name: Build Corresponding Extension
        run: dotnet build ${{ steps.extract-metadata.outputs.extension_project_path }} --configuration Debug --no-restore

      - name: Build Corresponding Cmdlets Project
        run: dotnet build ${{ steps.extract-metadata.outputs.cmdlets_project_path }} --configuration Debug --no-restore

      - name: Restore Login dependency projects (for Resources module)
        if: ${{ steps.extract-metadata.outputs.module_name == 'Resources' }}
        run: |
          dotnet restore src/Extensions/Login/Extensions.Login.csproj
          dotnet restore src/PS/Login/Cmdlets.Login.csproj

      - name: Build Login dependency projects (for Resources module)
        if: ${{ steps.extract-metadata.outputs.module_name == 'Resources' }}
        run: |
          dotnet build src/Extensions/Login/Extensions.Login.csproj --configuration Debug --no-restore
          dotnet build src/PS/Login/Cmdlets.Login.csproj --configuration Debug --no-restore

      - name: Restore solution for module import validation
        run: dotnet restore cirrus.slnx

      - name: Build solution for module import validation
        run: dotnet build cirrus.slnx --configuration Debug --no-restore

      - name: Validate Module Manifest Dependencies
        shell: pwsh
        run: |
          $moduleName = "${{ steps.extract-metadata.outputs.module_name }}"
          $moduleDir = "${{ steps.extract-metadata.outputs.module_dir }}"
          $moduleManifestPath = "${{ steps.extract-metadata.outputs.module_manifest_path }}"
          $moduleManifestAbs = (Resolve-Path $moduleManifestPath).Path
          $moduleDirAbs = Split-Path -Parent $moduleManifestAbs

          function Test-ManifestDependencies {
            param(
              [Parameter(Mandatory = $true)]
              [string]$ManifestPath
            )

            $manifestAbs = (Resolve-Path $ManifestPath).Path
            $manifestDir = Split-Path -Parent $manifestAbs
            Write-Host "Validating manifest: $manifestAbs"

            $manifest = Import-PowerShellDataFile -Path $manifestAbs

            if ($manifest.RequiredAssemblies) {
              foreach ($asm in $manifest.RequiredAssemblies) {
                $asmPath = [System.IO.Path]::GetFullPath((Join-Path $manifestDir $asm))
                if (-not (Test-Path $asmPath)) {
                  throw "Missing RequiredAssemblies entry: $asmPath (declared: $asm)"
                }
                Write-Host "  OK RequiredAssembly: $asmPath"
              }
            }

            if ($manifest.RequiredModules) {
              foreach ($requiredModule in $manifest.RequiredModules) {
                if ($requiredModule -is [hashtable] -and $requiredModule.ContainsKey('ModuleName')) {
                  $requiredPath = [System.IO.Path]::GetFullPath((Join-Path $manifestDir $requiredModule.ModuleName))
                  if (-not (Test-Path $requiredPath)) {
                    throw "Missing RequiredModules manifest: $requiredPath (declared: $($requiredModule.ModuleName))"
                  }
                  Write-Host "  OK RequiredModule manifest: $requiredPath"
                  Test-ManifestDependencies -ManifestPath $requiredPath
                }
              }
            }

            Write-Host "Manifest validation passed: $manifestAbs"
          }

          try {
            Test-ManifestDependencies -ManifestPath $moduleManifestAbs
            Write-Host "Dependency validation succeeded for module: $moduleName"
          } catch {
            Write-Host "Debug listing of artifacts/Debug/Core:"
            Get-ChildItem ./artifacts/Debug/Core -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            Write-Error "Failed to validate module dependencies for $moduleName. $_"
            exit 1
          }

  end:
    if: always()
    needs:
      - build-artifacts
      - publish-cli
      - publish-cli-linux
      - publish-extension
      - build-extension
      - pack-extension-packages
      - discover-powershell-modules
      - build-powershell-module
    runs-on: ubuntu-latest
    steps:
      - name: End workflow
        run: echo "3_naga workflow finished"