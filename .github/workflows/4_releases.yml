name: (4_releases) Create Release From 3_naga Run

on:
  push:
    branches:
      - naga/test-pr
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional GitHub Actions run ID from 3_naga.yml. Uses hard-coded default when empty.
        required: false
        type: string
      release_tag:
        description: Optional SemVer tag (example v1.0.0-ci.20260504.1). Leave empty to auto-generate.
        required: false
        type: string

env:
  Source_Run_Id_Default: "25312848659"
  Artifact_Staging_Dir: release-artifacts
  Release_Files_Dir: release-files

jobs:
  create-release-from-run:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source run id
        id: source-run
        run: |
          if [ -n "${{ inputs.source_run_id }}" ]; then
            SOURCE_RUN_ID="${{ inputs.source_run_id }}"
          else
            SOURCE_RUN_ID="${{ env.Source_Run_Id_Default }}"
          fi
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using source run id: $SOURCE_RUN_ID"

      - name: Validate source run id
        run: |
          if ! [[ "${{ steps.source-run.outputs.source_run_id }}" =~ ^[0-9]+$ ]]; then
            echo "source_run_id must be numeric. Received: ${{ steps.source-run.outputs.source_run_id }}"
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            VERSION_SOURCE_FILE="src/Extensions/Extension/Extensions.Extension.csproj"
            BASE_VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' "$VERSION_SOURCE_FILE" || true)"

            if [ -z "$BASE_VERSION" ]; then
              VERSION_SOURCE_FILE="src/CLI/Core.Cli.csproj"
              RAW_ASSEMBLY_VERSION="$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' "$VERSION_SOURCE_FILE" || true)"
              BASE_VERSION="$(echo "$RAW_ASSEMBLY_VERSION" | awk -F. '{ if (NF >= 3) { printf "%s.%s.%s", $1, $2, $3 } else { print $0 } }')"
            fi

            if [ -z "$BASE_VERSION" ]; then
              echo "Unable to resolve base version from source files."
              exit 1
            fi

            if [[ "$BASE_VERSION" == *-* ]]; then
              TAG="v${BASE_VERSION}.ci.$(date +'%Y%m%d').${{ github.run_number }}"
            else
              TAG="v${BASE_VERSION}-ci.$(date +'%Y%m%d').${{ github.run_number }}"
            fi

            echo "Resolved base version '$BASE_VERSION' from $VERSION_SOURCE_FILE"
          fi

          SEMVER_REGEX='^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $SEMVER_REGEX ]]; then
            echo "release_tag must be valid SemVer. Received: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Download artifacts from 3_naga run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source-run.outputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.Artifact_Staging_Dir }}

      - name: Display downloaded artifact structure
        run: ls -R "${{ env.Artifact_Staging_Dir }}"

      - name: Prepare release artifacts
        run: |
          mkdir -p "${{ env.Release_Files_Dir }}"

          copy_release_artifacts() {
            local file_pattern="$1"
            local path_pattern="$2"
            echo "Searching for $file_pattern files matching pattern: $path_pattern"

            local files=()
            while IFS= read -r file; do
              files+=("$file")
            done < <(find "${{ env.Artifact_Staging_Dir }}" -name "$file_pattern" | grep -i "$path_pattern")

            if [ ${#files[@]} -eq 0 ]; then
              echo "  Warning: No $file_pattern files found matching pattern '$path_pattern'"
              return 1
            fi

            for file in "${files[@]}"; do
              echo "  Copying: $file"
              cp "$file" "${{ env.Release_Files_Dir }}/"
            done

            echo "  Copied ${#files[@]} file(s)"
            return 0
          }

          # Keep release outputs only.
          copy_release_artifacts "*.msix" "Release-" || echo "Note: No Release MSIX packages found"
          copy_release_artifacts "*.tar.gz" "Release-linux-x64" || echo "Note: No Release Linux tarballs found"
          copy_release_artifacts "*.nupkg" "Extension NuGet Package" || echo "Note: No Extension NuGet packages found"

          echo ""
          echo "Prepared release files:"
          ls -lah "${{ env.Release_Files_Dir }}"

          if [ -z "$(ls -A "${{ env.Release_Files_Dir }}")" ]; then
            echo "ERROR: No release artifacts found in source run ${{ steps.source-run.outputs.source_run_id }}"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            Release generated from 3_naga run.

            Source run ID: ${{ steps.source-run.outputs.source_run_id }}
            Triggered by: ${{ github.actor }}
            Commit: ${{ github.sha }}

            Artifacts included:
            - MSIX Packages (Release build)
            - Linux Tarballs (Release build)
            - Extension NuGet Packages (Release build)
          draft: false
          prerelease: false
          files: ${{ env.Release_Files_Dir }}/*
          fail_on_unmatched_files: false
