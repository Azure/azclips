name: Az.DataProtection Module Test v2

on:
  workflow_dispatch:
  push:
    branches:
      - naga/test-pr

jobs:
  test-az-dataprotection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        install-mode: [rollup, targeted]
        shell: [pwsh]
        include:
          # Windows PowerShell 5.1 -- exact customer repro environment
          - os: windows-latest
            install-mode: rollup
            shell: powershell
          - os: windows-latest
            install-mode: targeted
            shell: powershell
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: ${{ matrix.os }} / ${{ matrix.install-mode }} / ${{ matrix.shell }}

    steps:
      - name: Bootstrap PowerShell gallery prerequisites
        shell: ${{ matrix.shell }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Write-Host "PowerShell edition: $($PSVersionTable.PSEdition)"
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

          # Windows PowerShell 5.1 often needs an explicit NuGet provider bootstrap.
          if ($PSVersionTable.PSEdition -eq 'Desktop') {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

      - name: Install Az module(s)
        shell: ${{ matrix.shell }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Install-ModuleWithRetry {
            param(
              [Parameter(Mandatory = $true)][string]$Name
            )

            $maxAttempts = 3
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                Write-Host "Installing module '$Name' (attempt $attempt/$maxAttempts)..."
                Install-Module -Name $Name -Repository PSGallery -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
                Write-Host "Install succeeded for '$Name'."
                return
              }
              catch {
                if ($attempt -eq $maxAttempts) {
                  throw
                }
                Write-Host "Install attempt failed for '$Name': $($_.Exception.Message)"
                Write-Host "Retrying install..."
              }
            }
          }

          $mode = '${{ matrix.install-mode }}'
          if ($mode -eq 'rollup') {
            Write-Host 'Installing full Az rollup (customer repro path)...'
            Install-ModuleWithRetry -Name Az
          } else {
            Write-Host 'Installing Az.DataProtection only (targeted path)...'
            Install-ModuleWithRetry -Name Az.DataProtection
          }
          Write-Host "Install completed (mode: $mode)."

      - name: Import module and report versions
        id: versions
        shell: ${{ matrix.shell }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $mode = '${{ matrix.install-mode }}'
          if ($mode -eq 'rollup') {
            # Exact customer repro: Import-Module Az (which should auto-load sub-modules)
            Write-Host 'Importing full Az rollup...'
            Import-Module Az -Force -ErrorAction Stop

            $azLoaded = Get-Module -Name Az
            if (-not $azLoaded) {
              throw 'Az rollup was not loaded after Import-Module Az.'
            }
          } else {
            Import-Module Az.DataProtection -Force -ErrorAction Stop
          }

          # Ensure Az.DataProtection is explicitly imported for deterministic behavior.
          Import-Module Az.DataProtection -Force -ErrorAction Stop

          $module = Get-Module -Name Az.DataProtection
          if (-not $module) {
            throw 'Az.DataProtection module is NOT loaded after import.'
          }

          $accounts = Get-Module -Name Az.Accounts
          if (-not $accounts) {
            throw 'Az.Accounts module was not loaded (expected as a dependency).'
          }

          # Gather Az rollup version if present.
          $azRollup = Get-Module -Name Az -ListAvailable |
            Sort-Object Version -Descending |
            Select-Object -First 1
          $azRollupVersion = if ($azRollup) { $azRollup.Version.ToString() } else { 'n/a (targeted install)' }

          $summary = @"
          | Component | Version |
          |-----------|---------|
          | Install mode | ${{ matrix.install-mode }} |
          | Shell | ${{ matrix.shell }} |
          | PowerShell | $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition)) |
          | Az (rollup) | $azRollupVersion |
          | Az.DataProtection | $($module.Version) |
          | Az.Accounts | $($accounts.Version) |
          | Module path | ``$($module.ModuleBase)`` |
          "@

          Write-Host $summary
          $summary >> $env:GITHUB_STEP_SUMMARY

      - name: Scan module source files for Unicode corruption
        shell: ${{ matrix.shell }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $module = Get-Module -Name Az.DataProtection -ListAvailable |
            Sort-Object Version -Descending |
            Select-Object -First 1

          if (-not $module) {
            throw 'Az.DataProtection module not found on disk.'
          }

          $moduleRoot = $module.ModuleBase
          Write-Host "Scanning module files under: $moduleRoot"

          $badChars = @{
            '\u2013' = 'en-dash (U+2013) - breaks operators like -ne, -eq'
            '\u2014' = 'em-dash (U+2014)'
            '\u2018' = 'left single smart quote (U+2018)'
            '\u2019' = 'right single smart quote (U+2019)'
            '\u201C' = 'left double smart quote (U+201C)'
            '\u201D' = 'right double smart quote (U+201D)'
          }

          $corrupted = @()
          $ps1Files = @(Get-ChildItem -Path $moduleRoot -Recurse -Include '*.ps1', '*.psm1' -File)
          Write-Host "Files to scan: $($ps1Files.Count)"

          foreach ($file in $ps1Files) {
            $content = [System.IO.File]::ReadAllText($file.FullName)
            foreach ($pattern in $badChars.Keys) {
              $regex = [regex]$pattern
              $regexMatches = $regex.Matches($content)
              if ($regexMatches.Count -gt 0) {
                $lines = $content.Split("`n")
                for ($i = 0; $i -lt $lines.Count; $i++) {
                  if ($regex.IsMatch($lines[$i])) {
                    $detail = "  $($file.FullName):$($i + 1) - $($badChars[$pattern])"
                    Write-Host "CORRUPT  $detail"
                    $corrupted += $detail
                  }
                }
              }
            }
          }

          if ($corrupted.Count -gt 0) {
            $summary = "Found $($corrupted.Count) Unicode corruption(s) in module source files:`n$($corrupted -join "`n")"
            Write-Host ''
            Write-Host $summary
            $summary >> $env:GITHUB_STEP_SUMMARY
            throw $summary
          }

          Write-Host "No Unicode corruption found in $($ps1Files.Count) files."

      - name: Validate exported commands
        shell: ${{ matrix.shell }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Import-Module Az.DataProtection -Force -ErrorAction Stop

          $commands = @(Get-Command -Module Az.DataProtection -ErrorAction Stop)
          $cmdlets  = @($commands | Where-Object CommandType -EQ 'Cmdlet')
          $functions = @($commands | Where-Object CommandType -EQ 'Function')

          $minimumExpectedCommands = 10
          if ($commands.Count -lt $minimumExpectedCommands) {
            throw "Expected at least $minimumExpectedCommands exported commands but found $($commands.Count)."
          }

          Write-Host "Total commands: $($commands.Count) (cmdlets: $($cmdlets.Count), functions: $($functions.Count))"
          Write-Host ''
          Write-Host 'All exported commands:'
          $commands | Select-Object -ExpandProperty Name | Sort-Object | ForEach-Object { Write-Host "  - $_" }

      - name: Verify required commands exist
        shell: ${{ matrix.shell }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Import-Module Az.DataProtection -Force -ErrorAction Stop

          $requiredCommands = @(
            'Get-AzDataProtectionBackupVault',
            'Get-AzDataProtectionBackupInstance',
            'Initialize-AzDataProtectionBackupInstance'
          )

          $missing = @()
          foreach ($name in $requiredCommands) {
            $cmd = Get-Command -Module Az.DataProtection -Name $name -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host "OK  $name ($($cmd.CommandType))"
            } else {
              Write-Host "MISSING  $name"
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing required commands: $($missing -join ', ')"
          }

      - name: Verify policy commands
        shell: ${{ matrix.shell }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Import-Module Az.DataProtection -Force -ErrorAction Stop

          $policyGetCandidates = @(
            'Get-AzDataProtectionBackupPolicy',
            'Get-AzDataProtectionPolicy'
          )

          $foundPolicyGet = $null
          foreach ($candidate in $policyGetCandidates) {
            $cmd = Get-Command -Module Az.DataProtection -Name $candidate -ErrorAction SilentlyContinue
            if ($cmd) {
              $foundPolicyGet = $cmd
              break
            }
          }

          if (-not $foundPolicyGet) {
            Write-Host 'Available Get-* commands in Az.DataProtection:'
            Get-Command -Module Az.DataProtection -Name 'Get-*' |
              Select-Object -ExpandProperty Name | Sort-Object |
              ForEach-Object { Write-Host "  - $_" }
            throw "No policy Get command found. Expected one of: $($policyGetCandidates -join ', ')"
          }

          Write-Host "Policy Get command: $($foundPolicyGet.Name)"

          $allPolicyCommands = @(Get-Command -Module Az.DataProtection -Name '*Policy*' -ErrorAction SilentlyContinue)
          Write-Host "Total *Policy* commands: $($allPolicyCommands.Count)"
          $allPolicyCommands |
            Select-Object -ExpandProperty Name | Sort-Object |
            ForEach-Object { Write-Host "  - $_" }

          if ($allPolicyCommands.Count -lt 2) {
            throw "Expected multiple policy commands but found only $($allPolicyCommands.Count)."
          }

      - name: Smoke-test command metadata
        shell: ${{ matrix.shell }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Import-Module Az.DataProtection -Force -ErrorAction Stop

          $targets = @(
            'Get-AzDataProtectionBackupVault',
            'Get-AzDataProtectionBackupInstance',
            'Initialize-AzDataProtectionBackupInstance'
          )

          $policyGet = @('Get-AzDataProtectionBackupPolicy', 'Get-AzDataProtectionPolicy') |
            ForEach-Object { Get-Command -Module Az.DataProtection -Name $_ -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if ($policyGet) {
            $targets += $policyGet.Name
          }

          $targets = @($targets | Select-Object -Unique)

          foreach ($name in $targets) {
            $cmd = Get-Command -Module Az.DataProtection -Name $name -ErrorAction SilentlyContinue
            if (-not $cmd) {
              throw "Command not found during metadata check: $name"
            }

            $paramCount = $cmd.Parameters.Count
            if ($paramCount -eq 0) {
              throw "Command $name has 0 parameters - metadata may be broken."
            }

            Write-Host "OK  $name - $($cmd.CommandType), $paramCount parameters"
          }

          Write-Host ''
          Write-Host 'All metadata smoke tests passed.'
