name: Az.DataProtection Module Test v2

"on":
  workflow_dispatch:
  push:
    branches:
      - naga/test-pr

# GitHub Actions does not support ${{ matrix.* }} in the shell: field,
# so we use two jobs: one for pwsh (7+) and one for powershell (5.1).

jobs:
  # =================================================================
  # Job 1 — PowerShell Core 7+ (ubuntu + windows)
  # =================================================================
  test-pwsh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        install-mode: [rollup, targeted]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: ${{ matrix.os }} / ${{ matrix.install-mode }} / pwsh

    steps:
      - name: Bootstrap PowerShell gallery
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Write-Host "PowerShell edition: $($PSVersionTable.PSEdition)"
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

          if ($PSVersionTable.PSEdition -eq 'Desktop') {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

      - name: Install Az module(s)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Install-ModuleWithRetry {
            param([Parameter(Mandatory)][string]$Name)
            $maxAttempts = 3
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                Write-Host "Installing '$Name' (attempt $attempt/$maxAttempts)..."
                Install-Module -Name $Name -Repository PSGallery -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
                Write-Host "Install succeeded."
                return
              } catch {
                if ($attempt -eq $maxAttempts) { throw }
                Write-Host "Retrying: $($_.Exception.Message)"
              }
            }
          }

          $mode = '${{ matrix.install-mode }}'
          if ($mode -eq 'rollup') {
            Write-Host 'Installing full Az rollup (customer repro path)...'
            Install-ModuleWithRetry -Name Az
          } else {
            Write-Host 'Installing Az.DataProtection only (targeted path)...'
            Install-ModuleWithRetry -Name Az.DataProtection
          }

      - name: Import Az rollup (customer regression gate)
        if: matrix.install-mode == 'rollup'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Write-Host 'Customer repro: Import-Module Az...'
          $importErrors = @()
          try {
            Import-Module Az -Force -ErrorAction Stop -ErrorVariable +importErrors
          } catch {
            Write-Host "Import-Module Az FAILED: $($_.Exception.Message)"
            throw
          }

          if ($importErrors.Count -gt 0) {
            Write-Host 'Non-terminating errors during Import-Module Az:'
            $importErrors | ForEach-Object { Write-Host "  - $_" }
            throw 'Regression: Import-Module Az produced errors.'
          }

          if (-not (Get-Module -Name Az)) {
            throw 'Regression: Az module is not loaded after Import-Module Az.'
          }

          Write-Host 'Import-Module Az succeeded without errors.'

      - name: Import Az.DataProtection and report versions
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Import-Module Az.DataProtection -Force -ErrorAction Stop

          $module = Get-Module -Name Az.DataProtection
          if (-not $module) { throw 'Az.DataProtection is NOT loaded.' }

          $accounts = Get-Module -Name Az.Accounts
          if (-not $accounts) { throw 'Az.Accounts is NOT loaded.' }

          $azRollup = Get-Module -Name Az -ListAvailable |
            Sort-Object Version -Descending | Select-Object -First 1
          $azVer = if ($azRollup) { $azRollup.Version.ToString() } else { 'n/a' }

          Write-Host "Install mode : ${{ matrix.install-mode }}"
          Write-Host "Shell        : pwsh"
          Write-Host "PowerShell   : $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
          Write-Host "Az rollup    : $azVer"
          Write-Host "Az.DataProt  : $($module.Version)"
          Write-Host "Az.Accounts  : $($accounts.Version)"
          Write-Host "Module path  : $($module.ModuleBase)"

      - name: Scan for Unicode corruption in module source
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $module = Get-Module -Name Az.DataProtection -ListAvailable |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $module) { throw 'Module not found on disk.' }

          $moduleRoot = $module.ModuleBase
          Write-Host "Scanning: $moduleRoot"

          # Characters that break PowerShell when they replace ASCII equivalents
          $badChars = @{
            '\u2013' = 'en-dash (U+2013) - breaks -ne, -eq etc.'
            '\u2014' = 'em-dash (U+2014)'
            '\u2018' = 'left single smart quote (U+2018)'
            '\u2019' = 'right single smart quote (U+2019)'
            '\u201C' = 'left double smart quote (U+201C)'
            '\u201D' = 'right double smart quote (U+201D)'
          }

          $corrupted = @()
          $files = @(Get-ChildItem -Path $moduleRoot -Recurse -Include '*.ps1','*.psm1' -File)
          Write-Host "Files to scan: $($files.Count)"

          foreach ($file in $files) {
            $content = [System.IO.File]::ReadAllText($file.FullName)
            foreach ($pattern in $badChars.Keys) {
              $regex = [regex]$pattern
              if ($regex.IsMatch($content)) {
                $lines = $content.Split("`n")
                for ($i = 0; $i -lt $lines.Count; $i++) {
                  if ($regex.IsMatch($lines[$i])) {
                    $detail = "$($file.FullName):$($i+1) - $($badChars[$pattern])"
                    Write-Host "CORRUPT  $detail"
                    $corrupted += $detail
                  }
                }
              }
            }
          }

          if ($corrupted.Count -gt 0) {
            throw "Found $($corrupted.Count) Unicode corruption(s):`n$($corrupted -join "`n")"
          }
          Write-Host "No Unicode corruption found."

      - name: Validate exported commands
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Import-Module Az.DataProtection -Force -ErrorAction Stop
          $commands = @(Get-Command -Module Az.DataProtection -ErrorAction Stop)

          if ($commands.Count -lt 10) {
            throw "Expected >= 10 commands, found $($commands.Count)."
          }

          $cmdlets   = @($commands | Where-Object CommandType -EQ 'Cmdlet')
          $functions = @($commands | Where-Object CommandType -EQ 'Function')
          Write-Host "Total: $($commands.Count) (cmdlets: $($cmdlets.Count), functions: $($functions.Count))"
          $commands | Select-Object -ExpandProperty Name | Sort-Object | ForEach-Object { Write-Host "  - $_" }

      - name: Verify required commands
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Import-Module Az.DataProtection -Force -ErrorAction Stop

          $required = @(
            'Get-AzDataProtectionBackupVault',
            'Get-AzDataProtectionBackupInstance',
            'Initialize-AzDataProtectionBackupInstance'
          )

          $missing = @()
          foreach ($name in $required) {
            $cmd = Get-Command -Module Az.DataProtection -Name $name -ErrorAction SilentlyContinue
            if ($cmd) { Write-Host "OK  $name" } else { Write-Host "MISSING  $name"; $missing += $name }
          }
          if ($missing.Count -gt 0) { throw "Missing: $($missing -join ', ')" }

      - name: Verify policy commands
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Import-Module Az.DataProtection -Force -ErrorAction Stop

          $found = @('Get-AzDataProtectionBackupPolicy','Get-AzDataProtectionPolicy') |
            ForEach-Object { Get-Command -Module Az.DataProtection -Name $_ -ErrorAction SilentlyContinue } |
            Select-Object -First 1

          if (-not $found) {
            Get-Command -Module Az.DataProtection -Name 'Get-*' |
              Select-Object -ExpandProperty Name | Sort-Object |
              ForEach-Object { Write-Host "  - $_" }
            throw 'No policy Get command found.'
          }
          Write-Host "Policy Get: $($found.Name)"

          $all = @(Get-Command -Module Az.DataProtection -Name '*Policy*' -ErrorAction SilentlyContinue)
          if ($all.Count -lt 2) { throw "Expected >= 2 policy commands, found $($all.Count)." }
          $all | Select-Object -ExpandProperty Name | Sort-Object | ForEach-Object { Write-Host "  - $_" }

      - name: Smoke-test command metadata
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Import-Module Az.DataProtection -Force -ErrorAction Stop

          $targets = @(
            'Get-AzDataProtectionBackupVault',
            'Get-AzDataProtectionBackupInstance',
            'Initialize-AzDataProtectionBackupInstance'
          )

          $policyGet = @('Get-AzDataProtectionBackupPolicy','Get-AzDataProtectionPolicy') |
            ForEach-Object { Get-Command -Module Az.DataProtection -Name $_ -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if ($policyGet) { $targets += $policyGet.Name }
          $targets = @($targets | Select-Object -Unique)

          foreach ($name in $targets) {
            $cmd = Get-Command -Module Az.DataProtection -Name $name -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "Not found: $name" }
            if ($cmd.Parameters.Count -eq 0) { throw "$name has 0 parameters." }
            Write-Host "OK  $name - $($cmd.CommandType), $($cmd.Parameters.Count) params"
          }

  # =================================================================
  # Job 2 — Windows PowerShell 5.1 (customer's exact environment)
  # =================================================================
  test-powershell51:
    strategy:
      fail-fast: false
      matrix:
        install-mode: [rollup, targeted]
    runs-on: windows-latest
    timeout-minutes: 30
    name: windows-latest / ${{ matrix.install-mode }} / powershell-5.1

