name: Performance Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Benchmark/**'
      - 'global.json'
      - 'cirrus.slnx'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Benchmark/**'
      - 'global.json'
      - 'cirrus.slnx'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────── Stage 1: run CLI + PS benchmarks in parallel ───────────────
  # Each product runs as its own matrix leg so the two ~15-min benchmark runs
  # execute concurrently on separate self-hosted benchmark machines (running both
  # on one machine would skew measurements). These jobs only PRODUCE result JSON —
  # they never touch gh-pages — so they drop to read-only permissions. The
  # serial `publish` job below is the single writer to gh-pages.
  benchmark:
    name: Run ${{ matrix.product }} benchmarks
    runs-on: [self-hosted, Linux, X64, benchmark]
    permissions:
      contents: read
    strategy:
      fail-fast: false          # let one product finish even if the other fails
      matrix:
        product: [CLI, PS]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore + build
        run: dotnet build cirrus.slnx --configuration Release

      # Stage PowerShell module manifests into artifacts/Release/PS/<Module>/.
      # The PS benchmarks import these instead of the tracked src/PS/<Module>/<Module>.psd1
      # files. Only the PS leg needs them.
      - name: Stage PS module manifests
        if: matrix.product == 'PS'
        run: pwsh -NoProfile -File build/Set-ModuleConfiguration.ps1 -Configuration Release

      - name: Run ${{ matrix.product }} benchmarks (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 30
          command: dotnet run --project tests/Benchmark -c Release --no-build -- --ci --product ${{ matrix.product }}

      # Hand the single result JSON to the publish job. Kept separate from the
      # full BDN log artifact so publish can drop it at the exact path the
      # dashboard action expects.
      - name: Upload ${{ matrix.product }} benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-result-${{ matrix.product }}
          path: artifacts/Benchmark/ci/${{ matrix.product }}/results/Benchmark.${{ matrix.product }}.ResourceGroupBenchmarks-report-full-compressed.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload BDN logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci-${{ github.run_id }}-${{ matrix.product }}
          path: artifacts/Benchmark/ci/**
          retention-days: 14

  # ─────────────── Stage 2: publish dashboards + gate (single gh-pages writer) ──
  # Runs once, after both benchmark legs. Both publish steps execute sequentially
  # inside this one job, so only one process ever writes the gh-pages branch —
  # which is exactly what prevents the non-fast-forward ("merge conflict") that a
  # naive parallel-publish design hits. The concurrency group additionally
  # serializes gh-pages writes across DIFFERENT workflow runs (the benchmark runs
  # above still parallelize freely).
  publish:
    name: Publish dashboards / gate regressions
    needs: benchmark
    if: always()              # publish whatever results exist, even if a leg failed
    runs-on: ubuntu-latest    # just git + the node action; no need for a benchmark machine
    permissions:
      contents: write          # gh-pages auto-push (main only)
      pull-requests: write     # PR comments on regression
    concurrency:
      group: benchmark-gh-pages
      cancel-in-progress: false
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      # Pull both products' result JSONs back to the paths the dashboard action
      # expects. continue-on-error tolerates a product whose benchmark leg failed
      # to produce a result; the matching publish step is then skipped via hashFiles.
      - name: Download CLI benchmark result
        uses: actions/download-artifact@v4
        with:
          name: bench-result-CLI
          path: artifacts/Benchmark/ci/CLI/results
        continue-on-error: true

      - name: Download PS benchmark result
        uses: actions/download-artifact@v4
        with:
          name: bench-result-PS
          path: artifacts/Benchmark/ci/PS/results
        continue-on-error: true

      - name: Fetch gh-pages branch
        if: hashFiles('artifacts/Benchmark/ci/CLI/results/Benchmark.CLI.ResourceGroupBenchmarks-report-full-compressed.json') != '' || hashFiles('artifacts/Benchmark/ci/PS/results/Benchmark.PS.ResourceGroupBenchmarks-report-full-compressed.json') != ''
        run: git fetch origin gh-pages:gh-pages

      # ─────────────── CLI ───────────────
      - name: Publish CLI dashboard / gate regression
        if: hashFiles('artifacts/Benchmark/ci/CLI/results/Benchmark.CLI.ResourceGroupBenchmarks-report-full-compressed.json') != ''
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Cirrus CLI Benchmarks'
          tool: 'benchmarkdotnet'
          output-file-path: artifacts/Benchmark/ci/CLI/results/Benchmark.CLI.ResourceGroupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: ${{ github.event.pull_request.head.repo.fork != true }}
          summary-always: true
          gh-pages-branch: gh-pages
          skip-fetch-gh-pages: true   # gh-pages fetched once by the step above
          benchmark-data-dir-path: dev/bench/cli
          comment-always: ${{ github.event.pull_request.head.repo.fork != true }}

      # ─────────────── PS ────────────────
      - name: Publish PS dashboard / gate regression
        if: hashFiles('artifacts/Benchmark/ci/PS/results/Benchmark.PS.ResourceGroupBenchmarks-report-full-compressed.json') != ''
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Cirrus PS Benchmarks'
          tool: 'benchmarkdotnet'
          output-file-path: artifacts/Benchmark/ci/PS/results/Benchmark.PS.ResourceGroupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: ${{ github.event.pull_request.head.repo.fork != true }}
          summary-always: true
          gh-pages-branch: gh-pages
          skip-fetch-gh-pages: true   # local gh-pages already prepared; avoids non-ff re-fetch
          benchmark-data-dir-path: dev/bench/ps
          comment-always: ${{ github.event.pull_request.head.repo.fork != true }}

      # Upload CLI + PS benchmark results for the fork-PR comment workflow
      - name: Upload benchmark results for fork PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            artifacts/Benchmark/ci/CLI/results/Benchmark.CLI.ResourceGroupBenchmarks-report-full-compressed.json
            artifacts/Benchmark/ci/PS/results/Benchmark.PS.ResourceGroupBenchmarks-report-full-compressed.json
          retention-days: 1
          if-no-files-found: warn
