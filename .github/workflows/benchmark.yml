name: Performance Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Benchmark/**'
      - 'tests/Common/**'
      - 'global.json'
      - 'azclips.slnx'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Benchmark/**'
      - 'tests/Common/**'
      - 'global.json'
      - 'azclips.slnx'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────── Detect which extensions / families changed ───────────────
  detect-changes:
    name: Detect changed extensions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read      # dorny/paths-filter lists PR files via the GitHub API
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_ext_work: ${{ steps.set-matrix.outputs.has_ext_work }}
      run_startup: ${{ steps.set-matrix.outputs.run_startup }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'src/Core/**'
              - 'src/CLI/**'
              - 'tests/Benchmark/*.cs'
              - 'tests/Benchmark/CLI/CLIBenchmarkBase.cs'
              - 'tests/Benchmark/CLI/BenchmarkAssemblyConfigurationService.cs'
              - 'tests/Benchmark/PS/PSBenchmarkBase.cs'
              - 'tests/Benchmark/PS/PSManifestStager.cs'
              - 'tests/Common/**'
              - 'global.json'
              - 'azclips.slnx'
              - 'Shared.props'
              - '.github/workflows/benchmark.yml'
            startup:
              - 'tests/Benchmark/Startup/**'
            compute:
              - 'src/Extensions/Compute/**'
              - 'src/PS/Compute/**'
              - 'tests/Benchmark/CLI/VirtualMachineBenchmarks.cs'
              - 'tests/Benchmark/PS/VirtualMachineBenchmarks.cs'
            resources:
              - 'src/Extensions/Resources/**'
              - 'src/PS/Resources/**'
              - 'tests/Benchmark/CLI/ResourceGroupBenchmarks.cs'
              - 'tests/Benchmark/PS/ResourceGroupBenchmarks.cs'

      - name: Build extension matrix
        id: set-matrix
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          STARTUP: ${{ steps.filter.outputs.startup }}
          COMPUTE: ${{ steps.filter.outputs.compute }}
          RESOURCES: ${{ steps.filter.outputs.resources }}
          EVENT: ${{ github.event_name }}
        run: |
          ALL='["compute","resources"]'
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$SHARED" = "true" ]; then
            MATRIX="$ALL"
          else
            exts=()
            [ "$COMPUTE" = "true" ] && exts+=("compute")
            [ "$RESOURCES" = "true" ] && exts+=("resources")
            if [ ${#exts[@]} -eq 0 ]; then
              MATRIX='[]'
            else
              MATRIX=$(printf '"%s",' "${exts[@]}")
              MATRIX="[${MATRIX%,}]"
            fi
          fi
          echo "matrix={\"extension\":$MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "has_ext_work=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_ext_work=true" >> "$GITHUB_OUTPUT"
          fi
          # Startup is cross-cutting (whole-CLI process startup): run it on shared changes,
          # on startup-specific changes, or on manual dispatch — not on extension-only changes.
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$SHARED" = "true" ] || [ "$STARTUP" = "true" ]; then
            echo "run_startup=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_startup=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved matrix: {\"extension\":$MATRIX}; run_startup handled above"

  # ─────────────── Build the solution once ───────────────
  build:
    name: Build benchmark artifacts once
    needs: detect-changes
    if: needs.detect-changes.outputs.has_ext_work == 'true' || needs.detect-changes.outputs.run_startup == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore + build
        run: dotnet build azclips.slnx --configuration Release

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-build-outputs
          path: |
            artifacts/Release
            tests/Benchmark/bin/Release
          retention-days: 1

  # ─────────────── Run CLI benchmarks (per changed extension) ───────────────
  run-cli:
    name: Run CLI benchmarks (${{ matrix.extension }})
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_ext_work == 'true'
    runs-on: [self-hosted, Linux, X64, benchmark]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: benchmark-build-outputs
          path: .

      - name: Run CLI benchmarks (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          retry_wait_seconds: 30
          command: dotnet artifacts/Release/Benchmark/Benchmark.dll --ci --extension ${{ matrix.extension }} --product CLI

      - name: Upload CLI benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-cli-results-${{ matrix.extension }}
          path: artifacts/Benchmark/ci
          retention-days: 14
          if-no-files-found: warn

  # ─────────────── Run PS benchmarks (per changed extension) ───────────────
  run-ps:
    name: Run PS benchmarks (${{ matrix.extension }})
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_ext_work == 'true'
    runs-on: [self-hosted, Linux, X64, benchmark]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: benchmark-build-outputs
          path: .

      - name: Run PS benchmarks (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 30
          command: dotnet artifacts/Release/Benchmark/Benchmark.dll --ci --extension ${{ matrix.extension }} --product PS

      - name: Upload PS benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ps-results-${{ matrix.extension }}
          path: artifacts/Benchmark/ci
          retention-days: 14
          if-no-files-found: warn

  # ─────────────── Run STARTUP benchmarks (cross-cutting, not per-extension) ───────────────
  run-startup:
    name: Run STARTUP benchmarks
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_startup == 'true'
    runs-on: [self-hosted, Linux, X64, benchmark]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: benchmark-build-outputs
          path: .

      - name: Run STARTUP benchmarks (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          retry_wait_seconds: 30
          command: dotnet artifacts/Release/Benchmark/Benchmark.dll --ci --product STARTUP

      - name: Upload STARTUP benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-startup-results
          path: artifacts/Benchmark/ci
          retention-days: 14
          if-no-files-found: warn

  # ─────────────── Publish dashboards + gate regressions (single gh-pages writer) ───────────────
  publish:
    name: Publish dashboards and gate regressions
    needs: [detect-changes, run-cli, run-ps, run-startup]
    # Run whenever any producer was in scope (matrix jobs are skipped, not failed, when out of scope).
    if: always() && (needs.detect-changes.outputs.has_ext_work == 'true' || needs.detect-changes.outputs.run_startup == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # gh-pages auto-push (main only)
      pull-requests: write     # PR comments on regression
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*-results*
          path: downloaded
          merge-multiple: true

      # ─────────────── Compute ───────────────
      - name: Publish Compute CLI dashboard / gate regression
        if: ${{ hashFiles('downloaded/COMPUTE/CLI/results/Benchmark.CLI.VirtualMachineBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips Compute CLI Benchmarks'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/COMPUTE/CLI/results/Benchmark.CLI.VirtualMachineBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: ${{ github.event.pull_request.head.repo.fork != true }}
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/cli
          comment-always: ${{ github.event.pull_request.head.repo.fork != true }}

      - name: Publish Compute PS dashboard / gate regression
        if: ${{ hashFiles('downloaded/COMPUTE/PS/results/Benchmark.PS.VirtualMachineBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips Compute PS Benchmarks'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/COMPUTE/PS/results/Benchmark.PS.VirtualMachineBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: ${{ github.event.pull_request.head.repo.fork != true }}
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/ps
          comment-always: ${{ github.event.pull_request.head.repo.fork != true }}
          skip-fetch-gh-pages: true

      # ─────────────── Resources ───────────────
      - name: Publish Resources CLI dashboard / gate regression
        if: ${{ hashFiles('downloaded/RESOURCES/CLI/results/Benchmark.CLI.ResourceGroupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips Resources CLI Benchmarks'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/RESOURCES/CLI/results/Benchmark.CLI.ResourceGroupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: ${{ github.event.pull_request.head.repo.fork != true }}
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/cli
          comment-always: ${{ github.event.pull_request.head.repo.fork != true }}
          skip-fetch-gh-pages: true

      - name: Publish Resources PS dashboard / gate regression
        if: ${{ hashFiles('downloaded/RESOURCES/PS/results/Benchmark.PS.ResourceGroupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips Resources PS Benchmarks'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/RESOURCES/PS/results/Benchmark.PS.ResourceGroupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: ${{ github.event.pull_request.head.repo.fork != true }}
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/ps
          comment-always: ${{ github.event.pull_request.head.repo.fork != true }}
          skip-fetch-gh-pages: true

      # ─────────────── Startup ───────────────
      - name: Publish CLI startup dashboard (warm, tracked)
        if: ${{ hashFiles('downloaded/ALL/STARTUP/results/Benchmark.Startup.CliWarmStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips CLI Startup (warm)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/ALL/STARTUP/results/Benchmark.Startup.CliWarmStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-cli
          skip-fetch-gh-pages: true

      - name: Publish PS startup dashboard (warm, tracked)
        if: ${{ hashFiles('downloaded/ALL/STARTUP/results/Benchmark.Startup.PsWarmStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips PS Startup (warm)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/ALL/STARTUP/results/Benchmark.Startup.PsWarmStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-ps
          skip-fetch-gh-pages: true

      - name: Publish CLI startup dashboard (cold, informational)
        if: ${{ hashFiles('downloaded/ALL/STARTUP/results/Benchmark.Startup.CliColdStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips CLI Startup (cold)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/ALL/STARTUP/results/Benchmark.Startup.CliColdStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-cli
          skip-fetch-gh-pages: true

      - name: Publish PS startup dashboard (cold, informational)
        if: ${{ hashFiles('downloaded/ALL/STARTUP/results/Benchmark.Startup.PsColdStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips PS Startup (cold)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/ALL/STARTUP/results/Benchmark.Startup.PsColdStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-ps
          skip-fetch-gh-pages: true

      # Upload benchmark result JSONs for the fork-PR comment workflow
      - name: Upload benchmark results for fork PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: downloaded/**/results/*-report-full-compressed.json
          retention-days: 1
          if-no-files-found: warn

      # ─────────────── Always ────────────
      - name: Upload BDN logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci-${{ github.run_id }}
          path: downloaded/**
          retention-days: 14
          if-no-files-found: warn
