name: Performance Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Benchmark/**'
      - 'tests/Common/**'
      - 'global.json'
      - 'azclips.slnx'
      - '.github/workflows/benchmark.yml'
      - '.github/scripts/detect-benchmark-changes.sh'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Benchmark/**'
      - 'tests/Common/**'
      - 'global.json'
      - 'azclips.slnx'
      - '.github/workflows/benchmark.yml'
      - '.github/scripts/detect-benchmark-changes.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────── Detect which extensions / families changed ───────────────
  # Fully generic: the extension universe is derived from the [BenchmarkExtension]
  # attribute by .github/scripts/detect-benchmark-changes.sh — adding a new
  # benchmarked extension needs no edits here (only a shared/startup path list).
  detect-changes:
    name: Detect changed extensions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read      # dorny/paths-filter lists PR files via the GitHub API
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      publish_matrix: ${{ steps.set-matrix.outputs.publish_matrix }}
      has_ext_work: ${{ steps.set-matrix.outputs.has_ext_work }}
      run_startup: ${{ steps.set-matrix.outputs.run_startup }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: json          # expose the changed-file list for generic detection
          filters: |
            shared:
              - 'src/Core/**'
              - 'src/CLI/*'
              - 'src/CLI/!(Help)/**'
              - 'src/CLI/Help/*'
              - 'src/CLI/Help/!(Docs)/**'
              - 'tests/Benchmark/*.cs'
              - 'tests/Benchmark/CLI/CLIBenchmarkBase.cs'
              - 'tests/Benchmark/CLI/BenchmarkAssemblyConfigurationService.cs'
              - 'tests/Benchmark/PS/PSBenchmarkBase.cs'
              - 'tests/Benchmark/PS/PSManifestStager.cs'
              - 'tests/Common/**'
              - '.github/workflows/benchmark.yml'
              - 'global.json'
              - 'azclips.slnx'
              - 'Shared.props'
              - '.github/scripts/detect-benchmark-changes.sh'
            startup:
              - 'tests/Benchmark/Startup/**'
            all:
              - '**'

      - name: Build extension matrix
        id: set-matrix
        env:
          EVENT: ${{ github.event_name }}
          SHARED: ${{ steps.filter.outputs.shared }}
          STARTUP: ${{ steps.filter.outputs.startup }}
          CHANGED_FILES: ${{ steps.filter.outputs.all_files }}
        run: bash .github/scripts/detect-benchmark-changes.sh

  # ─────────────── Build the solution once ───────────────
  build:
    name: Build benchmark artifacts once
    needs: detect-changes
    if: needs.detect-changes.outputs.has_ext_work == 'true' || needs.detect-changes.outputs.run_startup == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore + build
        run: dotnet build azclips.slnx --configuration Release

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-build-outputs
          path: |
            artifacts/Release
            tests/Benchmark/bin/Release
          retention-days: 1

  # ─────────────── Run CLI benchmarks (per changed extension) ───────────────
  run-cli:
    name: Run CLI benchmarks (${{ matrix.extension }})
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_ext_work == 'true'
    runs-on: [ self-hosted, 1ES.Pool=pool-ubuntu-gh, "JobId=azclips-cli-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ strategy.job-index }}" ]

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Display dotnet version
        run: dotnet --version

      - name: Download build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-build-outputs
          path: .

      - name: Run CLI benchmarks (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 30
          command: dotnet artifacts/Release/Benchmark/Benchmark.dll --ci --extension ${{ matrix.extension }} --product CLI

      - name: Upload CLI benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-cli-results-${{ matrix.extension }}
          path: artifacts/Benchmark/ci
          retention-days: 14
          if-no-files-found: warn

  # ─────────────── Run PS benchmarks (per changed extension) ───────────────
  run-ps:
    name: Run PS benchmarks (${{ matrix.extension }})
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_ext_work == 'true'
    runs-on: [ self-hosted, 1ES.Pool=pool-ubuntu-gh, "JobId=azclips-ps-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ strategy.job-index }}" ]

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Display dotnet version
        run: dotnet --version

      - name: Download build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-build-outputs
          path: .

      - name: Run PS benchmarks (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 30
          command: dotnet artifacts/Release/Benchmark/Benchmark.dll --ci --extension ${{ matrix.extension }} --product PS

      - name: Upload PS benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ps-results-${{ matrix.extension }}
          path: artifacts/Benchmark/ci
          retention-days: 14
          if-no-files-found: warn

  # ─────────────── Run STARTUP benchmarks (cross-cutting, not per-extension) ───────────────
  run-startup:
    name: Run STARTUP benchmarks
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_startup == 'true'
    runs-on: [ self-hosted, 1ES.Pool=pool-ubuntu-gh, "JobId=azclips-startup-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" ]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Display dotnet version
        run: dotnet --version

      - name: Download build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-build-outputs
          path: .

      - name: Run STARTUP benchmarks (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          retry_wait_seconds: 30
          command: dotnet artifacts/Release/Benchmark/Benchmark.dll --ci --product STARTUP

      - name: Upload STARTUP benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-startup-results
          path: artifacts/Benchmark/ci
          retention-days: 14
          if-no-files-found: warn

  # ─────────────── Publish extension dashboards (generic matrix) ───────────────
  # One leg per {extension × product}. The matrix comes straight from
  # detect-changes (derived from the [BenchmarkExtension] attribute).
  publish-extensions:
    name: Publish ${{ matrix.extension }} ${{ matrix.product }} dashboard
    needs: [detect-changes, run-cli, run-ps]
    if: always() && needs.detect-changes.outputs.has_ext_work == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # gh-pages auto-push (main only)
      pull-requests: write     # PR comments on regression
    strategy:
      fail-fast: false
      max-parallel: 1          # serialise gh-pages writes across legs
      matrix: ${{ fromJSON(needs.detect-changes.outputs.publish_matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Download all benchmark results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: benchmark-*-results*
          path: downloaded
          merge-multiple: true

      - name: Resolve dashboard parameters
        id: p
        env:
          EXT: ${{ matrix.extension }}
          PRODUCT: ${{ matrix.product }}
        run: |
          ext_upper="${EXT^^}"
          title="${EXT^}"
          product_lower="${PRODUCT,,}"
          report=$(ls "downloaded/${ext_upper}/${PRODUCT}/results/"*-report-full-compressed.json 2>/dev/null | head -1 || true)
          {
            echo "report=$report"
            echo "name=Azclips ${title} ${PRODUCT} Benchmarks"
            echo "data_dir=dev/bench/${product_lower}"
            if [ -n "$report" ]; then echo "found=true"; else echo "found=false"; fi
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: name='Azclips ${title} ${PRODUCT} Benchmarks' data_dir='dev/bench/${product_lower}' report='${report:-<none>}'"

      - name: Publish dashboard / gate regression
        if: steps.p.outputs.found == 'true'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: ${{ steps.p.outputs.name }}
          tool: 'benchmarkdotnet'
          output-file-path: ${{ steps.p.outputs.report }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: ${{ github.event.pull_request.head.repo.fork != true }}
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: ${{ steps.p.outputs.data_dir }}
          comment-always: ${{ github.event.pull_request.head.repo.fork != true }}

  # ─────────────── Publish startup dashboards (fixed, cross-cutting) ───────────────
  # Startup dashboards are special (warm tracked, cold informational) and are not
  # per-extension. Serialised after publish-extensions so gh-pages pushes don't race.
  publish-startup:
    name: Publish startup dashboards
    needs: [detect-changes, run-startup, publish-extensions]
    if: always() && needs.detect-changes.outputs.run_startup == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # gh-pages auto-push (main only)
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Download all benchmark results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: benchmark-*-results*
          path: downloaded
          merge-multiple: true

      - name: Publish CLI startup dashboard (warm, tracked)
        if: ${{ hashFiles('downloaded/ALL/STARTUP/results/Benchmark.Startup.CliWarmStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: 'Azclips CLI Startup (warm)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/ALL/STARTUP/results/Benchmark.Startup.CliWarmStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-cli

      - name: Publish PS startup dashboard (warm, tracked)
        if: ${{ hashFiles('downloaded/ALL/STARTUP/results/Benchmark.Startup.PsWarmStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: 'Azclips PS Startup (warm)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/ALL/STARTUP/results/Benchmark.Startup.PsWarmStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-ps
          skip-fetch-gh-pages: true

      - name: Publish CLI startup dashboard (cold, informational)
        if: ${{ hashFiles('downloaded/ALL/STARTUP/results/Benchmark.Startup.CliColdStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: 'Azclips CLI Startup (cold)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/ALL/STARTUP/results/Benchmark.Startup.CliColdStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-cli
          skip-fetch-gh-pages: true

      - name: Publish PS startup dashboard (cold, informational)
        if: ${{ hashFiles('downloaded/ALL/STARTUP/results/Benchmark.Startup.PsColdStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: 'Azclips PS Startup (cold)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/ALL/STARTUP/results/Benchmark.Startup.PsColdStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-ps
          skip-fetch-gh-pages: true

  # ─────────────── Collect artifacts (fork PR comment + debugging) ───────────────
  # Single writer of the `benchmark-results` artifact consumed by benchmark-comment.yml,
  # decoupled from the (matrix) publish jobs so the artifact name stays unique.
  collect:
    name: Collect benchmark artifacts
    needs: [detect-changes, run-cli, run-ps, run-startup]
    if: always() && (needs.detect-changes.outputs.has_ext_work == 'true' || needs.detect-changes.outputs.run_startup == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Download all benchmark results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: benchmark-*-results*
          path: downloaded
          merge-multiple: true

      # On pull_request events actions/checkout defaults its repository input to
      # github.repository (the base, not the fork), so the base repo's gh-pages
      # branch is readable via the default token's contents: read scope.
      # continue-on-error covers the first ever run, before dev/bench/traces/ exists.
      - name: Checkout gh-pages for trace baselines
        id: baselines
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          sparse-checkout: |
            dev/bench/traces

      # Upload benchmark result JSONs for the fork-PR comment workflow
      - name: Upload benchmark results for fork PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: downloaded/**/results/*-report-full-compressed.json
          retention-days: 1
          if-no-files-found: warn

      - name: Upload BDN logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci-${{ github.run_id }}
          path: downloaded/**
          retention-days: 14
          if-no-files-found: warn

      - name: Aggregate trace hierarchies
        if: always()
        run: |
          python3 .github/scripts/aggregate-benchmark-traces.py \
            --input downloaded \
            --baseline gh-pages/dev/bench/traces \
            --sidecar-out sidecars \
            --commit "${{ github.sha }}" \
            --ref "${{ github.ref }}" \
            --run-id "${{ github.run_id }}" \
            --summary-out "$GITHUB_STEP_SUMMARY"

      - name: Upload trace sidecars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-trace-sidecars
          path: sidecars
          retention-days: 1
          if-no-files-found: ignore

  # ─────────────── Publish trace sidecars to gh-pages (main only) ───────────────
  # Separate from `collect` on purpose: `collect` only needs the run jobs, so it can
  # execute alongside publish-extensions / publish-startup, which push to gh-pages and
  # serialise among themselves. Pushing from `collect` would race them. Chaining here
  # joins that existing serialisation instead of competing with it.
  publish-traces:
    name: Publish trace sidecars to gh-pages
    needs: [collect, publish-extensions, publish-startup]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download trace sidecars
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-trace-sidecars
          path: sidecars

      - name: Checkout gh-pages
        if: steps.download.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Commit sidecars
        if: steps.download.outcome == 'success'
        env:
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$(ls -A sidecars 2>/dev/null)" ]; then
            echo "No sidecars were produced; nothing to publish."
            exit 0
          fi

          mkdir -p gh-pages/dev/bench/traces
          # cp -r merges rather than replaces: extensions the path filter skipped keep
          # their existing baseline, so dev/bench/traces accumulates the union with
          # each subtree frozen at its own vintage.
          cp -r sidecars/. gh-pages/dev/bench/traces/

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/bench/traces

          if git diff --cached --quiet; then
            echo "Sidecars unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "bench: update trace sidecars for ${SHA}"

          # publish-extensions and publish-startup also push to gh-pages. They are
          # upstream in `needs`, but a retry keeps this green if one lands late.
          for attempt in 1 2 3; do
            if git push; then
              echo "Published trace sidecars on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing."
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash || true
            sleep 5
          done

          # Sidecars are regenerable, so a lost push self-heals on the next main run.
          echo "::warning::Could not push trace sidecars after 3 attempts."
          exit 0
