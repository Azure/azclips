name: Performance Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Benchmark/**'
      - 'global.json'
      - 'azclips.slnx'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Benchmark/**'
      - 'global.json'
      - 'azclips.slnx'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

#TODO: run filtering based on files changed
jobs:
  build:
    name: Build benchmark artifacts once
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore + build
        run: dotnet build azclips.slnx --configuration Release

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-build-outputs
          path: |
            artifacts/Release
            tests/Benchmark/bin/Release
          retention-days: 1

  run-cli:
    name: Run CLI benchmarks
    needs: build
    runs-on: [self-hosted, Linux, X64, benchmark]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: benchmark-build-outputs
          path: .

      - name: Run CLI benchmarks (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 30
          command: dotnet artifacts/Release/Benchmark/Benchmark.dll --ci --product CLI

      - name: Upload CLI benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-cli-results
          path: artifacts/Benchmark/ci/CLI
          retention-days: 14

  run-ps:
    name: Run PS benchmarks
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: benchmark-build-outputs
          path: .

      - name: Run PS benchmarks (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 30
          command: dotnet artifacts/Release/Benchmark/Benchmark.dll --ci --product PS

      - name: Upload PS benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ps-results
          path: artifacts/Benchmark/ci/PS
          retention-days: 14

  run-startup:
    name: Run STARTUP benchmarks
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: benchmark-build-outputs
          path: .

      - name: Run STARTUP benchmarks (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          retry_wait_seconds: 30
          command: dotnet artifacts/Release/Benchmark/Benchmark.dll --ci --product STARTUP

      - name: Upload STARTUP benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-startup-results
          path: artifacts/Benchmark/ci/STARTUP
          retention-days: 14

  publish:
    name: Publish dashboards and gate regressions
    needs: [run-cli, run-ps, run-startup]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # gh-pages auto-push (main only)
      pull-requests: write     # PR comments on regression
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download CLI benchmark outputs
        uses: actions/download-artifact@v4
        with:
          name: benchmark-cli-results
          path: downloaded/cli

      - name: Download PS benchmark outputs
        uses: actions/download-artifact@v4
        with:
          name: benchmark-ps-results
          path: downloaded/ps

      - name: Download STARTUP benchmark outputs
        uses: actions/download-artifact@v4
        with:
          name: benchmark-startup-results
          path: downloaded/startup

      # ─────────────── CLI ───────────────
      - name: Publish CLI dashboard / gate regression
        if: ${{ hashFiles('downloaded/cli/results/Benchmark.CLI.ResourceGroupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips CLI Benchmarks'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/cli/results/Benchmark.CLI.ResourceGroupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: ${{ github.event.pull_request.head.repo.fork != true }}
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/cli
          comment-always: ${{ github.event.pull_request.head.repo.fork != true }}

      # ─────────────── PS ────────────────
      - name: Publish PS dashboard / gate regression
        if: ${{ hashFiles('downloaded/ps/results/Benchmark.PS.ResourceGroupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips PS Benchmarks'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/ps/results/Benchmark.PS.ResourceGroupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: ${{ github.event.pull_request.head.repo.fork != true }}
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/ps
          comment-always: ${{ github.event.pull_request.head.repo.fork != true }}
          skip-fetch-gh-pages: true

      # ─────────────── STARTUP ───────────────
      - name: Publish CLI startup dashboard (warm, tracked)
        if: ${{ hashFiles('downloaded/startup/results/Benchmark.Startup.CliWarmStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips CLI Startup (warm)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/startup/results/Benchmark.Startup.CliWarmStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-cli
          skip-fetch-gh-pages: true

      - name: Publish PS startup dashboard (warm, tracked)
        if: ${{ hashFiles('downloaded/startup/results/Benchmark.Startup.PsWarmStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips PS Startup (warm)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/startup/results/Benchmark.Startup.PsWarmStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: '115%'
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-ps
          skip-fetch-gh-pages: true

      - name: Publish CLI startup dashboard (cold, informational)
        if: ${{ hashFiles('downloaded/startup/results/Benchmark.Startup.CliColdStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips CLI Startup (cold)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/startup/results/Benchmark.Startup.CliColdStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-cli
          skip-fetch-gh-pages: true

      - name: Publish PS startup dashboard (cold, informational)
        if: ${{ hashFiles('downloaded/startup/results/Benchmark.Startup.PsColdStartupBenchmarks-report-full-compressed.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Azclips PS Startup (cold)'
          tool: 'benchmarkdotnet'
          output-file-path: downloaded/startup/results/Benchmark.Startup.PsColdStartupBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/startup-ps
          skip-fetch-gh-pages: true

      # Upload CLI + PS benchmark results for the fork-PR comment workflow
      - name: Upload benchmark results for fork PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            downloaded/cli/**/results/*ResourceGroupBenchmarks-report-full-compressed.json
            downloaded/ps/**/results/*ResourceGroupBenchmarks-report-full-compressed.json
          retention-days: 1
          if-no-files-found: warn

      # ─────────────── Always ────────────
      - name: Upload BDN logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci-${{ github.run_id }}
          path: |
            downloaded/cli/**
            downloaded/ps/**
            downloaded/startup/**
          retention-days: 14
          if-no-files-found: warn
