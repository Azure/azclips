name: Build and Test (Agent)

# Cross-platform smoke test that the agent subprocess is healthy on macOS,
# Windows, and Linux. It guards the class of failure unit tests can't see: a
# packaging/layout regression that leaves the agent unable to start (e.g. the
# macOS P0 "Failed to create CoreCLR, HRESULT: 0x80070008").
#
# It needs NO Azure login and NO LLM credential. A failing `az` command fires
# the agent fallback; the agent's runtime starts, loads, and runs all the way
# to the pre-LLM auth check — where, with no login, it prints a stable
# "requires an Azure login" message. That message is the login-free proof the
# whole agent chain is alive; the absence of "Failed to create CoreCLR" is the
# proof the P0 has not regressed.
#
# Assertions (per platform):
#   FAIL if output contains "Failed to create CoreCLR"     (agent runtime dead)
#   FAIL if output lacks   "requires an Azure login"        (agent never reached auth → false green guard)
#   PASS otherwise.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-test-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux / Windows: lean smoke (agent-startup regression guard) ---
          - os: ubuntu-latest
            platform: linux
            profile: lean
            trigger: miss
            build: bash devops/scripts/packaging/linux/tarball/build_linux_tarball.sh
            out_glob: devops/out/linux
            az_name: az
            shell: bash
          - os: windows-latest
            platform: windows
            profile: lean
            trigger: miss
            build: pwsh -NoProfile -File devops/scripts/packaging/windows/zip/build_win_zip.ps1
            out_glob: devops/out/windows
            az_name: az.exe
            shell: pwsh
          # --- macOS P0 repro matrix: {Intel macos-13, Apple Silicon macos-14}
          #     x {lean, full}. The reported crash was on a full install where
          #     `vm show` actually runs (vm/Compute present) and fails, spawning the
          #     agent — so the `full` jobs trigger with a real `vm show` command;
          #     `lean` jobs use a generic miss (vm would be a structured bypass).
          - { os: macos-13, platform: macos13-intel-lean, profile: lean, trigger: miss, build: bash devops/scripts/packaging/macos/tarball/build_macos_tarball.sh, out_glob: devops/out/macos, az_name: az, shell: bash }
          - { os: macos-13, platform: macos13-intel-full, profile: full, trigger: vm,   build: bash devops/scripts/packaging/macos/tarball/build_macos_tarball.sh, out_glob: devops/out/macos, az_name: az, shell: bash }
          - { os: macos-14, platform: macos14-arm-lean,   profile: lean, trigger: miss, build: bash devops/scripts/packaging/macos/tarball/build_macos_tarball.sh, out_glob: devops/out/macos, az_name: az, shell: bash }
          - { os: macos-14, platform: macos14-arm-full,   profile: full, trigger: vm,   build: bash devops/scripts/packaging/macos/tarball/build_macos_tarball.sh, out_glob: devops/out/macos, az_name: az, shell: bash }

    runs-on: ${{ matrix.os }}
    name: agent-smoke (${{ matrix.platform }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish built-in extensions (fills builtin-publish/ for the inject step)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x devops/scripts/packaging/common/build_common.sh
          bash devops/scripts/packaging/common/build_common.sh

      - name: Build the platform package (CLI + agent hybrid layout)
        env:
          PACKAGE_PROFILE: ${{ matrix.profile }}
        run: ${{ matrix.build }}

      # --- POSIX (macОС / Linux) ------------------------------------------------
      - name: Smoke — POSIX
        if: matrix.shell == 'bash'
        run: |
          set -uo pipefail
          AZ="$(find "$GITHUB_WORKSPACE/${{ matrix.out_glob }}" -type f -name '${{ matrix.az_name }}' -perm -u+x | head -1)"
          if [ -z "${AZ:-}" ]; then
            echo "::error::packaged az not found under ${{ matrix.out_glob }}"
            find "$GITHUB_WORKSPACE/${{ matrix.out_glob }}" -maxdepth 4 -type f | head -50
            exit 1
          fi
          echo "az = $AZ"
          ls -la "$(dirname "$AZ")" | grep -i azclips-agent || echo "WARN: azclips-agent not next to az"

          "$AZ" --version
          "$AZ" config set --key agent.enabled --value true
          "$AZ" config set --key agent.sessionStyle --value oneshot

          set +e
          # Trigger the agent fallback. Two modes:
          #  - miss: a generic unknown verb → falls through to the top-level catch
          #    and fires the agent (used on lean, where `vm` would be a structured
          #    ExtensionNotInstalled bypass).
          #  - vm:   a real `vm show` that actually runs and fails (full package has
          #    vm/Compute) → matches the reported P0's trigger exactly.
          if [ "${{ matrix.trigger }}" = "vm" ]; then
            OUT="$("$AZ" vm show --name test --subscription-id 00000000-0000-0000-0000-000000000000 --resource-group test 2>&1)"
          else
            OUT="$("$AZ" create a resource group named ci-smoke-test 2>&1)"
          fi
          set -e
          echo "----- output -----"; echo "$OUT"; echo "------------------"

          if echo "$OUT" | grep -qi "Failed to create CoreCLR"; then
            echo "::error::P0 — agent subprocess could not start its .NET runtime (Failed to create CoreCLR)."
            exit 1
          fi
          if echo "$OUT" | grep -qiE "requires an Azure login|No active Azure account"; then
            echo "PASS — agent chain alive (runtime started, ran to auth step; only login missing)."
          else
            echo "::error::agent never reached the auth step — no 'requires an Azure login'. Fallback may not have fired, or agent died early."
            exit 1
          fi

      # --- Windows --------------------------------------------------------------
      - name: Smoke — Windows
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $az = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/${{ matrix.out_glob }}" -Recurse -Filter '${{ matrix.az_name }}' -File | Select-Object -First 1
          if (-not $az) {
            Write-Host "::error::packaged az.exe not found under ${{ matrix.out_glob }}"
            Get-ChildItem -Path "$env:GITHUB_WORKSPACE/${{ matrix.out_glob }}" -Recurse -File | Select-Object -First 50 | ForEach-Object { $_.FullName }
            exit 1
          }
          $AZ = $az.FullName
          Write-Host "az = $AZ"

          & $AZ --version
          & $AZ config set --key agent.enabled --value true
          & $AZ config set --key agent.sessionStyle --value oneshot

          # Generic miss (unknown verb) fires the agent fallback; a known-but-
          # uninstalled verb like `vm` in lean would bypass it via a structured error.
          # Capture stdout+stderr to a file: piping "2>&1" through Out-String turns
          # stderr into ErrorRecord objects that -match reads unreliably, and with
          # ErrorActionPreference=Stop a native stderr write can abort the step
          # before we ever assert. A file redirect gives us the raw combined text.
          $ErrorActionPreference = 'Continue'
          $outFile = Join-Path $env:RUNNER_TEMP 'az_smoke_out.txt'
          & $AZ create a resource group named ci-smoke-test *> $outFile
          $OUT = Get-Content -Raw -Path $outFile
          Write-Host "----- output -----"; Write-Host $OUT; Write-Host "------------------"

          if ($OUT -match 'Failed to create CoreCLR') {
            Write-Host "::error::P0 — agent subprocess could not start its .NET runtime (Failed to create CoreCLR)."
            exit 1
          }
          if ($OUT -match 'requires an Azure login|No active Azure account') {
            Write-Host "PASS — agent chain alive (runtime started, ran to auth step; only login missing)."
            exit 0   # az itself exits non-zero (no login); don't let that fail the step
          } else {
            Write-Host "::error::agent never reached the auth step — no 'requires an Azure login'. Fallback may not have fired, or agent died early."
            exit 1
          }
