name: Build and Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ps-validation-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PowerShell matrix YAML dependency
        run: |
          tools_root="$RUNNER_TEMP/ps-validation-tools"
          python3 -m venv "$tools_root"
          "$tools_root/bin/python" -m pip install --disable-pip-version-check \
            -r devops/scripts/packaging/powershell/requirements.txt
          echo "$tools_root/bin" >> "$GITHUB_PATH"

      - name: Test PowerShell validation matrix
        run: bash devops/scripts/packaging/powershell/test_generate_ps_validation_matrix.sh

      - name: Test PowerShell module lifecycle
        shell: pwsh
        run: ./tests/Scripts/PS/PSModuleLifecycleFixtures.ps1

      - name: Test PowerShell module smoke tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/Scripts/PS/PSSmokeFixtures.ps1
          exit $LASTEXITCODE

      - name: Test PowerShell validation pipeline
        shell: pwsh
        run: ./tests/Scripts/PS/PSValidationPipelineFixtures.ps1

      - name: Test PowerShell package and runtime dependencies
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/Scripts/PS/PSDependencyFixtures.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File ./tests/Scripts/PS/PSDependencyRuntimeFixtures.ps1
          exit $LASTEXITCODE

      - name: Test PowerShell release upgrades
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/Scripts/PS/PSUpgradeReleaseFixtures.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File ./tests/Scripts/PS/PSUpgradeFixtures.ps1
          exit $LASTEXITCODE

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore azclips.slnx

      - name: Build
        run: dotnet build azclips.slnx --no-restore --configuration Debug # Should be Release but
        # there are some issues (a) with locating extension dll and (b) with the RequiredAssemblies property

      - name: Run tests
        run: dotnet test azclips.slnx --no-build --configuration Debug --verbosity normal

      - name: E2E - CLI Help
        run: |
          ./artifacts/Debug/Core.Cli/az --help

      - name: Setup PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: E2E - PowerShell Module
        shell: pwsh
        run: |
          Import-Module ./src/PS/Accounts/Accounts.psd1
          $commands = Get-Command -Module Accounts
          if ($commands.Count -eq 0) {
            Write-Error "No commands found in Accounts module"
            exit 1
          }
          Write-Host "Found $($commands.Count) commands in Accounts module"

  recording-secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed recordings for secrets
        run: python3 devops/scripts/ci/scan_recordings.py --base "origin/${{ github.base_ref || 'main' }}"

  help-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore azclips.slnx

      - name: Build
        run: dotnet build azclips.slnx --no-restore --configuration Debug

      - name: Validate help content
        run: |
          dotnet run --project tools/Help/Azclips.Help.Tool/Azclips.Help.Tool.csproj --no-build --configuration Debug -- \
            --artifacts-root artifacts/Debug \
            --output-root artifacts/help

      - name: Install PlatyPS
        shell: pwsh
        run: ./build/Install-BuildDependencies.ps1

      - name: Smoke-test help drift gate
        shell: pwsh
        run: ./tests/Scripts/PS/HelpDriftFixtures.ps1

      - name: Validate PS help drift
        shell: pwsh
        run: ./build/Test-PSHelpMarkdown.ps1

  help-tool-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore azclips.slnx

      - name: Build solution
        run: dotnet build azclips.slnx --no-restore --configuration Debug

      - name: Run help tool tests
        run: dotnet test tools/Help/Azclips.Help.Tool.Tests/Azclips.Help.Tool.Tests.csproj --no-build --configuration Debug --verbosity normal

  ps-docs-sync-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pester 5+
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PS docs sync Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tests/Ps.DocsSync.Tests/ -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "Pester tests failed: $($result.FailedCount) failure(s)." }

      - name: PS docs sync — dry-run over real corpus
        shell: pwsh
        run: pwsh -File build/Sync-AzclipsPowerShellDocs.ps1 -TargetRepoPath /tmp/nonexistent

  cli-docs-sync-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pester 5+
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run CLI docs sync Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tests/Cli.DocsSync.Tests/ -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "Pester tests failed: $($result.FailedCount) failure(s)." }

      # Load-only smoke: dot-source the shim with AZCLIPS_CLI_SYNC_LOAD_ONLY=1 (used by
      # the Pester setup) so Main is skipped. Catches parse errors and stale function
      # references without needing CLI2Yaml (which lives behind apidrop auth).
      - name: CLI docs sync — load-only smoke
        shell: pwsh
        run: |
          $env:AZCLIPS_CLI_SYNC_LOAD_ONLY = '1'
          . ./build/Sync-AzClipsCliDocs.ps1
          if (-not (Get-Command Invoke-SyncApply -ErrorAction SilentlyContinue)) {
              throw "Load-only smoke failed: Invoke-SyncApply not defined after dot-sourcing."
          }

  release-script-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run PR file policy tests
        working-directory: devops/scripts/ci
        run: python3 -m unittest test_check_pull_request_changes.py -v

      - name: Install Pester 5+
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run release script Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tests/Release.Tests/ -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "Pester tests failed: $($result.FailedCount) failure(s)." }
