name: Build and Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet restore azclips.slnx
      - run: dotnet build azclips.slnx --no-restore --configuration Debug
      - name: Capture fingerprint baselines
        env:
          FP_WRITE: "1"
        run: dotnet test Agent/tests/Core.Agent.Tests/Core.Agent.Tests.csproj --no-build --configuration Debug --filter "FullyQualifiedName~SystemPromptFingerprintTests" --logger "console;verbosity=detailed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: baselines-${{ matrix.os }}
          path: Agent/tests/Core.Agent.Tests/Baselines/
