name: Build and Package Azure CLI v2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-cli:

    strategy:
      matrix:
        configuration: [Debug, Release]
        # At present, we only build for Windows x64 platform. When needed, we can add more platforms here.
        platform: [win-x64]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: azclips.slnx
      Certificate_Directory: .  # Store certificate in the root directory

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: dotnet restore $env:Solution_Name
      env:
        Configuration: ${{ matrix.configuration }}

    # Build the Solution
    - name: Build the solution
      run: dotnet build $env:Solution_Name --configuration $env:Configuration --no-restore
      env:
        Configuration: ${{ matrix.configuration }}

    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: dotnet test $env:Solution_Name --no-build --configuration $env:Configuration --verbosity normal
      env:
        Configuration: ${{ matrix.configuration }}

    # Upload the build artifacts
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Build Artifacts (${{ matrix.configuration }}-${{ matrix.platform }})
        path: artifacts/${{ matrix.configuration }}

    # Decode the base 64 encoded pfx and save the Signing_Certificate
    - name: Decode the pfx
      if: github.event_name != 'pull_request'
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path -Path $env:Certificate_Directory -ChildPath GitHubActionsWorkflow.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    - name: Publish the CLI application
      run: dotnet publish src/CLI/Core.Cli.csproj -c ${{ matrix.configuration }} -r ${{ matrix.platform }} --self-contained -o ./publish/${{ matrix.configuration }}/${{ matrix.platform }}
      env:
        Configuration: ${{ matrix.configuration }}
    
    - name: Publish the Extension (az extension)
      run: dotnet publish src/Extensions/Extension/Extensions.Extension.csproj -c ${{ matrix.configuration }} -r ${{ matrix.platform }} -o ./publish/${{ matrix.configuration }}/${{ matrix.platform }}/Extensions/Extension
      env:
        Configuration: ${{ matrix.configuration }}

    # Copy appx manifest
    - name: Copy appx manifest
      run: Copy-Item src/CLI/Core.Cli.appxmanifest ./publish/${{ matrix.configuration }}/${{ matrix.platform }}/AppxManifest.xml

    # Copy appx assets
    - name: Copy appx assets
      run: |
        $assetsSource = "assets"
        $assetsDestination = "./publish/${{ matrix.configuration }}/${{ matrix.platform }}/Assets"
        if (Test-Path $assetsSource) {
          New-Item -ItemType Directory -Path $assetsDestination -Force | Out-Null
          Copy-Item "$assetsSource\*" $assetsDestination -Recurse -Force
        }

    # Create the appx package
    - name: Create the appx package
      run: |
        $windowsKitBinRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
        $latestBinDir = Get-ChildItem -Path $windowsKitBinRoot -Directory |
          Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
          Sort-Object -Property Name -Descending |
          Select-Object -First 1
        if (-not $latestBinDir) {
          throw "No Windows SDK bin directory found under $windowsKitBinRoot"
        }
        # Determine the SDK tool architecture based on the target platform
        $sdkArch = if ("${{ matrix.platform }}" -eq "win-x86") { "x86" } else { "x64" }
        $makeAppxPath = Join-Path -Path $latestBinDir.FullName -ChildPath "$sdkArch\MakeAppx.exe"
        & $makeAppxPath pack /d "./publish/${{ matrix.configuration }}/${{ matrix.platform }}" /p "./bin/${{ matrix.configuration }}/az-${{ matrix.platform }}.msix" /nv
    
    # Sign the appx package
    - name: Sign the appx package
      if: github.event_name != 'pull_request'
      run: |
        $windowsKitBinRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
        $latestBinDir = Get-ChildItem -Path $windowsKitBinRoot -Directory |
          Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
          Sort-Object -Property Name -Descending |
          Select-Object -First 1
        if (-not $latestBinDir) {
          throw "No Windows SDK bin directory found under $windowsKitBinRoot"
        }
        # Use x64 signtool regardless of target platform (runs on host)
        $signtoolPath = Join-Path -Path $latestBinDir.FullName -ChildPath 'x64\signtool.exe'
        & $signtoolPath sign /f "$env:Certificate_Directory/GitHubActionsWorkflow.pfx" /p "${{ secrets.Pfx_Key }}" /fd SHA256 "./bin/${{ matrix.configuration }}/az-${{ matrix.platform }}.msix"

    # Remove the pfx
    - name: Remove the pfx
      if: github.event_name != 'pull_request'
      run: Remove-Item -path $env:Certificate_Directory\GitHubActionsWorkflow.pfx

    # Upload the MSIX package:
    - name: Upload MSIX package
      uses: actions/upload-artifact@v4
      with:
        name: MSIX Package (${{ matrix.configuration }}-${{ matrix.platform }})
        path: ./bin/${{ matrix.configuration }}/az-${{ matrix.platform }}.msix

  discover-extensions:
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.discover-extensions.outputs.extensions }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: discover-extensions
      run: |
        extensions=$( { find src/Extensions -name "*.csproj" -type f; find Agent -name "Agent.Commands.csproj" -type f; } | jq -R -s -c 'split("\n") | map(select(length > 0))')
        echo "extensions=$extensions" >> $GITHUB_OUTPUT

  build-extension:
    needs: discover-extensions
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.discover-extensions.outputs.extensions) }}
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract Extension Metadata
        id: extract-metadata
        shell: pwsh
        run: |
          $csprojPath = "${{ matrix.extension }}"
          [xml]$csproj = Get-Content $csprojPath
          
          $assemblyName = $csproj.Project.PropertyGroup.AssemblyName | Where-Object { $_ } | Select-Object -First 1
          $extName = $csproj.Project.PropertyGroup.ExtName | Where-Object { $_ } | Select-Object -First 1
          
          if (-not $assemblyName) {
            Write-Error "AssemblyName not found in $csprojPath"
            exit 1
          }
          
          if (-not $extName) {
            Write-Error "ExtName not found in $csprojPath"
            exit 1
          }
          
          Write-Host "AssemblyName: $assemblyName"
          Write-Host "ExtName: $extName"
          
          echo "assembly_name=$assemblyName" >> $env:GITHUB_OUTPUT
          echo "ext_name=$extName" >> $env:GITHUB_OUTPUT
      # Install the .NET Core workload
      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore Extension
        run: dotnet restore ${{ matrix.extension }}
      - name: Build Extension
        run: dotnet build ${{ matrix.extension }} --configuration ${{ matrix.configuration }} --no-restore
        env:
          Configuration: ${{ matrix.configuration }}
      - name: Upload Extension Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Extension - ${{ steps.extract-metadata.outputs.ext_name }} (${{ matrix.configuration }})
          path: ./artifacts/${{ matrix.configuration }}/${{ steps.extract-metadata.outputs.ext_name }}
  
  discover-powershell-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover-modules.outputs.modules }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: discover-modules
      run: |
        modules=$(find src/PS -name "*.psm1" -type f | jq -R -s -c 'split("\n") | map(select(length > 0))')
        echo "modules=$modules" >> $GITHUB_OUTPUT
  
  build-powershell-module:
    needs: discover-powershell-modules
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover-powershell-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup PowerShell latest
        shell: powershell
        run: |
          winget install --id Microsoft.PowerShell --source winget --disable-interactivity --accept-source-agreements
      - name: Extract Extension Metadata
        id: extract-metadata
        shell: pwsh
        run: |
          $psm1Path = "${{ matrix.module }}"
          $moduleName = [System.IO.Path]::GetFileNameWithoutExtension($psm1Path)
          $moduleDir = [System.IO.Path]::GetDirectoryName($psm1Path)
          
          if (-not $moduleName) {
            Write-Error "Module name could not be determined from $psm1Path"
            exit 1
          }
          
          Write-Host "Module Name: $moduleName"
          
          echo "module_name=$moduleName" >> $env:GITHUB_OUTPUT
          echo "module_dir=$moduleDir" >> $env:GITHUB_OUTPUT
          echo "extension_project_path=src/Extensions/${moduleName}/Extensions.${moduleName}.csproj" >> $env:GITHUB_OUTPUT
      # Install the .NET Core workload
      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore Extension
        run: dotnet restore ${{ steps.extract-metadata.outputs.extension_project_path }}
      # The hardcoded Debug configuration is to match the psd1 RequiredAssemblies paths
      - name: Build Corresponding Extension
        run: dotnet build ${{ steps.extract-metadata.outputs.extension_project_path }} --configuration Debug --no-restore
      # Skip Publish step for now since psd1 RequiredAssemblies paths are hardcoded
      # - name: Publish PowerShell Module (Local)
      #   shell: pwsh
      #   run: |
      #     $moduleName = "${{ steps.extract-metadata.outputs.module_name }}"
      #     $moduleDir = "${{ steps.extract-metadata.outputs.module_dir }}"
      #     $publishDir = "./publish/$moduleName"
      #     $buildOutput = "./artifacts/Release/Microsoft.Azure.Azclips.Extensions.$moduleName"
          
      #     Write-Host "Publishing module: $moduleName"
      #     Write-Host "Source: $moduleDir"
      #     Write-Host "Build output: $buildOutput"
      #     Write-Host "Publish directory: $publishDir"
          
      #     # Create publish directory
      #     New-Item -Path $publishDir -ItemType Directory -Force | Out-Null
          
      #     # Copy all PowerShell module files recursively (excludes obj folder)
      #     Copy-Item -Path "$moduleDir/*" -Destination $publishDir -Recurse -Exclude "obj"
          
      #     # Copy all DLLs from build output
      #     Copy-Item -Path "$buildOutput/*.dll" -Destination $publishDir
          
      #     # Rename the main DLL to match what the module manifest expects
      #     $mainDll = Join-Path $publishDir "Microsoft.Azure.Azclips.Extensions.$moduleName.dll"
      #     if (Test-Path $mainDll) {
      #       Rename-Item -Path $mainDll -NewName "$moduleName.dll"
      #       Write-Host "Renamed to: $moduleName.dll"
      #     }
          
      #     Write-Host "Module published to: $publishDir"
      #     Get-ChildItem -Path $publishDir -Recurse | ForEach-Object { Write-Host $_.FullName }
      # module import test
      - name: Test Module Import
        shell: pwsh
        run: |
          $moduleName = "${{ steps.extract-metadata.outputs.module_name }}"
          $moduleDir = "${{ steps.extract-metadata.outputs.module_dir }}"
          $publishDir = "./publish/$moduleName"
          
          Write-Host "Testing import of module: $moduleName from $moduleDir"
          
          try {
            Import-Module ./$moduleDir -Force -ErrorAction Stop
            Write-Host "Module $moduleName imported successfully."
            $commands = Get-Command -Module $moduleName
            if ($commands.Count -eq 0) {
              Write-Error "No commands found in $moduleName module"
              exit 1
            }
            Write-Host "Found $($commands.Count) commands in $moduleName module"
          } catch {
            Write-Error "Failed to import module $moduleName. $_"
            exit 1
          }
      # Skip upload for now since publish step is skipped
      # - name: Upload PowerShell Module Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: PowerShell Module - ${{ steps.extract-metadata.outputs.module_name }}
      #     path: ./publish/${{ steps.extract-metadata.outputs.module_name }}

  create-release:
    # Only run on push to main branch (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-cli, build-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          # Generate version based on date and run number: v1.0.YYMMDD.RUN_NUMBER
          VERSION="v1.0.$(date +'%y%m%d').${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Get latest commits for release notes
        id: commits
        run: |
          # Get commit messages since last tag, or last 10 if no tags
          if git describe --tags --abbrev=0 2>/dev/null; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges | head -20)
          else
            COMMITS=$(git log -10 --pretty=format:"- %s (%h)" --no-merges)
          fi
          # Handle multiline output properly
          {
            echo 'commits<<EOF'
            echo "$COMMITS"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: release-artifacts

      - name: Display artifact structure
        run: ls -R release-artifacts

      - name: Prepare release artifacts
        run: |
          mkdir -p release-files
          
          # Function to copy artifacts matching a pattern
          copy_release_artifacts() {
            local file_pattern="$1"
            local path_pattern="$2"
            echo "Searching for $file_pattern files matching pattern: $path_pattern"
            
            # Use array to avoid subshell issues with while loop
            local files=()
            while IFS= read -r file; do
              files+=("$file")
            done < <(find release-artifacts -name "$file_pattern" | grep -i "$path_pattern")
            
            if [ ${#files[@]} -eq 0 ]; then
              echo "  Warning: No $file_pattern files found matching pattern '$path_pattern'"
              return 1
            fi
            
            for file in "${files[@]}"; do
              echo "  Copying: $file"
              cp "$file" release-files/
            done
            
            echo "  Copied ${#files[@]} file(s)"
            return 0
          }
          
          # Copy MSIX packages (Release builds only for production)
          # Artifact name pattern: "MSIX Package (Release-win-x64)"
          copy_release_artifacts "*.msix" "Release-" || echo "Note: No MSIX packages found"
          
          # Copy extension DLLs (Release builds only)
          # Artifact name pattern: "Extension - Resources (Release)"
          copy_release_artifacts "*.dll" "(Release)" || echo "Note: No extension DLLs found"
          
          echo ""
          echo "Release artifacts prepared:"
          ls -lah release-files
          
          # Verify we have at least some artifacts
          if [ -z "$(ls -A release-files)" ]; then
            echo "ERROR: No release artifacts found!"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            Automated release ${{ steps.version.outputs.version }}
            
            Built from commit ${{ github.sha }}
            
            ## Artifacts
            - **MSIX Packages**: Signed Windows installers (Release build)
            - **Extension DLLs**: Extension modules (Release build)
            
            ## Recent Changes
            ${{ steps.commits.outputs.commits }}
          draft: false
          prerelease: false
          files: release-files/*
          fail_on_unmatched_files: false