name: Extension Test Coverage

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/scripts/generate-extension-test-coverage.py'
      - '.github/workflows/extension-test-coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/scripts/generate-extension-test-coverage.py'
      - '.github/workflows/extension-test-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Generate extension test coverage report
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Generate report
        run: |
          python3 .github/scripts/generate-extension-test-coverage.py \
            --repo-root . \
            --out artifacts/TestCoverage \
            --commit "${{ github.sha }}"

      - name: Add report to job summary
        run: cat artifacts/TestCoverage/extension-test-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-test-coverage
          path: artifacts/TestCoverage
          retention-days: 14

  publish:
    name: Publish extension test coverage page
    needs: report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download report artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-test-coverage
          path: report

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish report
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p gh-pages/dev/test-coverage
          cp report/index.html gh-pages/dev/test-coverage/index.html
          cp report/extension-test-coverage.md gh-pages/dev/test-coverage/extension-test-coverage.md
          cp report/extension-test-coverage.json gh-pages/dev/test-coverage/extension-test-coverage.json
          cp report/data.js gh-pages/dev/test-coverage/data.js

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/test-coverage

          if git diff --cached --quiet; then
            echo "Extension test coverage page unchanged; nothing to publish."
            exit 0
          fi

          git commit -m "test-coverage: update extension report for ${SHA}"

          for attempt in 1 2 3; do
            if git push; then
              echo "Published extension test coverage page on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing."
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash || true
            sleep 5
          done

          echo "::warning::Could not push extension test coverage page after 3 attempts."
          exit 0
