name: Extension Test Coverage

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/scripts/generate-extension-test-coverage.py'
      - '.github/scripts/extension_coverage_analysis.py'
      - '.github/scripts/test_extension_test_coverage.py'
      - '.github/skills/extension-test-coverage/**'
      - '.github/workflows/extension-test-coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/scripts/generate-extension-test-coverage.py'
      - '.github/scripts/extension_coverage_analysis.py'
      - '.github/scripts/test_extension_test_coverage.py'
      - '.github/skills/extension-test-coverage/**'
      - '.github/workflows/extension-test-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Generate extension test coverage report
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      ready: ${{ steps.tests.outcome == 'success' && steps.generate.outcome == 'success' && steps.upload.outcome == 'success' }}
    steps:
      - name: Harden runner
        id: harden
        continue-on-error: true
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        if: steps.harden.outcome == 'success'
        continue-on-error: true

      - name: Test report attribution
        id: tests
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        run: python3 -S -B -m unittest discover -s .github/scripts -p test_extension_test_coverage.py

      - name: Generate report
        id: generate
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -S .github/scripts/generate-extension-test-coverage.py \
            --repo-root . \
            --out artifacts/TestCoverage \
            --commit "${{ github.sha }}"

      - name: Add report to job summary
        id: summary
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: cat artifacts/TestCoverage/extension-test-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifacts
        id: upload
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-test-coverage
          path: artifacts/TestCoverage
          retention-days: 14
          if-no-files-found: error

      - name: Warn on optional reporting failure
        if: always() && (steps.harden.outcome != 'success' || steps.checkout.outcome != 'success' || steps.tests.outcome != 'success' || steps.generate.outcome != 'success' || steps.summary.outcome != 'success' || steps.upload.outcome != 'success')
        continue-on-error: true
        run: |
          echo "::warning::Optional coverage reporting was incomplete. See step logs; this report does not gate builds or PR merges."
          echo "Coverage reporting was incomplete (advisory). Publication requires passing report tests, generation and artifact upload." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish extension test coverage page
    needs: report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.report.outputs.ready == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Harden runner
        id: harden
        continue-on-error: true
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Download report artifacts
        id: download
        if: steps.harden.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-test-coverage
          path: report

      - name: Checkout gh-pages
        id: checkout
        if: steps.download.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish report
        id: publish
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p gh-pages/dev/test-coverage
          cp report/index.html gh-pages/dev/test-coverage/index.html
          cp report/extension-test-coverage.md gh-pages/dev/test-coverage/extension-test-coverage.md
          cp report/extension-test-coverage.json gh-pages/dev/test-coverage/extension-test-coverage.json
          cp report/data.js gh-pages/dev/test-coverage/data.js

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/test-coverage

          if git diff --cached --quiet; then
            echo "Extension test coverage page unchanged; nothing to publish."
            exit 0
          fi

          git commit -m "test-coverage: update extension report for ${SHA}"

          for attempt in 1 2 3; do
            if git push; then
              echo "Published extension test coverage page on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing."
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash || true
            sleep 5
          done

          echo "::warning::Could not push extension test coverage page after 3 attempts."
          exit 0

      - name: Warn on optional publication failure
        if: always() && (steps.harden.outcome != 'success' || steps.download.outcome != 'success' || steps.checkout.outcome != 'success' || steps.publish.outcome != 'success')
        continue-on-error: true
        run: |
          echo "::warning::Optional coverage publication failed. See step logs; the previous published report has not been replaced successfully."
          echo "Coverage publication failed (advisory); see step logs." >> "$GITHUB_STEP_SUMMARY"
