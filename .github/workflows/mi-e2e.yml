name: Managed Identity E2E

# Real Azure managed-identity end-to-end test: builds the self-contained az
# bundle, uploads it to a blob in the resource group, then uses `az vm run-command`
# to pull it onto a Linux VM and verify `login --identity` + `vm show` for system-
# and user-assigned identities. No SSH is used. Provisions real Azure resources,
# so it is manual/scheduled only — never on PRs.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  push:
    branches: [ming/test-sp-mi-au] # TEMP: test the pipeline on this branch; remove before merge

concurrency:
  group: mi-e2e
  cancel-in-progress: false

permissions:
  id-token: write # OIDC login to Azure
  contents: read

jobs:
  mi-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run MI E2E test
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # Provisioning input for terraform/linux-vm (read by change.sh via
          # TF_VAR_*). All resources — VM, identities, and the bundle storage —
          # live in this resource group.
          TF_VAR_resource_group_name: ming-test
        run: |
          # No SSH: the test ships the bundle via an Azure Storage blob and runs
          # it on the VM with `az vm run-command`. terraform.tfvars is gitignored
          # (local-only); resource_group_name is supplied via TF_VAR_ above.
          scripts/mi-e2e-test.sh --provision
