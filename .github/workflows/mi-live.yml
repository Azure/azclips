name: Managed Identity Live

# Real Azure managed-identity live test: builds the self-contained az bundle,
# uploads it to a blob in the resource group, then uses `az vm run-command` to
# pull it onto a Linux VM and verify `login --identity` + `vm show` for system-
# and user-assigned identities. No SSH is used. Provisions real Azure resources,
# so it is manual/scheduled only — never on PRs.
#
# Configuration comes from the `dev` environment variables published by
# terraform/bootstrap/setup-github-identity.sh (stage 0). Nothing here is
# hardcoded, so each fork targets its own identity and resources.
on:
  workflow_dispatch:
  # TEMPORARY: remove before merging. Lets this branch be tested before the
  # renamed workflow reaches the default branch, where workflow_dispatch looks
  # for it.
  push:
    branches: [new-mi-live-e2e-test]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

concurrency:
  group: mi-live
  cancel-in-progress: false

permissions:
  id-token: write # OIDC login to Azure
  contents: read

jobs:
  mi-live:
    runs-on: ubuntu-latest

    # REQUIRED. The federated credential created by stage 0 trusts the OIDC
    # subject "repo:<owner>/<repo>:environment:dev". Removing or renaming this
    # makes the token subject stop matching and the Azure login fails. Keep it in
    # sync with `github_environment` in terraform/bootstrap.
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run MI live test
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # terraform.tfvars is gitignored (local-only), so CI supplies the alias
          # here. It must match the one used locally: it selects the Terraform
          # state blob and every resource name, including the resource group.
          TF_VAR_alias: ${{ vars.ALIAS }}
        run: |
          # No SSH: the test ships the bundle via an Azure Storage blob and runs
          # it on the VM with `az vm run-command`.
          scripts/mi-live-test.sh --provision
