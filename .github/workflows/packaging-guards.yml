name: Packaging Guards

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Extensions/**'
      - 'src/PS/**'
      - '.github/scripts/packaging_guards.py'
      - '.github/scripts/test_packaging_guards.py'
      - '.github/workflows/packaging-guards.yml'
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'src/Extensions/**'
      - 'src/PS/**'

permissions:
  contents: read

jobs:
  validate-rollup:
    name: Validate PowerShell rollup
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run packaging guard tests
        run: python3 .github/scripts/test_packaging_guards.py

      - name: Validate Az rollup membership
        run: python3 .github/scripts/packaging_guards.py validate-rollup .

  review-extension-changes:
    name: Review extension changes for PowerShell impact
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout trusted packaging guard
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Review packaging impact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/packaging_guards.py review-pr \
            --repository "${{ github.repository }}" \
            --pull-request "$PR_NUMBER" \
            --head-repository "$HEAD_REPOSITORY" \
            --head-sha "$HEAD_SHA"
