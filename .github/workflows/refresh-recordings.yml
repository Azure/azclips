name: Refresh recordings

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      filter:
        description: Only refresh scenario classes whose name contains this
        required: false
        type: string
      open-pr:
        description: Open a pull request with the rewritten recordings
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency: refresh-recordings

jobs:
  refresh:
    runs-on: [self-hosted, live-recorder]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # A PR opened with the automatic token never triggers its own checks; a
          # LIVE_REFRESH_TOKEN secret (fine-grained PAT, contents and pull requests
          # write) makes the refresh PR run CI like any other.
          token: ${{ secrets.LIVE_REFRESH_TOKEN || github.token }}

      - name: Build and sign in
        run: |
          dotnet build azclips.slnx
          ./artifacts/Debug/Core.Cli/az login --identity --subscription-id "${{ vars.LIVE_TEST_SUBSCRIPTION_ID }}"

      - name: Refresh stale recordings
        env:
          # Ties run-scoped resource names (-t<8hex>) to this workflow run, so a
          # leftover group from an interrupted run maps back to the run that made it.
          AZCLIPS_TEST_RUN_ID: ${{ github.run_id }}
        run: python3 devops/scripts/live/refresh_recordings.py --filter "${{ inputs.filter }}"

      # Scheduled runs only report; rewritten recordings become a PR when a human
      # asks for one by dispatching with open-pr.
      - name: Open a pull request
        if: ${{ !cancelled() && inputs.open-pr }}
        env:
          GH_TOKEN: ${{ secrets.LIVE_REFRESH_TOKEN || github.token }}
        run: |
          if git diff --quiet -- tests; then
            echo "No recordings were rewritten."
            exit 0
          fi
          branch="live/recording-refresh-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add 'tests/Scenario.Tests/*/Records/*'
          git commit -m "Refresh stale scenario recordings"
          git push origin "$branch"
          gh pr create --title "{Tests} Refresh stale scenario recordings" --body-file refresh-summary.md --base main --head "$branch"

      - name: Report rewritten recordings
        if: ${{ !cancelled() && !inputs.open-pr }}
        run: |
          if git diff --quiet -- tests; then
            echo "No recordings were rewritten."
            exit 0
          fi
          git diff --stat -- tests
          echo "Recordings were rewritten but no pull request was requested; dispatch the workflow with open-pr to publish them." >> "$GITHUB_STEP_SUMMARY"
