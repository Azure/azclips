name: Repeat az rewrite tests
on:
  pull_request:
    paths: [.github/workflows/repeat-az-rewrite.yml]
jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Agent/tests/Core.Agent.Tests/Core.Agent.Tests.csproj -c Debug
      - shell: bash
        run: |
          fails=0
          for i in $(seq 1 50); do
            dotnet test Agent/tests/Core.Agent.Tests/Core.Agent.Tests.csproj -c Debug --no-build \
              --filter "FullyQualifiedName~PlanGateTests" --blame-hang-timeout 2min > out.txt 2>&1 || { fails=$((fails+1)); tail -20 out.txt; }
          done
          echo "failed runs: $fails / 50"
          [ "$fails" -eq 0 ]
