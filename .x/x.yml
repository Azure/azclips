schema_version: 1
repository: Azure/azclips
profile:
  owner: Azure
  repo: azclips
  base_branch: main
  kind: dotnet-cli
  workflow: analysis-fix-review
  triage_labels: null
  triage_agent: azclips_triager
  triage_handoffs:
    sufficient:bug: Fixer
  live_test: false
  live_test_workflow: null
  module_root: src
  target_kind: area
  title_style: null
  pr_doc_url: null
  needs_info_label: agent-assist-needs-info
  triaged_label: agent-assist-triaged
  triage_result_labels:
    bug: bug
    documentation: documentation
    duplicate: duplicate
    question: question
    wontfix: wontfix
  reference_repository: Azure/azclips
  reference_paths:
  - README.md
  - SUPPORT.md
  - SECURITY.md
  - eng-docs/area-owners.md
  - docs/azure-cli/docs-conceptual/getting-started.md
  - docs/azure-cli/docs-conceptual/install-overview.md
  - docs/azure-cli/docs-conceptual/install-cli-manual.md
  - docs/azure-cli/docs-conceptual/troubleshooting.md
  - wiki/01-getting-started/overview.md
  - wiki/02-deep-dive/authentication.md
  - wiki/02-deep-dive/configuration-profiles.md
  - wiki/02-deep-dive/extension-system.md
  - wiki/02-deep-dive/ai-agent.md
  - wiki/02-deep-dive/build-cicd.md
  triage_owner_labels:
    identity: act-identity-squad
    quality-productivity: act-quality-productivity-squad
    codegen-extensibility: act-codegen-extensibility-squad
    observability: act-observability-squad
    platform-engineering: act-platform-engineering-squad
    experience-enablement: act-experience-enablement-squad
agents:
  Coordinator: definitions/coordinator.md
  azclips_triager: definitions/azclips_triager.md
  Fixer: definitions/fixer.md
  Reviewer: definitions/reviewer.md
tools:
  azclips_triager.clips.auth:
    role: azclips_triager
    path: tools/azclips_triager/clips/auth.py
  azclips_triager.clips.projects:
    role: azclips_triager
    path: tools/azclips_triager/clips/projects.py
  azclips_triager.clips.squads:
    role: azclips_triager
    path: tools/azclips_triager/clips/squads.py
  reviewer.clips.review:
    role: Reviewer
    path: tools/reviewer/clips/review.py
  fixer.formatting.guidance:
    role: Fixer
    path: tools/fixer/formatting/guidance.py
  reviewer.policy.analysis:
    role: Reviewer
    path: tools/reviewer/policy/analysis.py
  fixer.title_gate.title_repair:
    role: Fixer
    path: tools/fixer/title_gate/title_repair.py
  validation.checks:
    role: Coordinator
    path: tools/validation/checks.py
files:
- README.md
- definitions/azclips_triager.md
- definitions/coordinator.md
- definitions/fixer.md
- definitions/reviewer.md
- tools/azclips_triager/clips/auth.py
- tools/azclips_triager/clips/projects.py
- tools/azclips_triager/clips/squads.py
- tools/fixer/formatting/guidance.py
- tools/fixer/title_gate/title_repair.py
- tools/reviewer/clips/review.py
- tools/reviewer/policy/analysis.py
- tools/settings.py
- tools/validation/checks.py
dependencies:
  validation:
    entry_point: tools/validation/checks.py:repository_checks
    repositories:
    - Azure/azclips
