schema_version: 1
repository: Azure/azclips
profile:
  base_branch: main
  kind: dotnet-cli
  module_root: src
  target_kind: area
  workflow: analysis-fix-review
  live_test: false
  live_test_workflow: null
  triage_agent: azclips_triager
  triage_handoffs:
    sufficient:bug: Fixer
  triage_labels: null
  needs_info_label: agent-assist-needs-info
  title_style: null
  pr_doc_url: null
  reference_repository: Azure/azclips
  reference_paths:
  - README.md
  - SUPPORT.md
  - SECURITY.md
  - eng-docs/area-owners.md
  - docs/azure-cli/docs-conceptual/getting-started.md
  - docs/azure-cli/docs-conceptual/install-overview.md
  - docs/azure-cli/docs-conceptual/install-cli-manual.md
  - docs/azure-cli/docs-conceptual/troubleshooting.md
  - wiki/01-getting-started/overview.md
  - wiki/02-deep-dive/authentication.md
  - wiki/02-deep-dive/configuration-profiles.md
  - wiki/02-deep-dive/extension-system.md
  - wiki/02-deep-dive/ai-agent.md
  - wiki/02-deep-dive/build-cicd.md
  triage_owner_labels:
    codegen-extensibility: act-codegen-extensibility-squad
    experience-enablement: act-experience-enablement-squad
    identity: act-identity-squad
    observability: act-observability-squad
    platform-engineering: act-platform-engineering-squad
    quality-productivity: act-quality-productivity-squad
  triage_result_labels:
    bug: bug
    documentation: documentation
    duplicate: duplicate
    question: question
    wontfix: wontfix
  triaged_label: agent-assist-triaged

# How the engine publishes changes: from its fork (fork), from its fork with a verified
# head (verified-fork) or from a branch in this repository (upstream-branch).
publication:
  mode: upstream-branch

# What this repository's tools may reach. Reads stay within the Azure organization;
# a write to another repository needs that repository to list this one in accept_from.
access:
  read:
  - Azure/azclips
  - Azure/azure-cli
  - Azure/azure-powershell
  - Azure/azure-cli-extensions
  - Azure/terraform-provider-azapi
  - Azure/CLIPS
  credentials:
  - clips
  organization_reads:
  - /orgs/Azure/teams/act-codegen-extensibility-squad/members
  - /orgs/Azure/teams/act-experience-enablement-squad/members
  - /orgs/Azure/teams/act-identity-squad/members
  - /orgs/Azure/teams/act-observability-squad/members
  - /orgs/Azure/teams/act-platform-engineering-squad/members
  - /orgs/Azure/teams/act-quality-productivity-squad/members
  graphql:
  - organization: Azure
    project: 957
    query_sha256: 97405635a6e3f7aadc802ef72ddeb935e38a554ec8add05a85dcce8331e7713c

# Files a generated change may touch and the bounds of its execution job.
job:
  allowed_paths:
  - src/*
  - tests/*
  - tools/*
  - build/*
  - docs/*
  - wiki/*
  - TUI/*
  - toolkit/*
  - devops/scripts/*
  - install/*
  - README.md
  - global.json
  - Directory.*
  - NuGet.config
  - azclips.slnx
  execution_slice_seconds: 900
