description: "[read/group-typo] config-list-verb-typo"
metadata:
  mode: read
  failureType: group-typo
vars:
  case_id: config-list-verb-typo
  command_group: config
  goal: List configuration settings.
  command: config lst
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az config list
          match: all
          forbiddenArguments:
            - -n
            - -g
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az config list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: List configuration settings."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
