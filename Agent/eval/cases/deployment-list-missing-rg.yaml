description: "[read/missing-param] deployment-list-missing-rg"
metadata:
  mode: read
  failureType: missing-param
vars:
  case_id: deployment-list-missing-rg
  command_group: deployment
  goal: List deployments; the resource group was omitted.
  command: deployment group list
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az deployment group list
          match: all
          requiredArguments:
            - --resource-group
          forbiddenArguments:
            - -n
            - -g
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az deployment group list
        - az group list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: List deployments; the resource group was omitted."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - A 404 masks a missing resource group; supply a placeholder or list groups first.
