description: "[mutate/flag-typo] group-delete-flag-typo"
metadata:
  mode: mutate
  failureType: flag-typo
vars:
  case_id: group-delete-flag-typo
  command_group: group
  goal: Delete resource group azclips-eval-rg-404.
  command: group delete --resource-grp azclips-eval-rg-404
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az group delete
          match: any
          forbiddenArguments:
            - -n
            - -g
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az group delete
        - az group exists
        - az group show
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Delete resource group azclips-eval-rg-404."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - Accept --name or --resource-group with azclips-eval-rg-404. It must target only that group.
