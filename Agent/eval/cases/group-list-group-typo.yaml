description: "[read/group-typo] group-list-group-typo"
metadata:
  mode: read
  failureType: group-typo
vars:
  case_id: group-list-group-typo
  command_group: gruop
  goal: List resource groups in the active subscription.
  command: gruop list
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az group list
          match: all
          forbiddenArguments:
            - -n
            - -g
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az group list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: List resource groups in the active subscription."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
