description: "[mutate/invalid-value] group-update-not-found"
metadata:
  mode: mutate
  failureType: invalid-value
vars:
  case_id: group-update-not-found
  command_group: group
  goal: Tag the named resource group, which does not exist.
  command: group update --name azclips-eval-rg-404 --tags env=dev
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az group list
          match: any
          forbiddenArguments:
            - -n
            - -g
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az group list
        - az group show
        - az group exists
        - az group update
        - az group create
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Tag the named resource group, which does not exist."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - Finding the right group is expected; creating it only as a conditional alternative.
