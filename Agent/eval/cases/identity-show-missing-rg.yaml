description: "[read/missing-param] identity-show-missing-rg"
metadata:
  mode: read
  failureType: missing-param
vars:
  case_id: identity-show-missing-rg
  command_group: identity
  goal: Show the named managed identity; the resource group was omitted.
  command: identity show --name azclips-eval-id
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az identity show
          match: any
          requiredArguments:
            - --resource-group
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --name: azclips-eval-id
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az identity show
        - az identity list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Show the named managed identity; the resource group was omitted."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - A cryptic api-version error masks a missing resource group. Keep the identity name; listing identities first is acceptable.
