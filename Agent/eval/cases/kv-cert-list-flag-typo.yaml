description: "[read/flag-typo] kv-cert-list-flag-typo"
metadata:
  mode: read
  failureType: flag-typo
vars:
  case_id: kv-cert-list-flag-typo
  command_group: keyvault
  goal: List certificates in the named vault.
  command: keyvault certificate list --vault-nme azclipsevalkv404
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az keyvault certificate list
          match: all
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --vault-name: azclipsevalkv404
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az keyvault certificate list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: List certificates in the named vault."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
