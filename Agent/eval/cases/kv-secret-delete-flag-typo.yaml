description: "[mutate/flag-typo] kv-secret-delete-flag-typo"
metadata:
  mode: mutate
  failureType: flag-typo
vars:
  case_id: kv-secret-delete-flag-typo
  command_group: keyvault
  goal: Delete secret mysecret from the named vault.
  command: keyvault secret delete --vault-name azclipsevalkv404 --nmae mysecret
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az keyvault secret delete
          match: all
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --vault-name: azclipsevalkv404
            --name: mysecret
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az keyvault secret delete
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Delete secret mysecret from the named vault."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
