description: "[read/missing-param] kv-secret-list-missing-vault"
metadata:
  mode: read
  failureType: missing-param
vars:
  case_id: kv-secret-list-missing-vault
  command_group: keyvault
  goal: List secrets in a key vault; the vault was not specified.
  command: keyvault secret list
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az keyvault secret list
          match: any
          forbiddenArguments:
            - -n
            - -g
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az keyvault secret list
        - az rest
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: List secrets in a key vault; the vault was not specified."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - The vault is unknown; a --vault-name or --vault-url placeholder is acceptable.
