description: "[read/group-typo] kv-secret-list-verb-typo"
metadata:
  mode: read
  failureType: group-typo
vars:
  case_id: kv-secret-list-verb-typo
  command_group: keyvault
  goal: List secrets in the named vault.
  command: keyvault secret lst --vault-name azclipsevalkv404
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az keyvault secret list
          match: all
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --vault-name: azclipsevalkv404
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az keyvault secret list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: List secrets in the named vault."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
