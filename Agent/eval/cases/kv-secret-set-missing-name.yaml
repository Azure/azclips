description: "[mutate/missing-param] kv-secret-set-missing-name"
metadata:
  mode: mutate
  failureType: missing-param
vars:
  case_id: kv-secret-set-missing-name
  command_group: keyvault
  goal: Store a secret in the named vault; the secret name was omitted.
  command: keyvault secret set --vault-name azclipsevalkv404 --value placeholder-value
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az keyvault secret set
          match: all
          requiredArguments:
            - --name
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --vault-name: azclipsevalkv404
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az keyvault secret set
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Store a secret in the named vault; the secret name was omitted."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
