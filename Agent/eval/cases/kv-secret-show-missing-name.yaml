description: "[read/missing-param] kv-secret-show-missing-name"
metadata:
  mode: read
  failureType: missing-param
vars:
  case_id: kv-secret-show-missing-name
  command_group: keyvault
  goal: Show a secret in the named vault; the secret name was omitted.
  command: keyvault secret show --vault-name azclipsevalkv404
assert:
  - commandSet:
      anyOf:
        - - command: az keyvault secret list
            match: any
            forbiddenArguments:
              - -n
              - -g
            argumentValues:
              --vault-name: azclipsevalkv404
        - - command: az keyvault secret show
            match: all
            forbiddenArguments:
              - -n
              - -g
            argumentValues:
              --vault-name: azclipsevalkv404
            placeholders:
              - --name
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az keyvault secret list
        - az keyvault secret show
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Show a secret in the named vault; the secret name was omitted."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - Listing secrets to find the name, or a <secret-name> placeholder, is acceptable. Do not reveal secret values.
