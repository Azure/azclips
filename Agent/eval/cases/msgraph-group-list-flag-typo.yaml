description: "[read/flag-typo] msgraph-group-list-flag-typo"
metadata:
  mode: read
  failureType: flag-typo
vars:
  case_id: msgraph-group-list-flag-typo
  command_group: msgraph
  goal: List Entra groups named Contoso.
  command: msgraph group list --displayname Contoso
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az msgraph group list
          match: all
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --display-name: Contoso
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az msgraph group list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: List Entra groups named Contoso."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
