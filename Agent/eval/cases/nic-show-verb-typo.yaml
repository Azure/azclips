description: "[read/group-typo] nic-show-verb-typo"
metadata:
  mode: read
  failureType: group-typo
vars:
  case_id: nic-show-verb-typo
  command_group: network
  goal: Show the named network interface.
  command: network nic shw --name azclips-eval-nic-404 --resource-group azclips-test-rg
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az network nic show
          match: all
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --name: azclips-eval-nic-404
            --resource-group: azclips-test-rg
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az network nic show
        - az network nic list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Show the named network interface."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
