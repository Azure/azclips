description: "[mutate/invalid-value] profile-set-not-found"
metadata:
  mode: mutate
  failureType: invalid-value
vars:
  case_id: profile-set-not-found
  command_group: profile
  goal: Switch to a profile that does not exist.
  command: profile set --name no-such-profile
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az profile list
          match: any
          forbiddenArguments:
            - -n
            - -g
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az profile list
        - az profile set
        - az login
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Switch to a profile that does not exist."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - Listing profiles is expected; login only as a conditional alternative.
