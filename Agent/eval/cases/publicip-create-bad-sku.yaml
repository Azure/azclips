description: "[mutate/invalid-value] publicip-create-bad-sku"
metadata:
  mode: mutate
  failureType: invalid-value
vars:
  case_id: publicip-create-bad-sku
  command_group: network
  goal: Create public IP azclips-eval-pip.
  command: network public-ip create --name azclips-eval-pip --resource-group azclips-test-rg --location eastus --sku Premium
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az network public-ip create
          match: all
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --name: azclips-eval-pip
            --resource-group: azclips-test-rg
            --location: eastus
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az network public-ip create
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Create public IP azclips-eval-pip."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - The SKU must be one of Basic, Standard, StandardV2, or omitted.
