description: "[read/flag-typo] role-list-flag-typo"
metadata:
  mode: read
  failureType: flag-typo
vars:
  case_id: role-list-flag-typo
  command_group: role
  goal: List role assignments for the given principal.
  command: role assignment list --asignee 00000000-0000-0000-0000-000000000000
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az role assignment list
          match: any
          forbiddenArguments:
            - -n
            - -g
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az role assignment list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: List role assignments for the given principal."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - Either --assignee or --assignee-object-id with the same GUID is acceptable.
