description: "[read/group-typo] storage-acount-list-typo"
metadata:
  mode: read
  failureType: group-typo
vars:
  case_id: storage-acount-list-typo
  command_group: storage
  goal: List storage accounts in azclips-test-rg.
  command: storage acount list --resource-group azclips-test-rg
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az storage account list
          match: all
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --resource-group: azclips-test-rg
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az storage account list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: List storage accounts in azclips-test-rg."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
