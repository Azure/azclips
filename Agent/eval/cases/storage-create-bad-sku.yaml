description: "[mutate/invalid-value] storage-create-bad-sku"
metadata:
  mode: mutate
  failureType: invalid-value
vars:
  case_id: storage-create-bad-sku
  command_group: storage
  goal: Create the named storage account.
  command: storage account create --name azclipsevalsa999 --resource-group azclips-test-rg --location eastus --sku Standard_XYZ
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az storage account create
          match: all
          requiredArguments:
            - --sku
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --name: azclipsevalsa999
            --resource-group: azclips-test-rg
            --location: eastus
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az storage account create
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Create the named storage account."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - The SKU must be one of the allowed values listed in the error.
