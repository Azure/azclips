description: "[read/invalid-value] storage-show-not-found"
metadata:
  mode: read
  failureType: invalid-value
vars:
  case_id: storage-show-not-found
  command_group: storage
  goal: Show the named storage account, which does not exist.
  command: storage account show --name azclipsevalsa404 --resource-group azclips-test-rg
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az storage account list
          match: any
          forbiddenArguments:
            - -n
            - -g
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az storage account list
        - az storage account show
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Show the named storage account, which does not exist."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - Listing storage accounts to find the right name is expected. Do not make creation mandatory.
