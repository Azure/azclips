description: "[mutate/group-typo] vm-delete-verb-typo"
metadata:
  mode: mutate
  failureType: group-typo
vars:
  case_id: vm-delete-verb-typo
  command_group: vm
  goal: Delete the named VM.
  command: vm delte --name azclips-eval-vm-404 --resource-group azclips-test-rg
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az vm delete
          match: all
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --name: azclips-eval-vm-404
            --resource-group: azclips-test-rg
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az vm delete
        - az vm show
        - az vm list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Delete the named VM."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - Deleting the named VM is the user intent; it must not broaden the deletion to other resources.
