description: "[read/group-typo] vm-show-verb-typo"
metadata:
  mode: read
  failureType: group-typo
vars:
  case_id: vm-show-verb-typo
  command_group: vm
  goal: Show the named VM.
  command: vm shwo --name azclips-eval-vm-404 --resource-group azclips-test-rg
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az vm show
          match: all
          forbiddenArguments:
            - -n
            - -g
          argumentValues:
            --name: azclips-eval-vm-404
            --resource-group: azclips-test-rg
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az vm show
        - az vm list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: Show the named VM."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
