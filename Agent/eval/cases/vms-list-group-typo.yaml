description: "[read/group-typo] vms-list-group-typo"
metadata:
  mode: read
  failureType: group-typo
vars:
  case_id: vms-list-group-typo
  command_group: vms
  goal: List virtual machines.
  command: vms list
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az vm list
          match: all
          forbiddenArguments:
            - -n
            - -g
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az vm list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: List virtual machines."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
