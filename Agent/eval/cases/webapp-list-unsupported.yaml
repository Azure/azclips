description: "[read/group-typo] webapp-list-unsupported"
metadata:
  mode: read
  failureType: group-typo
vars:
  case_id: webapp-list-unsupported
  command_group: webapp
  goal: List web apps in azclips-test-rg.
  command: webapp list --resource-group azclips-test-rg
assert:
  - type: javascript
    value: file://assertions/command-set.js:commandSetAssertion
    metric: command-set
    config:
      checkName: Required commands and parameters
      source: metadata
      path: plan.steps
      expectedCommandSet:
        - command: az rest
          match: all
          forbiddenArguments:
            - -n
            - -g
  - type: javascript
    value: file://assertions/plan-contract.js:planContractAssertion
    metric: plan-contract
    config:
      checkName: Plan steps and scope
      allowedCommands:
        - az rest
        - az extension list
      validateSubscription: true
  - recoveryQuality:
      criteria:
        - "User goal: List web apps in azclips-test-rg."
        - Preserve every user-supplied name, group, location and value except the one that caused the failure.
        - This CLI has no webapp group. A GET on Microsoft.Web/sites with the generic REST command, or honestly saying the group is unavailable, is acceptable. Do not invent webapp commands.
