[workspace]
members = ["core", "cli", "ps", "ansible", "vendored_sdks/azure_identity"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Azure CLI Lite Team"]
description = "A lightweight Azure CLI implementation"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
cargo-husky = { version = "1.5.0", default-features = false, features = [
    "precommit-hook",
    "run-cargo-test",
    "run-cargo-clippy",
    "push-hook",
    "run-cargo-fmt",
] }
chrono = "0.4"
crossterm = "0.29.0"
dirs = "6.0"
env_logger = "0.11"
futures = "0.3"
oauth2 = "5.0.0"
once_cell = "1.21.3"
percent-encoding = "2.3"
prost = "0.13"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.27"
strum_macros = "0.27"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
# Calc String Width in Terminal.
# By default, it uses the cjk features. But maybe we can close it in the future.
unicode-width = "0.2.0"
webbrowser = "1.0.4"
