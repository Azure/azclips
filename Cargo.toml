[workspace]
members = [
    "core", 
    "cli", 
    "ps", 
    "ansible",
    "core/src/auth/vendored_sdks/azure_identity"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Azure CLI Lite Team"]
description = "A lightweight Azure CLI implementation"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
dirs = "6.0"
env_logger = "0.11"
futures = "0.3"
percent-encoding = "2.3"
prost = "0.13"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.27"
strum_macros = "0.27"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
cargo-husky = { version = "1.5.0", default-features = false, features = [
    "precommit-hook",
    "run-cargo-test",
    "run-cargo-clippy",
    "push-hook",
    "run-cargo-fmt",
] }
oauth2 = "5.0.0"
chrono = "0.4"
