[package]
name = "az_cli"
version = "0.1.0"
edition = "2021"
description = "Azure CLI V3 implementation"
license = "MIT"

[lib]
name = "az_cli"
path = "src/lib.rs"

[dependencies]
az_core = { path = "../core", features = ["cli"] }
anyhow = "1.0"
dirs = "6.0"
env_logger = "0.11"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
