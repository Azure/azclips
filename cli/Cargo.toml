[package]
name = "azure"
version = "0.1.0"
edition = "2021"
description = "Azure CLI V3 implementation"
license = "MIT"

[lib]
name = "az_cli"
path = "src/lib.rs"

[dependencies]
az_core = { path = "../core", features = ["cli"] }
anyhow = { workspace = true }
dirs = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
crossterm = "0.29.0"
# Calc String Width in Terminal.
# By default, it uses the cjk features. But maybe we can close it in the future.
unicode-width = "0.2.0"
