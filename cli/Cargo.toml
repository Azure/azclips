[package]
name = "azure"
version = "0.1.0"
edition = "2021"
description = "Azure CLI V3 implementation"
license = "MIT"

[lib]
name = "az_cli"
path = "src/lib.rs" 

[dependencies]
az_core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde_json = "1.0"
dirs = "6.0"
