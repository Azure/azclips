[package]
name = "azlite-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Azure CLI Lite"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
dirs = "6.0"

[lib]
name = "azlite_core"
path = "src/lib.rs" 