[package]
name = "azlite-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Azure CLI Lite"
license = "MIT"

[lib]
name = "azlite_core"
path = "src/lib.rs" 

[dependencies]
anyhow = "1.0"
base64 = "0.22"
dirs = "6.0"
log = "0.4"
prost = "0.13"
regex = "1.11"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tonic = {version = "0.12", features = ["default",]}

[build-dependencies]
tonic-build = "0.12"