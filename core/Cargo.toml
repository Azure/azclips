[package]
name = "az_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[lib]
name = "az_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
dirs = "6.0"
log = "0.4"
percent-encoding = "2.3"
prost = "0.13"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
# tonic = {version = "0.12", features = ["default",]}  # tonic is for grpc service

[dev-dependencies]
tempfile = "3.18"

[build-dependencies]
tonic-build = "0.12"
