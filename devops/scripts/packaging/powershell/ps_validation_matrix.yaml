schemaVersion: 3

# Keep versions quoted: they are identifiers, not YAML numbers.
powershell:
  # PowerShell releases need their matching .NET runtime. The Az modules target
  # net10.0 (src/Directory.Build.props), so releases older than 7.6 are unsupported.
  defaultVersions:
    - '7.6'
  versions:
    - version: '7.6'
      dotnetRuntime: '10.0'
  versionCheck:
    enabled: true
    source: github
    repository: PowerShell/PowerShell
    tagPattern: '^v(7\.[0-9]+)\.[0-9]+$'

# Each distribution emits DistributionScript. A new Linux distribution needs
# devops/scripts/packaging/powershell/linux/<id>_install_script.sh.
distributions:
  - id: alpine
    title: Alpine
    family: alpine
    executionMode: container
    pool: ubuntu-latest
    imageTemplate: 'alpine:{version}'
    versions:
      - version: '3.21'
      - version: '3.22'
      - version: '3.23'
    versionCheck:
      enabled: true
      repository: library/alpine
      tagPattern: '^([0-9]+\.[0-9]+)$'

  - id: debian
    title: Debian
    family: debian
    executionMode: container
    pool: ubuntu-latest
    imageTemplate: 'debian:{version}-slim'
    versions:
      - version: '13'
    versionCheck:
      enabled: true
      repository: library/debian
      tagPattern: '^([0-9]+)-slim$'

  - id: ubuntu
    title: Ubuntu
    family: debian
    executionMode: container
    pool: ubuntu-latest
    imageTemplate: 'ubuntu:{version}'
    versions:
      - version: '24.04'
      - version: '26.04'
        testInAlpha: true
    versionCheck:
      enabled: true
      repository: library/ubuntu
      tagPattern: '^([0-9]+\.04)$'

  - id: rhel
    title: RHEL
    titleSuffix: ' (UBI)'
    family: rhel
    executionMode: container
    pool: ubuntu-latest
    imageTemplate: 'registry.access.redhat.com/ubi{version}/ubi:latest'
    versions:
      - version: '8'
      - version: '9'
      - version: '10'
    versionCheck:
      enabled: false

  - id: macos_arm64
    title: macOS
    titleSuffix: ' (arm64)'
    family: macos
    executionMode: native
    poolTemplate: 'macOS-{version}-arm64'
    versions:
      - version: '15'
    versionCheck:
      enabled: false

  - id: macos_x64
    title: macOS
    titleSuffix: ' (x64)'
    family: macos
    executionMode: native
    poolTemplate: 'macOS-{version}'
    versions:
      - version: '15'
    versionCheck:
      enabled: false

  - id: windows
    title: Windows Server
    family: windows
    executionMode: native
    poolTemplate: 'windows-{version}'
    versions:
      - version: '2022'
      - version: '2025'
    powershellVersions:
      - '7.6'
    powershellVersionCheck: true
    versionCheck:
      enabled: false
