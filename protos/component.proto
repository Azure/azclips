syntax = "proto3";
package component;

import "protos/command.proto";

message CrsPluginComponent {
    ComponentMetadata metadata = 1;
    command.CrsInterface interface = 2;
}

message ComponentMetadata {
    string name = 1;  // the component name for installation and identification
    string version = 2; // the release version of the component, for built-in component, the version is the version of the core
    string uri = 3;  // the unique uri for the component, this uri should be the crs uri which starts with `crs://azure/` and the following segments are composed by the top level command group name for the component. The uri should be unique across all the components.
    command.CrsHelp help = 4;  // the help information of the component
}

message MetadataRequest {
    reserved 1; // uint32 az_ctx_server = 1;
}

message MetadataResponse {
    ComponentMetadata metadata = 1;
}

message ValidateRequest {
    reserved 1; // uint32 az_ctx_server = 1;
    string uri = 2;
}

message ValidateResponse {
    // if the uri is not found return None;
    optional string uri = 1;
}

message InterfaceRequest {
    reserved 1; // uint32 az_ctx_server = 1;
    string uri = 2;
    uint32 depth = 3;  // the depth of the interface to return, 0 means all the depth, 1 means the top level command group and command
}

message InterfaceResponse {
    command.CrsInterface interface = 1;
}

message ExecuteRequest {
    reserved 1; // uint32 az_ctx_server = 1;
    string uri = 2;  // the crs uri for the command to execute
    command.CrsParams params = 3;
    command.CrsOutputFormat output_format = 4;
}


message None {}

message ExecuteResponse {
    oneof data {
        None none = 1;
        bytes json = 2;
    }
}

message GetCoreInfoRequest {
    reserved 1;
}

message GetCoreInfoResponse {
    CoreInfo core_info = 1;
}

// CoreInfo is the information of the core
message CoreInfo {
    string version = 1;
}
