syntax = "proto3";
package action;

import "protos/model/content.proto";

message InstanceCreateAction {
    string ref = 1;
}

message JsonInstanceCreateAction {
    string ref = 1;
    RequestJson json = 2;
}

message InstanceUpdateAction {
    string ref = 1;
}

message JsonInstanceUpdateAction {
    string ref = 1;
    RequestJson json = 2;
}

message InstanceDeleteAction {
    string ref = 1;
}

message JsonInstanceDeleteAction {
    string ref = 1;
    RequestJson json = 2;
}