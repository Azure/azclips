syntax = "proto3";
package action;

import "protos/model/content.proto";

message InstanceCreateAction {
    string ref = 1;
    oneof type {
        RequestJson json = 2;
    }
}

message InstanceUpdateAction {
    string ref = 1;
    oneof type {
        RequestJson json = 2;
    }
}

message InstanceDeleteAction {
    string ref = 1;
    oneof type {
        RequestJson json = 2;
    }
}