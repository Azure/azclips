syntax = "proto3";
package condition;

message ConditionOperator {
    oneof type {
      ConditionAndOperator and = 1;
      ConditionOrOperator or = 2;
      ConditionNotOperator not = 3;
      ConditionHasValueOperator hasValue = 4;
    }
}

message ConditionAndOperator {
  repeated ConditionOperator operators = 1;
}

message ConditionOrOperator {
  repeated ConditionOperator operators = 1;
}

message ConditionNotOperator {
  ConditionOperator operator = 1;
}

message ConditionHasValueOperator {
  string arg = 1;
}

message Condition {
  string var = 1;
  ConditionOperator operator = 2;
}