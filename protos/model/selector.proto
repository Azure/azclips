syntax = "proto3";
package selector;

message SelectorIndex {
  // string type = 1;
  string name = 2;
  oneof type {
      ObjectIndex object = 3;
      ArrayIndex array = 4;
      SimpleIndex simple = 5;
  }
}

message ObjectIndexDiscriminator {
  string property = 1;
  string value = 2;

  SelectorIndex prop = 3;
  ObjectIndexDiscriminator discriminator = 4;
}

message ObjectIndexAdditionalProperties {
  SelectorIndex item = 1;
  repeated Schema identifiers = 2;
}

message ObjectIndex {
  // string type = 1;
  SelectorIndex prop = 2;
  ObjectIndexDiscriminator discriminator = 3;
  ObjectIndexAdditionalProperties additional_props = 4;
}

message ArrayIndex {
  // string type = 1;
  SelectorIndex item = 2;
  repeated Schema identifiers = 3;
}

message SimpleIndex {
  // string type = 1;
}

message SubresourceSelector {
  string var = 1;
  string ref = 2;
}

message JsonSubresourceSelector {
  string var = 1;
  string ref = 2;
  SelectorIndex json = 3;
}
