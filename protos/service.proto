syntax = "proto3";
package service;

import "protos/command.proto";

// service Service {
//     rpc Metadata(MetadataRequest) returns (MetadataResponse);
//     rpc Check(CheckRequest) returns (CheckResponse);
//     rpc Interface(InterfaceRequest) returns (InterfaceResponse);
//     rpc Execute(ExecuteRequest) returns (ExecuteResponse);
// }

message MetadataRequest {
    reserved 1; // uint32 az_ctx_server = 1;
}

message MetadataResponse {
    ServiceMetadata metadata = 1;
}

message CheckRequest {
    reserved 1; // uint32 az_ctx_server = 1;
    string uri = 2;
}

message CheckResponse {
    // if the uri is not found return None;
    optional string uri = 1;
}

message InterfaceRequest {
    reserved 1; // uint32 az_ctx_server = 1;
    string uri = 2;
    uint32 depth = 3;  // the depth of the interface to return, 0 means all the depth, 1 means the top level command group and command
}

message InterfaceResponse {
    command.CMDInterface interface = 1;
}

message ServiceMetadata {
    string name = 1;  // the service name for installation and identification
    string version = 2; // the release version of the service, for built-in service, the version is the version of the core
    string uri = 3;  // the unique uri for the service, this uri should be the cmd uri which starts with `cmd://azure/` and the following segments are composed by the top level command group name for the service. The uri should be unique across all the services.
    command.CMDHelp help = 4;  // the help information of the service
}

message ExecuteRequest {
    reserved 1; // uint32 az_ctx_server = 1;
    string uri = 2;  // the cmd uri for the command to execute
    command.CMDParams params = 3;
    command.CMDOutputFormat output_format = 4;
}


message None {}

message ExecuteResponse {
    oneof data {
        None none = 1;
        bytes json = 2;
    }
}

// the context for the service to run

// service AzServiceCtx {
//     rpc GetCoreInfo(GetCoreInfoRequest) returns (GetCoreInfoResponse);
// }

message GetCoreInfoRequest {
    reserved 1;
}

message GetCoreInfoResponse {
    CoreInfo core_info = 1;
}

// CoreInfo is the information of the core
message CoreInfo {
    string version = 1;
}
