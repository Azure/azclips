syntax = "proto3";
package proto.module;
option go_package = "./proto";

import "shared/proto/command.proto";

service Module {
    rpc Metadata(MetadataRequest) returns (MetadataResponse);
    rpc Check(CheckRequest) returns (CheckResponse);
    rpc Interface(InterfaceRequest) returns (InterfaceResponse);
    rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}

service AzContext {
    rpc GetCoreInfo(GetCoreInfoRequest) returns (GetCoreInfoResponse);
}

message MetadataRequest {
    uint32 az_ctx_server = 1;
}

message MetadataResponse {
    ModuleMetadata metadata = 1;
}

message CheckRequest {
    uint32 az_ctx_server = 1;
    string uri = 2;
}

message CheckResponse {
    string uri = 1;
}

message GetCoreInfoRequest {}


message GetCoreInfoResponse {
    CoreInfo core_info = 1;
}

message InterfaceRequest {
    uint32 az_ctx_server = 1;
    string uri = 2;
}

message InterfaceResponse {
    command.CMDInterface interface = 1;
}

message ModuleMetadata {
    string name = 1;
    ModuleHelp help = 2;
    uint32 priority = 3;
    oneof cls {
        BuiltInModule built_in = 4;
        PluginModule plugin = 5;
    }
    repeated command.CMDInterface groups = 10;
    repeated command.CMDInterface commands = 11;
}

// ModuleHelp is the help message of the module
message ModuleHelp {
    string short = 1; // short description of the module
    string long = 2; // long description of the module
}

// BuiltInModule is the module that is built in to the core
message BuiltInModule {
}

// PluginModule is the module that is loaded from a plugin
message PluginModule {
    string version = 1;
}

// CoreInfo is the information of the core
message CoreInfo {
    string version = 1;
}
