services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: azclips-jaeger
    # v2 runs the default all-in-one config (memory storage, OTLP enabled) with no --config flag.
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC  (the app exports here)
      - "4318:4318"     # OTLP HTTP  (alternate ingest)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
