# Rebrands the Jaeger UI (Azure logo + "Azclips" wordmark) without forking the
# UI bundle: nginx proxies to the Jaeger container and injects a small CSS
# overlay into the HTML, and serves the replacement logo from ./branding.
server {
    listen 16686;
    server_name _;

    # Rebrand assets. Drop your logo at ./branding/logo.svg (see README).
    location /branding/ {
        alias /usr/share/nginx/branding/;
        default_type image/svg+xml;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://jaeger:16686;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Force an uncompressed upstream response so sub_filter can rewrite it.
        proxy_set_header Accept-Encoding "";

        # Inject the rebrand stylesheet immediately before </head>:
        #  - swap every Jaeger logo (top-nav + empty-search splash) for our SVG
        #  - replace the "Jaeger" wordmark text with "Azclips"
        #  - hide the "About Jaeger" dropdown (the only submenu in the last
        #    top-right horizontal menu; the Trace-ID search box beside it is a
        #    plain item, so it is preserved)
        sub_filter '</head>' '<style>img[src*="jaeger-logo"]{content:url("/branding/logo.svg")!important}.Branding--name{font-size:0!important}.Branding--name::after{content:"Azclips";font-size:20px;font-weight:500;letter-spacing:-.5px;line-height:1;color:var(--text-inverse)}.Menu--item.ant-menu-horizontal:last-of-type .ant-menu-submenu{display:none!important}</style></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
