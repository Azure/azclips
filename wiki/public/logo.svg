<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Cirrus logo">

  <!-- Background (transparent by default) -->
  <rect width="512" height="512" fill="none"/>

  <!-- Outer ring -->
  <circle
    cx="256"
    cy="256"
    r="210"
    fill="none"
    stroke="#3FA9F5"
    stroke-width="24"/>

  <!-- Chevron (>) -->
  <polyline
    points="200,210 245,256 200,302"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Cloud outline -->
  <path
    d="
      M 270 300
      H 330
      C 360 300, 380 280, 380 255
      C 380 232, 362 214, 340 214
      C 332 190, 310 175, 285 175
      C 255 175, 230 200, 230 230
      C 215 232, 205 245, 205 260
      C 205 282, 225 300, 250 300
      Z"
    fill="none"
    stroke="#3FA9F5"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Text -->
  <text
    x="256"
    y="360"
    text-anchor="middle"
    font-size="48"
    font-family="Segoe UI, Arial, Helvetica, sans-serif"
    letter-spacing="6"
    fill="#FFFFFF">
    CIRRUS
  </text>
</svg>